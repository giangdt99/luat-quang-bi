nh_huong": "Hội đồng trường của một trường THCS công lập tiếp tục họp bầu hiệu trưởng sau 01/01/2026.", "ket_luan": "→ Sai: hội đồng trường phổ thông công lập đã kết thúc hoạt động; hồ sơ bàn giao cho hiệu trưởng (Điều 2 khoản 3 điểm b Luật 123)."}, {"tinh_huong": "Em Bảo học lớp 7 ở trường THCS công lập, phụ huynh hỏi có phải đóng học phí không.", "ket_luan": "→ Không: học sinh phổ thông trong cơ sở giáo dục công lập được miễn học phí (Điều 99 khoản 3)."}, {"tinh_huong": "Em Chi học một trường THCS tư thục, phụ huynh hỏi Nhà nước có giúp gì.", "ket_luan": "→ Nhà nước hỗ trợ tiền đóng học phí; mức do HĐND cấp tỉnh quyết định (Điều 99 khoản 3)."}, {"tinh_huong": "Cô Dung, giáo viên được điều động làm cán bộ quản lý của trường công lập, hỏi về phụ cấp nhà giáo.", "ket_luan": "→ Được bảo lưu phụ cấp nhà giáo theo quy định của Chính phủ; là viên chức quản lý, được hưởng phụ cấp ưu đãi nghề (Điều 66a)."}], "nho": ["THCS: **xã**; THPT: **tỉnh** (cấp thấp lo trường thấp, cấp cao lo trường cao).", "**Công miễn, tư hỗ trợ**: công lập miễn học phí, dân lập tư thục được hỗ trợ.", "Học phí tư thục do **HĐND** (không phải UBND) cấp tỉnh quyết định.", "Số chi giáo dục **20 – 5 – 3**: tối thiểu 20%, đầu tư 5%, đại học 3%."]}]});</script><script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L3", "ten": "Luật Nhà giáo 2025", "so": "Luật số 73/2025/QH15", "hieuluc": "01/01/2026", "mota": "Luật Nhà giáo số 73/2025/QH15 (thông qua 16/6/2025, 9 chương, 42 điều) quy định hoạt động nghề nghiệp, quyền, nghĩa vụ, chức danh, tuyển dụng, tiền lương, đào tạo, tôn vinh, kỷ luật và quản lý nhà giáo; có hiệu lực từ 01/01/2026.", "baihoc": [{"id": "L3-1", "ten": "Quy định chung: phạm vi, giải thích từ ngữ, nguyên tắc, chính sách, hiệu lực", "tomtat": ["Luật Nhà giáo số **73/2025/QH15** được thông qua ngày **16/6/2025**, gồm **9 chương, 42 điều** (Điều 41 khoản 1).", "Luật có hiệu lực thi hành từ ngày **01/01/2026** (Điều 41 khoản 1).", "Điều 1 điều chỉnh: hoạt động nghề nghiệp, quyền và nghĩa vụ; chức danh, chuẩn nghề nghiệp; tuyển dụng, sử dụng; tiền lương, đãi ngộ; đào tạo, bồi dưỡng, hợp tác quốc tế; tôn vinh, khen thưởng, xử lý vi phạm; quản lý nhà giáo.", "Điều 2: áp dụng đối với nhà giáo trong cơ sở giáo dục **thuộc hệ thống giáo dục quốc dân**; cơ quan quản lý nhà nước về giáo dục, cơ sở giáo dục; tổ chức, cá nhân liên quan.", "Điều 3 khoản 1: nhà giáo là lực lượng **nòng cốt** của ngành giáo dục, được tôn trọng, bảo vệ, tôn vinh; khoản 2: có vai trò **quyết định** trong bảo đảm chất lượng giáo dục.", "Điều 4 khoản 1: **giáo viên** là nhà giáo giảng dạy, giáo dục chương trình mầm non, phổ thông, thường xuyên, dự bị đại học, giáo dục đặc biệt cho người khuyết tật; chương trình sơ cấp, trung cấp trong cơ sở giáo dục nghề nghiệp.", "Điều 4 khoản 6: **người đứng đầu cơ sở giáo dục** là hiệu trưởng, giám đốc.", "Điều 4 khoản 8: **điều động** nhà giáo là chuyển từ cơ sở công lập này sang cơ sở công lập khác hoặc sang cơ quan quản lý giáo dục **theo yêu cầu của cấp có thẩm quyền**; khoản 9: **thuyên chuyển** là chuyển **theo nguyện vọng cá nhân**.", "Điều 5 có **6 khoản** nguyên tắc: phù hợp chủ trương của Đảng, chính sách pháp luật; chuẩn hóa, nâng cao chất lượng; **bình đẳng giới**; tôn trọng quyền tự chủ, sáng tạo trong chuyên môn; phân quyền, phân cấp, phối hợp; quyền tự chủ của cơ sở giáo dục **gắn với trách nhiệm giải trình**.", "Điều 6 có **9 khoản**: khoản 1 Nhà nước giữ vai trò **chủ đạo**; khoản 3 thu hút nhà giáo đến vùng khó khăn; khoản 4 bảo vệ uy tín, danh dự, nhân phẩm; khoản 5 ưu tiên về tiền lương, đãi ngộ.", "Điều 42 khoản 1: đề án, kế hoạch tuyển dụng, xét thăng hạng đã được phê duyệt trước 01/01/2026 được tiếp tục thực hiện trong **12 tháng**."], "bay": ["⚠ nhà giáo là lực lượng **nòng cốt** (Điều 3) ≠ Nhà nước giữ vai trò **chủ đạo** (Điều 6); vai trò **quyết định** là về chất lượng giáo dục.", "⚠ **điều động** (theo yêu cầu cấp có thẩm quyền) ≠ **thuyên chuyển** (theo nguyện vọng cá nhân).", "⚠ Luật có **9 chương, 42 điều**; Điều 5 có **6** khoản, Điều 6 có **9** khoản - dễ nhầm số.", "⚠ **thông qua** 16/6/2025 ≠ **có hiệu lực** 01/01/2026."], "cauhoi": [{"t": "s", "q": "Luật Nhà giáo số 73/2025/QH15 có hiệu lực thi hành từ ngày nào?", "o": ["16/6/2025", "01/09/2026", "01/01/2026", "01/07/2025"], "a": [2], "e": "Điều 41 khoản 1: hiệu lực 01/01/2026. Bẫy: 16/6/2025 là ngày thông qua, không phải ngày có hiệu lực.", "r": "Luật Nhà giáo 2025 Điều 41 khoản 1"}, {"t": "s", "q": "Luật Nhà giáo năm 2025 gồm bao nhiêu chương, bao nhiêu điều?", "o": ["9 chương, 42 điều", "9 chương, 41 điều", "8 chương, 42 điều", "10 chương, 45 điều"], "a": [0], "e": "Luật gồm 9 chương, 42 điều; Điều 41 là hiệu lực thi hành, Điều 42 là điều khoản chuyển tiếp.", "r": "Luật Nhà giáo 2025"}, {"t": "s", "q": "Theo Điều 3 Luật Nhà giáo, nhà giáo là lực lượng nào của ngành giáo dục?", "o": ["Tiên phong", "Duy nhất", "Chủ đạo", "Nòng cốt"], "a": [3], "e": "Điều 3 khoản 1: lực lượng nòng cốt. Bẫy: 'chủ đạo' là vai trò của Nhà nước (Điều 6 khoản 1).", "r": "Luật Nhà giáo 2025 Điều 3 khoản 1"}, {"t": "s", "q": "Phát biểu nào sau đây đúng về vai trò của Nhà nước và nhà giáo theo Điều 3 và Điều 6 Luật Nhà giáo?", "o": ["Nhà giáo giữ vai trò chủ đạo; Nhà nước giữ vai trò nòng cốt", "Nhà nước giữ vai trò chủ đạo; nhà giáo là lực lượng nòng cốt của ngành giáo dục", "Nhà nước giữ vai trò nòng cốt; nhà giáo là lực lượng tiên phong", "Nhà giáo giữ vai trò chủ đạo và quyết định chất lượng giáo dục"], "a": [1], "e": "Đổi chủ thể/từ khóa là bẫy: Nhà nước - chủ đạo (Điều 6.1); nhà giáo - nòng cốt (Điều 3.1).", "r": "Luật Nhà giáo 2025 Điều 3, Điều 6"}, {"t": "s", "q": "Phát biểu nào đúng về 'giáo viên' theo Điều 4 Luật Nhà giáo?", "o": ["Là nhà giáo chỉ giảng dạy, giáo dục chương trình phổ thông", "Là nhà giáo giảng dạy, giáo dục chương trình mầm non, phổ thông, thường xuyên, dự bị đại học, giáo dục đặc biệt cho người khuyết tật; chương trình sơ cấp, trung cấp trong cơ sở giáo dục nghề nghiệp", "Là nhà giáo giảng dạy chương trình mầm non, phổ thông, đại học và sau đại học", "Là nhà giáo giảng dạy, giáo dục chương trình cao đẳng, đại học trở lên"], "a": [1], "e": "Điều 4 khoản 1. Giảng viên (cao đẳng trở lên) khác giáo viên. Phương án nhiễu thu hẹp hoặc nới rộng phạm vi.", "r": "Luật Nhà giáo 2025 Điều 4 khoản 1"}, {"t": "s", "q": "Theo Điều 4, 'điều động nhà giáo' là việc chuyển nhà giáo từ cơ sở giáo dục công lập này sang cơ sở công lập khác hoặc sang cơ quan quản lý giáo dục theo yêu cầu của chủ thể nào?", "o": ["Cơ sở giáo dục nơi đến", "Hiệu trưởng cơ sở giáo dục nơi đi", "Cá nhân nhà giáo", "Cấp có thẩm quyền"], "a": [3], "e": "Điều động theo yêu cầu của cấp có thẩm quyền; thuyên chuyển theo nguyện vọng cá nhân.", "r": "Luật Nhà giáo 2025 Điều 4 khoản 8"}, {"t": "s", "q": "Theo Điều 5 Luật Nhà giáo, Điều này quy định nguyên tắc nào sau đây?", "o": ["Quyền tự chủ của cơ sở giáo dục gắn với trách nhiệm giải trình", "Tập trung quản lý ở trung ương, không phân cấp", "Ưu tiên nhà giáo công lập hơn nhà giáo ngoài công lập trong mọi trường hợp", "Quyền tự chủ của cơ sở giáo dục tách khỏi trách nhiệm giải trình"], "a": [0], "e": "Điều 5 khoản 6: tự chủ gắn với trách nhiệm giải trình; khoản 5: phân quyền, phân cấp, phối hợp.", "r": "Luật Nhà giáo 2025 Điều 5"}, {"t": "s", "q": "Theo Điều 6 Luật Nhà giáo, chính sách bảo vệ uy tín, danh dự, nhân phẩm của nhà giáo nằm ở khoản mấy?", "o": ["Khoản 5", "Khoản 3", "Khoản 4", "Khoản 1"], "a": [2], "e": "Khoản 4: bảo vệ uy tín, danh dự, nhân phẩm. Khoản 3: thu hút nhà giáo đến vùng khó khăn; khoản 5: ưu tiên tiền lương, đãi ngộ.", "r": "Luật Nhà giáo 2025 Điều 6 khoản 4"}, {"t": "s", "q": "Theo Điều 4 khoản 6 Luật Nhà giáo, 'người đứng đầu cơ sở giáo dục' là ai?", "o": ["Chủ tịch hội đồng trường", "Hiệu trưởng và phó hiệu trưởng", "Chủ sở hữu cơ sở giáo dục", "Hiệu trưởng, giám đốc"], "a": [3], "e": "Điều 4 khoản 6: hiệu trưởng, giám đốc. Phó hiệu trưởng không phải người đứng đầu.", "r": "Luật Nhà giáo 2025 Điều 4 khoản 6"}, {"t": "s", "q": "Luật Nhà giáo áp dụng "nòng cốt"], ["nòng cốt", "quyết định"]], "k": 3}, {"t": "f", "q": "Điều động nhà giáo theo yêu cầu của ____; thuyên chuyển nhà giáo theo ____ cá nhân.", "a": [["cấp có thẩm quyền"], ["nguyện vọng"]], "e": "Điều 4 khoản 8, 9.", "r": "Luật Nhà giáo 2025 Điều 4 khoản 8, 9", "o": [["Chính phủ", "nguyện vọng"], ["cấp có thẩm quyền", "yêu cầu"], ["cấp có thẩm quyền", "nguyện vọng"], ["người đứng đầu", "nguyện vọng"]], "k": 2}, {"t": "f", "q": "Theo Điều 6 khoản 1, Nhà nước giữ vai trò ____ trong phát triển đội ngũ nhà giáo.", "a": [["chủ đạo"]], "e": "Nhà nước chủ đạo; nhà giáo nòng cốt.", "r": "Luật Nhà giáo 2025 Điều 6 khoản 1", "o": [["nòng cốt"], ["quyết định"], ["trực tiếp"], ["chủ đạo"]], "k": 3}, {"t": "f", "q": "Một trong các nguyên tắc quản lý và phát triển nhà giáo là bảo đảm ____ giới.", "a": [["bình đẳng"]], "e": "Điều 5 khoản 3.", "r": "Luật Nhà giáo 2025 Điều 5 khoản 3", "o": [["tự chủ"], ["công bằng"], ["bình đẳng"], ["ưu tiên"]], "k": 2}, {"t": "f", "q": "Luật Nhà giáo gồm ____ chương và ____ điều.", "a": [["9", "chín"], ["42", "bốn mươi hai"]], "e": "Luật gồm 9 chương, 42 điều.", "r": "Luật Nhà giáo 2025", "o": [["9", "41"], ["9", "42"], ["8", "42"], ["10", "40"]], "k": 1}, {"t": "f", "q": "Quyền tự chủ của cơ sở giáo dục gắn với trách nhiệm ____.", "a": [["giải trình"]], "e": "Điều 5 khoản 6.", "r": "Luật Nhà giáo 2025 Điều 5 khoản 6", "o": [["tự chịu"], ["chịu trách"], ["báo cáo"], ["giải trình"]], "k": 3}, {"t": "f", "q": "Người đứng đầu cơ sở giáo dục là hiệu trưởng, ____.", "a": [["giám đốc"]], "e": "Điều 4 khoản 6.", "r": "Luật Nhà giáo 2025 Điều 4 khoản 6", "o": [["giám đốc"], ["phó hiệu trưởng"], ["tổng giám đốc"], ["chủ tịch"]], "k": 0}], "ynho": ["Luật Nhà giáo **73/2025/QH15**, thông qua **16/6/2025**, hiệu lực **01/01/2026**.", "Luật có **9 chương, 42 điều**.", "Nhà giáo là lực lượng **nòng cốt** (Điều 3); Nhà nước giữ vai trò **chủ đạo** (Điều 6).", "**Điều động** = theo yêu cầu cấp có thẩm quyền; **thuyên chuyển** = theo nguyện vọng cá nhân.", "Điều 5 có **6 khoản**, Điều 6 có **9 khoản**; tự chủ phải gắn với **trách nhiệm giải trình**."], "bang": [{"tieu_de": "Số liệu và mốc thời gian cần nhớ", "cot": ["Nội dung", "Số liệu", "Căn cứ"], "dong": [["Số hiệu luật", "73/2025/QH15", "Luật Nhà giáo"], ["Ngày thông qua", "16/6/2025", "Luật Nhà giáo"], ["Ngày có hiệu lực", "01/01/2026", "Điều 41 khoản 1"], ["Cấu trúc", "9 chương, 42 điều", "Điều 41 khoản 1"], ["Số khoản nguyên tắc", "6 khoản", "Điều 5"], ["Số khoản chính sách của Nhà nước", "9 khoản", "Điều 6"], ["Thời hạn tiếp tục đề án đã duyệt trước 01/01/2026", "12 tháng", "Điều 42 khoản 1"]]}, {"tieu_de": "Dễ nhầm: điều động và thuyên chuyển", "cot": ["Tiêu chí", "Điều động (Điều 4.8)", "Thuyên chuyển (Điều 4.9)"], "dong": [["Ý chí quyết định", "Yêu cầu của cấp có thẩm quyền", "Nguyện vọng cá nhân"], ["Chuyển đi đâu", "Cơ sở công lập khác hoặc cơ quan quản lý giáo dục", "Chuyển sang cơ sở khác theo nguyện vọng"]]}], "vidu": [{"tinh_huong": "Cô Lan là giáo viên Tin học một trường THCS công lập, được Sở yêu cầu chuyển sang trường công lập khác để đáp ứng nhu cầu của địa phương.", "ket_luan": "→ Đây là điều động (Điều 4 khoản 8), vì chuyển theo yêu cầu của cấp có thẩm quyền."}, {"tinh_huong": "Thầy Minh làm đơn xin chuyển về trường gần nhà theo nguyện vọng riêng và được chấp thuận.", "ket_luan": "→ Đây là thuyên chuyển (Điều 4 khoản 9), vì theo nguyện vọng cá nhân."}, {"tinh_huong": "Hiệu trưởng Hòa nói: 'Luật Nhà giáo có hiệu lực từ ngày thông qua 16/6/2025'.", "ket_luan": "→ Sai. Thông qua 16/6/2025 nhưng có hiệu lực từ 01/01/2026 (Điều 41 khoản 1)."}, {"tinh_huong": "Cô Hà dạy ở trường THCS và tổ chức hoạt động giáo dục cho học sinh lớp 8 theo chương trình giáo dục phổ thông. Có phải là giáo viên theo Luật không?", "ket_luan": "→ Đúng. Giáo viên là nhà giáo giảng dạy, giáo dục chương trình phổ thông (Điều 4 khoản 1)."}, {"tinh_huong": "Trường THCS ngoài hệ thống giáo dục quốc dân hỏi Luật Nhà giáo có áp dụng cho nhà giáo ở đó không.", "ket_luan": "→ Luật áp dụng với nhà giáo trong cơ sở giáo dục thuộc hệ thống giáo dục quốc dân (Điều 2)."}], "nho": ["Số: **73 – 16/6 – 01/01 – 9 – 42** (số hiệu – thông qua – hiệu lực – chương – điều).", "**Nòng cốt** là nhà giáo, **chủ đạo** là Nhà nước: nòng cốt nằm ở trường, chủ đạo nằm ở trên.", "**Điều động = Đ**ược **Đ**iều từ trên xuống (cấp có thẩm quyền); **Thuyên chuyển = T**ự **T**hân xin (nguyện vọng cá nhân).", "Điều 5 có **6** nguyên tắc, Điều 6 có **9** chính sách: nguyên tắc ít hơn chính sách."]}, {"id": "L3-2", "ten": "Hoạt động nghề nghiệp, quyền, nghĩa vụ và đạo đức nhà giáo (Điều 7-10)", "tomtat": ["Điều 7 khoản 2: nội dung hoạt động nghề nghiệp gồm (a) chuẩn bị và tổ chức giảng dạy, giáo dục, đánh giá người học; (b) học tập, bồi dưỡng; (c) nghiên cứu khoa học; (d) phục vụ cộng đồng; (đ) hoạt động chuyên môn khác.", "Điều 7 khoản 3: hoạt động ở **điểm a, b** thực hiện theo **năm học hoặc khóa học**.", "Điều 7 khoản 4 điểm b: giáo viên **tiểu học, THCS, THPT, dự bị đại học** giảng dạy, giáo dục môn học, hoạt động giáo dục theo chương trình giáo dục phổ thông.", "**Quyền** của nhà giáo ở **Điều 8**; **nghĩa vụ** ở **Điều 9**; đạo đức ở Điều 10; việc không được làm ở Điều 11.", "Điều 8 khoản 1: nhà giáo cơ sở **công lập** thực hiện quyền theo pháp luật về **viên chức**; cơ sở **ngoài công lập** theo pháp luật về **lao động**.", "Điều 8 khoản 2 điểm a: được giảng dạy phù hợp chuyên môn; chủ động phân phối thời lượng, sắp xếp nội dung theo chương trình; lựa chọn, sử dụng tài liệu, học liệu; nhận xét, đánh giá, **tham gia** khen thưởng, xử lý kỷ luật người học.", "Điều 8 khoản 2: quyền nghiên cứu khoa học, chuyển giao (b); được tôn trọng, bảo vệ uy tín, danh dự, nhân phẩm và đối xử bình đẳng (c); **nghỉ hè** và các ngày nghỉ khác (d); đào tạo, bồi dưỡng (đ); tham gia giảng dạy, nghiên cứu tại cơ quan, tổ chức khác theo quy định (e).", "Điều 9 khoản 2 (nghĩa vụ): giảng dạy đúng mục tiêu, nguyên lý giáo dục, thực hiện đầy đủ và có chất lượng chương trình (a); giữ gìn phẩm chất, đạo đức, mẫu mực, nêu gương, bảo đảm **liêm chính học thuật** (b).", "Điều 9 khoản 2: phát huy phẩm chất, năng lực, phát hiện, bồi dưỡng năng khiếu người học (c); **tôn trọng, đối xử công bằng**, bảo vệ quyền, lợi ích hợp pháp, chính đáng của người học (d); nghiên cứu khoa học, cập nhật kỹ năng, tiếp cận công nghệ mới (đ); xây dựng môi trường giáo dục an toàn, dân chủ, đổi mới, sáng tạo (e).", "Điều 10 khoản 1: đạo đức nhà giáo gồm quy tắc ứng xử trong quan hệ với **người học, đồng nghiệp, gia đình người học và cộng đồng**; khoản 2: **Bộ trưởng Bộ Giáo dục và Đào tạo** ban hành quy tắc ứng xử."], "bay": ["⚠ **Quyền = Điều 8**, **nghĩa vụ = Điều 9** (không phải Điều 9-10); Điều 10 là đạo đức.", "⚠ nhà giáo **tham gia** khen thưởng, xử lý kỷ luật người học ≠ **quyết định** một mình.", "⚠ công lập theo pháp luật **viên chức** ≠ ngoài công lập theo pháp luật **lao động**.", "⚠ Quy tắc ứng xử do **Bộ trưởng BGDĐT** ban hành, không phải Chính phủ hay Thủ tướng."], "cauhoi": [{"t": "s", "q": "Quyền của nhà giáo được quy định tại điều nào của Luật Nhà giáo 2025?", "o": ["Điều 7", "Điều 10", "Điều 8", "Điều 9"], "a": [2], "e": "Điều 8 là quyền; Điều 9 là nghĩa vụ; Điều 10 đạo đức nhà giáo.", "r": "Luật Nhà giáo 2025 Điều 8"}, {"t": "s", "q": "Nghĩa vụ của nhà giáo được quy định tại điều nào của Luật Nhà giáo 2025?", "o": ["Điều 9", "Điều 11", "Điều 10", "Điều 8"], "a": [0], "e": "Điều 9 là nghĩa vụ. Bẫy thường gặp: nhầm quyền - nghĩa vụ ở Điều 9-10.", "r": "Luật Nhà giáo 2025 Điều 9"}, {"t": "s", "q": "Theo Điều 7 khoản 3, hoạt động nghề nghiệp nào được thực hiện theo năm học hoặc khóa học?", "o": ["Nghiên cứu khoa học và phục vụ cộng đồng (điểm c, d)", "Tất cả các hoạt động nghề nghiệp ở khoản 2", "Chỉ hoạt động giảng dạy, giáo dục ở điểm a", "Chuẩn bị, tổ chức giảng dạy, giáo dục, đánh giá người học và học tập, bồi dưỡng (điểm a, b)"], "a": [3], "e": "Khoản 3 chỉ nói điểm a và b. Phương án nhiễu mở rộng hoặc thu hẹp phạm vi.", "r": "Luật Nhà giáo 2025 Điều 7 khoản 3"}, {"t": "s", "q": "Nhà giáo làm việc trong cơ sở giáo dục ngoài công lập thực hiện quyền theo quy định của pháp luật nào (Điều 8 khoản 1)?", "o": ["Pháp luật về viên chức", "Pháp luật về lao động", "Pháp luật về cán bộ, công chức", "Luật Giáo dục"], "a": [1], "e": "Công lập theo pháp luật viên chức; ngoài công lập theo pháp luật lao động.", "r": "Luật Nhà giáo 2025 Điều 8 khoản 1"}, {"t": "s", "q": "Nhà giáo cơ sở giáo dục công lập thực hiện nghĩa vụ theo khoản 1 Điều 9 theo pháp luật nào?", "o": ["Pháp luật về lao động", "Pháp luật về viên chức", "Pháp luật về thi đua, khen thưởng", "Pháp luật về cán bộ, công chức"], "a": [1], "e": "Khoản 1 Điều 9 dẫn chiếu pháp luật viên chức (công lập) hoặc lao động (ngoài công lập).", "r": "Luật Nhà giáo 2025 Điều 9 khoản 1"}, {"t": "s", "q": "Theo Điều 8 khoản 2 điểm a, quyền của nhà giáo đối với việc khen thưởng, xử lý kỷ luật người học là gì?", "o": ["Độc lập quyết định khen thưởng, xử lý kỷ luật người học", "Quyết định hình thức kỷ luật đối với người học mà không cần ai phê duyệt", "Chỉ được đề nghị khen thưởng, không được tham gia xử lý kỷ luật", "Nhận xét, đánh giá, tham gia khen thưởng, xử lý kỷ luật người học"], "a": [3], "e": "Bẫy: 'tham gia' khác 'quyết định'.", "r": "Luật Nhà giáo 2025 Điều 8 khoản 2 điểm a"}, {"t": "s", "q": "Nội dung nào sau đây là NGHĨA VỤ (không phải quyền) của nhà giáo?", "o": ["Bảo đảm liêm chính học thuật", "Được tôn trọng, bảo vệ uy tín, danh dự, nhân phẩm", "Nghỉ hè và các ngày nghỉ khác", "Tham gia giảng dạy, nghiên cứu khoa học tại cơ quan, tổ chức khác theo quy định"], "a": [0], "e": "Liêm chính học thuật là nghĩa vụ (Điều 9.2.b); các phương án còn lại là quyền (Điều 8.2).", "r": "Luật Nhà giáo 2025 Điều 9 khoản 2 điểm b"}, {"t": "s", "q": "Theo Điều 10 khoản 2, ai ban hành quy tắc ứng xử của nhà giáo?", "o": ["Chính phủ", "Thủ tướng Chính phủ", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Chủ tịch Ủy ban nhân dân cấp tỉnh"], "a": [2], "e": "Bộ trưởng BGDĐT ban hành. Bẫy: Chính phủ vs Thủ tướng vs Bộ trưởng.", "r": "Luật Nhà giáo 2025 Điều 10 khoản 2"}, {"t": "s", "q": "Theo Điều 10 khoản 1, đạo đức nhà giáo gồm quy tắc ứng xử của nhà giáo trong quan hệ với đối tượng nào?", "o": ["Người học, đồng nghiệp, gia đình người học, cộng đồng và doanh nghiệp", "Chỉ người học và đồng nghiệp", "Người học, đồng nghiệp, cấp trên và cơ quan quản lý", "Người học, đồng nghiệp, gia đình người học và cộng đồng"], "a": [3], "e": "Điều 10 khoản 1 liệt kê 4 nhóm đối tượng. Phương án nhiễu thêm/bớt đối tượng.", "r": "Luật Nhà giáo 2025 Điều 10 khoản 1"}, {"t": "s", "q": "Giáo viên nào sau đây giảng dạy, giáo dục môn học, hoạt động giáo dục theo chương trình giáo dục phổ thông (Điều 7 khoản 4 điểm b)?", "o": ["Giáo viên mầm non, tiểu học, trung học cơ sở", "Giáo viên tiểu học, trung học cơ sở, trung học phổ thông, dự bị đại học", "Giáo viên tiểu học, THCS, THPT và giảng viên đại học", "Chỉ giáo viên trung học cơ sở và trung học phổ thông"], "a": [1], "e": "Điều 7 khoản 4 điểm b. Mầm non không thuộc nhóm này; giảng viên đại học cũng không.", "r": "Luật Nhà giáo 2025 Điều 7 khoản 4"}, {"t": "s", "q": "Quy định về đạo đức nhà giáo nằm ở điều nào của Luật Nhà giáo 2025?", "o": ["Điều 10", "Điều 11", "Điều 12", "Điều 9"], "a": [0], "e": "Điều 10 đạo đức; Điều 11 những việc không được làm; Điều 12 chức danh.", "r": "Luật Nhà giáo 2025 Điều 10"}, {"t": "s", "q": "Điều 8 khoản 2 điểm d của Luật Nhà giáo quy định quyền nào?", "o": ["Nghiên cứu khoa học, chuyển giao", "Đối xử bình đẳng trong phát triển nghề nghiệp", "Nghỉ hè và các ngày nghỉ khác", "Đào tạo, bồi dưỡng nâng cao trình độ"], "a": [2], "e": "Điểm d: nghỉ hè; điểm b: nghiên cứu khoa học; điểm đ: đào tạo, bồi dưỡng; điểm c: bình đẳng.", "r": "Luật Nhà giáo 2025 Điều 8 khoản 2 điểm d"}, {"t": "s", "q": "Theo Điều 9 khoản 2 điểm d, nhà giáo có nghĩa vụ đối với người học như thế nào?", "o": ["Tôn trọng, đối xử công bằng, bảo vệ quyền, lợi ích hợp pháp, chính đáng", "Đối xử bình đẳng trong phát triển nghề nghiệp", "Ưu tiên người học giỏi, đối xử khác biệt", "Chỉ tôn trọng người học, không có nghĩa vụ bảo vệ quyền lợi"], "a": [0], "e": "Điều 9.2.d. 'Bình đẳng trong phát triển nghề nghiệp' là quyền của nhà giáo (Điều 8.2.c).", "r": "Luật Nhà giáo 2025 Điều 9 khoản 2 điểm d"}, {"t": "m", "q": "Nội dung hoạt động nghề nghiệp của nhà giáo (Điều 7 khoản 2) gồm (chọn tất cả đáp án đúng)", "o": ["Học tập, bồi dưỡng", "Chuẩn bị và tổ chức giảng dạy, giáo dục, đánh giá người học", "Nghiên cứu khoa học", "Kinh doanh dịch vụ dạy thêm", "Phục vụ cộng đồng"], "a": [0, 1, 2, 4], "e": "Điều 7.2 gồm các nội dung a-đ; dạy thêm có thu tiền không phải nội dung hoạt động nghề nghiệp.", "r": "Luật Nhà giáo 2025 Điều 7 khoản 2"}, {"t": "m", "q": "Những nội dung nào sau đây là nghĩa vụ của nhà giáo theo Điều 9 khoản 2 (chọn tất cả đáp án đúng)", "o": ["Bảo đảm liêm chính học thuật", "Tham gia xây dựng môi trường giáo dục an toàn, dân chủ, đổi mới, sáng tạo", "Giữ gìn phẩm chất, uy tín, danh dự, nhân phẩm; mẫu mực, nêu gương", "Nghỉ hè và các ngày nghỉ khác", "Cập nhật kỹ năng thực hành, tiếp cận công nghệ mới"], "a": [0, 1, 2, 4], "e": "Nghỉ hè là quyền (Điều 8.2.d).", "r": "Luật Nhà giáo 2025 Điều 9 khoản 2"}, {"t": "m", "q": "Những nội dung nào sau đây là QUYỀN của nhà giáo theo Điều 8 khoản 2 (chọn tất cả đáp án đúng)", "o": ["Bảo đảm liêm chính học thuật", "Mẫu mực, nêu gương trong hoạt động giáo dục", "Được đào tạo, bồi dưỡng nâng cao trình độ", "Nghỉ hè và các ngày nghỉ khác", "Chủ động phân phối thời lượng, sắp xếp nội dung theo chương trình"], "a": [2, 3, 4], "e": "Liêm chính học thuật, mẫu mực, nêu gương là nghĩa vụ (Điều 9.2.b).", "r": "Luật Nhà giáo 2025 Điều 8 khoản 2"}, {"t": "m", "q": "Phát biểu nào đúng về quyền và nghĩa vụ của nhà giáo (chọn tất cả đáp án đúng)", "o": ["Nhà giáo ngoài công lập thực hiện quyền theo pháp luật về lao động", "Nhà giáo công lập thực hiện quyền theo pháp luật về viên chức", "Quyền ở Điều 8, nghĩa vụ ở Điều 9", "Nhà giáo công lập thực hiện quyền theo pháp luật về lao động", "Quyền ở Điều 9, nghĩa vụ ở Điều 10"], "a": [0, 1, 2], "e": "Đổi số điều và đổi pháp luật áp dụng là bẫy.", "r": "Luật Nhà giáo 2025 Điều 8, Điều 9"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 10 Luật Nhà giáo (đạo đức nhà giáo) (chọn tất cả đáp án đúng)", "o": ["Gồm quy tắc ứng xử trong quan hệ với người học", "Thủ tướng Chính phủ ban hành quy tắc ứng xử", "Chỉ gồm quy tắc ứng xử với người học", "Gồm quy tắc ứng xử trong quan hệ với đồng nghiệp", "Bộ trưởng Bộ Giáo dục và Đào tạo ban hành quy tắc ứng xử"], "a": [0, 3, 4], "e": "Bộ trưởng BGDĐT ban hành; quy tắc ứng xử gồm 4 nhóm quan hệ.", "r": "Luật Nhà giáo 2025 Điều 10"}, {"t": "f", "q": "Nhà giáo cơ sở công lập thực hiện quyền theo pháp luật về ____.", "a": [["viên chức"]], "e": "Điều 8 khoản 1.", "r": "Luật Nhà giáo 2025 Điều 8 khoản 1", "o": [["viên chức"], ["lao động"], ["công chức"], ["giáo dục"]], "k": 0}, {"t": "f", "q": "Nhà giáo có quyền nghỉ ____ và các ngày nghỉ khác.", "a": [["hè"]], "e": "Điều 8 khoản 2 điểm d.", "r": "Luật Nhà giáo 2025 Điều 8 khoản 2 điểm d", "o": [["thu"], ["đông"], ["hè"], ["tết"]], "k": 2}, {"t": "f", "q": "Nghĩa vụ giữ gìn phẩm chất, uy tín, danh dự, nhân phẩm, đạo đức nhà giáo; mẫu mực, nêu gương; bảo đảm ____ học thuật.", "a": [["liêm chính"]], "e": "Điều 9 khoản 2 điểm b.", "r": "Luật Nhà giáo 2025 Điều 9 khoản 2 điểm b", "o": [["khách quan"], ["trung thực"], ["nghiêm túc"], ["liêm chính"]], "k": 3}, {"t": "f", "q": "Bộ trưởng Bộ ____ ban hành quy tắc ứng xử của nhà giáo.", "a": [["Giáo dục và Đào tạo"]], "e": "Điều 10 khoản 2.", "r": "Luật Nhà giáo 2025 Điều 10 khoản 2", "o": [["Nội vụ"], ["Khoa học và Công nghệ"], ["Lao động - Thương binh và Xã hội"], ["Giáo dục và Đào tạo"]], "k": 3}, {"t": "f", "q": "Quyền của nhà giáo quy định tại Điều ____, nghĩa vụ của nhà giáo quy định tại Điều ____.", "a": [["8", "tám"], ["9", "chín"]], "e": "Điều 8 quyền, Điều 9 nghĩa vụ.", "r": "Luật Nhà giáo 2025 Điều 8, Điều 9", "o": [["9", "8"], ["7", "8"], ["10", "9"], ["8", "9"]], "k": 3}, {"t": "f", "q": "Hoạt động nghề nghiệp ở điểm a, b khoản 2 Điều 7 được thực hiện theo năm ____ hoặc khóa học.", "a": [["học"]], "e": "Điều 7 khoản 3.", "r": "Luật Nhà giáo 2025 Điều 7 khoản 3", "o": [["học"], ["thi"], ["tài chính"], ["công tác"]], "k": 0}, {"t": "f", "q": "Nhà giáo được chủ động phân phối ____, sắp xếp nội dung theo chương trình.", "a": [["thời lượng"]], "e": "Điều 8 khoản 2 điểm a.", "r": "Luật Nhà giáo 2025 Điều 8 khoản 2 điểm a", "o": [["thời lượng"], ["ngân sách"], ["nhân lực"], ["thời khóa biểu"]], "k": 0}], "ynho": ["**Quyền** ở **Điều 8**, **nghĩa vụ** ở **Điều 9**, đạo đức Điều 10, việc không được làm Điều 11.", "Công lập theo pháp luật **viên chức**; ngoài công lập theo pháp luật **lao động**.", "Nhà giáo **tham gia** khen thưởng, kỷ luật người học, không quyết định một mình.", "Hoạt động ở điểm a, b thực hiện theo **năm học hoặc khóa học**.", "Quy tắc ứng xử do **Bộ trưởng BGDĐT** ban hành."], "bang": [{"tieu_de": "Điều 7-10 nói về cái gì", "cot": ["Điều", "Nội dung"], "dong": [["Điều 7", "Hoạt động nghề nghiệp (5 nhóm a-đ)"], ["Điều 8", "Quyền của nhà giáo"], ["Điều 9", "Nghĩa vụ của nhà giáo"], ["Điều 10", "Đạo đức nhà giáo"], ["Điều 11", "Những việc nhà giáo không được làm"]]}, {"tieu_de": "Áp dụng quyền theo loại cơ sở (Điều 8 khoản 1)", "cot": ["Loại cơ sở", "Quyền thực hiện theo"], "dong": [["Công lập", "Pháp luật về viên chức"], ["Ngoài công lập", "Pháp luật về lao động"]]}], "vidu": [{"tinh_huong": "Thầy Nam muốn xem mình có quyền nghỉ hè không và tra Điều 9.", "ket_luan": "→ Sai điều. Quyền nghỉ hè nằm ở Điều 8 khoản 2 điểm d; Điều 9 là nghĩa vụ."}, {"tinh_huong": "Cô Thu tự chọn học liệu bổ trợ phù hợp chương trình và sắp xếp nội dung các tiết dạy.", "ket_luan": "→ Đúng quyền theo Điều 8 khoản 2 điểm a (chủ động phân phối thời lượng, lựa chọn tài liệu, học liệu)."}, {"tinh_huong": "Cô Mai nói: 'Tôi một mình quyết định khen thưởng, kỷ luật học sinh lớp chủ nhiệm'.", "ket_luan": "→ Sai. Nhà giáo được tham gia khen thưởng, xử lý kỷ luật người học (Điều 8.2.a), không phải quyết định một mình."}, {"tinh_huong": "Thầy Đức sửa bài, chép nguồn trung thực và nêu gương liêm chính khi nghiên cứu sáng kiến.", "ket_luan": "→ Đúng nghĩa vụ Điều 9 khoản 2 điểm b (mẫu mực, nêu gương, liêm chính học thuật)."}, {"tinh_huong": "Cô Vy dạy ở trường THCS tư thục, quyền của cô thực hiện theo luật nào?", "ket_luan": "→ Theo pháp luật về lao động (Điều 8 khoản 1), vì là cơ sở ngoài công lập."}], "nho": ["**Quyền 8 – Nghĩa vụ 9**: quyền đứng trước (8), nghĩa vụ đứng sau (9).", "**Công = Viên chức, Tư = Lao động**: cơ sở công lập theo viên chức, ngoài công lập theo lao động.", "Điều 10 đạo đức gồm **4 quan hệ**: người học, đồng nghiệp, gia đình người học, cộng đồng.", "Nghĩa vụ phải nhớ cụm **liêm chính học thuật** và **tôn trọng, đối xử công bằng** người học."]}, {"id": "L3-3", "ten": "Những việc không được làm; chức danh và chuẩn nghề nghiệp (Điều 11-13)", "tomtat": ["Điều 11 khoản 1: nhà giáo **công lập** không được làm những việc viên chức không được làm; nhà giáo **ngoài công lập** không thực hiện hành vi bị nghiêm cấm trong lĩnh vực **lao động**.", "Điều 11 khoản 2 liệt kê **5 việc** nhà giáo không được làm (a-đ).", "Điều 11.2.a: không **phân biệt đối xử** giữa những người học **dưới mọi hình thức**.", "Điều 11.2.b: không **gian lận, cố ý làm sai lệch kết quả** trong **tuyển sinh, đánh giá người học**.", "Điều 11.2.c: không **ép buộc** người học tham gia **học thêm dưới mọi hình thức**.", "Điều 11.2.d: không ép buộc người học nộp **tiền hoặc hiện vật** ngoài quy định của pháp luật; điểm đ: không lợi dụng chức danh nhà giáo và hoạt động nghề nghiệp để thực hiện hành vi vi phạm pháp luật.", "Điều 11 khoản 3: **tổ chức, cá nhân** không được không thực hiện đầy đủ chế độ, chính sách đối với nhà giáo; không đăng tải, phát tán thông tin **mang tính quy kết** về trách nhiệm của nhà giáo khi **chưa có kết luận** của cơ quan có thẩm quyền.", "Điều 12: chức danh nhà giáo là tên gọi thể hiện trình độ, năng lực chuyên môn, nghiệp vụ trong từng **cấp học**; **Bộ trưởng BGDĐT** xác định tương đương chức danh (khoản 4); **Chính phủ** quy định chi tiết (khoản 5).", "Điều 13 khoản 1: chuẩn nghề nghiệp là hệ thống **tiêu chuẩn** theo từng chức danh, gồm đạo đức nhà giáo; trình độ đào tạo, bồi dưỡng; năng lực chuyên môn, nghiệp vụ.", "Điều 13 khoản 2: áp dụng **thống nhất** cho công lập và ngoài công lập; khoản 3: dùng trong tuyển dụng, bố trí, đánh giá, đào tạo, bồi dưỡng.", "Điều 13 khoản 4: nhà giáo **tự đánh giá**, lập kế hoạch phát triển nghề nghiệp **liên tục**; khoản 5: **Bộ trưởng BGDĐT** quy định chi tiết."], "bay": ["⚠ Luật Nhà giáo: ép học thêm **dưới mọi hình thức**; Luật Giáo dục Điều 22 khoản 5: ép học thêm **để thu tiền**.", "⚠ Điều 11 khoản 2 là việc **nhà giáo** không được làm; khoản 3 là việc **tổ chức, cá nhân** không được làm đối với nhà giáo.", "⚠ thông tin quy kết **khi chưa có kết luận** của cơ quan có thẩm quyền (đã có kết luận thì không thuộc điều cấm này).", "⚠ Chức danh: **Bộ trưởng** xác định tương đương (khoản 4), **Chính phủ** quy định chi tiết (khoản 5)."], "cauhoi": [{"t": "s", "q": "Theo Điều 11 Luật Nhà giáo, nhà giáo không được ép buộc người học tham gia học thêm như thế nào?", "o": ["Trong giờ học chính khóa", "Bằng hình thức tổ chức dạy thêm có thu tiền", "Dưới mọi hình thức", "Để thu tiền"], "a": [2], "e": "Điều 11.2.c: 'dưới mọi hình thức'. Bẫy: Luật Giáo dục Điều 22 khoản 5 dùng 'để thu tiền'.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2 điểm c"}, {"t": "s", "q": "Điều 11 khoản 2 Luật Nhà giáo liệt kê bao nhiêu việc nhà giáo không được làm (ngoài khoản 1)?", "o": ["5 việc", "6 việc", "4 việc", "3 việc"], "a": [0], "e": "Các điểm a, b, c, d, đ = 5 việc.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2"}, {"t": "s", "q": "Theo Điều 11 khoản 1, nhà giáo ngoài công lập không được thực hiện hành vi bị nghiêm cấm trong lĩnh vực nào?", "o": ["Viên chức", "Giáo dục", "Thi đua, khen thưởng", "Lao động"], "a": [3], "e": "Nhà giáo công lập: những việc viên chức không được làm; ngoài công lập: hành vi bị cấm trong lĩnh vực lao động.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 1"}, {"t": "s", "q": "Hành vi nào sau đây là việc nhà giáo không được làm theo Điều 11 khoản 2?", "o": ["Nhận xét, đánh giá người học theo chuẩn nghề nghiệp", "Cố ý làm sai lệch kết quả đánh giá người học", "Chủ động lựa chọn tài liệu, học liệu theo chương trình", "Tham gia giảng dạy tại cơ quan, tổ chức khác theo quy định"], "a": [1], "e": "Điều 11.2.b. Ba phương án còn lại là quyền hợp pháp (Điều 8.2).", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2 điểm b"}, {"t": "s", "q": "Phát biểu nào đúng về việc nhà giáo không được làm quy định tại Điều 11 khoản 2 điểm d?", "o": ["Chỉ cấm ép buộc nộp hiện vật có giá trị lớn", "Không ép buộc người học nộp tiền hoặc hiện vật ngoài quy định của pháp luật", "Không ép buộc người học nộp tiền, còn hiện vật thì không bị cấm", "Không được thu mọi khoản tiền của người học, kể cả theo quy định của pháp luật"], "a": [1], "e": "Cấm ép buộc nộp tiền HOẶC hiện vật NGOÀI quy định của pháp luật. Phương án nhiễu đổi/bớt điều kiện.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2 điểm d"}, {"t": "s", "q": "Hành vi nào sau đây là việc tổ chức, cá nhân không được làm đối với nhà giáo theo Điều 11 khoản 3?", "o": ["Đăng tải thông tin về trách nhiệm của nhà giáo sau khi có kết luận của cơ quan có thẩm quyền", "Góp ý phê bình nhà giáo trong cuộc họp phụ huynh", "Phản ánh sự việc đến cơ quan có thẩm quyền", "Đăng tải thông tin mang tính quy kết về trách nhiệm của nhà giáo khi chưa có kết luận của cơ quan có thẩm quyền"], "a": [3], "e": "Điều cấm gắn với thời điểm 'khi chưa có kết luận'. Bẫy: đảo điều kiện thời điểm.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 3"}, {"t": "s", "q": "Theo Điều 12, ai xác định tương đương chức danh nhà giáo?", "o": ["Bộ trưởng Bộ Giáo dục và Đào tạo", "Chính phủ", "Chủ tịch Ủy ban nhân dân cấp tỉnh", "Thủ tướng Chính phủ"], "a": [0], "e": "Khoản 4: Bộ trưởng BGDĐT xác định tương đương; khoản 5: Chính phủ quy định chi tiết.", "r": "Luật Nhà giáo 2025 Điều 12 khoản 4"}, {"t": "s", "q": "Theo Điều 12, cơ quan nào quy định chi tiết về chức danh nhà giáo (khoản 5)?", "o": ["Quốc hội", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Chính phủ", "Ủy ban nhân dân cấp tỉnh"], "a": [2], "e": "Khoản 5: Chính phủ quy định chi tiết. Bẫy đổi chủ thể với khoản 4.", "r": "Luật Nhà giáo 2025 Điều 12 khoản 5"}, {"t": "s", "q": "Nội dung nào sau đây KHÔNG thuộc hệ thống tiêu chuẩn của chuẩn nghề nghiệp nhà giáo (Điều 13 khoản 1)?", "o": ["Trình độ đào tạo, bồi dưỡng", "Đạo đức nhà giáo", "Năng lực chuyên môn, nghiệp vụ", "Thâm niên công tác"], "a": [3], "e": "Chuẩn gồm 3 nhóm tiêu chuẩn: đạo đức; trình độ; năng lực chuyên môn, nghiệp vụ.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 1"}, {"t": "s", "q": "Chuẩn nghề nghiệp nhà giáo theo Điều 13 khoản 2 được áp dụng như thế nào?", "o": ["Riêng từng loại hình, khác nhau giữa công lập và ngoài công lập", "Thống nhất cho cơ sở giáo dục công lập và ngoài công lập", "Chỉ cho nhà giáo mới được tuyển dụng", "Chỉ cho cơ sở giáo dục công lập"], "a": [1], "e": "Khoản 2: áp dụng thống nhất.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 2"}, {"t": "s", "q": "Theo Điều 13 khoản 4, nhà giáo thực hiện việc gì liên quan đến chuẩn nghề nghiệp?", "o": ["Tự đánh giá, lập kế hoạch phát triển nghề nghiệp liên tục", "Tự ban hành chuẩn nghề nghiệp cho mình", "Chỉ chịu sự đánh giá của người đứng đầu cơ sở giáo dục", "Tự đánh giá nhưng không phải lập kế hoạch phát triển"], "a": [0], "e": "Khoản 4: tự đánh giá và lập kế hoạch phát triển nghề nghiệp liên tục.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 4"}, {"t": "s", "q": "Ai quy định chi tiết về chuẩn nghề nghiệp nhà giáo (Điều 13 khoản 5)?", "o": ["Thủ tướng Chính phủ", "Người đứng đầu cơ sở giáo dục", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Chính phủ"], "a": [2], "e": "Khoản 5 Điều 13: Bộ trưởng BGDĐT quy định chi tiết.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 5"}, {"t": "s", "q": "Theo Điều 12, chức danh nhà giáo là tên gọi thể hiện trình độ, năng lực chuyên môn, nghiệp vụ trong từng đơn vị nào?", "o": ["Cấp học", "Hạng lương", "Địa bàn công tác", "Môn học"], "a": [0], "e": "Điều 12: trong từng cấp học.", "r": "Luật Nhà giáo 2025 Điều 12"}, {"t": "m", "q": "Những việc nào sau đây nhà giáo KHÔNG được làm theo Điều 11 khoản 2 (chọn tất cả đáp án đúng)", "o": ["Nhận xét, đánh giá người học", "Phân biệt đối xử giữa những người học dưới mọi hình thức", "Tham gia giảng dạy, nghiên cứu khoa học tại cơ quan, tổ chức khác theo quy định", "Ép buộc người học tham gia học thêm dưới mọi hình thức", "Lợi dụng chức danh nhà giáo để thực hiện hành vi vi phạm pháp luật"], "a": [1, 3, 4], "e": "Hai phương án sau là quyền theo Điều 8.2.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2"}, {"t": "m", "q": "Những hành vi nào tổ chức, cá nhân không được làm đối với nhà giáo (Điều 11 khoản 3) (chọn tất cả đáp án đúng)", "o": ["Gian lận kết quả đánh giá người học", "Phát tán thông tin mang tính quy kết về trách nhiệm của nhà giáo khi chưa có kết luận của cơ quan có thẩm quyền", "Công khai kết luận của cơ quan có thẩm quyền về nhà giáo", "Các việc khác theo quy định của pháp luật", "Không thực hiện đầy đủ chế độ, chính sách đối với nhà giáo"], "a": [1, 3, 4], "e": "Gian lận đánh giá người học là việc của nhà giáo (khoản 2).", "r": "Luật Nhà giáo 2025 Điều 11 khoản 3"}, {"t": "m", "q": "Chuẩn nghề nghiệp nhà giáo gồm các tiêu chuẩn nào (Điều 13 khoản 1) (chọn tất cả đáp án đúng)", "o": ["Trình độ đào tạo, bồi dưỡng", "Năng lực chuyên môn, nghiệp vụ", "Đạo đức nhà giáo", "Thâm niên giảng dạy", "Kết quả học tập của người học"], "a": [0, 1, 2], "e": "Chuẩn gồm đúng 3 nhóm tiêu chuẩn.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 1"}, {"t": "m", "q": "Chuẩn nghề nghiệp nhà giáo được sử dụng trong những hoạt động nào (Điều 13 khoản 3) (chọn tất cả đáp án đúng)", "o": ["Bố trí, sử dụng", "Cấp phép thành lập trường", "Đánh giá", "Tuyển dụng", "Đào tạo, bồi dưỡng"], "a": [0, 2, 3, 4], "e": "Khoản 3: tuyển dụng, bố trí, đánh giá, đào tạo, bồi dưỡng.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 3"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 11 Luật Nhà giáo (chọn tất cả đáp án đúng)", "o": ["Luật Nhà giáo chỉ cấm ép buộc học thêm để thu tiền", "Khoản 2 quy định việc nhà giáo không được làm", "Luật Nhà giáo cấm ép buộc học thêm dưới mọi hình thức", "Khoản 3 quy định việc nhà giáo không được làm", "Khoản 3 quy định việc tổ chức, cá nhân không được làm đối với nhà giáo"], "a": [1, 2, 4], "e": "Phân biệt chủ thể (khoản 2 - nhà giáo; khoản 3 - tổ chức, cá nhân) và phạm vi 'mọi hình thức'.", "r": "Luật Nhà giáo 2025 Điều 11"}, {"t": "f", "q": "Nhà giáo không được ép buộc người học tham gia ____ dưới ____ hình thức.", "a": [["học thêm"], ["mọi"]], "e": "Điều 11 khoản 2 điểm c.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2 điểm c", "o": [["học thêm", "một số"], ["học thêm", "mọi"], ["thi thêm", "mọi"], ["học thêm", "bất kỳ"]], "k": 1}, {"t": "f", "q": "Nhà giáo không được ____ giữa những người học dưới mọi hình thức.", "a": [["phân biệt đối xử"]], "e": "Điều 11 khoản 2 điểm a.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2 điểm a", "o": [["đánh giá"], ["xếp loại"], ["khen thưởng"], ["phân biệt đối xử"]], "k": 3}, {"t": "f", "q": "Nhà giáo không được lợi dụng chức danh nhà giáo và hoạt động nghề nghiệp để thực hiện hành vi ____ pháp luật.", "a": [["vi phạm"]], "e": "Điều 11 khoản 2 điểm đ.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 2 điểm đ", "o": [["vi phạm"], ["làm trái"], ["xâm phạm"], ["lạm dụng"]], "k": 0}, {"t": "f", "q": "Những việc nhà giáo không được làm được quy định tại Điều ____ Luật Nhà giáo.", "a": [["11", "mười một"]], "e": "Điều 11.", "r": "Luật Nhà giáo 2025 Điều 11", "o": [["11"], ["10"], ["12"], ["13"]], "k": 0}, {"t": "f", "q": "Không đăng tải, phát tán thông tin mang tính ____ về trách nhiệm của nhà giáo khi chưa có ____ của cơ quan có thẩm quyền.", "a": [["quy kết"], ["kết luận"]], "e": "Điều 11 khoản 3 điểm b.", "r": "Luật Nhà giáo 2025 Điều 11 khoản 3 điểm b", "o": [["kết luận", "quy kết"], ["đánh giá", "kết luận"], ["quy kết", "kết luận"], ["quy kết", "xử lý"]], "k": 2}, {"t": "f", "q": "Chuẩn nghề nghiệp nhà giáo là hệ thống ____ theo từng chức danh nhà giáo.", "a": [["tiêu chuẩn"]], "e": "Điều 13 khoản 1.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 1", "o": [["tiêu chí"], ["quy định"], ["tiêu chuẩn"], ["quy trình"]], "k": 2}, {"t": "f", "q": "Chuẩn nghề nghiệp nhà giáo được áp dụng thống nhất cho cơ sở giáo dục công lập và ____.", "a": [["ngoài công lập"]], "e": "Điều 13 khoản 2.", "r": "Luật Nhà giáo 2025 Điều 13 khoản 2", "o": [["ngoài công lập"], ["công lập"], ["tư thục"], ["dân lập"]], "k": 0}, {"t": "f", "q": "Chức danh nhà giáo thể hiện trình độ, năng lực chuyên môn, nghiệp vụ trong từng ____ học.", "a": [["cấp"]], "e": "Điều 12.", "r": "Luật Nhà giáo 2025 Điều 12", "o": [["cấp"], ["lớp"], ["trình độ"], ["chương trình"]], "k": 0}], "ynho": ["Điều 11 khoản 2 có **5 việc** nhà giáo không được làm (a-đ).", "Ép học thêm: **dưới mọi hình thức** (Luật Giáo dục Điều 22.5 là **để thu tiền**).", "Không ép nộp **tiền hoặc hiện vật** ngoài quy định pháp luật.", "Không phát tán thông tin **quy kết** khi **chưa có kết luận** của cơ quan có thẩm quyền.", "Chuẩn nghề nghiệp áp dụng **thống nhất** công lập và ngoài công lập."], "bang": [{"tieu_de": "5 việc nhà giáo không được làm (Điều 11.2)", "cot": ["Điểm", "Nội dung"], "dong": [["a", "Phân biệt đối xử người học dưới mọi hình thức"], ["b", "Gian lận, cố ý làm sai lệch kết quả tuyển sinh, đánh giá"], ["c", "Ép buộc người học học thêm dưới mọi hình thức"], ["d", "Ép nộp tiền hoặc hiện vật ngoài quy định"], ["đ", "Lợi dụng chức danh và hoạt động nghề nghiệp để vi phạm pháp luật"]]}, {"tieu_de": "Ai không được làm gì", "cot": ["Khoản", "Chủ thể", "Nội dung"], "dong": [["Khoản 1", "Nhà giáo công lập / ngoài công lập", "Việc viên chức không được làm / hành vi bị nghiêm cấm trong lĩnh vực lao động"], ["Khoản 2", "Nhà giáo", "5 việc (a-đ)"], ["Khoản 3", "Tổ chức, cá nhân", "Không thực hiện đầy đủ chế độ chính sách; không phát tán thông tin quy kết khi chưa có kết luận"]]}], "vidu": [{"tinh_huong": "Cô Hồng nhắc học sinh giỏi hơn trong lớp, đối xử lạnh nhạt với học sinh gia đình khó khăn.", "ket_luan": "→ Vi phạm Điều 11 khoản 2 điểm a (phân biệt đối xử giữa người học)."}, {"tinh_huong": "Thầy Sơn thông báo học sinh nào không đăng ký lớp học thêm của thầy sẽ bị trừ điểm hạnh kiểm.", "ket_luan": "→ Vi phạm Điều 11.2.c (ép buộc học thêm dưới mọi hình thức)."}, {"tinh_huong": "Cô Trang yêu cầu phụ huynh nộp quỹ riêng bằng tiền và quà không có trong quy định.", "ket_luan": "→ Vi phạm Điều 11.2.d (ép nộp tiền hoặc hiện vật ngoài quy định)."}, {"tinh_huong": "Một phụ huynh đăng lên mạng 'thầy X đã vi phạm' trong khi cơ quan có thẩm quyền chưa kết luận.", "ket_luan": "→ Vi phạm Điều 11 khoản 3 (phát tán thông tin quy kết khi chưa có kết luận)."}, {"tinh_huong": "Thầy Lâm sửa điểm kiểm tra cho học sinh để đạt chỉ tiêu thi đua.", "ket_luan": "→ Vi phạm Điều 11.2.b (gian lận, cố ý làm sai lệch kết quả đánh giá)."}], "nho": ["**P-G-É-T-L**: Phân biệt – Gian lận – Ép học thêm – Thu tiền – Lợi dụng (a-b-c-d-đ).", "Ép học thêm: Luật Nhà giáo **mọi hình thức**; Luật Giáo dục **để thu tiền**.", "Khoản 2 là việc của **nhà giáo**; khoản 3 là việc của **tổ chức, cá nhân** đối với nhà giáo.", "Bộ trưởng **xác định tương đương** chức danh (khoản 4), Chính phủ **quy định chi tiết** (khoản 5)."]}, {"id": "L3-4", "ten": "Tuyển dụng, sử dụng, điều động, thuyên chuyển, đánh giá nhà giáo (Điều 14-22)", "tomtat": ["Điều 14 khoản 1: tuyển dụng căn cứ chuẩn nghề nghiệp; phương thức **thi tuyển hoặc xét tuyển**, trong đó **phải có thực hành sư phạm** (điểm b).", "Điều 14 khoản 3: ưu tiên người đã làm nhiệm vụ giảng dạy, giáo dục ở vị trí phù hợp; (giáo dục nghề nghiệp) người có kỹ năng nghề cao.", "Điều 14 khoản 4: **không được đăng ký** tuyển dụng: mất/hạn chế năng lực hành vi dân sự hoặc khó khăn nhận thức, làm chủ hành vi; đang bị truy cứu trách nhiệm hình sự, đang chấp hành bản án, quyết định hình sự, đang bị áp dụng biện pháp đưa vào cơ sở cai nghiện bắt buộc, cơ sở giáo dục bắt buộc; đã có **tiền án** về tội xâm phạm an ninh quốc gia, tính mạng, sức khỏe, nhân phẩm, danh dự con người.", "Điều 14 khoản 5: sử dụng **hợp đồng làm việc** (viên chức) và **hợp đồng lao động**.", "Điều 15: tiếp nhận nhà giáo trong cơ sở công lập qua **kiểm tra, sát hạch**; đối tượng gồm người được tiếp nhận làm viên chức và đối tượng thu hút, trọng dụng (Điều 25).", "Điều 16: chế độ làm việc gồm thời gian làm việc, thời gian **nghỉ hè** hằng năm và các ngày nghỉ khác; khoản 3 nghỉ hè bố trí theo quy định của **Chính phủ**; khoản 4 **Bộ trưởng BGDĐT** quy định chi tiết chế độ làm việc.", "Điều 17 khoản 3: **không điều động** nhà giáo nữ đang mang thai hoặc nuôi con dưới **36 tháng tuổi**; hoàn cảnh đặc biệt khó khăn; vợ/chồng đang điều động, biệt phái ở vùng khó khăn (trừ khi tự nguyện).", "Điều 19 khoản 2: **không được thuyên chuyển** khi đang bị xem xét kỷ luật, kiểm tra, xác minh, thanh tra, điều tra, truy tố, xét xử; hoặc **chưa đủ 03 năm** công tác kể từ ngày được tuyển dụng (trừ tự nguyện đến vùng đồng bào dân tộc thiểu số, miền núi, biên giới, hải đảo, đặc biệt khó khăn).", "Điều 20 khoản 1: dạy liên trường, liên cấp là giảng dạy đồng thời từ **02 cơ sở giáo dục trở lên**.", "Điều 21: nhà giáo giữ chức vụ quản lý cơ sở giáo dục được hưởng chế độ của chức vụ quản lý; nếu giảng dạy **đủ định mức** thì được hưởng chế độ nhà giáo.", "Điều 22: đánh giá nhà giáo định kỳ theo **năm hoặc năm học**, và khi thay đổi vị trí việc làm, bổ nhiệm, miễn nhiệm, quy hoạch, đào tạo, khen thưởng, kỷ luật...; nội dung theo chuẩn nghề nghiệp."], "bay": ["⚠ tuyển dụng: thi tuyển **hoặc** xét tuyển, nhưng **phải có** thực hành sư phạm (không phải 'có thể').", "⚠ nghỉ hè do **Chính phủ** quy định (Điều 16.3) ≠ chế độ làm việc chi tiết do **Bộ trưởng BGDĐT** (Điều 16.4).", "⚠ **điều động** không áp dụng với nữ nuôi con **dưới 36 tháng**; **thuyên chuyển** cấm khi **chưa đủ 03 năm** kể từ tuyển dụng.", "⚠ Tiếp nhận (Điều 15) bằng **kiểm tra, sát hạch**, khác với tuyển dụng (thi tuyển/xét tuyển)."], "cauhoi": [{"t": "s", "q": "Theo Điều 14 khoản 1, phương thức tuyển dụng nhà giáo là gì?", "o": ["Chỉ xét tuyển, không cần thực hành sư phạm", "Chỉ thi tuyển, trong đó có thể có thực hành sư phạm", "Thi tuyển hoặc xét tuyển, trong đó phải có thực hành sư phạm", "Thi tuyển hoặc xét tuyển, trong đó có thể có thực hành sư phạm"], "a": [2], "e": "Điều 14.1.b: 'phải có thực hành sư phạm'. Bẫy: 'phải' ≠ 'có thể'; 'hoặc' ≠ 'chỉ'.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 1 điểm b"}, {"t": "s", "q": "Người nào sau đây không được đăng ký tuyển dụng nhà giáo theo Điều 14 khoản 4?", "o": ["Người đang bị truy cứu trách nhiệm hình sự", "Người từng bị xử phạt vi phạm hành chính về trật tự công cộng", "Người có bằng cử nhân chuyên ngành phù hợp nhưng chưa có kinh nghiệm giảng dạy", "Người đã hoàn thành chương trình bồi dưỡng nghiệp vụ sư phạm"], "a": [0], "e": "Điều 14.4.b. Các phương án còn lại không thuộc trường hợp bị cấm đăng ký.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 4"}, {"t": "s", "q": "Theo Điều 14 khoản 5, nhà giáo được sử dụng theo loại hợp đồng nào?", "o": ["Hợp đồng dịch vụ và hợp đồng làm việc", "Chỉ hợp đồng làm việc", "Chỉ hợp đồng lao động", "Hợp đồng làm việc và hợp đồng lao động"], "a": [3], "e": "Khoản 5: hợp đồng làm việc (viên chức) và hợp đồng lao động.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 5"}, {"t": "s", "q": "Việc tiếp nhận nhà giáo trong cơ sở giáo dục công lập theo Điều 15 được thực hiện thông qua hình thức nào?", "o": ["Xét tuyển", "Kiểm tra, sát hạch", "Phỏng vấn", "Thi tuyển"], "a": [1], "e": "Điều 15: kiểm tra, sát hạch. Bẫy: thi tuyển/xét tuyển là phương thức tuyển dụng (Điều 14).", "r": "Luật Nhà giáo 2025 Điều 15"}, {"t": "s", "q": "Theo Điều 16 khoản 3, thời gian nghỉ hè hằng năm của nhà giáo được bố trí theo quy định của cơ quan nào?", "o": ["Người đứng đầu cơ sở giáo dục", "Chính phủ", "Ủy ban nhân dân cấp tỉnh", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [1], "e": "Điều 16.3: theo quy định của Chính phủ. Bộ trưởng quy định chi tiết chế độ làm việc (khoản 4).", "r": "Luật Nhà giáo 2025 Điều 16 khoản 3"}, {"t": "s", "q": "Ai quy định chi tiết chế độ làm việc của nhà giáo theo Điều 16 khoản 4?", "o": ["Giám đốc Sở Giáo dục và Đào tạo", "Chính phủ", "Thủ tướng Chính phủ", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [3], "e": "Điều 16.4. Bẫy đổi chủ thể với khoản 3 (Chính phủ).", "r": "Luật Nhà giáo 2025 Điều 16 khoản 4"}, {"t": "s", "q": "Theo Điều 17 khoản 3, không điều động nhà giáo nữ đang mang thai hoặc nuôi con dưới bao nhiêu tháng tuổi?", "o": ["36 tháng", "60 tháng", "24 tháng", "12 tháng"], "a": [0], "e": "Điều 17.3: dưới 36 tháng tuổi.", "r": "Luật Nhà giáo 2025 Điều 17 khoản 3"}, {"t": "s", "q": "Theo Điều 19 khoản 2, nhà giáo chưa đủ bao nhiêu năm công tác kể từ ngày được tuyển dụng thì không được thuyên chuyển (trừ trường hợp luật định)?", "o": ["02 năm", "10 năm", "03 năm", "05 năm"], "a": [2], "e": "Điều 19.2.b: chưa đủ 03 năm.", "r": "Luật Nhà giáo 2025 Điều 19 khoản 2 điểm b"}, {"t": "s", "q": "Phát biểu nào đúng về điều kiện thuyên chuyển nhà giáo theo Điều 19 khoản 2?", "o": ["Được thuyên chuyển bất kể đang bị xem xét kỷ luật", "Không được thuyên chuyển khi chưa đủ 03 năm công tác, kể cả trường hợp tự nguyện đến vùng đặc biệt khó khăn", "Không được thuyên chuyển khi chưa đủ 05 năm công tác kể từ ngày tuyển dụng", "Không được thuyên chuyển khi chưa đủ 03 năm công tác kể từ ngày tuyển dụng, trừ trường hợp tự nguyện đến vùng đặc biệt khó khăn, biên giới, hải đảo"], "a": [3], "e": "Có ngoại lệ tự nguyện đến vùng khó khăn; số năm là 03; đang bị xem xét kỷ luật thì không được thuyên chuyển.", "r": "Luật Nhà giáo 2025 Điều 19 khoản 2"}, {"t": "s", "q": "Theo Điều 20 khoản 1, dạy liên trường là giảng dạy đồng thời từ bao nhiêu cơ sở giáo dục trở lên?", "o": ["01 cơ sở", "02 cơ sở", "03 cơ sở", "05 cơ sở"], "a": [1], "e": "Điều 20.1: đồng thời từ 02 cơ sở giáo dục trở lên.", "r": "Luật Nhà giáo 2025 Điều 20 khoản 1"}, {"t": "s", "q": "Theo Điều 21, nhà giáo giữ chức vụ quản lý cơ sở giáo dục, nếu giảng dạy đủ định mức thì được hưởng chế độ nào?", "o": ["Chế độ của chức vụ quản lý và chế độ của nhà giáo", "Không được hưởng chế độ nào", "Chỉ chế độ của chức vụ quản lý", "Chỉ chế độ của nhà giáo"], "a": [0], "e": "Điều 21: được hưởng chế độ chức vụ quản lý; nếu giảng dạy đủ định mức thì được hưởng chế độ nhà giáo.", "r": "Luật Nhà giáo 2025 Điều 21"}, {"t": "s", "q": "Theo Điều 22 khoản 1, đánh giá định kỳ nhà giáo được thực hiện theo chu kỳ nào?", "o": ["Chỉ khi có yêu cầu của cơ quan quản lý", "Theo 03 năm một lần", "Theo năm hoặc năm học", "Theo quý"], "a": [2], "e": "Điều 22.1: định kỳ theo năm hoặc năm học.", "r": "Luật Nhà giáo 2025 Điều 22 khoản 1"}, {"t": "s", "q": "Theo Điều 14 khoản 3, đối tượng nào được ưu tiên khi tuyển dụng nhà giáo?", "o": ["Người đã làm nhiệm vụ giảng dạy, giáo dục ở vị trí phù hợp", "Người có hộ khẩu tại địa phương tuyển dụng", "Người nhỏ tuổi nhất trong hồ sơ", "Người có học vị tiến sĩ"], "a": [0], "e": "Điều 14.3 ưu tiên người đã làm nhiệm vụ giảng dạy, giáo dục ở vị trí phù hợp.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 3"}, {"t": "m", "q": "Các trường hợp nào sau đây không được đăng ký tuyển dụng nhà giáo (Điều 14 khoản 4) (chọn tất cả đáp án đúng)", "o": ["Đang bị truy cứu trách nhiệm hình sự", "Đã hoàn thành nghĩa vụ quân sự", "Chưa có chứng chỉ ngoại ngữ", "Đã có tiền án về tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự con người", "Mất hoặc hạn chế năng lực hành vi dân sự"], "a": [0, 3, 4], "e": "Điều 14.4 a, b, c; hai phương án nhiễu không thuộc các trường hợp cấm.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 4"}, {"t": "m", "q": "Các trường hợp nào không điều động nhà giáo theo Điều 17 khoản 3 (chọn tất cả đáp án đúng)", "o": ["Nhà giáo nữ đang nuôi con dưới 36 tháng tuổi", "Nhà giáo có vợ/chồng đang được điều động ở vùng khó khăn (trừ khi tự nguyện)", "Nhà giáo vừa được tuyển dụng chưa đủ 03 năm", "Nhà giáo đã đủ 03 năm công tác", "Nhà giáo nữ đang mang thai"], "a": [0, 1, 4], "e": "03 năm là điều kiện về thuyên chuyển (Điều 19), không phải điều động.", "r": "Luật Nhà giáo 2025 Điều 17 khoản 3"}, {"t": "m", "q": "Các trường hợp nào không được thuyên chuyển nhà giáo (Điều 19 khoản 2) (chọn tất cả đáp án đúng)", "o": ["Chưa đủ 03 năm công tác kể từ ngày được tuyển dụng (trừ trường hợp luật định)", "Nhà giáo nữ nuôi con dưới 36 tháng tuổi", "Đang bị thanh tra, điều tra", "Đã đủ 03 năm công tác", "Đang bị xem xét kỷ luật"], "a": [0, 2, 4], "e": "Nuôi con dưới 36 tháng là trường hợp không điều động (Điều 17).", "r": "Luật Nhà giáo 2025 Điều 19 khoản 2"}, {"t": "m", "q": "Phát biểu nào đúng về chế độ làm việc của nhà giáo (Điều 16) (chọn tất cả đáp án đúng)", "o": ["Bộ trưởng BGDĐT quy định thời gian nghỉ hè", "Bộ trưởng BGDĐT quy định chi tiết chế độ làm việc", "Thời gian làm việc không gồm hoạt động nghiên cứu khoa học và phục vụ cộng đồng", "Thời gian nghỉ hè được bố trí theo quy định của Chính phủ", "Chế độ làm việc gồm thời gian làm việc, nghỉ hè hằng năm và các ngày nghỉ khác"], "a": [1, 3, 4], "e": "Thời gian làm việc là thời gian thực hiện hoạt động nghề nghiệp (khoản 2 Điều 7), gồm cả nghiên cứu khoa học, phục vụ cộng đồng.", "r": "Luật Nhà giáo 2025 Điều 16"}, {"t": "m", "q": "Phát biểu nào đúng về tuyển dụng và tiếp nhận nhà giáo (chọn tất cả đáp án đúng)", "o": ["Tuyển dụng phải có thực hành sư phạm", "Tiếp nhận nhà giáo thông qua thi tuyển", "Tuyển dụng không bắt buộc thực hành sư phạm", "Tiếp nhận nhà giáo trong cơ sở công lập thông qua kiểm tra, sát hạch", "Tuyển dụng có thể thi tuyển hoặc xét tuyển"], "a": [0, 3, 4], "e": "Phân biệt: tuyển dụng (Điều 14) và tiếp nhận (Điều 15).", "r": "Luật Nhà giáo 2025 Điều 14, Điều 15"}, {"t": "f", "q": "Phương thức tuyển dụng nhà giáo là thi tuyển hoặc xét tuyển, trong đó phải có ____ sư phạm.", "a": [["thực hành"]], "e": "Điều 14 khoản 1 điểm b.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 1 điểm b", "o": [["lý thuyết"], ["thử thách"], ["thực hành"], ["đánh giá"]], "k": 2}, {"t": "f", "q": "Không điều động nhà giáo nữ đang mang thai hoặc nuôi con dưới ____ tháng tuổi.", "a": [["36", "ba mươi sáu"]], "e": "Điều 17 khoản 3.", "r": "Luật Nhà giáo 2025 Điều 17 khoản 3", "o": [["24"], ["36"], ["12"], ["48"]], "k": 1}, {"t": "f", "q": "Nhà giáo chưa đủ ____ năm công tác kể từ ngày được tuyển dụng thì không được thuyên chuyển, trừ trường hợp luật định.", "a": [["03", "3", "ba"]], "e": "Điều 19 khoản 2 điểm b.", "r": "Luật Nhà giáo 2025 Điều 19 khoản 2 điểm b", "o": [["05"], ["02"], ["03"], ["10"]], "k": 2}, {"t": "f", "q": "Dạy liên trường là giảng dạy đồng thời từ ____ cơ sở giáo dục trở lên.", "a": [["02", "2", "hai"]], "e": "Điều 20 khoản 1.", "r": "Luật Nhà giáo 2025 Điều 20 khoản 1", "o": [["03"], ["02"], ["04"], ["05"]], "k": 1}, {"t": "f", "q": "Nhà giáo đang bị xem xét ____ thì không được thuyên chuyển.", "a": [["kỷ luật"]], "e": "Điều 19 khoản 2 điểm a.", "r": "Luật Nhà giáo 2025 Điều 19 khoản 2 điểm a", "o": [["khiếu nại"], ["kỷ luật"], ["điều tra"], ["xử phạt"]], "k": 1}, {"t": "f", "q": "Việc tiếp nhận nhà giáo trong cơ sở giáo dục công lập được thực hiện thông qua kiểm tra, ____.", "a": [["sát hạch"]], "e": "Điều 15.", "r": "Luật Nhà giáo 2025 Điều 15", "o": [["thử việc"], ["phỏng vấn"], ["đánh giá"], ["sát hạch"]], "k": 3}, {"t": "f", "q": "Thời gian nghỉ hè hằng năm và các ngày nghỉ khác của nhà giáo bố trí theo quy định của ____.", "a": [["Chính phủ"]], "e": "Điều 16 khoản 3.", "r": "Luật Nhà giáo 2025 Điều 16 khoản 3", "o": [["Thủ tướng Chính phủ"], ["Chính phủ"], ["Bộ trưởng Bộ Giáo dục và Đào tạo"], ["Ủy ban nhân dân cấp tỉnh"]], "k": 1}, {"t": "f", "q": "Người đang bị truy cứu trách nhiệm ____ không được đăng ký tuyển dụng nhà giáo.", "a": [["hình sự"]], "e": "Điều 14 khoản 4 điểm b.", "r": "Luật Nhà giáo 2025 Điều 14 khoản 4 điểm b", "o": [["hình sự"], ["dân sự"], ["hành chính"], ["kỷ luật"]], "k": 0}], "ynho": ["Tuyển dụng: thi tuyển **hoặc** xét tuyển, **phải có** thực hành sư phạm.", "**Không điều động** nữ đang mang thai hoặc nuôi con dưới **36 tháng**.", "**Không thuyên chuyển** khi chưa đủ **03 năm** kể từ ngày tuyển dụng.", "Dạy liên trường, liên cấp: từ **02 cơ sở giáo dục** trở lên.", "Nghỉ hè theo **Chính phủ**; chế độ làm việc chi tiết do **Bộ trưởng BGDĐT**."], "bang": [{"tieu_de": "Điều động và thuyên chuyển: điều kiện bị hạn chế", "cot": ["Hình thức", "Không được áp dụng khi"], "dong": [["Điều động (Điều 17.3)", "Nữ mang thai hoặc nuôi con dưới 36 tháng; hoàn cảnh đặc biệt khó khăn; vợ/chồng đang điều động, biệt phái ở vùng khó khăn (trừ tự nguyện)"], ["Thuyên chuyển (Điều 19.2)", "Đang bị xem xét kỷ luật, kiểm tra, thanh tra, điều tra, truy tố, xét xử; chưa đủ 03 năm công tác kể từ ngày tuyển dụng (trừ tự nguyện đến vùng khó khăn)"]]}, {"tieu_de": "Các điều trong nhóm Tuyển dụng - đánh giá", "cot": ["Điều", "Nội dung chính"], "dong": [["14", "Tuyển dụng: thi tuyển hoặc xét tuyển + thực hành sư phạm"], ["15", "Tiếp nhận: kiểm tra, sát hạch"], ["16", "Chế độ làm việc, nghỉ hè"], ["17", "Điều động"], ["19", "Thuyên chuyển"], ["20", "Dạy liên trường, liên cấp (từ 2 cơ sở)"], ["22", "Đánh giá nhà giáo theo năm hoặc năm học"]]}], "vidu": [{"tinh_huong": "Trường THCS tổ chức xét tuyển giáo viên Tin học nhưng không có phần thực hành sư phạm.", "ket_luan": "→ Sai. Tuyển dụng phải có thực hành sư phạm (Điều 14 khoản 1 điểm b)."}, {"tinh_huong": "Cô Ngọc đang nuôi con 30 tháng tuổi, Phòng muốn điều động cô sang trường khác xa nhà.", "ket_luan": "→ Không được. Điều 17 khoản 3 cấm điều động nữ nuôi con dưới 36 tháng."}, {"tinh_huong": "Thầy Phúc mới được tuyển dụng 2 năm, xin thuyên chuyển về quê vì lý do cá nhân, không thuộc vùng khó khăn.", "ket_luan": "→ Chưa được. Chưa đủ 03 năm kể từ ngày tuyển dụng (Điều 19 khoản 2)."}, {"tinh_huong": "Cô Bình dạy Tin học buổi sáng ở trường A và buổi chiều ở trường B.", "ket_luan": "→ Là dạy liên trường (từ 02 cơ sở giáo dục trở lên) theo Điều 20 khoản 1."}, {"tinh_huong": "Anh Tú đang bị truy cứu trách nhiệm hình sự nộp hồ sơ tuyển dụng giáo viên.", "ket_luan": "→ Không được đăng ký tuyển dụng theo Điều 14 khoản 4."}], "nho": ["**36 tháng** nuôi con, **03 năm** kể từ tuyển dụng: 36 tháng gắn với điều động, 3 năm gắn với thuyên chuyển.", "Tuyển dụng = **thi/xét** + **thực hành sư phạm bắt buộc**; Tiếp nhận = **kiểm tra, sát hạch**.", "Nghỉ hè **Chính phủ** (Điều 16.3) – chế độ làm việc **Bộ trưởng** (Điều 16.4).", "Liên trường = **từ 2 trường** trở lên."]}, {"id": "L3-5", "ten": "Tiền lương, phụ cấp, chính sách hỗ trợ, nghỉ hưu (Điều 23-27, 40, 42)", "tomtat": ["Điều 23 khoản 1 điểm a (cơ sở công lập): lương của nhà giáo được xếp **cao nhất** trong hệ thống thang bậc lương hành chính sự nghiệp.", "Điều 23.1.b: **phụ cấp ưu đãi nghề** và phụ cấp khác theo tính chất công việc, theo vùng.", "Điều 23.1.c: nhà giáo **mầm non**; công tác ở vùng đồng bào dân tộc thiểu số, miền núi, biên giới, hải đảo, đặc biệt khó khăn; dạy trường chuyên biệt; giáo dục hòa nhập; ngành, nghề đặc thù được hưởng lương và phụ cấp **cao hơn** điều kiện bình thường.", "Điều 23 khoản 2: cơ sở ngoài công lập theo pháp luật **lao động**; khoản 3: chế độ đặc thù trùng nhau thì chỉ hưởng **một mức cao nhất**.", "Điều 24 khoản 1: chính sách hỗ trợ gồm trợ cấp theo tính chất công việc, theo vùng; hỗ trợ đào tạo, bồi dưỡng; chăm sóc sức khỏe định kỳ, sức khỏe nghề nghiệp; **phụ cấp lưu động** (xóa mù chữ, phổ cập giáo dục, biệt phái, dạy tăng cường, dạy liên trường, điểm trường).", "Điều 24 khoản 2: nhà ở công vụ hoặc chỗ ở tập thể, hoặc hỗ trợ tiền thuê nhà; hỗ trợ tiền tàu xe.", "Điều 26 khoản 1: tuổi nghỉ hưu theo **Bộ luật Lao động**.", "Điều 26 khoản 2: nhà giáo **mầm non** có nguyện vọng được nghỉ hưu sớm hơn **không quá 05 tuổi**; có đủ **15 năm** đóng BHXH trở lên thì **không giảm tỷ lệ** hưởng lương hưu. Quy định này áp dụng cho mầm non, không áp dụng cho THCS.", "Điều 27 (nghỉ hưu ở tuổi cao hơn, công lập): **tiến sĩ** không quá **05** tuổi; **phó giáo sư** không quá **07** tuổi; **giáo sư** không quá **10** tuổi; không giữ chức vụ quản lý.", "Điều 40: bổ sung khoản 3a Điều 66 Luật Bảo hiểm xã hội số 41/2024/QH15 (lương hưu của nhà giáo mầm non nghỉ hưu sớm không giảm tỷ lệ).", "Điều 42 khoản 2: nhà giáo tiếp tục hưởng **phụ cấp thâm niên nhà giáo** cho đến khi thực hiện cải cách chính sách tiền lương."], "bay": ["⚠ lương xếp **cao nhất** trong thang bậc lương hành chính sự nghiệp (không phải 'cao hơn' hay 'ngang bằng').", "⚠ nghỉ hưu sớm **không quá 05 tuổi** + **15 năm** BHXH chỉ áp dụng cho nhà giáo **mầm non**, không phải THCS.", "⚠ nghỉ hưu cao hơn: tiến sĩ **05** - phó giáo sư **07** - giáo sư **10** tuổi (đừng hoán đổi).", "⚠ chế độ đặc thù trùng nhau: hưởng **một mức cao nhất** (không cộng dồn)."], "cauhoi": [{"t": "s", "q": "Theo Điều 23 khoản 1 điểm a, lương của nhà giáo trong cơ sở giáo dục công lập được xếp như thế nào?", "o": ["Cao nhất trong thang lương của các ngành nghề trong xã hội", "Bằng mức cao nhất của công chức hành chính", "Cao nhất trong hệ thống thang bậc lương hành chính sự nghiệp", "Cao hơn mức lương của công chức hành chính"], "a": [2], "e": "Điều 23.1.a: cao nhất trong thang bậc lương hành chính sự nghiệp. Bẫy: phạm vi so sánh.", "r": "Luật Nhà giáo 2025 Điều 23 khoản 1 điểm a"}, {"t": "s", "q": "Theo Điều 23 khoản 1 điểm c, nhà giáo công tác ở vùng đặc biệt khó khăn được hưởng lương và phụ cấp như thế nào?", "o": ["Cao hơn so với điều kiện bình thường", "Bằng so với điều kiện bình thường", "Thấp hơn nhưng được hỗ trợ nhà ở", "Chỉ hưởng phụ cấp, không tăng lương"], "a": [0], "e": "Điều 23.1.c: lương và phụ cấp cao hơn so với điều kiện bình thường.", "r": "Luật Nhà giáo 2025 Điều 23 khoản 1 điểm c"}, {"t": "s", "q": "Theo Điều 23 khoản 2, nhà giáo cơ sở giáo dục ngoài công lập hưởng tiền lương theo pháp luật nào?", "o": ["Thang bậc lương hành chính sự nghiệp", "Pháp luật về viên chức", "Pháp luật về cán bộ, công chức", "Pháp luật về lao động"], "a": [3], "e": "Khoản 2: ngoài công lập theo pháp luật lao động.", "r": "Luật Nhà giáo 2025 Điều 23 khoản 2"}, {"t": "s", "q": "Theo Điều 23 khoản 3, nhà giáo thuộc nhiều đối tượng hưởng chế độ đặc thù trùng nhau thì hưởng như thế nào?", "o": ["Do người đứng đầu cơ sở giáo dục lựa chọn", "Chỉ hưởng một mức cao nhất", "Hưởng cộng dồn tất cả các mức", "Hưởng mức thấp nhất"], "a": [1], "e": "Điều 23.3: chỉ hưởng một mức cao nhất.", "r": "Luật Nhà giáo 2025 Điều 23 khoản 3"}, {"t": "s", "q": "Theo Điều 24 khoản 2, chính sách hỗ trợ nhà ở cho nhà giáo thể hiện như thế nào?", "o": ["Chỉ hỗ trợ tiền mua nhà trả góp", "Bố trí nhà ở công vụ hoặc chỗ ở tập thể, hoặc hỗ trợ tiền thuê nhà", "Cấp đất ở miễn phí cho mọi nhà giáo", "Chỉ bố trí nhà ở công vụ, không hỗ trợ tiền thuê nhà"], "a": [1], "e": "Điều 24.2: nhà ở công vụ/chỗ ở tập thể hoặc hỗ trợ tiền thuê nhà.", "r": "Luật Nhà giáo 2025 Điều 24 khoản 2"}, {"t": "s", "q": "Theo Điều 26 khoản 2, nhà giáo mầm non có nguyện vọng được nghỉ hưu sớm hơn tuổi quy định không quá bao nhiêu tuổi?", "o": ["10 tuổi", "07 tuổi", "03 tuổi", "05 tuổi"], "a": [3], "e": "Điều 26.2: không quá 05 tuổi. Bẫy: 07 và 10 là mức của phó giáo sư, giáo sư (Điều 27).", "r": "Luật Nhà giáo 2025 Điều 26 khoản 2"}, {"t": "s", "q": "Nhà giáo mầm non nghỉ hưu sớm không bị giảm tỷ lệ hưởng lương hưu khi có đủ bao nhiêu năm đóng bảo hiểm xã hội trở lên (Điều 26 khoản 2)?", "o": ["15 năm", "25 năm", "20 năm", "10 năm"], "a": [0], "e": "Điều 26.2: đủ 15 năm đóng BHXH trở lên.", "r": "Luật Nhà giáo 2025 Điều 26 khoản 2"}, {"t": "s", "q": "Giáo viên trung học cơ sở có nguyện vọng nghỉ hưu sớm hơn không quá 05 tuổi mà không giảm tỷ lệ hưởng lương hưu theo Điều 26 thì như thế nào?", "o": ["Được áp dụng nếu công tác ở vùng khó khăn", "Được áp dụng nếu có đủ 20 năm đóng bảo hiểm xã hội", "Không áp dụng; quy định này chỉ dành cho nhà giáo mầm non", "Được áp dụng như nhà giáo mầm non"], "a": [2], "e": "Điều 26.2 chỉ nêu nhà giáo mầm non. Bẫy: mở rộng chủ thể.", "r": "Luật Nhà giáo 2025 Điều 26 khoản 2"}, {"t": "s", "q": "Theo Điều 27, phó giáo sư công tác ở cơ sở giáo dục công lập có  động"]], "e": "Điều 23 khoản 2.", "r": "Luật Nhà giáo 2025 Điều 23 khoản 2", "o": [["dân sự"], ["viên chức"], ["công chức"], ["lao động"]], "k": 3}], "ynho": ["Lương nhà giáo xếp **cao nhất** trong thang bậc lương hành chính sự nghiệp.", "Nghỉ hưu sớm **không quá 05 tuổi**, **15 năm** BHXH: chỉ **mầm non**.", "Nghỉ hưu cao hơn: tiến sĩ **05**, phó giáo sư **07**, giáo sư **10** tuổi.", "Chế độ đặc thù trùng nhau: hưởng **một mức cao nhất**.", "Tiếp tục hưởng **phụ cấp thâm niên nhà giáo** đến khi cải cách tiền lương."], "bang": [{"tieu_de": "Nghỉ hưu ở tuổi cao hơn (Điều 27)", "cot": ["Học vị / chức danh", "Kéo dài tối đa"], "dong": [["Tiến sĩ", "Không quá 05 tuổi"], ["Phó giáo sư", "Không quá 07 tuổi"], ["Giáo sư", "Không quá 10 tuổi"]]}, {"tieu_de": "Nghỉ hưu: so sánh các trường hợp", "cot": ["Đối tượng", "Quy định", "Căn cứ"], "dong": [["Nhà giáo nói chung", "Theo Bộ luật Lao động", "Điều 26.1"], ["Nhà giáo mầm non", "Nghỉ sớm không quá 5 tuổi, đủ 15 năm BHXH không giảm tỷ lệ hưởng lương hưu", "Điều 26.2"], ["Nhà giáo THCS", "Không áp dụng nghỉ hưu sớm của mầm non", "Điều 26.2"], ["Tiến sĩ, PGS, GS công lập", "Nghỉ hưu cao hơn, không giữ chức vụ quản lý", "Điều 27"]]}], "vidu": [{"tinh_huong": "Cô Liên dạy THCS công lập, muốn nghỉ hưu sớm 3 tuổi mà không giảm lương hưu vì đã đóng 16 năm BHXH.", "ket_luan": "→ Không được áp dụng. Quy định nghỉ hưu sớm là cho nhà giáo mầm non (Điều 26 khoản 2)."}, {"tinh_huong": "Cô Yến, giáo viên mầm non, đóng BHXH 15 năm, muốn nghỉ hưu sớm 4 tuổi.", "ket_luan": "→ Đúng. Không quá 05 tuổi và đủ 15 năm thì không giảm tỷ lệ hưởng lương hưu (Điều 26.2)."}, {"tinh_huong": "Giáo sư Hải ở trường công lập muốn làm việc thêm 8 tuổi sau tuổi nghỉ hưu.", "ket_luan": "→ Được. Giáo sư kéo dài không quá 10 tuổi, nhưng không giữ chức vụ quản lý (Điều 27)."}, {"tinh_huong": "Cô Hương vừa hưởng phụ cấp vùng khó khăn vừa hưởng một chế độ đặc thù trùng nhau.", "ket_luan": "→ Chỉ hưởng một mức cao nhất (Điều 23 khoản 3)."}, {"tinh_huong": "Thầy Tâm hỏi: lương nhà giáo thấp hơn hay cao hơn thang lương hành chính sự nghiệp?", "ket_luan": "→ Được xếp cao nhất trong thang bậc lương hành chính sự nghiệp (Điều 23 khoản 1 điểm a)."}], "nho": ["Nghỉ hưu kéo dài: **5 – 7 – 10** theo thứ tự **Tiến sĩ – Phó giáo sư – Giáo sư** (học vị càng cao càng được lâu).", "**5 tuổi + 15 năm = mầm non**; THCS không có.", "Lương: **cao nhất**; chế độ trùng: **một mức cao nhất** (không cộng dồn).", "Phụ cấp: ưu đãi nghề (Điều 23), **lưu động** (Điều 24), thâm niên (Điều 42)."]}, {"id": "L3-6", "ten": "Đào tạo, bồi dưỡng, tôn vinh, khen thưởng, kỷ luật và quản lý nhà nước (Điều 28-39, 41)", "tomtat": ["Điều 28 khoản 1 điểm b: trình độ chuẩn giáo viên **tiểu học, THCS, THPT**: có bằng **cử nhân trở lên** thuộc ngành đào tạo giáo viên phù hợp với môn học, cấp học **hoặc** có bằng cử nhân trở lên chuyên ngành phù hợp và có **chứng chỉ nghiệp vụ sư phạm**.", "Điều 28 khoản 1: giáo viên **mầm non** - cao đẳng sư phạm trở lên (điểm a); giảng viên đại học - **thạc sĩ** trở lên; sau đại học - **tiến sĩ** (điểm c); khoản 3: **Chính phủ** quy định lộ trình.", "Điều 29 khoản 1: chương trình đào tạo, bồi dưỡng gồm đào tạo đáp ứng trình độ chuẩn, nâng cao; bồi dưỡng theo chuẩn nghề nghiệp; bồi dưỡng theo tiêu chuẩn chức danh, chức vụ lãnh đạo, quản lý; bồi dưỡng thường xuyên; khoản 2: Nhà nước hỗ trợ kinh phí.", "Điều 30: nhà giáo tham gia đầy đủ, chấp hành quy chế, tự học, học tập suốt đời; được tạo điều kiện về thời gian, thời gian học **tính vào thời gian công tác liên tục**; được hỗ trợ kinh phí.", "Điều 32: ngày **20 tháng 11** hằng năm là ngày Nhà giáo Việt Nam. Điều 33: danh hiệu **Nhà giáo nhân dân, Nhà giáo ưu tú**.", "Điều 34: khen thưởng theo Luật Thi đua, khen thưởng; địa phương, cơ sở giáo dục có hình thức tôn vinh riêng.", "Điều 35: kỷ luật nhà giáo viên chức theo pháp luật **viên chức**; hợp đồng lao động theo pháp luật **lao động**; khoản 3: xử lý kỷ luật không làm ảnh hưởng học tập của người học, bảo đảm tính nhân văn.", "Điều 36  và có chứng chỉ nghiệp vụ sư phạm, muốn dạy THCS.", "ket_luan": "→ Đủ trình độ chuẩn theo Điều 28 khoản 1 điểm b (cử nhân chuyên ngành phù hợp và có chứng chỉ nghiệp vụ sư phạm)."}, {"tinh_huong": "Cô Oanh tốt nghiệp cao đẳng sư phạm muốn dạy THCS.", "ket_luan": "→ Chưa đủ chuẩn. THCS cần cử nhân; cao đẳng sư phạm là chuẩn của mầm non."}, {"tinh_huong": "Hiệu trưởng ra quyết định tạm đình chỉ giảng dạy thầy Khoa trong lúc Hội đồng kỷ luật đang xem xét vì việc dạy tiếp ảnh hưởng tâm lý học sinh.", "ket_luan": "→ Đúng. Người đứng đầu cơ sở giáo dục quyết định trong thời hạn xem xét kỷ luật (Điều 36)."}, {"tinh_huong": "Cô Thảo học bồi dưỡng thường xuyên theo kế hoạch của trường, thời gian học có bị trừ thâm niên không?", "ket_luan": "→ Không. Thời gian học được tính vào thời gian công tác liên tục (Điều 30)."}, {"tinh_huong": "Trường tổ chức lễ kỷ niệm ngày Nhà giáo Việt Nam vào ngày 20/11.", "ket_luan": "→ Đúng theo Điều 32."}], "nho": ["Chuẩn: **Mầm non = Cao đẳng; Phổ thông = Cử nhân; Đại học = Thạc sĩ; Sau đại học = Tiến sĩ**.", "**Chính phủ quản lý – Bộ làm đầu mối**: Chính phủ ở trên, Bộ GDĐT là cầu nối.", "Tạm đình chỉ: **Hiệu trưởng quyết, trong lúc xem xét** (không đợi có quyết định kỷ luật).", "**20/11** + hai danh hiệu: **Nhân dân** (cao) và **Ưu tú**."]}]});</script>
<script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L4", "ten": "Nghị định 93/2026/NĐ-CP hướng dẫn Luật Nhà giáo", "so": "Nghị định số 93/2026/NĐ-CP", "hieuluc": "31/03/2026", "mota": "Nghị định quy định chi tiết và hướng dẫn thi hành một số điều của Luật Nhà giáo 2025: chức danh, bổ nhiệm, tuyển dụng, tiếp nhận, điều động, thuyên chuyển, dạy liên trường, đánh giá, nghỉ hè và nghỉ hưu ở tuổi cao hơn.", "baihoc": [{"id": "L4-1", "ten": "Thông tin chung, chức danh nhà giáo, bổ nhiệm và đánh giá", "tomtat": ["Nghị định 93/2026/NĐ-CP quy định chi tiết và hướng dẫn thi hành một số điều của **Luật Nhà giáo (Luật số 73/2025/QH15)**.", "Nghị định được ký ngày **31/3/2026** và có hiệu lực từ ngày ký (**31/03/2026**).", "Điều 3 khoản 1: chức danh giáo viên gồm **9** chức danh: mầm non, tiểu học, THCS, THPT, dự bị đại học, giáo dục thường xuyên, sơ cấp, trung học nghề, trung cấp.", "Chức danh giáo viên **không chia hạng** (không còn hạng I, II, III); 'giáo viên trung học cơ sở' là một chức danh.", "Điều 3 khoản 2: chức danh **giảng viên** vẫn có phân cấp (giảng viên cao đẳng: giảng viên, chính, cao cấp; đại học: thêm phó giáo sư, giáo sư).", "Điều 4 khoản 1: bổ nhiệm chức danh và xếp lương thực hiện khi **tuyển dụng, tiếp nhận và thay đổi vị trí việc làm**.", "Điều 4 khoản 1: nhà giáo được bổ nhiệm chức danh nào phải đáp ứng **chuẩn nghề nghiệp của chức danh đó**.", "Điều 4 khoản 3: thay đổi chức danh thực hiện theo pháp luật về viên chức về thay đổi vị trí việc làm.", "Điều 4 khoản 5: **Bộ trưởng Bộ Giáo dục và Đào tạo** quy định việc bổ nhiệm và xếp lương.", "Điều 14 khoản 1 điểm a: đánh giá theo chuẩn nghề nghiệp gồm **3 nội dung**: đạo đức nhà giáo và chấp hành quy tắc ứng xử; trình độ đào tạo, bồi dưỡng; năng lực chuyên môn, nghiệp vụ theo yêu cầu chức danh gắn với vị trí việc làm.", "Điều 14 khoản 1 điểm b: kết quả đánh giá là căn cứ đánh giá theo **khoản 1 Điều 22 Luật Nhà giáo**.", "Điều 14 khoản 2 điểm a: nhà giáo công lập đáp ứng tiêu chí chung về đánh giá, ng viên đều không phân cấp", "Chức danh giáo viên không chia hạng, còn chức danh giảng viên cao đẳng, đại học vẫn có phân cấp", "Giáo viên chia hạng, còn giảng viên không phân cấp", "Cả chức danh giáo viên và giảng viên đều chia hạng I, II, III"], "a": [1], "e": "Bẫy đảo chủ thể: chỉ giáo viên không chia hạng; giảng viên vẫn có cấp (giảng viên, giảng viên chính, giảng viên cao cấp...).", "r": "Điều 3 khoản 1, 2 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Việc bổ nhiệm chức danh và xếp lương nhà giáo được thực hiện khi nào?", "o": ["Khi tuyển dụng, tiếp nhận và thăng hạng", "Khi hết thời gian tập sự và khi nghỉ hưu", "Chỉ khi tuyển dụng", "Khi tuyển dụng, tiếp nhận và thay đổi vị trí việc làm"], "a": [3], "e": "Ba thời điểm: tuyển dụng, tiếp nhận, thay đổi vị trí việc làm; không gắn với thăng hạng (giáo viên không còn hạng).", "r": "Điều 4 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Nhà giáo được bổ nhiệm vào chức danh nào thì phải đáp ứng yêu cầu nào?", "o": ["Đáp ứng chuẩn nghề nghiệp của chính chức danh đó", "Hoàn thành chương trình bồi dưỡng nghiệp vụ quản lý giáo dục", "Đáp ứng chuẩn nghề nghiệp của chức danh cao hơn một bậc", "Có thâm niên giảng dạy tối thiểu 03 năm"], "a": [0], "e": "Chuẩn nghề nghiệp phải tương ứng với chức danh được bổ nhiệm, không phải chức danh cao hơn.", "r": "Điều 4 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Ai quy định việc bổ nhiệm và xếp lương đối với nhà giáo?", "o": ["Chủ tịch Ủy ban nhân dân cấp tỉnh", "Thủ tướng Chính phủ", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Chính phủ"], "a": [2], "e": "Khoản 5 Điều 4 giao cho Bộ trưởng Bộ GDĐT. Bẫy 'Chính phủ' / 'Thủ tướng Chính phủ'.", "r": "Điều 4 khoản 5 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Nội dung đánh giá nhà giáo theo chuẩn nghề nghiệp gồm những gì?", "o": ["Chỉ năng lực chuyên môn, nghiệp vụ theo yêu cầu chức danh", "Đạo đức nhà giáo và chấp hành quy tắc ứng xử; trình độ đào tạo, bồi dưỡng; năng lực chuyên môn, nghiệp vụ theo yêu cầu chức danh gắn với vị trí việc làm", "Đạo đức nhà giáo; thâm niên công tác; kết quả thi tốt nghiệp của học sinh", "Trình độ ngoại ngữ, tin học; sáng kiến kinh nghiệm; số tiết dạy"], "a": [1], "e": "Có đủ ba nội dung. Bẫy 'chỉ' làm thu hẹp phạm vi.", "r": "Điều 14 khoản 1 điểm a Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Nhà giáo công lập được đánh giá theo tiêu chí chung nào?", "o": ["Tiêu chí do Ủy ban nhân dân cấp tỉnh ban hành riêng cho nhà giáo", "Tiêu chí chung về đánh giá, xếp loại chất lượng viên chức theo pháp luật về viên chức", "Tiêu chí theo pháp luật về lao động", "Tiêu chí do từng cơ sở giáo dục tự quy định"], "a": [1], "e": "Nhà giáo công lập là viên chức nên áp dụng tiêu chí chung theo pháp luật về viên chức.", "r": "Điều 14 khoản 2 điểm a Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Chức danh nào sau đây thuộc nhóm chức danh giáo viên theo khoản 1 Điều 3?", "o": ["Giáo sư", "Giảng viên trường chính trị", "Giảng viên cao đẳng", "Giáo viên dự bị đại học"], "a": [3], "e": "Giáo viên dự bị đại học thuộc khoản 1; các chức danh còn lại thuộc nhóm giảng viên (khoản 2).", "r": "Điều 3 khoản 1, 2 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Kết quả đánh giá nhà giáo theo chuẩn nghề nghiệp là căn cứ để đánh giá theo quy định tại điều khoản nào của Luật Nhà giáo?", "o": ["Khoản 1 Điều 14", "Khoản 2 Điều 22", "Khoản 1 Điều 22", "Khoản 1 Điều 12"], "a": [2], "e": "Điều 14 khoản 1 điểm b Nghị định 93 dẫn đến khoản 1 Điều 22 Luật Nhà giáo.", "r": "Điều 14 khoản 1 điểm b Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Những chức danh nào sau đây thuộc chức danh giáo viên theo khoản 1 Điều 3? (chọn tất cả đáp án đúng)", "o": ["Giáo viên trung học nghề", "Giáo viên giáo dục thường xuyên", "Giảng viên cao đẳng", "Giáo viên sơ cấp", "Phó giáo sư"], "a": [0, 1, 3], "e": "Giảng viên cao đẳng và phó giáo sư thuộc chức danh giảng viên (khoản 2).", "r": "Điều 3 khoản 1, 2 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Nội dung đánh giá nhà giáo theo chuẩn nghề nghiệp gồm (chọn tất cả đáp án đúng)", "o": ["Thâm n
