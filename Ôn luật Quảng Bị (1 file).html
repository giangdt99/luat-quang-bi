 chức danh được bổ nhiệm.", "r": "Điều 4 khoản 1 Nghị định 93/2026/NĐ-CP", "o": [["chuẩn nghề nghiệp"], ["tiêu chuẩn chung"], ["chuẩn đầu ra"], ["yêu cầu tuyển dụng"]], "k": 0}, {"t": "f", "q": "Chức danh giáo viên theo khoản 1 Điều 3 gồm ____ chức danh và không còn chia ____.", "a": [["9", "chín"], ["hạng"]], "e": "9 chức danh, không chia hạng I, II, III.", "r": "Điều 3 khoản 1 Nghị định 93/2026/NĐ-CP", "o": [["9", "hạng"], ["9", "ngạch"], ["7", "hạng"], ["9", "cấp"]], "k": 0}, {"t": "f", "q": "Việc bổ nhiệm chức danh và xếp lương nhà giáo thực hiện khi tuyển dụng, tiếp nhận và thay đổi ____.", "a": [["vị trí việc làm"]], "e": "Gắn với vị trí việc làm, không phải thăng hạng.", "r": "Điều 4 khoản 1 Nghị định 93/2026/NĐ-CP", "o": [["chức danh"], ["vị trí việc làm"], ["đơn vị công tác"], ["ngạch lương"]], "k": 1}, {"t": "f", "q": "Nhà giáo công lập phải đáp ứng tiêu chí chung về đánh giá, xếp loại chất lượng ____ theo pháp luật về viên chức.", "a": [["viên chức"]], "e": "Tiêu chí chung theo pháp luật về viên chức.", "r": "Điều 14 khoản 2 điểm a Nghị định 93/2026/NĐ-CP", "o": [["nhà giáo"], ["giáo viên"], ["viên chức"], ["học sinh"]], "k": 2}, {"t": "f", "q": "Việc bổ nhiệm và xếp lương đối với nhà giáo do Bộ trưởng Bộ ____ quy định.", "a": [["giáo dục và đào tạo"]], "e": "Bộ trưởng Bộ Giáo dục và Đào tạo.", "r": "Điều 4 khoản 5 Nghị định 93/2026/NĐ-CP", "o": [["nội vụ"], ["giáo dục và đào tạo"], ["tài chính"], ["lao động - thương binh và xã hội"]], "k": 1}], "ynho": ["NĐ 93/2026 ký và có hiệu lực **31/03/2026**.", "Chức danh giáo viên có **9** chức danh, **không chia hạng**.", "Giảng viên **vẫn phân cấp**; giáo viên thì không.", "Đánh giá theo chuẩn nghề nghiệp có **3 nội dung**.", "**Bộ trưởng Bộ GDĐT** quy định việc bổ nhiệm và xếp lương (Điều 4 khoản 5)."], "bang": [{"tieu_de": "Ba mốc hiệu lực dễ nhầm", "cot": ["Văn bản", "Hiệu lực"], "dong": [["Luật Nhà giáo", "01/01/2026"], ["NĐ 93/2026 (hướng dẫn Luật Nhà giáo)", "31/03/2026 (ngày ký)"], ["NĐ 259/2026 (tuyển dụng viên chức)", "01/7/2026"]]}, {"tieu_de": "Giáo viên và giảng viên", "cot": ["Nội dung", "Giáo viên", "Giảng viên"], "dong": [["Chia hạng/phân cấp", "Không chia hạng", "Vẫn có phân cấp"], ["Ví dụ", "Giáo viên THCS là một chức danh", "Giảng viên, chính, cao cấp; đại học thêm PGS, GS"], ["Căn cứ", "Điều 3 khoản 1", "Điều 3 khoản 2"]]}], "vidu": [{"tinh_huong": "Cô A, giáo viên THCS công lập, thắc mắc mình thuộc hạng II hay hạng III.", "ket_luan": "→ Sai cách hiểu: theo Điều 3 khoản 1, giáo viên THCS là một chức danh, không còn chia hạng."}, {"tinh_huong": "Thầy B, hiệu trưởng một trường THCS, nói giảng viên cao đẳng cũng không phân cấp như giáo viên.", "ket_luan": "→ Sai: Điều 3 khoản 2, giảng viên vẫn có phân cấp (giảng viên, giảng viên chính, giảng viên cao cấp)."}, {"tinh_huong": "Cô C vừa được tuyển dụng vào trường THCS và được bổ nhiệm chức danh, xếp lương.", "ket_luan": "→ Đúng: Điều 4 khoản 1, bổ nhiệm chức danh và xếp lương thực hiện khi tuyển dụng, tiếp nhận hoặc thay đổi vị trí việc làm."}, {"tinh_huong": "Phòng giáo dục đánh giá thầy D chỉ dựa vào trình độ đào tạo, bồi dưỡng.", "ket_luan": "→ Chưa đủ: Điều 14 khoản 1 điểm a yêu cầu 3 nội dung gồm đạo đức nhà giáo và chấp hành quy tắc ứng xử; trình độ đào tạo, bồi dưỡng; năng lực chuyên môn, nghiệp vụ."}, {"tinh_huong": "Một tỉnh tự ban hành văn bản quy định cách bổ nhiệm và xếp lương chức danh nhà giáo.", "ket_luan": "→ Không đúng thẩm quyền: Điều 4 khoản 5 giao Bộ trưởng Bộ Giáo dục và Đào tạo quy định."}], "nho": ["Số 9 chức danh: giáo viên có 9 loại từ mầm non đến trung cấp, nhớ là 'chín tên, không hạng'.", "Phân biệt: Giáo viên = Gọn (không hạng); Giảng viên = Gồm cấp bậc.", "Ba ngày hiệu lực: Luật 01/01, NĐ 93 ngày 31/03 (ngày ký), NĐ 259 ngày 01/7 - đi theo thứ tự thời gian tăng dần."]}, {"id": "L4-2", "ten": "Tuyển dụng nhà giáo: căn cứ, ưu tiên và thi tuyển", "tomtat": ["Điều 5 khoản 1 điểm a: tuyển dụng nhà giáo công lập căn cứ **chuẩn nghề nghiệp theo chức danh** tương ứng vị trí việc làm dự kiến tuyển và pháp luật về viên chức.", "Điều 6 khoản 1: người có thời gian giảng dạy, giáo dục đúng vị trí việc làm (hoặc cấp học/trình độ khác nhưng môn học phù hợp) từ **đủ 03 năm (36 tháng)** trở lên, có đóng BHXH bắt buộc được cộng **05 điểm**.", "Thời gian đóng BHXH có thể **không liên tục**, chưa nhận BHXH một lần thì **cộng dồn** (Điều 6 khoản 1).", "Điều 6 khoản 2: người có chứng chỉ kỹ năng nghề quốc gia bậc 4 trở lên hoặc kinh nghiệm thực tế sản xuất, kinh doanh, dịch vụ phù hợp ngành nghề giảng dạy từ đủ 03 năm, có đóng BHXH cũng được cộng 05 điểm.", "Điểm ưu tiên cộng vào kết quả điểm **vòng 2**; thuộc nhiều diện thì **chỉ cộng điểm cao nhất** (Điều 6 khoản 4).", "Điều 7: thi tuyển nhà giáo gồm **02 vòng**.", "Vòng 1: **trắc nghiệm trên máy vi tính**; Phần I kiến thức chung **60 câu, 60 phút**; Phần II ngoại ngữ **30 câu, 30 phút** (Điều 7 khoản 1).", "Đúng từ **50%** số câu hỏi của **từng phần** thì được dự thi vòng 2.", "Không yêu cầu ngoại ngữ trong bản mô tả công việc thì không thi Phần II; có các trường hợp miễn thi ngoại ngữ (điểm d khoản 1).", "Vòng 2: đánh giá năng lực qua **thực hành sư phạm**; chọn **một trong ba** hình thức: vấn đáp, thực hành giảng dạy hoặc thi viết (Điều 7 khoản 2).", "Vấn đáp **30 phút** (chuẩn bị không quá **15 phút**, không tính vào thời gian thi); thi viết **180 phút** (không kể chép đề).", "Vòng 2 chấm **thang điểm 100** cho cả ba hình thức."], "bay": ["⚠ '03 năm' (điều kiện) ≠ '05 điểm' (số điểm cộng); điểm cộng vào vòng 2, không phải vòng 1.", "⚠ Nhiều diện ưu tiên: 'chỉ cộng cao nhất' ≠ 'cộng dồn'.", "⚠ Đạt 50% 'từng phần' ≠ 'tổng hai phần'.", "⚠ Vòng 1: 60 câu/60 phút và 30 câu/30 phút; vòng 2: 180 phút thi viết, vấn đáp 30 phút.", "⚠ Vòng 2 chọn 'một trong ba' hình thức, không phải thi cả ba."], "cauhoi": [{"t": "s", "q": "Tuyển dụng nhà giáo vào cơ sở giáo dục công lập căn cứ vào đâu?", "o": ["Chuẩn nghề nghiệp theo chức danh nhà giáo tương ứng với vị trí việc làm dự kiến tuyển và pháp luật về viên chức", "Bằng cấp cao nhất của người dự tuyển và thâm niên công tác", "Xếp loại học lực toàn khóa của người dự tuyển", "Chỉ tiêu do Ủy ban nhân dân cấp tỉnh giao hằng năm, không cần căn cứ chuẩn nghề nghiệp"], "a": [0], "e": "Căn cứ là chuẩn nghề nghiệp theo chức danh tương ứng vị trí việc làm và pháp luật viên chức.", "r": "Điều 5 khoản 1 điểm a Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Người có thời gian giảng dạy đúng vị trí việc làm cần tuyển từ mức nào trở lên, có đóng bảo hiểm xã hội bắt buộc, được cộng 05 điểm?", "o": ["Từ đủ 05 năm (60 tháng) trở lên", "Từ đủ 03 năm (36 tháng) trở lên", "Từ đủ 02 năm (24 tháng) trở lên", "Từ đủ 12 tháng trở lên"], "a": [1], "e": "Mốc là đủ 03 năm (36 tháng). Số 05 là số điểm được cộng chứ không phải số năm (bẫy đổi số).", "r": "Điều 6 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Điểm ưu tiên 05 điểm trong tuyển dụng nhà giáo được cộng vào đâu?", "o": ["Kết quả điểm vòng 1", "Tổng điểm của cả hai vòng thi", "Điểm Phần II (ngoại ngữ) của vòng 1", "Kết quả điểm vòng 2"], "a": [3], "e": "Cộng vào điểm vòng 2 (thực hành sư phạm), không cộng vào vòng 1.", "r": "Điều 6 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Người dự tuyển thuộc nhiều diện ưu tiên thì được cộng điểm ưu tiên như thế nào?", "o": ["Chỉ cộng điểm ưu tiên ở mức cao nhất", "Cộng dồn nhưng tối đa không quá 10 điểm", "Chỉ cộng điểm ở diện đầu tiên được ghi trong hồ sơ", "Cộng dồn tất cả các diện"], "a": [0], "e": "Thuộc nhiều diện thì chỉ cộng điểm ở diện có mức cao nhất, không cộng dồn.", "r": "Điều 6 khoản 4 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Phát biểu nào đúng về thời gian giảng dạy có đóng bảo hiểm xã hội bắt buộc để được ưu tiên?", "o": ["Phải liên tục, không được gián đoạn", "Được cộng dồn kể cả khi đã nhận bảo hiểm xã hội một lần", "Có thể không liên tục; nếu chưa nhận bảo hiểm xã hội một lần thì được cộng dồn", "Không yêu cầu đóng bảo hiểm xã hội"], "a": [2], "e": "Thời gian không liên tục vẫn được cộng dồn nhưng điều kiện là chưa nhận bảo hiểm xã hội một lần.", "r": "Điều 6 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Vòng 1 của thi tuyển nhà giáo được thực hiện bằng hình thức nào?", "o": ["Thực hành giảng dạy", "Trắc nghiệm trên máy vi tính", "Thi viết tự luận trên giấy", "Vấn đáp"], "a": [1], "e": "Vòng 1 là trắc nghiệm trên máy vi tính; vòng 2 mới là thực hành sư phạm.", "r": "Điều 7 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Phần I (kiến thức chung) của vòng 1 thi tuyển nhà giáo có số câu và thời gian là bao nhiêu?", "o": ["60 câu, 60 phút", "30 câu, 60 phút", "60 câu, 90 phút", "50 câu, 60 phút"], "a": [0], "e": "Phần I: 60 câu/60 phút. Phần II ngoại ngữ: 30 câu/30 phút.", "r": "Điều 7 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Điều kiện để người dự tuyển được dự thi vòng 2 là gì?", "o": ["Tổng số câu đúng của hai phần đạt từ 50%", "Đúng từ 50% số câu của Phần I, Phần II không yêu cầu", "Đúng từ 50% số câu hỏi trở lên của từng phần thi", "Đúng từ 70% số câu hỏi của từng phần thi"], "a": [2], "e": "Phải đạt từ 50% ở TỪNG phần được thi, không tính tổng hai phần.", "r": "Điều 7 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Vòng 2 thi tuyển nhà giáo đánh giá năng lực bằng cách nào?", "o": ["Thi viết 180 phút và vấn đáp, bắt buộc cả hai", "Trắc nghiệm trên máy vi tính", "Phỏng vấn về vị trí việc làm", "Thực hành sư phạm, theo một trong ba hình thức: vấn đáp, thực hành giảng dạy hoặc thi viết"], "a": [3], "e": "Vòng 2 chọn một trong ba hình thức, không bắt buộc thi tất cả.", "r": "Điều 7 khoản 2 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Thang điểm của vòng 2 (vấn đáp, thực hành giảng dạy, thi viết) là bao nhiêu?", "o": ["Thang điểm 100", "Thang điểm 200", "Thang điểm 10", "Thang điểm 50"], "a": [0], "e": "Thang điểm 100 cho cả ba hình thức.", "r": "Điều 7 khoản 2 điểm d Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Phát biểu nào đúng về hình thức vấn đáp ở vòng 2?", "o": ["Thời gian chuẩn bị tối thiểu 15 phút", "Thời gian vấn đáp 30 phút, đã bao gồm 15 phút chuẩn bị", "Thời gian vấn đáp 45 phút", "Thời gian vấn đáp 30 phút; thời gian chuẩn bị không quá 15 phút và không tính vào thời gian thi"], "a": [3], "e": "Chuẩn bị không quá 15 phút và không tính vào thời gian thi.", "r": "Điều 7 khoản 2 điểm c Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Những trường hợp nào sau đây được cộng 05 điểm vào kết quả điểm vòng 2? (chọn tất cả đáp án đúng)", "o": ["Có thời gian giảng dạy đúng vị trí việc làm cần tuyển từ đủ 03 năm, có đóng bảo hiểm xã hội bắt buộc", "Có học sinh đạt giải học sinh giỏi cấp tỉnh trong 3 năm liền", "Có bằng thạc sĩ trở lên", "Có kinh nghiệm thực tế sản xuất, kinh doanh, dịch vụ phù hợp ngành nghề giảng dạy từ đủ 03 năm, có đóng bảo hiểm xã hội", "Có thời gian giảng dạy cấp học hoặc trình độ khác nhưng môn học phù hợp từ đủ 03 năm, có đóng bảo hiểm xã hội bắt buộc"], "a": [0, 3, 4], "e": "Hai diện ở khoản 1 và khoản 2 Điều 6; bằng cấp hoặc giải thưởng không phải điều kiện cộng điểm này.", "r": "Điều 6 khoản 1, 2 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Phát biểu nào đúng về vòng 1 thi tuyển nhà giáo? (chọn tất cả đáp án đúng)", "o": ["Thi viết trên giấy trong 180 phút", "Thi trắc nghiệm trên máy vi tính", "Phần II ngoại ngữ gồm 60 câu, thời gian 60 phút", "Phần II ngoại ngữ gồm 30 câu, thời gian 30 phút", "Phần I kiến thức chung gồm 60 câu"], "a": [1, 3, 4], "e": "Phần II chỉ 30 câu/30 phút; 180 phút là thời gian thi viết ở vòng 2.", "r": "Điều 7 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Phát biểu nào đúng về vòng 2 thi tuyển nhà giáo? (chọn tất cả đáp án đúng)", "o": ["Thi viết có thời gian 180 phút, không kể thời gian chép đề", "Nội dung căn cứ chuẩn nghề nghiệp nhà giáo theo chức danh", "Thang điểm 100", "Vấn đáp có thời gian 60 phút", "Bắt buộc thực hành giảng dạy"], "a": [0, 1, 2], "e": "Vấn đáp 30 phút; hình thức là một trong ba, không bắt buộc thực hành giảng dạy.", "r": "Điều 7 khoản 2 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Trường hợp nào sau đây được miễn thi ngoại ngữ ở vòng 1? (chọn tất cả đáp án đúng)",  ["100", "120"], ["50", "180"], ["10", "90"]], "k": 0}, {"t": "f", "q": "Vấn đáp ở vòng 2 có thời gian 30 phút, thời gian chuẩn bị không quá ____ phút và không tính vào thời gian thi.", "a": [["15", "mười lăm"]], "e": "Chuẩn bị không quá 15 phút.", "r": "Điều 7 khoản 2 điểm c Nghị định 93/2026/NĐ-CP", "o": [["30"], ["10"], ["15"], ["20"]], "k": 2}], "ynho": ["Thi tuyển nhà giáo có **02 vòng**.", "Vòng 1 máy tính: kiến thức chung **60 câu/60 phút**, ngoại ngữ **30 câu/30 phút**.", "Đúng từ **50%** số câu của **từng phần** mới vào vòng 2.", "Dạy đủ **03 năm** có đóng BHXH thì cộng **05 điểm** vào **vòng 2**.", "Nhiều diện ưu tiên: chỉ cộng **điểm cao nhất**."], "bang": [{"tieu_de": "Thi tuyển nhà giáo: hai vòng", "cot": ["Nội dung", "Vòng 1", "Vòng 2"], "dong": [["Hình thức", "Trắc nghiệm trên máy vi tính", "Thực hành sư phạm (chọn 1 trong 3)"], ["Thời gian/số câu", "Phần I: 60 câu, 60 phút; Phần II: 30 câu, 30 phút", "Vấn đáp 30 phút; thi viết 180 phút"], ["Điều kiện/điểm", "Đúng từ 50% từng phần", "Thang điểm 100"], ["Điểm ưu tiên", "Không cộng", "Cộng vào vòng 2"]]}, {"tieu_de": "Điểm cộng 05 điểm", "cot": ["Diện", "Điều kiện"], "dong": [["Giảng dạy, giáo dục đúng vị trí việc làm", "Từ đủ 03 năm (36 tháng), có đóng BHXH bắt buộc"], ["Chứng chỉ kỹ năng nghề quốc gia bậc 4 trở lên", "Hoặc kinh nghiệm thực tế từ đủ 03 năm, có đóng BHXH"], ["Nhiều diện", "Chỉ cộng điểm cao nhất"]]}], "vidu": [{"tinh_huong": "Cô E dạy 02 năm 10 tháng ở một trường tư thục, có đóng BHXH, dự thi vào trường THCS công lập.", "ket_luan": "→ Chưa được cộng 05 điểm: Điều 6 khoản 1 yêu cầu từ đủ 03 năm (36 tháng)."}, {"tinh_huong": "Thầy G dạy hợp đồng ở hai nơi, tổng cộng 40 tháng có đóng BHXH bắt buộc, không liên tục, chưa nhận BHXH một lần.", "ket_luan": "→ Đúng: thời gian BHXH được cộng dồn, nên thầy được cộng 05 điểm (Điều 6 khoản 1)."}, {"tinh_huong": "Cô H đạt 55% số câu Phần I nhưng chỉ 40% số câu Phần II ngoại ngữ.", "ket_luan": "→ Không được dự vòng 2: phải đúng từ 50% số câu của từng phần."}, {"tinh_huong": "Thầy K thuộc hai diện ưu tiên, mỗi diện đều được cộng điểm, và nhà trường cộng cả hai.", "ket_luan": "→ Sai: Điều 6 khoản 4, chỉ cộng điểm ưu tiên cao nhất."}, {"tinh_huong": "Cô L chọn thi vòng 2 bằng cả vấn đáp, thực hành và thi viết.", "ket_luan": "→ Không cần: Điều 7 khoản 2, chọn một trong ba hình thức."}], "nho": ["Bộ số 60-60, 30-30: kiến thức chung 60 câu 60 phút; ngoại ngữ 30 câu 30 phút.", "Quy tắc 3-5: ba năm dạy, năm điểm cộng; điểm cộng chỉ cộng ở vòng 2.", "Vòng 2: vấn đáp 30 phút (chuẩn bị không quá 15 phút), thi viết 180 phút; chọn một trong ba hình thức."]}, {"id": "L4-3", "ten": "Xét tuyển, tiếp nhận, thu hút và trọng dụng nhà giáo", "tomtat": ["Điều 8: xét tuyển nhà giáo gồm **02 vòng**.", "Xét tuyển vòng 1: **kiểm tra điều kiện tại Phiếu đăng ký**; không thuộc diện miễn ngoại ngữ thì **Hội đồng tổ chức sát hạch**.", "Xét tuyển vòng 2: thực hiện theo **khoản 2 Điều 7** (như vòng 2 thi tuyển).", "Điều 9 khoản 1: Hội đồng, trình tự, thủ tục, nội quy, xác định người trúng tuyển ở cơ sở công lập theo **pháp luật tuyển dụng viên chức**.", "Điều 9 khoản 3: ra đề thi, chấm thi phải **bảo mật**.", "Điều 10: tiếp nhận nhà giáo vào cơ sở công lập; điều kiện theo pháp luật về viên chức.", "Điều 10 khoản 2 điểm b: sát hạch khi tiếp nhận bằng **phỏng vấn hoặc thực hành sư phạm**.", "Điều 10 khoản 1 điểm b: người đạt chuẩn trình độ được đào tạo, tình nguyện đến vùng dân tộc thiểu số, miền núi, biên giới, hải đảo, vùng khó khăn thuộc đối tượng thu hút, trọng dụng; vùng dân tộc thiểu số phải **sử dụng được tiếng dân tộc thiểu số**.", "Điều 15 khoản 1: đối tượng thu hút, trọng dụng gồm **7 nhóm (a–g)**, trong đó có người có tài năng, giáo sư, phó giáo sư, nhà giáo lĩnh vực trọng yếu, nhà giáo ngành khó tuyển sinh/đặc thù.", "Điều 16 khoản 2: nhóm đ được tuyển theo hình thức **tiếp nhận**, **không yêu cầu thời gian công tác** theo pháp luật tiếp nhận viên chức; hưởng chính sách vùng đặc biệt khó khăn."], "bay": ["⚠ Xét tuyển: vòng 1 'kiểm tra Phiếu đăng ký' ≠ thi tuyển: vòng 1 'trắc nghiệm máy tính'.", "⚠ 'Sát hạch' ngoại ngữ (xét tuyển) ≠ 'thi' ngoại ngữ (thi tuyển).", "⚠ Tiếp nhận: sát hạch 'phỏng vấn hoặc thực hành sư phạm' ≠ 'thi tuyển'.", "⚠ Vùng dân tộc thiểu số: phải 'sử dụng được tiếng dân tộc thiểu số' ≠ 'là người dân tộc thiểu số'.", "⚠ Nhóm đ: 'không yêu cầu thời gian công tác' ≠ 'phải có thời gian công tác tối thiểu'."], "cauhoi": [{"t": "s", "q": "Xét tuyển nhà giáo được thực hiện qua mấy vòng?", "o": ["01 vòng", "02 vòng", "Chỉ xét hồ sơ, không chia vòng", "03 vòng"], "a": [1], "e": "Xét tuyển gồm 02 vòng.", "r": "Điều 8 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Vòng 1 của xét tuyển nhà giáo là gì?", "o": ["Thi trắc nghiệm trên máy vi tính 60 câu", "Vấn đáp 30 phút", "Kiểm tra điều kiện tại Phiếu đăng ký", "Thực hành sư phạm"], "a": [2], "e": "Xét tuyển: vòng 1 kiểm tra điều kiện tại Phiếu đăng ký; trắc nghiệm máy tính là vòng 1 của thi tuyển.", "r": "Điều 8 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Trong xét tuyển, người không thuộc diện miễn ngoại ngữ thì xử lý thế nào?", "o": ["Hội đồng tổ chức sát hạch ngoại ngữ", "Bị loại khỏi danh sách xét tuyển", "Được miễn sát hạch nếu nộp chứng chỉ bất kỳ", "Thi trắc nghiệm ngoại ngữ 30 câu trên máy vi tính"], "a": [0], "e": "Xét tuyển dùng sát hạch của Hội đồng, không thi trắc nghiệm.", "r": "Điều 8 (khoản 1 điểm d) Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Vòng 2 của xét tuyển nhà giáo thực hiện theo quy định nào?", "o": ["Khoản 1 Điều 7", "Điều 6", "Điều 9", "Khoản 2 Điều 7"], "a": [3], "e": "Vòng 2 xét tuyển giống vòng 2 thi tuyển (khoản 2 Điều 7), khác khoản 1 là vòng 1 thi tuyển.", "r": "Điều 8 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Hội đồng, trình tự, thủ tục, nội quy và xác định người trúng tuyển nhà giáo ở cơ sở công lập thực hiện theo quy định nào?", "o": ["Quy chế riêng do Ủy ban nhân dân cấp tỉnh ban hành", "Pháp luật về lao động", "Pháp luật về tuyển dụng viên chức", "Luật Giáo dục"], "a": [2], "e": "Điều 9 khoản 1 dẫn về pháp luật tuyển dụng viên chức.", "r": "Điều 9 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Sát hạch khi tiếp nhận nhà giáo vào cơ sở công lập được thực hiện bằng hình thức nào?", "o": ["Thi viết 180 phút", "Phỏng vấn hoặc thực hành sư phạm", "Không cần sát hạch, chỉ xét hồ sơ", "Trắc nghiệm trên máy vi tính"], "a": [1], "e": "Tiếp nhận sát hạch bằng phỏng vấn hoặc thực hành sư phạm.", "r": "Điều 10 khoản 2 điểm b Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Đối tượng thu hút, trọng dụng được nhắc đến ở điểm đ khoản 1 Điều 15 (và Điều 10 khoản 1 điểm b) là ai?", "o": ["Nhà giáo thuộc lĩnh vực trọng yếu", "Người đạt chuẩn trình độ được đào tạo, tình nguyện đến làm việc ở vùng dân tộc thiểu số, miền núi, biên giới, hải đảo, vùng khó khăn", "Nghệ nhân ưu tú, thầy thuốc ưu tú", "Giáo sư, phó giáo sư"], "a": [1], "e": "Nhóm đ là người tình nguyện đến vùng khó khăn; các phương án khác là nhóm khác.", "r": "Điều 10 khoản 1 điểm b; Điều 15 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Khi tiếp nhận người tình nguyện đến vùng dân tộc thiểu số, người đó phải đáp ứng thêm yêu cầu nào?", "o": ["Là người dân tộc thiểu số", "Có chứng chỉ ngoại ngữ bậc 3", "Sử dụng được tiếng dân tộc thiểu số", "Cư trú tại địa phương từ đủ 05 năm"], "a": [2], "e": "Yêu cầu là 'sử dụng được tiếng dân tộc thiểu số', không bắt buộc là người dân tộc thiểu số.", "r": "Điều 10 khoản 1 điểm b Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Nhà giáo thuộc nhóm đ khoản 1 Điều 15 được tuyển theo hình thức nào?", "o": ["Xét tuyển 02 vòng", "Thi tuyển", "Bổ nhiệm trực tiếp không qua hình thức nào", "Tiếp nhận"], "a": [3], "e": "Điều 16 khoản 2: tuyển theo hình thức tiếp nhận.", "r": "Điều 16 khoản 2 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Phát biểu nào đúng về nhóm đ khoản 1 Điều 15 khi được tiếp nhận?", "o": ["Không yêu cầu thời gian công tác theo pháp luật về tiếp nhận viên chức", "Không được hưởng chính sách vùng đặc biệt khó khăn", "Phải qua thi tuyển 02 vòng", "Phải có thời gian công tác tối thiểu 05 năm"], "a": [0], "e": "Không yêu cầu thời gian công tác và được hưởng chính sách vùng đặc biệt khó khăn.", "r": "Điều 16 khoản 2 Nghị định 93/2026/NĐ-CP"}, {"t": "s", "q": "Khoản 1 Điều 15 quy định đối tượng thu hút, trọng dụng gồm bao nhiêu nhóm?", "o": ["5 nhóm", "6 nhóm", "7 nhóm (từ điểm a đến điểm g)", "8 nhóm"], "a": [2], "e": "Gồm 7 nhóm a–g.", "r": "Điều 15 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Đối tượng nào sau đây thuộc đối tượng thu hút, trọng dụng theo khoản 1 Điều 15? (chọn tất cả đáp án đúng)", "o": ["Người có bằng thạc sĩ bất kỳ chuyên ngành", "Mọi nhà giáo có thâm niên từ 20 năm trở lên", "Nhà giáo thuộc lĩnh vực trọng yếu", "Người có tài năng", "Giáo sư, phó giáo sư"], "a": [2, 3, 4], "e": "Thâm niên hoặc bằng thạc sĩ không phải điều kiện của các nhóm này.", "r": "Điều 15 khoản 1 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Phát biểu nào đúng về xét tuyển nhà giáo? (chọn tất cả đáp án đúng)", "o": ["Vòng 2 thực hiện theo khoản 2 Điều 7", "Người không thuộc diện miễn ngoại ngữ thì được miễn sát hạch", "Vòng 1 thi trắc nghiệm trên máy vi tính", "Gồm 02 vòng", "Vòng 1 kiểm tra điều kiện tại Phiếu đăng ký"], "a": [0, 3, 4], "e": "Trắc nghiệm máy tính là của thi tuyển; người không thuộc diện miễn vẫn phải sát hạch ngoại ngữ.", "r": "Điều 8 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Phát biểu nào đúng về tiếp nhận nhà giáo vào cơ sở công lập? (chọn tất cả đáp án đúng)", "o": ["Điều kiện tiếp nhận thực hiện theo pháp luật về viên chức", "Không cần sát hạch", "Có đối tượng thu hút, trọng dụng tình nguyện đến vùng khó khăn", "Sát hạch bằng phỏng vấn hoặc thực hành sư phạm", "Bắt buộc thi tuyển 02 vòng"], "a": [0, 2, 3], "e": "Tiếp nhận có sát hạch, không phải thi tuyển 02 vòng.", "r": "Điều 10 Nghị định 93/2026/NĐ-CP"}, {"t": "m", "q": "Nhà giáo thuộc nhóm đ khoản 1 Điều 15 có đặc điểm nào sau đây? (chọn tất cả đáp án đúng)", "o": ["Được tuyển theo hình thức tiếp nhận", "Không yêu cầu thời gian công tác theo pháp luật tiếp nhận viên chức", "Phải dự thi tuyển 02 vòng", "Hưởng chính sách vùng đặc biệt khó khăn", "Phải có từ đủ 36 tháng giảng dạy"], "a": [0, 1, 3], "e": "36 tháng là điều kiện ưu tiên điểm ở Điều 6, không liên quan; nhóm đ tuyển theo tiếp nhận.", "r": "Điều 16 khoản 2 Nghị định 93/2026/NĐ-CP"}, {"t": "f", "q": "Xét tuyển nhà giáo gồm ____ vòng.", "a": [["02", "2", "hai"]], "e": "02 vòng.", "r": "Điều 8 Nghị định 93/2026/NĐ-CP", "o": [["03"], ["01"], ["04"], ["02"]], "k": 3}, {"t": "f", "q": "Vòng 1 xét tuyển kiểm tra điều kiện tại ____.", "a": [["phiếu đăng ký"]], "e": "Phiếu đăng ký.", "r": "Điều 8 Nghị định 93/2026/NĐ-CP", "o": [["hồ sơ gốc"], ["văn bằng, chứng chỉ"], ["bản tự khai"], ["phiếu đăng ký"]], "k": 3}, {"t": "f", "q": "Hội đồng, trình tự, thủ tục xét tuyển nhà giáo ở cơ sở công lập thực hiện theo pháp luật về tuyển dụng ____.", "a": [["viên chức"]], "e": "Theo pháp luật tuyển dụng viên chức.", "r": "Điều 9 khoản 1 Nghị định 93/2026/NĐ-CP", "o": [["công chức"], ["lao động"], ["viên chức"], ["giáo viên"]], "k": 2}, {"t": "f", "q": "Việc ra đề thi, chấm thi phải được ____.", "a": [["bảo mật"]], "e": "Phải bảo mật.", "r": "Điều 9 khoản 3 Nghị định 93/2026/NĐ-CP", "o": [["công khai"], ["niêm yết"], ["lưu trữ"], ["bảo mật"]], "k": 3}, {"t": "f", "q": "Khi tiếp nhận nhà giáo, sát hạch bằng phỏng vấn hoặc thực hành ____.", "a": [["sư phạm"]], "e": "Phỏng vấn hoặc thực hành sư phạm.", "r": "Điều 10 khoản 2 điểm b Nghị định 93/2026/NĐ-CP", "o": [["chuyên môn"], ["ngoại ngữ"], ["sư phạm"], ["sức khỏe"]], "k": 2}, {"t": "f", "q": "Nhóm đ khoản 1 Điều 15 được tuyển theo hình thức ____, không yêu cầu thời gian ____ theo pháp luật về tiếp nhận viên chức.", "a": [["tiếp nhận"], ["công tác"]], "e": "Tiếp nhận; không yêu cầu thời gian công tác.", "r": "Điều 16 khoản 2 Nghị định 93/2026/NĐ-CP", "o": [["xét tuyển", "công tác"], ["tiếp nhận", "giảng dạy"], ["thi tuyển", "công tác"], ["tiếp nhận", "công tác"]], "k": 3}], "ynho": ["Xét tuyển nhà giáo có **02 vòng**.", "Vòng 1 xét tuyển: kiểm tra **Phiếu đăng ký**; ngoại ngữ thì **sát hạch**.", "Vòng 2 xét tuyển theo **khoản 2 Điều 7**.", "Tiếp nhận: sát hạch bằng **phỏng vấn hoặc thực hành sư phạm**.", "Đối tượng thu hút, trọng dụng gồm **7 nhóm (a-g)**."], "bang": [{"tieu_de": "Thi tuyển và xét tuyển", "cot": ["Nội dung", "Thi tuyển (Điều 7)", "Xét tuyển (Điều 8)"], "dong": [["Số vòng", "02", "02"], ["Vòng 1", "Trắc nghiệm trên máy vi tính", "Kiểm tra điều kiện tại Phiếu đăng ký"], ["Ngoại ngữ", "Thi (Phần II)", "Hội đồng sát hạch nếu không thuộc diện miễn"], ["Vòng 2", "Thực hành sư phạm", "Theo khoản 2 Điều 7"]]}, {"tieu_de": "Tiếp nhận và thu hút", "cot": ["Nội dung", "Quy định"], "dong": [["Sát hạch khi tiếp nhận", "Phỏng vấn hoặc thực hành sư phạm (Điều 10 khoản 2 điểm b)"], ["Vùng dân tộc thiểu số", "Phải sử dụng được tiếng dân tộc thiểu số"], ["Đối tượng thu hút, trọng dụng", "7 nhóm a-g (Điều 15 khoản 1)"], ["Nhóm đ", "Tiếp nhận, không yêu cầu thời gian công tác (Điều 16 khoản 2)"]]}], "vidu": [{"tinh_huong": "Cô M nộp hồ sơ xét tuyển vào trường THCS công lập, Hội đồng kiểm tra điều kiện ghi trong Phiếu đăng ký.", "ket_luan": "→ Đúng: Điều 8, vòng 1 xét tuyển là kiểm tra điều kiện tại Phiếu đăng ký."}, {"tinh_huong": "Thầy N xin chuyển từ trường ngoài công lập vào trường công lập theo diện tiếp nhận và được hội đồng phỏng vấn.", "ket_luan": "→ Đúng: Điều 10 khoản 2 điểm b cho phép sát hạch bằng phỏng vấn hoặc thực hành sư phạm."}, {"tinh_huong": "Cô P là người Kinh, tình nguyện lên vùng dân tộc thiểu số và nói được tiếng Mông.", "ket_luan": "→ Đủ điều kiện về ngôn ngữ: chỉ cần sử dụng được tiếng dân tộc thiểu số, không phải là người dân tộc thiểu số."}, {"tinh_huong": "Hội đồng yêu cầu thầy Q phải có thời gian công tác tối thiểu trước khi tiếp nhận, dù thầy thuộc nhóm đ.", "ket_luan": "→ Sai: Điều 16 khoản 2, nhóm đ không yêu cầu thời gian công tác theo pháp luật tiếp nhận viên chức."}, {"tinh_huong": "Một trường để lộ đề thi trước ngày thi tuyển nhà giáo.", "ket_luan": "→ Vi phạm Điều 9 khoản 3: ra đề thi, chấm thi phải bảo mật."}], "nho": ["Xét tuyển = Xem hồ sơ (Phiếu đăng ký) ở vòng 1; Thi tuyển = Thi máy ở vòng 1.", "Ngoại ngữ: Thi tuyển thì 'thi', xét tuyển thì 'sát hạch'.", "Tiếp nhận: 'phỏng vấn hoặc thực hành' - không phải thi."]}, {"id": "L4-4", "ten": "Điều động, thuyên chuyển và dạy liên trường, liên cấp", "tomtat": ["Điều 11 khoản 1 điểm a: **Chủ tịch UBND cấp xã** điều động trong phạm vi quản lý (từ cơ sở giáo dục đến cơ quan quản lý giáo dục cấp xã).", "Điều 11 khoản 1 điểm b: **Giám đốc Sở GDĐT** điều động giữa hai đơn vị hành chính cấp xã khác nhau, và lên cơ quan quản lý giáo dục cấp tỉnh.", "Điều 11 khoản 1 điểm c: **Bộ trưởng Bộ Quốc phòng, Bộ Công an** điều động ở trường lực lượng vũ trang; điểm đ: **UBND cấp tỉnh** ban hành quy chế điều động.", "Điều 11 khoản 2: đối tượng điều động gồm nhà giáo dôi dư, có nguyện vọng đến vùng đặc biệt khó khăn, được quy hoạch/bổ nhiệm cán bộ quản lý...", "Điều 11 khoản 3: nhà giáo giữ chức vụ quản lý điều động đến nơi phụ cấp thấp hơn được **bảo lưu phụ cấp chức vụ**; ký hợp đồng làm việc với cơ sở công lập nơi đến; chế độ tính theo nơi đến, đang hưởng cao hơn thì bảo lưu.", "Điều 11 khoản 4 điểm b: xem xét, quyết định trong **30 ngày làm việc** kể từ ngày nhận đủ hồ sơ hợp lệ; không đồng ý phải **trả lời bằng văn bản nêu lý do**.", "Điều 12: thuyên chuyển theo **nguyện vọng** nhà giáo; phải được cơ sở, cơ quan **nơi đi và nơi đến** đồng ý, phù hợp vị trí việc làm.", "Điều 12 khoản 3 điểm a: hồ sơ thuyên chuyển gồm đơn (Mẫu số 01), văn bản đồng ý cho liên hệ công tác của nơi đi, văn bản đồng ý tiếp nhận của nơi đến.", "Điều 13 khoản 2: dạy liên trường, liên cấp do cơ sở có nhu cầu phối hợp xây dựng kế hoạch, báo cáo **UBND cấp xã hoặc Sở GDĐT ra quyết định** phân công; quyết định xác định rõ thời gian, khối lượng giảng dạy, trách nhiệm phối hợp.", "Điều 13 khoản 3 điểm a: số tiết theo chế độ làm việc là **tổng số tiết** ở các cơ sở được phân công.", "Điều 13 khoản 3: đánh giá do người đứng đầu cơ sở năm học bị lùi lại, nhà trường THCS cần thay đổi thời gian nghỉ hè.", "ket_luan": "→ Do Bộ trưởng Bộ GDĐT quyết định (Điều 17 khoản 1 điểm e, nhóm a, b)."}, {"tinh_huong": "Cô Y muốn nghỉ hưu ở tuổi cao hơn, nộp hồ sơ trước thời điểm nghỉ hưu 3 tháng.", "ket_luan": "→ Chưa đúng: Điều 18 yêu cầu nộp trước ít nhất 06 tháng."}, {"tinh_huong": "Trong kỳ nghỉ hè, nhà trường chỉ trả lương cơ bản, cắt phụ cấp của thầy Z.", "ket_luan": "→ Sai: Điều 17 khoản 1 điểm g, nghỉ hè hưởng nguyên lương và phụ cấp."}], "nho": ["Số 8-6-4: phổ thông và dự bị ĐH 8, nghề-trung cấp-cao đẳng 6, sơ cấp 4; thường xuyên 4 đến 8.", "Địa phương chọn 'khi nào' (Chủ tịch tỉnh), Bộ chỉ vào khi 'đột xuất, khẩn cấp'.", "Nghỉ hưu cao tuổi: 'sáu tháng - ba mươi ngày' = nộp trước 6 tháng, xét trong 30 ngày làm việc."]}]});</script><script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L5", "ten": "Nghị định 259/2026/NĐ-CP về tuyển dụng, sử dụng và quản lý viên chức", "so": "Nghị định số 259/2026/NĐ-CP", "ngay": "30/06/2026", "hieuluc": "01/07/2026", "mota": "Nghị định quy định về tuyển dụng (xét tuyển, thi tuyển), xếp lương, hợp đồng làm việc và sử dụng viên chức, ban hành ngày 30/06/2026, có hiệu lực từ 01/07/2026.", "baihoc": [{"id": "L5-1", "ten": "Quy định chung: thẩm quyền, căn cứ, kế hoạch và điều kiện đăng ký dự tuyển", "tomtat": ["Nghị định 259/2026/NĐ-CP ban hành **30/06/2026**, có hiệu lực **01/07/2026**, thay thế NĐ **115/2020** và NĐ **85/2023**.", "Điều 3 khoản 1: đơn vị **tự bảo đảm chi thường xuyên và chi đầu tư (nhóm 1)**, **tự bảo đảm chi thường xuyên (nhóm 2)** và đơn vị khác được giao thẩm quyền theo pháp luật ngành có thẩm quyền tuyển dụng.", "Điều 3 khoản 2: **cơ quan quản lý** đơn vị sự nghiệp tuyển dụng cho đơn vị **tự bảo đảm một phần chi thường xuyên (nhóm 3)** và **do Nhà nước bảo đảm chi thường xuyên (nhóm 4)** theo phân cấp.", "Điều 3 khoản 3: nhóm 3, 4 có thể được tuyển dụng **theo phân cấp hoặc ủy quyền**.", "Điều 4 khoản 1, căn cứ tuyển dụng: **nhu cầu thực tế**, **yêu cầu vị trí việc làm**, **quỹ tiền lương và nguồn thu hợp pháp**, **biên chế** viên chức hưởng lương ngân sách được giao.", "Điều 5, kế hoạch tuyển dụng gồm: phương thức (xét/thi), số biên chế, số vị trí việc làm, số tuyển ở từng vị trí, chỉ tiêu dân tộc thiểu số (nếu có), tiêu chuẩn điều kiện theo bậc nghề nghiệp, yêu cầu ngoại ngữ...", "Điều 6 khoản 1: điều kiện đăng ký dự tuyển thực hiện theo **Điều 19 Luật Viên chức 2025**.", "Điều 6 khoản 1: cơ quan tuyển dụng cụ thể hóa điểm g, h khoản 1 Điều 19 nhưng **không thấp hơn** tiêu chuẩn chung và **không trái nguyên tắc Điều 16** của Luật.", "Điều 6 khoản 2: lĩnh vực **văn hóa, nghệ thuật, thể dục thể thao** có thể từ đủ **15 tuổi**, phải có **văn bản đồng ý của người đại diện theo pháp luật**."], "bay": ["⚠ Ngày **ban hành (30/06/2026)** ≠ ngày **hiệu lực (01/07/2026)**.", "⚠ Nhóm 1, 2 **tự tuyển**; nhóm 3, 4 **do cơ quan quản lý tuyển** (phân cấp/ủy quyền).", "⚠ **Điều 19** (điều kiện đăng ký) ≠ **Điều 16** (nguyên tắc); 'không **thấp hơn**' tiêu chuẩn chung ≠ 'không cao hơn'.", "⚠ Chỉ 3 lĩnh vực (văn hóa, nghệ thuật, TDTT) mới từ đủ **15** tuổi, không phải 16 hay 18."], "cauhoi": [{"t": "s", "q": "Nghị định 259/2026/NĐ-CP quy định về tuyển dụng, sử dụng và quản lý viên chức được ban hành vào ngày nào?", "o": ["31/03/2026", "22/01/2026", "30/06/2026", "01/07/2026"], "a": [2], "e": "Nghị định được ban hành ngày 30/06/2026; ngày 01/07/2026 là ngày có hiệu lực (dễ nhầm giữa ngày ban hành và ngày hiệu lực).", "r": "Nghị định 259/2026/NĐ-CP phần thông tin chung"}, {"t": "s", "q": "Nghị định 259/2026/NĐ-CP có hiệu lực thi hành từ ngày nào?", "o": ["01/07/2026", "30/06/2026", "01/09/2026", "01/01/2026"], "a": [0], "e": "Hiệu lực từ 01/07/2026, sau ngày ban hành 30/06/2026 một ngày; không phải ngày ban hành.", "r": "Nghị định 259/2026/NĐ-CP phần thông tin chung"}, {"t": "s", "q": "Theo khoản 1 Điều 3, đơn vị sự nghiệp công lập nào sau đây có thẩm quyền tự tuyển dụng viên chức?", "o": ["Đơn vị tự bảo đảm một phần chi thường xuyên", "Đơn vị do Nhà nước bảo đảm chi thường xuyên", "Mọi đơn vị sự nghiệp công lập không phân biệt mức tự bảo đảm tài chính", "Đơn vị tự bảo đảm chi thường xuyên"], "a": [3], "e": "Nhóm 1 (tự bảo đảm chi thường xuyên và chi đầu tư) và nhóm 2 (tự bảo đảm chi thường xuyên) tự tuyển. Nhóm 3 (một phần) và nhóm 4 (Nhà nước bảo đảm) do cơ quan quản lý tuyển theo phân cấp (khoản 2) nên phương án nhiễu sai.", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 1, 2"}, {"t": "s", "q": "Việc tuyển dụng viên chức cho đơn vị sự nghiệp do Nhà nước bảo đảm chi thường xuyên được thực hiện bởi ai theo khoản 2 Điều 3?", "o": ["Chính phủ trực tiếp tuyển dụng", "Cơ quan quản lý đơn vị sự nghiệp công lập, theo phân cấp", "Chỉ người đứng đầu đơn vị sự nghiệp, không cần phân cấp", "Hội đồng tuyển dụng do Bộ Nội vụ thành lập"], "a": [1], "e": "Khoản 2: cơ quan quản lý tuyển dụng cho nhóm 3 và nhóm 4 theo phân cấp (khoản 3 còn cho phép ủy quyền). Hội đồng tuyển dụng chỉ tổ chức thực hiện, không phải cơ quan có thẩm quyền.", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 2, 3"}, {"t": "s", "q": "Căn cứ nào sau đây KHÔNG nằm trong các căn cứ tuyển dụng viên chức tại khoản 1 Điều 4?", "o": ["Nhu cầu thực tế của đơn vị", "Yêu cầu của vị trí việc làm", "Số lượng người nộp hồ sơ đăng ký dự tuyển", "Biên chế viên chức hưởng lương ngân sách được giao"], "a": [2], "e": "Căn cứ gồm nhu cầu thực tế, yêu cầu vị trí việc làm, quỹ tiền lương và nguồn thu hợp pháp, biên chế được giao; không có căn cứ vào số hồ sơ đăng ký.", "r": "Nghị định 259/2026/NĐ-CP Điều 4 khoản 1"}, {"t": "s", "q": "Điều kiện đăng ký dự tuyển viên chức theo khoản 1 Điều 6 Nghị định 259/2026/NĐ-CP thực hiện theo điều nào của Luật Viên chức 2025?", "o": ["Điều 19", "Điều 30", "Điều 43", "Điều 16"], "a": [0], "e": "Khoản 1 Điều 6 dẫn Điều 19 Luật Viên chức 2025. Điều 16 là nguyên tắc mà việc cụ thể hóa không được trái; đây là chỗ dễ nhầm.", "r": "Nghị định 259/2026/NĐ-CP Điều 6 khoản 1"}, {"t": "s", "q": "Khi cụ thể hóa điểm g, h khoản 1 Điều 19 Luật Viên chức 2025, cơ quan tuyển dụng phải bảo đảm yêu cầu nào?", "o": ["Có thể thấp hơn tiêu chuẩn chung nếu đơn vị thiếu người", "Không cao hơn tiêu chuẩn chung, nhưng được trái nguyên tắc tuyển dụng", "Chỉ cần được người đứng đầu đơn vị đồng ý, không bị ràng buộc", "Không thấp hơn tiêu chuẩn chung và không trái nguyên tắc tại Điều 16 của Luật"], "a": [3], "e": "Khoản 1 Điều 6: cụ thể hóa nhưng không thấp hơn tiêu chuẩn chung và không trái nguyên tắc Điều 16. Bẫy: đảo 'không thấp hơn' thành 'không cao hơn'.", "r": "Nghị định 259/2026/NĐ-CP Điều 6 khoản 1"}, {"t": "s", "q": "Theo khoản 2 Điều 6, người đăng ký dự tuyển trong lĩnh vực văn hóa, nghệ thuật, thể dục thể thao có thể từ đủ bao nhiêu tuổi?", "o": ["Đủ 18 tuổi, kèm văn bản đồng ý của người đại diện theo pháp luật", "Đủ 15 tuổi, kèm văn bản đồng ý của người đại diện theo pháp luật", "Đủ 14 tuổi, kèm văn bản đồng ý của người đại diện theo pháp luật", "Đủ 16 tuổi, không cần văn bản đồng ý"], "a": [1], "e": "Chỉ ba lĩnh vực văn hóa, nghệ thuật, thể dục thể thao mới có thể từ đủ 15 tuổi và bắt buộc có văn bản đồng ý của người đại diện theo pháp luật.", "r": "Nghị định 259/2026/NĐ-CP Điều 6 khoản 2"}, {"t": "s", "q": "Phát biểu nào sau đây đúng về Điều 3 Nghị định 259/2026/NĐ-CP?", "o": ["Đơn vị nhóm 4 bắt buộc tự tuyển dụng, không do cơ quan quản lý tuyển", "Đơn vị nhóm 2 phải do cơ quan quản lý tuyển dụng, còn nhóm 3 tự tuyển", "Đơn vị sự nghiệp nhóm 3 và nhóm 4 có thể được tuyển dụng theo phân cấp hoặc ủy quyền", "Chỉ đơn vị nhóm 1 mới có thẩm quyền tuyển dụng, các nhóm còn lại không được ủy quyền"], "a": [2], "e": "Khoản 2, 3: nhóm 3 và 4 do cơ quan quản lý tuyển theo phân cấp hoặc ủy quyền. Các phương án nhiễu đảo nhóm hoặc đảo chủ thể.", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 2, 3"}, {"t": "s", "q": "Nội dung nào sau đây thuộc kế hoạch tuyển dụng theo Điều 5?", "o": ["Số lượng tuyển ở từng vị trí việc làm", "Kết quả trúng tuyển dự kiến", "Danh sách cụ thể từng người dự tuyển", "Điểm ưu tiên đã tính cho từng thí sinh"], "a": [0], "e": "Kế hoạch gồm phương thức (xét/thi), số biên chế, số vị trí việc làm, số tuyển ở từng vị trí, chỉ tiêu dân tộc thiểu số (nếu có)...; không có danh sách người dự tuyển hay kết quả.", "r": "Nghị định 259/2026/NĐ-CP Điều 5"}, {"t": "s", "q": "Nghị định 259/2026/NĐ-CP thay thế Nghị định nào sau đây?", "o": ["Nghị định 129/2025/NĐ-CP", "Nghị định 93/2026/NĐ-CP", "Nghị định 73/2025/NĐ-CP", "Nghị định 115/2020/NĐ-CP"], "a": [3], "e": "Nghị định 259 thay NĐ 115/2020 và NĐ 85/2023. NĐ 93/2026 là nghị định hướng dẫn Luật Nhà giáo; 129/2025 là số của Luật Viên chức (QH15), 73/2025 là số Luật Nhà giáo.", "r": "Nghị định 259/2026/NĐ-CP phần thông tin chung"}, {"t": "m", "q": "Theo khoản 1 Điều 3, đơn vị nào có thẩm quyền tuyển dụng viên chức (chọn tất cả đáp án đúng)", "o": ["Đơn vị do Nhà nước bảo đảm chi thường xuyên (theo khoản 1)", "Đơn vị tự bảo đảm chi thường xuyên và chi đầu tư", "Đơn vị tự bảo đảm một phần chi thường xuyên (theo khoản 1)", "Đơn vị tự bảo đảm chi thường xuyên", "Đơn vị khác được giao thẩm quyền theo pháp luật ngành"], "a": [1, 3, 4], "e": "Khoản 1 liệt kê nhóm 1, nhóm 2 và đơn vị khác được giao thẩm quyền; nhóm 3, 4 thuộc khoản 2 (cơ quan quản lý tuyển theo phân cấp).", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 1, 2"}, {"t": "m", "q": "Căn cứ tuyển dụng viên chức theo khoản 1 Điều 4 gồm (chọn tất cả đáp án đúng)", "o": ["Quỹ tiền lương và nguồn thu hợp pháp", "Nhu cầu thực tế", "Số lượng hồ sơ đăng ký dự tuyển", "Yêu cầu của vị trí việc làm", "Biên chế viên chức hưởng lương ngân sách được giao"], "a": [0, 1, 3, 4], "e": "Bốn căn cứ đầu đúng theo khoản 1 Điều 4; số hồ sơ đăng ký không phải căn cứ.", "r": "Nghị định 259/2026/NĐ-CP Điều 4 khoản 1"}, {"t": "m", "q": "Kế hoạch tuyển dụng viên chức theo Điều 5 gồm các nội dung nào (chọn tất cả đáp án đúng)", "o": ["Số vị trí việc làm và số tuyển ở từng vị trí", "Chỉ tiêu dân tộc thiểu số (nếu có)", "Danh sách người dự tuyển đã được chấp thuận", "Số biên chế", "Phương thức tuyển dụng (xét hoặc thi)"], "a": [0, 1, 3, 4], "e": "Các nội dung đầu thuộc kế hoạch; danh sách người dự tuyển chỉ có sau khi nhận hồ sơ.", "r": "Nghị định 259/2026/NĐ-CP Điều 5"}, {"t": "m", "q": "Về việc tuyển dụng của đơn vị sự nghiệp công lập nhóm 3 và nhóm 4, các phát biểu đúng là (chọn tất cả đáp án đúng)", "o": ["Có thể được thực hiện thông qua ủy quyền", "Đơn vị tự quyết định mà không cần phân cấp", "Việc tuyển dụng thực hiện theo phân cấp", "Cơ quan quản lý đơn vị sự nghiệp thực hiện tuyển dụng", "Do Bộ Nội vụ trực tiếp tuyển dụng cho từng đơn vị"], "a": [0, 2, 3], "e": "Khoản 2 và 3 Điều 3: cơ quan quản lý tuyển theo phân cấp hoặc ủy quyền.", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 2, 3"}, {"t": "f", "q": "Điều kiện đăng ký dự tuyển được thực hiện theo Điều ____ Luật Viên chức 2025.", "a": [["19"]], "e": "Khoản 1 Điều 6 dẫn Điều 19; không nhầm với Điều 16 (nguyên tắc).", "r": "Nghị định 259/2026/NĐ-CP Điều 6 khoản 1", "o": [["20"], ["18"], ["21"], ["19"]], "k": 3}, {"t": "f", "q": "Lĩnh vực văn hóa, nghệ thuật, thể dục thể thao có thể từ đủ ____ tuổi, phải có văn bản đồng ý của người đại diện theo ____.", "a": [["15", "mười lăm"], ["pháp luật"]], "e": "Khoản 2 Điều 6: từ đủ 15 tuổi và có văn bản đồng ý của người đại diện theo pháp luật.", "r": "Nghị định 259/2026/NĐ-CP Điều 6 khoản 2", "o": [["16", "pháp luật"], ["15", "ủy quyền"], ["15", "pháp luật"], ["18", "pháp luật"]], "k": 2}, {"t": "f", "q": "Đơn vị tự bảo đảm chi ____ và chi đầu tư (nhóm 1), tự bảo đảm chi thường xuyên (nhóm 2) có thẩm quyền tuyển dụng.", "a": [["thường xuyên"]], "e": "Nhóm 1 tự bảo đảm chi thường xuyên và chi đầu tư.", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 1", "o": [["thường xuyên"], ["đột xuất"], ["cơ bản"], ["đầu tư"]], "k": 0}, {"t": "f", "q": "Cơ quan quản lý đơn vị sự nghiệp tuyển dụng cho đơn vị do Nhà nước bảo đảm chi thường xuyên theo ____ hoặc ủy quyền.", "a": [["phân cấp"]], "e": "Khoản 2, 3 Điều 3: theo phân cấp hoặc ủy quyền.", "r": "Nghị định 259/2026/NĐ-CP Điều 3 khoản 2, 3", "o": [["phân cấp"], ["quy định"], ["thỏa thuận"], ["hợp đồng"]], "k": 0}, {"t": "f", "q": "Căn cứ tuyển dụng gồm nhu cầu thực tế, yêu cầu ____, quỹ tiền lương và nguồn thu hợp pháp, biên chế được giao.", "a": [["vị trí việc làm"]], "e": "Khoản 1 Điều 4.", "r": "Nghị định 259/2026/NĐ-CP Điều 4 khoản 1", "o": [["trình độ đào tạo"], ["chỉ tiêu tuyển sinh"], ["kinh nghiệm công tác"], ["vị trí việc làm"]], "k": 3}, {"t": "f", "q": "Nghị định 259/2026/NĐ-CP được ban hành ngày ____ và có hiệu lực từ ngày ____.", "a": [["30/6/2026", "30/06/2026"], ["1/7/2026", "01/7/2026", "01/07/2026"]], "e": "Ban hành 30/6/2026; hiệu lực 01/7/2026.", "r": "Nghị định 259/2026/NĐ-CP phần thông tin chung", "o": [["30/6/2026", "1/7/2026"], ["30/6/2026", "15/7/2026"], ["1/7/2026", "30/6/2026"], ["15/7/2026", "1/7/2026"]], "k": 0}, {"t": "f", "q": "Nghị định 259/2026/NĐ-CP thay thế Nghị định số ____/2020/NĐ-CP và Nghị định số ____/2023/NĐ-CP.", "a": [["115"], ["85"]], "e": "Thay thế NĐ 115/2020 và NĐ 85/2023.", "r": "Nghị định 259/2026/NĐ-CP phần thông tin chung", "o": [["115", "85"], ["85", "115"], ["115", "95"], ["85", "85"]], "k": 0}], "ynho": ["NĐ 259 ban hành **30/06/2026**, hiệu lực **01/07/2026**.", "Thay thế NĐ **115/2020** và NĐ **85/2023**.", "Nhóm **1, 2** tự tuyển; nhóm **3, 4** do cơ quan quản lý tuyển.", "Điều kiện đăng ký dự tuyển theo **Điều 19** Luật Viên chức 2025.", "Văn hóa, nghệ thuật, TDTT có thể từ đủ **15 tuổi**, cần người đại diện đồng ý."], "bang": [{"tieu_de": "Ai tuyển dụng", "cot": ["Nhóm đơn vị", "Tuyển dụng"], "dong": [["Nhóm 1: tự bảo đảm chi thường xuyên và chi đầu tư", "Đơn vị tự tuyển"], ["Nhóm 2: tự bảo đảm chi thường xuyên", "Đơn vị tự tuyển"], ["Nhóm 3: tự bảo đảm một phần chi thường xuyên", "Cơ quan quản lý (phân cấp/ủy quyền)"], ["Nhóm 4: Nhà nước bảo đảm chi thường xuyên", "Cơ quan quản lý (phân cấp/ủy quyền)"]]}, {"tieu_de": "Căn cứ tuyển dụng (Điều 4)", "cot": ["Căn cứ"], "dong": [["Nhu cầu thực tế"], ["Yêu cầu vị trí việc làm"], ["Quỹ tiền lương và nguồn thu hợp pháp"], ["Biên chế viên chức hưởng lương ngân sách được giao"]]}], "vidu": [{"tinh_huong": "Trường THCS công lập do Nhà nước bảo đảm chi thường xuyên (nhóm 4) muốn tuyển giáo viên.", "ket_luan": "→ Theo Điều 3 khoản 2, cơ quan quản lý đơn vị sự nghiệp tuyển dụng theo phân cấp hoặc ủy quyền."}, {"tinh_huong": "Cô A hỏi NĐ 259 có hiệu lực ngày 30/06/2026 không.", "ket_luan": "→ Sai: ban hành 30/06/2026 nhưng hiệu lực 01/07/2026."}, {"tinh_huong": "Một đơn vị đặt điều kiện dự tuyển thấp hơn tiêu chuẩn chung của Điều 19.", "ket_luan": "→ Sai: Điều 6 khoản 1, chỉ được cụ thể hóa, không thấp hơn tiêu chuẩn chung và không trái nguyên tắc Điều 16."}, {"tinh_huong": "Một trường nghệ thuật muốn tuyển bạn B tròn 15 tuổi làm diễn viên.", "ket_luan": "→ Có thể: Điều 6 khoản 2, lĩnh vực nghệ thuật từ đủ 15 tuổi, cần văn bản đồng ý của người đại diện theo pháp luật."}, {"tinh_huong": "Trường THCS tuyển giáo viên khi chưa có biên chế được giao và chưa có nhu cầu thực tế.", "ket_luan": "→ Không đủ căn cứ theo Điều 4 khoản 1 (nhu cầu, vị trí việc làm, quỹ lương, biên chế)."}], "nho": ["Ban hành 30/6, hiệu lực 01/7: chỉ cách nhau một ngày, dễ nhầm.", "Nhóm 1-2 'tự lo' nên 'tự tuyển'; nhóm 3-4 'cần cha mẹ' (cơ quan quản lý) tuyển.", "Điều 19 = điều kiện đăng ký; Điều 16 = nguyên tắc - đi theo thứ tự 'nguyên tắc rồi điều kiện'."]}, {"id": "L5-2", "ten": "Xét tuyển, điểm ưu tiên và Hội đồng tuyển dụng", "tomtat": ["Điều 7 khoản 1: xét tuyển người **cam kết tình nguyện làm việc từ đủ 03 năm trở lên** ở vùng đặc biệt khó khăn (y tế, giáo dục, lĩnh vực cơ bản thiết yếu khác).", "Điều 7: các trường hợp xét tuyển còn gồm **cử tuyển** (về công tác tại địa phương cử đi học), **sinh viên tốt nghiệp xuất sắc, người có tài năng** theo chính sách thu hút, và trường hợp khác theo pháp luật ngành.", "Điều 8: điểm ưu tiên **cộng vào kết quả vòng 2**; mức **7,5** (Anh hùng, thương binh...), **5** (dân tộc thiểu số, con liệt sĩ, quân nhân phục viên...), **2,5** (hoàn thành nghĩa vụ quân sự, CAND...), **1,5** (cán bộ công đoàn trưởng thành từ cơ sở).", "Điều 8 khoản 2: thuộc **nhiều diện** ưu tiên chỉ được cộng điểm ưu tiên **cao nhất**.", "Điều 9: Hội đồng tuyển dụng có **05 hoặc 07** thành viên; Chủ tịch là **người đứng đầu hoặc cấp phó** cơ quan có thẩm quyền; Phó Chủ tịch là người phụ trách tổ chức cán bộ; Ủy viên kiêm Thư ký.", "Điều 9 khoản 3: Hội đồng làm việc tập thể, quyết định **theo đa số**, **ngang phiếu theo ý kiến Chủ tịch**, tự giải thể sau khi hoàn thành nhiệm vụ.", "Điều 9 khoản 4: không bố trí người có quan hệ vợ chồng, cha mẹ, con, anh chị em ruột... với người dự tuyển; người đang bị xử lý kỷ luật; người đã bị xử lý về tham nhũng, tiêu cực trong công tác cán bộ.", "Điều 13: xét tuyển **2 vòng**; vòng 1 kiểm tra điều kiện tại Phiếu đăng ký dự tuyển; vòng 2 vấn đáp hoặc thực hành, **thang 100 điểm**; vấn đáp **30 phút**, chuẩn bị **không quá 15 phút**.", "Điều 13 khoản 3: **không kiểm tra ngoại ngữ** khi xét tuyển, trừ khi cơ quan quyết định.", "Điều 14: trúng tuyển khi điểm vòng 2 **từ 50 điểm trở lên** và điểm vòng 2 + ưu tiên cao hơn trong chỉ tiêu; bằng điểm thì người có điểm vòng 2 cao hơn; **không bảo lưu** kết quả."], "bay": ["⚠ Mức ưu tiên **7,5 / 5 / 2,5 / 1,5**: dễ đánh tráo mức giữa các đối tượng.", "⚠ Nhiều diện ưu tiên: **cao nhất**, không cộng dồn, không phải thấp nhất.", "⚠ Vấn đáp **30 phút** ≠ chuẩn bị **không quá 15 phút**; 'từ 50 điểm trở lên' ≠ 'trên 50 điểm'.", "⚠ Chủ tịch Hội đồng (người đứng đầu/cấp phó) ≠ Phó Chủ tịch (người phụ trách tổ chức cán bộ); ngang phiếu theo ý kiến **Chủ tịch**."], "cauhoi": [{"t": "s", "q": "Theo khoản 1 Điều 7, người cam kết tình nguyện làm việc ở vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn được xét tuyển khi cam kết làm việc từ bao lâu?", "o": ["Từ đủ 02 năm trở lên", "Từ đủ 05 năm trở lên", "Từ đủ 03 năm trở lên", "Dưới 03 năm"], "a": [2], "e": "Điều 7 khoản 1: từ đủ 03 năm trở lên, trong lĩnh vực y tế, giáo dục và lĩnh vực cơ bản thiết yếu khác.", "r": "Nghị định 259/2026/NĐ-CP Điều 7 khoản 1"}, {"t": "s", "q": "Phát biểu nào sau đây đúng về trường hợp xét tuyển theo Điều 7?", "o": ["Người học theo chế độ cử tuyển, sau tốt nghiệp về công tác tại địa phương cử đi học được xét tuyển", "Người học theo chế độ cử tuyển được chọn nơi công tác tùy ý sau tốt nghiệp", "Chỉ người cam kết làm việc ở vùng đặc biệt khó khăn mới được xét tuyển, không có trường hợp nào khác", "Mọi sinh viên tốt nghiệp loại giỏi đều được xét tuyển"], "a": [0], "e": "Khoản 2: cử tuyển, về công tác tại địa phương cử đi học. Khoản 3 là sinh viên tốt nghiệp xuất sắc (không phải loại giỏi); khoản 4 còn trường hợp khác theo pháp luật ngành.", "r": "Nghị định 259/2026/NĐ-CP Điều 7 khoản 2, 3, 4"}, {"t": "s", "q": "Đối tượng nào sau đây được cộng 7,5 điểm ưu tiên theo Điều 8?", "o": ["Người hoàn thành nghĩa vụ quân sự", "Người dân tộc thiểu số", "Cán bộ công đoàn trưởng thành từ cơ sở", "Thương binh"], "a": [3], "e": "7,5 điểm: Anh hùng LLVTND, Anh hùng Lao động, thương binh...; dân tộc thiểu số là 5; hoàn thành nghĩa vụ quân sự là 2,5; cán bộ công đoàn là 1,5.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 1"}, {"t": "s", "q": "Người dân tộc thiểu số được cộng bao nhiêu điểm ưu tiên?", "o": ["7,5 điểm", "5 điểm", "2,5 điểm", "1,5 điểm"], "a": [1], "e": "Dân tộc thiểu số thuộc nhóm 5 điểm (cùng con liệt sĩ, quân nhân phục viên...). Bẫy: nhầm mức 7,5 hoặc 2,5.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 1 điểm b"}, {"t": "s", "q": "Điểm ưu tiên theo Điều 8 được cộng vào kết quả của vòng nào?", "o": ["Cả vòng 1 và vòng 2", "Chỉ phần thi ngoại ngữ", "Vòng 2", "Vòng 1"], "a": [2], "e": "Điểm ưu tiên cộng vào kết quả vòng 2 (không cộng vào vòng 1).", "r": "Nghị định 259/2026/NĐ-CP Điều 8"}, {"t": "s", "q": "Người thuộc nhiều diện ưu tiên theo Điều 8 thì được cộng điểm ưu tiên như thế nào?", "o": ["Chỉ được cộng một mức điểm ưu tiên cao nhất", "Được chọn bất kỳ một mức do mình đề nghị, kể cả mức thấp hơn rồi cộng thêm mức khác", "Được cộng dồn tất cả các mức", "Chỉ được cộng mức thấp nhất"], "a": [0], "e": "Khoản 2: nhiều diện thì chỉ cộng mức cao nhất vào kết quả vòng 2.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 2"}, {"t": "s", "q": "Hội đồng tuyển dụng viên chức có số lượng thành viên là bao nhiêu?", "o": ["07 hoặc 09 thành viên", "03 hoặc 05 thành viên", "Từ 05 đến 09 thành viên tùy ý", "05 hoặc 07 thành viên"], "a": [3], "e": "Điều 9: 05 hoặc 07 thành viên.", "r": "Nghị định 259/2026/NĐ-CP Điều 9 khoản 1, 2"}, {"t": "s", "q": "Ai là Chủ tịch Hội đồng tuyển dụng?", "o": ["Đại diện cơ quan cấp trên bất kỳ", "Người đứng đầu hoặc cấp phó của cơ quan, đơn vị có thẩm quyền tuyển dụng", "Người phụ trách tổ chức cán bộ", "Ủy viên kiêm Thư ký của Hội đồng"], "a": [1], "e": "Chủ tịch là người đứng đầu hoặc cấp phó; người phụ trách tổ chức cán bộ làm Phó Chủ tịch; Ủy viên kiêm Thư ký.", "r": "Nghị định 259/2026/NĐ-CP Điều 9 khoản 1, 2"}, {"t": "s", "q": "Khi các ý kiến biểu quyết trong Hội đồng tuyển dụng ngang phiếu nhau thì xử lý thế nào?", "o": ["Thực hiện theo ý kiến của Phó Chủ tịch", "Biểu quyết lại cho đến khi đa số", "Thực hiện theo ý kiến của Chủ tịch Hội đồng", "Báo cáo cơ quan cấp trên quyết định"], "a": [2], "e": "Khoản 3: làm việc tập thể, quyết định theo đa số; ngang phiếu thì theo ý kiến Chủ tịch.", "r": "Nghị định 259/2026/NĐ-CP Điều 9 khoản 3"}, {"t": "s", "q": "Theo Điều 13, thời gian chuẩn bị tối đa của thí sinh khi vấn đáp ở vòng 2 xét tuyển là bao nhiêu?", "o": ["Không quá 15 phút", "Không quá 20 phút", "Không quá 30 phút", "Không quá 10 phút"], "a": [0], "e": "Vấn đáp 30 phút (thời gian trả lời), chuẩn bị không quá 15 phút. Bẫy: đánh tráo hai con số.", "r": "Nghị định 259/2026/NĐ-CP Điều 13"}, {"t": "s", "q": "Điều kiện trúng tuyển trong xét tuyển theo Điều 14 là gì?", "o": ["Điểm vòng 2 trên 50 điểm, không tính điểm ưu tiên", "Điểm vòng 1 cao nhất trong chỉ tiêu", "Điểm vòng 2 từ 70 điểm trở lên", "Điểm vòng 2 từ 50 điểm trở lên và điểm vòng 2 cộng ưu tiên cao hơn trong chỉ tiêu"], "a": [3], "e": "Điều 14: 'từ 50 điểm trở lên' (bao gồm 50), cộng ưu tiên, lấy cao xuống thấp trong chỉ tiêu. Bẫy: 'trên 50' loại 50 điểm.", "r": "Nghị định 259/2026/NĐ-CP Điều 14"}, {"t": "s", "q": "Trong xét tuyển viên chức, việc kiểm tra ngoại ngữ được thực hiện như thế nào?", "o": ["Do thí sinh tự chọn có kiểm tra hay không", "Không kiểm tra, trừ khi cơ quan có thẩm quyền quyết định", "Luôn bắt buộc kiểm tra ở vòng 2", "Luôn bắt buộc kiểm tra ở vòng 1"], "a": [1], "e": "Điều 13 khoản 3: không kiểm tra ngoại ngữ khi xét tuyển, trừ khi cơ quan quyết định.", "r": "Nghị định 259/2026/NĐ-CP Điều 13 khoản 3"}, {"t": "m", "q": "Những đối tượng nào được cộng 5 điểm ưu tiên (chọn tất cả đáp án đúng)", "o": ["Con liệt sĩ", "Cán bộ công đoàn trưởng thành từ cơ sở (1,5 điểm)", "Người dân tộc thiểu số", "Người hoàn thành nghĩa vụ quân sự (2,5 điểm)", "Sĩ quan quân đội phục viên"], "a": [0, 2, 4], "e": "Ba đối tượng đầu thuộc nhóm 5 điểm; hai đối tượng sau ở mức 2,5 và 1,5.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 1"}, {"t": "m", "q": "Các trường hợp xét tuyển theo Điều 7 gồm (chọn tất cả đáp án đúng)", "o": ["Mọi người đang làm hợp đồng lao động tại đơn vị", "Sinh viên tốt nghiệp xuất sắc, người có tài năng thuộc chính sách thu hút", "Người có kinh nghiệm giảng dạy trên 05 năm", "Người học theo chế độ cử tuyển", "Người cam kết làm việc từ đủ 03 năm ở vùng đặc biệt khó khăn"], "a": [1, 3, 4], "e": "Khoản 1, 2, 3 Điều 7; hai phương án nhiễu không có trong điều luật.", "r": "Nghị định 259/2026/NĐ-CP Điều 7"}, {"t": "m", "q": "Những người nào KHÔNG được bố trí làm thành viên Hội đồng tuyển dụng (chọn tất cả đáp án đúng)", "o": ["Người có quan hệ vợ hoặc chồng với người dự tuyển", "Người đang trong thời hạn xử lý kỷ luật hoặc thi hành kỷ luật", "Người đã bị xử lý về tham nhũng, tiêu cực trong công tác cán bộ", "Người có quan hệ cha mẹ, con, anh chị em ruột với người dự tuyển", "Người có kinh nghiệm tham gia Hội đồng tuyển dụng trước đây"], "a": [0, 1, 2, 3], "e": "Khoản 4 Điều 9 nêu các trường hợp đầu; kinh nghiệm trước đây không phải lý do loại trừ.", "r": "Nghị định 259/2026/NĐ-CP Điều 9 khoản 4"}, {"t": "m", "q": "Phát biểu đúng về Hội đồng tuyển dụng (chọn tất cả đáp án đúng)", "o": ["Làm việc tập thể", "Hội đồng tồn tại cố định cho các kỳ tuyển dụng sau", "Quyết định theo đa số", "Tự giải thể sau khi hoàn thành nhiệm vụ", "Chủ tịch quyết định riêng mọi vấn đề, không cần biểu quyết"], "a": [0, 2, 3], "e": "Khoản 3 Điều 9: tập thể, đa số, ngang phiếu theo Chủ tịch, tự giải thể khi xong nhiệm vụ.", "r": "Nghị định 259/2026/NĐ-CP Điều 9 khoản 3"}, {"t": "f", "q": "Anh hùng Lực lượng vũ trang nhân dân, thương binh được cộng ____ điểm ưu tiên.", "a": [["7,5", "7.5"]], "e": "Mức cao nhất là 7,5 điểm.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 1 điểm a", "o": [["5"], ["10"], ["7,5"], ["2,5"]], "k": 2}, {"t": "f", "q": "Người dân tộc thiểu số được cộng ____ điểm ưu tiên vào kết quả vòng ____.", "a": [["5", "năm"], ["2", "hai"]], "e": "5 điểm, cộng vào vòng 2.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 1, 2", "o": [["5", "1"], ["2,5", "2"], ["10", "2"], ["5", "2"]], "k": 3}, {"t": "f", "q": "Người hoàn thành nghĩa vụ quân sự được cộng ____ điểm, cán bộ công đoàn trưởng thành từ cơ sở được cộng ____ điểm.", "a": [["2,5", "2.5"], ["1,5", "1.5"]], "e": "Điểm c: 2,5; điểm d: 1,5.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 1 điểm c, d", "o": [["1,5", "2,5"], ["2,5", "1,5"], ["2,5", "2"], ["1,5", "1,5"]], "k": 1}, {"t": "f", "q": "Hội đồng tuyển dụng có ____ hoặc ____ thành viên.", "a": [["05", "5", "năm"], ["07", "7", "bảy"]], "e": "05 hoặc 07 thành viên.", "r": "Nghị định 259/2026/NĐ-CP Điều 9 khoản 1, 2", "o": [["05", "07"], ["05", "09"], ["03", "07"], ["07", "09"]], "k": 0}, {"t": "f", "q": "Người thuộc nhiều diện ưu tiên chỉ được cộng điểm ưu tiên ____ nhất.", "a": [["cao"]], "e": "Chỉ cộng mức cao nhất.", "r": "Nghị định 259/2026/NĐ-CP Điều 8 khoản 2", "o": [["thấp"], ["cao"], ["trung bình"], ["tối đa"]], "k": 1}, {"t": "f", "q": "Khi xét tuyển, không kiểm tra ____, trừ khi cơ quan có thẩm quyền quyết định.", "a": [["ngoại ngữ"]], "e": "Điều 13 khoản 3.", "r": "Nghị định 259/2026/NĐ-CP Điều 13 khoản 3", "o": [["tin học"], ["kiến thức chung"], ["trình độ đào tạo"], ["ngoại ngữ"]], "k": 3}, {"t": "f", "q": "Vòng 1 xét tuyển là kiểm tra điều kiện dự tuyển tại ____ đăng ký dự tuyển.", "a": [["phiếu"]], "e": "Vòng 1 kiểm tra điều kiện tại Phiếu đăng ký dự tuyển.", "r": "Nghị định 259/2026/NĐ-CP Điều 13", "o": [["đơn"], ["phiếu"], ["bản"], ["thông báo"]], "k": 1}], "ynho": ["Điểm ưu tiên cộng vào **vòng 2**: mức **7,5 / 5 / 2,5 / 1,5**.", "Nhiều diện ưu tiên: chỉ cộng **cao nhất**.", "Hội đồng tuyển dụng có **05 hoặc 07** thành viên.", "Vấn đáp **30 phút**, chuẩn bị không quá **15 phút**; thang **100**.", "Trúng tuyển khi vòng 2 **từ 50 điểm trở lên**; **không bảo lưu** kết quả."], "bang": [{"tieu_de": "Điểm ưu tiên (Điều 8)", "cot": ["Mức điểm", "Ví dụ đối tượng"], "dong": [["7,5", "Anh hùng, thương binh..."], ["5", "Dân tộc thiểu số, con liệt sĩ, quân nhân phục viên..."], ["2,5", "Hoàn thành nghĩa vụ quân sự, CAND..."], ["1,5", "Cán bộ công đoàn trưởng thành từ cơ sở"]]}, {"tieu_de": "Hội đồng tuyển dụng (Điều 9)", "cot": ["Chức danh", "Ai đảm nhiệm"], "dong": [["Chủ tịch", "Người đứng đầu hoặc cấp phó cơ quan có thẩm quyền"], ["Phó Chủ tịch", "Người phụ trách tổ chức cán bộ"], ["Ủy viên kiêm Thư ký", "Thành viên Hội đồng"], ["Số thành viên", "05 hoặc 07"], ["Biểu quyết", "Đa số; ngang phiếu theo ý kiến Chủ tịch"]]}], "vidu": [{"tinh_huong": "Cô A là con liệt sĩ, đồng thời thuộc diện dân tộc thiểu số, dự xét tuyển vào trường THCS.", "ket_luan": "→ Chỉ được cộng điểm ưu tiên cao nhất (Điều 8 khoản 2), không cộng dồn."}, {"tinh_huong": "Thầy B là thương binh dự xét tuyển, được cộng 7,5 điểm.", "ket_luan": "→ Đúng: mức 7,5 dành cho Anh hùng, thương binh..., cộng vào kết quả vòng 2."}, {"tinh_huong": "Hội đồng tuyển dụng có 6 thành viên.", "ket_luan": "→ Sai: Điều 9, Hội đồng có 05 hoặc 07 thành viên."}, {"tinh_huong": "Thầy C là anh ruột của một thí sinh và được bố trí vào Hội đồng.", "ket_luan": "→ Vi phạm Điều 9 khoản 4: không bố trí người có quan hệ anh chị em ruột với người dự tuyển."}, {"tinh_huong": "Cô D vòng 2 đạt đúng 50 điểm và nằm trong chỉ tiêu.", "ket_luan": "→ Đủ điều kiện: Điều 14, từ 50 điểm trở lên; nếu không trúng thì không bảo lưu kết quả."}], "nho": ["Bậc thang ưu tiên 7,5 - 5 - 2,5 - 1,5 chia dần xuống.", "Hội đồng lẻ: 05 hoặc 07, không có số chẵn nên ít khi ngang phiếu; nếu ngang thì nghe Chủ tịch.", "Vấn đáp: 30 nói, 15 chuẩn bị - 'chuẩn bị bằng nửa thời gian nói'."]}, {"id": "L5-3", "ten": "Thi tuyển viên chức: hai vòng thi và xác định trúng tuyển", "tomtat": ["Điều 11: thi tuyển gồm **02 vòng**.", "Vòng 1 (khoản 1 điểm a): kiến thức chung, **trắc nghiệm trên máy tính, 60 câu, 60 phút**.", "Vòng 1 (điểm b): ngoại ngữ theo thông báo tuyển dụng, trắc nghiệm máy tính, **số câu do Hội đồng quyết định**, thời gian **tối đa 60 phút**; có văn bằng/chứng chỉ được xác định đáp ứng thì **miễn**.", "Vòng 1 (điểm c): trả lời đúng **từ 50% số câu trở lên của TỪNG phần** thì được dự vòng 2.", "Vòng 2 (khoản 2): thi **môn nghiệp vụ chuyên ngành**; chọn **1 trong 2** hình thức: **thực hành**; hoặc **kết hợp viết và phỏng vấn**.", "Vòng 2 (điểm c): thi viết **180 phút** (không kể chép đề); thi viết trên máy tính 60–120 câu trắc nghiệm, 90–180 phút; phỏng vấn **tối đa 30 phút** (chuẩn bị **không quá 15 phút**).", "Vòng 2 (điểm d): thang điểm **100** cho thực hành, viết, phỏng vấn; kết hợp viết + phỏng vấn quy đổi thang 100 theo tỷ lệ **viết 70%, phỏng vấn 30%** (làm tròn 02 chữ số thập phân).", "Điều 11 khoản 3: yêu cầu đặc thù cao hơn phải ghi trong **Kế hoạch và Thông báo tuyển dụng**.", "Điều 12 khoản 1: trúng tuyển khi điểm nghiệp vụ **từ 50 điểm trở lên** (kết hợp viết + phỏng vấn: dự đủ 2 bài, mỗi bài từ **50% điểm tối đa**) và điểm nghiệp vụ + ưu tiên cao hơn, lấy từ cao xuống thấp trong chỉ tiêu từng vị trí.", "Điều 12 khoản 2: bằng điểm ở chỉ tiêu cuối: điểm nghiệp vụ cao hơn, rồi điểm bài viết vòng 2 cao hơn, vẫn bằng thì **người đứng đầu quyết định**.", "Điều 12 khoản 4: không trúng tuyển thì **không được bảo lưu** kết quả."], "bay": ["⚠ Vòng 1 (kiến thức chung, ngoại ngữ) ≠ vòng 2 (nghiệp vụ chuyên ngành); '**từng** phần' ≠ 'tổng'.", "⚠ Vòng 2: '**hoặc**' (thực hành hoặc viết+phỏng vấn), không phải bắt buộc cả ba.", "⚠ Viết **70%**, phỏng vấn **30%**; phỏng vấn tối đa **30 phút**, chuẩn bị **15 phút** (dễ đảo).", "⚠ 'từ 50 điểm **trở lên**' (gồm 50) ≠ 'trên 50'; thi viết 180 phút '**không kể** chép đề'."], "cauhoi": [{"t": "s", "q": "Thi tuyển viên chức theo Điều 11 Nghị định 259/2026/NĐ-CP gồm mấy vòng?", "o": ["01 vòng", "04 vòng", "02 vòng", "03 vòng"], "a": [2], "e": "Thi tuyển gồm vòng 1 (kiến thức chung, ngoại ngữ) và vòng 2 (nghiệp vụ chuyên ngành).", "r": "Nghị định 259/2026/NĐ-CP Điều 11"}, {"t": "s", "q": "Phần thi kiến thức chung ở vòng 1 có bao nhiêu câu trắc nghiệm trên máy tính?", "o": ["60 câu", "50 câu", "120 câu", "100 câu"], "a": [0], "e": "Kiến thức chung: 60 câu, 60 phút. Các số 60–120 là câu hỏi của thi viết trên máy tính ở vòng 2, nên dễ nhầm.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1 điểm a"}, {"t": "s", "q": "Phát biểu nào đúng về phần thi ngoại ngữ ở vòng 1?", "o": ["Thi viết trên giấy, 60 câu, 60 phút", "Trắc nghiệm trên máy tính, đúng 60 câu, thời gian 90 phút", "Phỏng vấn trực tiếp tối đa 30 phút", "Trắc nghiệm trên máy tính, số câu do Hội đồng quyết định, thời gian tối đa 60 phút"], "a": [3], "e": "Điểm b khoản 1: ngoại ngữ theo thông báo tuyển dụng, trắc nghiệm máy tính, số câu do Hội đồng quyết định, tối đa 60 phút (không phải số câu cố định 60).", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1 điểm b"}, {"t": "s", "q": "Điều kiện để người dự tuyển được dự thi vòng 2 là gì?", "o": ["Chỉ cần đạt từ 50% ở phần kiến thức chung", "Trả lời đúng từ 50% số câu trở lên của từng phần thi vòng 1", "Trả lời đúng trên 50% tổng số câu của cả hai phần", "Trả lời đúng từ 60% số câu của từng phần thi"], "a": [1], "e": "Điểm c khoản 1: từ 50% trở lên của TỪNG phần. Bẫy: 'tổng' thay 'từng', 'trên' thay 'từ...trở lên'.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1 điểm c"}, {"t": "s", "q": "Người dự tuyển được miễn thi ngoại ngữ ở vòng 1 trong trường hợp nào?", "o": ["Đã từng thi đạt vòng 1 ở kỳ tuyển dụng trước", "Có tuổi đời trên 40", "Có văn bằng hoặc chứng chỉ được xác định đáp ứng yêu cầu ngoại ngữ", "Được người đứng đầu đơn vị đồng ý bằng văn bản vì thiếu người"], "a": [2], "e": "Điểm b khoản 1: có văn bằng/chứng chỉ được xác định đáp ứng thì miễn. Không bảo lưu kết quả kỳ trước (Điều 12 khoản 4).", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1 điểm b"}, {"t": "s", "q": "Hình thức thi vòng 2 môn nghiệp vụ chuyên ngành là gì?", "o": ["Chọn một trong hai: thực hành; hoặc kết hợp viết và phỏng vấn", "Bắt buộc cả viết, phỏng vấn và thực hành", "Chọn một trong hai: thực hành; hoặc trắc nghiệm trên máy tính kiến thức chung", "Chỉ thi viết"], "a": [0], "e": "Khoản 2 điểm a: chọn 1 trong 2 hình thức. Bẫy: 'và' (bắt buộc cả ba) thay cho 'hoặc'.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm a"}, {"t": "s", "q": "Thời gian thi viết môn nghiệp vụ chuyên ngành ở vòng 2 là bao nhiêu?", "o": ["120 phút, không kể thời gian chép đề", "180 phút, kể cả thời gian chép đề", "90 phút, không kể thời gian chép đề", "180 phút, không kể thời gian chép đề"], "a": [3], "e": "Thi viết 180 phút không kể chép đề. Thi viết trên máy tính là 60–120 câu trắc nghiệm, 90–180 phút.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm c"}, {"t": "s", "q": "Phát biểu nào đúng về phỏng vấn ở vòng 2?", "o": ["Thời gian phỏng vấn tối thiểu 30 phút, chuẩn bị không quá 15 phút", "Thời gian phỏng vấn tối đa 30 phút, thời gian chuẩn bị không quá 15 phút", "Thời gian phỏng vấn tối đa 15 phút, thời gian chuẩn bị không quá 30 phút", "Thời gian phỏng vấn tối đa 60 phút, không có thời gian chuẩn bị"], "a": [1], "e": "Phỏng vấn tối đa 30 phút, chuẩn bị không quá 15 phút; bẫy đảo hai con số hoặc đổi 'tối đa' thành 'tối thiểu'.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm c"}, {"t": "s", "q": "Khi kết hợp thi viết và phỏng vấn ở vòng 2, kết quả được quy đổi theo thang 100 với tỷ lệ nào?", "o": ["Viết 30%, phỏng vấn 70%", "Viết 50%, phỏng vấn 50%", "Viết 70%, phỏng vấn 30%", "Viết 60%, phỏng vấn 40%"], "a": [2], "e": "Điểm d khoản 2: viết 70%, phỏng vấn 30%, làm tròn 02 chữ số thập phân.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm d"}, {"t": "s", "q": "Khi bằng điểm ở chỉ tiêu cuối cùng, người nào được ưu tiên trúng tuyển trước tiên theo Điều 12?", "o": ["Người có điểm thi nghiệp vụ chuyên ngành cao hơn", "Người có điểm ưu tiên cao hơn", "Người có điểm vòng 1 cao hơn", "Người nhiều tuổi hơn"], "a": [0], "e": "Khoản 2: ưu tiên điểm nghiệp vụ chuyên ngành cao hơn; sau đó điểm bài viết vòng 2 cao hơn (nếu kết hợp viết + phỏng vấn); vẫn bằng thì người đứng đầu quyết định.", "r": "Nghị định 259/2026/NĐ-CP Điều 12 khoản 2"}, {"t": "s", "q": "Người không trúng tuyển trong kỳ thi tuyển viên chức thì kết quả thi được xử lý thế nào?", "o": ["Được bảo lưu 01 năm", "Được bảo lưu sang kỳ tuyển dụng kế tiếp tại cùng đơn vị", "Được bảo lưu nếu điểm từ 50 trở lên", "Không được bảo lưu kết quả"], "a": [3], "e": "Khoản 4 Điều 12: không trúng tuyển không được bảo lưu kết quả.", "r": "Nghị định 259/2026/NĐ-CP Điều 12 khoản 4"}, {"t": "m", "q": "Vòng 1 thi tuyển gồm các nội dung nào (chọn tất cả đáp án đúng)", "o": ["Phỏng vấn", "Thực hành", "Nghiệp vụ chuyên ngành", "Kiến thức chung (trắc nghiệm trên máy tính)", "Ngoại ngữ (trắc nghiệm trên máy tính)"], "a": [3, 4], "e": "Vòng 1 gồm kiến thức chung và ngoại ngữ; nghiệp vụ chuyên ngành (thực hành hoặc viết + phỏng vấn) là vòng 2.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1, 2"}, {"t": "m", "q": "Điều kiện trúng tuyển thi tuyển theo Điều 12 gồm (chọn tất cả đáp án đúng)", "o": ["Chỉ cần tổng điểm viết và phỏng vấn đạt 50, dù có bài dưới 50% điểm tối đa", "Điểm nghiệp vụ cộng điểm ưu tiên (nếu có) cao hơn, lấy từ cao xuống thấp trong chỉ tiêu từng vị trí", "Điểm thi nghiệp vụ chuyên ngành từ 50 điểm trở lên", "Nếu kết hợp viết và phỏng vấn thì phải dự đủ 2 bài, mỗi bài từ 50% điểm tối đa", "Điểm vòng 1 cao nhất trong chỉ tiêu"], "a": [1, 2, 3], "e": "Điểm a, b khoản 1. Bẫy: bài nào cũng phải từ 50% điểm tối đa, không chỉ tổng.", "r": "Nghị định 259/2026/NĐ-CP Điều 12 khoản 1"}, {"t": "m", "q": "Phát biểu đúng về vòng 2 thi tuyển (chọn tất cả đáp án đúng)", "o": ["Phỏng vấn chuẩn bị không quá 30 phút", "Thi viết 150 phút không kể chép đề", "Phỏng vấn tối đa 30 phút, chuẩn bị không quá 15 phút", "Thực hành chấm theo thang 100 điểm", "Thi viết và phỏng vấn đều chấm theo thang 100 điểm"], "a": [2, 3, 4], "e": "Thang điểm 100 cho thực hành, viết, phỏng vấn; viết là 180 phút, chuẩn bị phỏng vấn là 15 phút.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2"}, {"t": "m", "q": "Về yêu cầu đặc thù cao hơn của vị trí việc làm, thông tin phải được ghi trong (chọn tất cả đáp án đúng)", "o": ["Phiếu đăng ký dự tuyển của thí sinh", "Kế hoạch tuyển dụng", "Hợp đồng làm việc", "Quyết định công nhận trúng tuyển", "Thông báo tuyển dụng"], "a": [1, 4], "e": "Khoản 3 Điều 11: yêu cầu đặc thù cao hơn phải ghi trong Kế hoạch và Thông báo tuyển dụng.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 3"}, {"t": "m", "q": "Khi bằng điểm ở chỉ tiêu cuối cùng, thứ tự xử lý đúng là (chọn tất cả đáp án đúng)", "o": ["Vẫn bằng điểm thì người đứng đầu quyết định", "Ưu tiên người nhiều tuổi hơn", "Ưu tiên người có điểm thi nghiệp vụ chuyên ngành cao hơn", "Sau đó ưu tiên người có điểm bài viết vòng 2 cao hơn (nếu kết hợp viết và phỏng vấn)", "Ưu tiên người có điểm vòng 1 cao hơn"], "a": [0, 2, 3], "e": "Khoản 2 Điều 12 nêu ba bước đầu; điểm vòng 1 hay tuổi không phải tiêu chí.", "r": "Nghị định 259/2026/NĐ-CP Điều 12 khoản 2"}, {"t": "f", "q": "Phần thi kiến thức chung ở vòng 1 gồm ____ câu trắc nghiệm trên máy tính, thời gian ____ phút.", "a": [["60", "sáu mươi"], ["60", "sáu mươi"]], "e": "60 câu, 60 phút.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1 điểm a", "o": [["60", "90"], ["60", "60"], ["50", "60"], ["50", "90"]], "k": 1}, {"t": "f", "q": "Trả lời đúng từ ____% số câu trở lên của từng phần thi vòng 1 thì được dự thi vòng 2.", "a": [["50", "năm mươi"]], "e": "Từ 50% của từng phần.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 1 điểm c", "o": [["60"], ["50"], ["70"], ["80"]], "k": 1}, {"t": "f", "q": "Vòng 2 chọn một trong hai hình thức: thực hành; hoặc kết hợp ____ và ____.", "a": [["viết"], ["phỏng vấn"]], "e": "Khoản 2 điểm a.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm a", "o": [["viết", "phỏng vấn"], ["viết", "thực hành"], ["trắc nghiệm", "phỏng vấn"], ["thực hành", "phỏng vấn"]], "k": 0}, {"t": "f", "q": "Thi viết ở vòng 2 có thời gian ____ phút, không kể thời gian chép đề.", "a": [["180", "một trăm tám mươi"]], "e": "180 phút.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm c", "o": [["120"], ["180"], ["90"], ["150"]], "k": 1}, {"t": "f", "q": "Khi kết hợp viết và phỏng vấn, điểm được quy đổi thang 100 theo tỷ lệ viết ____%, phỏng vấn ____%.", "a": [["70", "bảy mươi"], ["30", "ba mươi"]], "e": "Viết 70%, phỏng vấn 30%.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm d", "o": [["50", "50"], ["60", "40"], ["70", "30"], ["40", "60"]], "k": 2}, {"t": "f", "q": "Phỏng vấn tối đa ____ phút, thời gian chuẩn bị không quá ____ phút.", "a": [["30", "ba mươi"], ["15", "mười lăm"]], "e": "Phỏng vấn tối đa 30 phút, chuẩn bị không quá 15 phút.", "r": "Nghị định 259/2026/NĐ-CP Điều 11 khoản 2 điểm c", "o": [["45", "15"], ["30", "30"], ["30", "15"], ["45", "30"]], "k": 2}, {"t": "f", "q": "Người không trúng tuyển thi tuyển không được ____ kết quả thi.", "a": [["bảo lưu"]], "e": "Khoản 4 Điều 12.", "r": "Nghị định 259/2026/NĐ-CP Điều 12 khoản 4", "o": [["phúc khảo"], ["công nhận"], ["thay đổi"], ["bảo lưu"]], "k": 3}], "ynho": ["Thi tuyển viên chức có **02 vòng**.", "Vòng 1: kiến thức chung **60 câu, 60 phút**; đúng từ **50% từng phần** vào vòng 2.", "Vòng 2: **một trong hai** hình thức: thực hành hoặc viết + phỏng vấn.", "Viết **70%**, phỏng vấn **30%** (thang 100).", "Trúng tuyển: từ **50 điểm trở lên**, **không bảo lưu**."], "bang": [{"tieu_de": "Hai vòng thi", "cot": ["Nội dung", "Vòng 1", "Vòng 2"], "dong": [["Môn", "Kiến thức chung; ngoại ngữ", "Nghiệp vụ chuyên ngành"], ["Hình thức", "Trắc nghiệm máy tính", "Thực hành, hoặc viết + phỏng vấn"], ["Thời gian", "Kiến thức chung 60 phút; ngoại ngữ tối đa 60 phút", "Viết 180 phút; phỏng vấn tối đa 30 phút (chuẩn bị 15 phút)"], ["Điều kiện/điểm", "Đúng từ 50% từng phần", "Thang điểm 100"]]}, {"tieu_de": "Tỷ lệ kết hợp", "cot": ["Bài thi", "Tỷ lệ"], "dong": [["Viết", "70%"], ["Phỏng vấn", "30%"], ["Làm tròn", "02 chữ số thập phân"]]}], "vidu": [{"tinh_huong": "Thí sinh A đạt 60% số câu kiến thức chung nhưng 45% số câu ngoại ngữ.", "ket_luan": "→ Không được vào vòng 2: phải đúng từ 50% số câu của từng phần."}, {"tinh_huong": "Hội đồng bắt thí sinh B thi cả thực hành lẫn thi viết lẫn phỏng vấn.", "ket_luan": "→ Sai: Điều 11 khoản 2, chọn một trong hai hình thức: thực hành hoặc kết hợp viết và phỏng vấn."}, {"tinh_huong": "Thí sinh C thi viết đạt 80, phỏng vấn đạt 60.", "ket_luan": "→ Điểm nghiệp vụ = 80x70% + 60x30% = 74 điểm."}, {"tinh_huong": "Thí sinh D có điểm nghiệp vụ đúng 50 điểm, trong chỉ tiêu.", "ket_luan": "→ Đủ điều kiện: Điều 12 khoản 1, từ 50 điểm trở lên."}, {"tinh_huong": "Thí sinh E không trúng tuyển, xin bảo lưu kết quả cho kỳ sau.", "ket_luan": "→ Không được: Điều 12 khoản 4, không bảo lưu kết quả."}], "nho": ["Vòng 1 'chung' (kiến thức, ngoại ngữ), vòng 2 'riêng' (nghiệp vụ chuyên ngành).", "Viết 7 - phỏng vấn 3: bài viết 'nặng' hơn.", "Viết 180 (không kể chép đề); phỏng vấn 30 + chuẩn bị 15."]}, {"id": "L5-4", "ten": "Xếp lương, quy trình sau thi, hợp đồng làm việc và bố trí vị trí việc làm", "tomtat": ["Điều 10 khoản 1: tuyển vào bậc nghề nghiệp nào thì xếp mức lương **khởi điểm** của bậc đó.", "Điều 10 khoản 2: người có thời gian công tác phù hợp chuyên môn, có đóng **bảo hiểm xã hội bắt buộc** thì **người đứng đầu** quyết định xếp bậc lương phù hợp.", "Điều 10 khoản 4: **Bộ Nội vụ** hướng dẫn việc xếp lương.", "Điều 19: Hội đồng báo cáo trong **05 ngày làm việc** kể từ chấm xong vòng 2 (kể cả phúc khảo); người đứng đầu phê duyệt trong **05 ngày làm việc**; công khai danh sách trúng tuyển chậm nhất **02 ngày làm việc** kể từ khi có quyết định phê duyệt.", "Điều 20 khoản 1: hoàn thiện hồ sơ chậm nhất **15 ngày** kể từ ngày công khai danh sách (bản sao văn bằng, chứng chỉ **không gồm** chứng chỉ tin học, ngoại ngữ; giấy tờ ưu tiên).", "Điều 20 khoản 3: không hoàn thiện hồ sơ, gian lận kê khai, dùng văn bằng sai quy định, hoặc không đến nhận việc đúng thỏa thuận thì **đương nhiên bị xóa tên**; gian lận kê khai/văn bằng sai thì không được tiếp nhận Phiếu đăng ký trong **01 kỳ** tuyển dụng tiếp theo.", "Điều 21: trong **03 ngày làm việc** từ khi hoàn thiện hồ sơ gửi kết quả đến đơn vị sử dụng; chậm nhất **05 ngày làm việc** ký hợp đồng làm việc; hợp đồng làm việc **có giá trị như quyết định tuyển dụng**.", "Điều 22: hợp đồng làm việc **xác định thời hạn** (theo pháp luật lao động) và **không xác định thời hạn**.", "Điều 23 khoản 2: viên chức tuyển từ 01/7/2020 đến 01/7/2026 đã ký hợp đồng xác định thời hạn **từ 02 lần trở lên** thì sau hợp đồng lần 2 được ký hợp đồng không xác định thời hạn **nếu đáp ứng yêu cầu vị trí và đơn vị còn nhu cầu**.", "Điều 23 khoản 4: chuyển đơn vị sự nghiệp khác được cấp có thẩm quyền đồng ý thì **không tuyển dụng mới, không giải quyết thôi việc**, ký hợp đồng làm việc mới.", "Điều 24, 25: bố trí vào bậc nghề nghiệp phù hợp năng lực, trình độ, kinh nghiệm; thay đổi bậc nghề nghiệp là xếp vào bậc **cao hơn hoặc thấp hơn trong cùng vị trí việc làm**."], "bay": ["⚠ Lương **khởi điểm** của bậc, không phải bậc cao nhất; BHXH **bắt buộc**, không phải tự nguyện.", "⚠ Các mốc thời gian: **05 ngày làm việc** (báo cáo, phê duyệt, ký hợp đồng) / **02 ngày làm việc** (công khai) / **03 ngày làm việc** (gửi kết quả) / **15 ngày** (hoàn thiện hồ sơ).", "⚠ Hợp đồng làm việc **có giá trị như quyết định tuyển dụng**; ký hợp đồng không xác định thời hạn là '**được ký nếu đáp ứng**', không phải 'đương nhiên'.", "⚠ Hồ sơ hoàn thiện **không gồm** chứng chỉ tin học, ngoại ngữ; gian lận chỉ bị chặn **01 kỳ** tiếp theo."], "cauhoi": [{"t": "s", "q": "Theo khoản 1 Điều 10, người được tuyển vào vị trí ở một bậc nghề nghiệp thì được xếp mức lương nào?", "o": ["Mức lương của bậc thấp hơn liền kề", "Mức lương cao nhất của bậc nghề nghiệp đó", "Mức lương khởi điểm của bậc nghề nghiệp đó", "Mức lương bậc 2 của bậc nghề nghiệp đó"], "a": [2], "e": "Khoản 1: xếp mức lương khởi điểm của bậc nghề nghiệp ở vị trí được tuyển.", "r": "Nghị định 259/2026/NĐ-CP Điều 10 khoản 1"}, {"t": "s", "q": "Phát biểu nào đúng về xếp lương theo khoản 2 Điều 10 đối với người có thời gian công tác trước đây?", "o": ["Thời gian công tác phù hợp yêu cầu chuyên môn, có đóng bảo hiểm xã hội bắt buộc thì người đứng đầu quyết định xếp bậc lương phù hợp", "Cơ quan cấp trên bắt buộc xếp mức lương cao nhất của bậc", "Mọi thời gian công tác trước đây đều được tính, kể cả không đóng bảo hiểm xã hội", "Chỉ tính thời gian đóng bảo hiểm xã hội tự nguyện"], "a": [0], "e": "Khoản 2: thời gian công tác đúng quy định, phù hợp chuyên môn, có đóng BHXH bắt buộc. Bẫy: 'tự nguyện' thay 'bắt buộc'.", "r": "Nghị định 259/2026/NĐ-CP Điều 10 khoản 2"}, {"t": "s", "q": "Cơ quan nào hướng dẫn việc xếp lương đối với viên chức theo khoản 4 Điều 10?", "o": ["Bộ Giáo dục và Đào tạo", "Bộ Tài chính", "Chính phủ", "Bộ Nội vụ"], "a": [3], "e": "Khoản 4 Điều 10: Bộ Nội vụ hướng dẫn việc xếp lương.", "r": "Nghị định 259/2026/NĐ-CP Điều 10 khoản 4"}, {"t": "s", "q": "Hội đồng tuyển dụng tổng hợp và báo cáo kết quả trong thời hạn nào kể từ khi chấm xong vòng 2 (kể cả phúc khảo)?", "o": ["03 ngày làm việc", "05 ngày làm việc", "10 ngày làm việc", "05 ngày (không phải ngày làm việc)"], "a": [1], "e": "Điều 19: 05 ngày dow.LAWS.push({"id": "L6", "ten": "Nghị quyết 248/2025/QH15 về cơ chế, chính sách đặc thù, vượt trội để thực hiện đột phá phát triển giáo dục và đào tạo", "so": "Nghị quyết số 248/2025/QH15", "hieuluc": "01/01/2026", "mota": "Nghị quyết do Quốc hội khóa XV thông qua ngày 10/12/2025 gồm 9 điều, quy định cơ chế tuyển dụng, đãi ngộ nhân lực, sách giáo khoa, chuyển đổi số, hỗ trợ người học, ưu đãi đầu tư và xử lý chuyển tiếp khi hội đồng trường công lập chấm dứt.", "baihoc": [{"id": "L6-1", "ten": "Phạm vi và phát triển nguồn nhân lực ngành giáo dục (Điều 1-2)", "tomtat": ["Nghị quyết **248/2025/QH15** của Quốc hội quy định một số cơ chế, chính sách **đặc thù, vượt trội** để đột phá phát triển giáo dục và đào tạo; được Quốc hội thông qua ngày **10/12/2025**, hiệu lực **01/01/2026**.", "Áp dụng đối với **cơ sở giáo dục thuộc hệ thống giáo dục quốc dân**, tổ chức và cá nhân có liên quan (Điều 1 khoản 2).", "**Giám đốc Sở Giáo dục và Đào tạo** có thẩm quyền **tuyển dụng, tiếp nhận** nhà giáo, cán bộ quản lý, nhân viên trong cơ sở giáo dục công lập trên địa bàn tỉnh (Điều 2 khoản 1 điểm a).", "Cơ sở giáo dục công lập gồm: **mầm non, phổ thông, thường xuyên, trường chuyên biệt và trường trung học nghề** công lập (Điều 2 khoản 1 điểm a).", "Giám đốc Sở còn điều động, thuyên chuyển, biệt phái, bổ nhiệm, thay đổi vị trí việc làm đối với người thuộc thẩm quyền quản lý và cơ sở liên quan từ **02 đơn vị hành chính cấp xã trở lên** (Điều 2 khoản 1 điểm a).", "**Chủ tịch Ủy ban nhân dân cấp xã** có thẩm quyền điều động, thuyên chuyển, biệt phái, bổ nhiệm, **miễn nhiệm**, thay đổi vị trí việc làm đối với người thuộc thẩm quyền quản lý (Điều 2 khoản 1 điểm b).", "Cơ sở **giáo dục nghề nghiệp, giáo dục đại học** được tự chủ xác định vị trí việc làm, tuyển dụng, ký hợp đồng lao động với chuyên gia, nhà khoa học trình độ tiến sĩ là người nước ngoài, người Việt Nam định cư ở nước ngoài (Điều 2 khoản 1 điểm c).", "Cơ sở GDNN, đại học tự chịu trách nhiệm xác nhận đối tượng **miễn giấy phép lao động** trong thời hạn **không quá 03 năm** (Điều 2 khoản 1 điểm c).", "**Phụ cấp ưu đãi nghề** theo lộ trình do **Chính phủ** quy định, với cơ sở **mầm non, phổ thông công lập**: tối thiểu **70%** giáo viên, tối thiểu **30%** nhân viên, **100%** giáo viên ở biên giới, hải đảo, vùng đồng bào dân tộc thiểu số và miền núi, vùng kinh tế - xã hội đặc biệt khó khăn (Điều 2 khoản 2 điểm a).", "Cơ sở **GDNN, đại học** tự chủ quyết định **thu nhập tăng thêm** từ nguồn thu hợp pháp **ngoài ngân sách nhà nước cấp** được để lại (Điều 2 khoản 2 điểm b)."], "bay": ["⚠ 'Giám đốc Sở' (tuyển dụng, tiếp nhận) ≠ 'Chủ tịch UBND cấp xã' (điều động, bổ nhiệm, miễn nhiệm...).", "⚠ 70% (giáo viên) ≠ 30% (nhân viên) ≠ 100% (giáo viên vùng đặc biệt); mức này là 'tối thiểu'.", "⚠ 'không quá 03 năm' ≠ 'tối thiểu 03 năm' (miễn giấy phép lao động).", "⚠ Phụ cấp ưu đãi nghề: mầm non, phổ thông công lập; tự chủ thu nhập tăng thêm: GDNN, đại học; lộ trình do Chính phủ (không phải Thủ tướng).", "⚠ Cơ sở liên quan từ 02 đơn vị cấp xã trở lên: Giám đốc Sở; trong phạm vi một xã: Chủ tịch UBND cấp xã."], "cauhoi": [{"t": "s", "q": "Theo Nghị quyết 248/2025/QH15, ai có thẩm quyền tuyển dụng, tiếp nhận nhà giáo trong cơ sở giáo dục công lập trên địa bàn tỉnh?", "o": ["Chủ tịch Ủy ban nhân dân cấp xã", "Chủ tịch Ủy ban nhân dân cấp tỉnh", "Giám đốc Sở Giáo dục và Đào tạo", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [2], "e": "Điều 2.1.a giao thẩm quyền tuyển dụng, tiếp nhận cho Giám đốc Sở GDĐT. Bẫy: Chủ tịch UBND cấp xã chỉ có thẩm quyền điều động, thuyên chuyển, biệt phái, bổ nhiệm, miễn nhiệm, thay đổi vị trí việc làm.", "r": "Điều 2 khoản 1 điểm a Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Phát biểu nào sau đây về thẩm quyền của Chủ tịch Ủy ban nhân dân cấp xã là đúng?", "o": ["Có thẩm quyền miễn nhiệm nhà giáo, cán bộ quản lý, nhân viên trong cơ sở giáo dục công lập thuộc thẩm quyền quản lý", "Có thẩm quyền tuyển dụng, tiếp nhận nhà giáo cơ sở giáo dục công lập trên địa bàn tỉnh", "Có thẩm quyền điều động nhà giáo của các cơ sở giáo dục liên quan từ 02 đơn vị hành chính cấp xã trở lên", "Có thẩm quyền quyết định một bộ sách giáo khoa dùng thống nhất toàn quốc"], "a": [0], "e": "Điều 2.1.b: Chủ tịch UBND cấp xã điều động, thuyên chuyển, biệt phái, bổ nhiệm, miễn nhiệm, thay đổi vị trí việc làm đối với người thuộc thẩm quyền quản lý. Tuyển dụng và các việc liên quan từ 02 đơn vị cấp xã trở lên thuộc Giám đốc Sở.", "r": "Điều 2 khoản 1 điểm b Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Việc điều động, thuyên chuyển, biệt phái, bổ nhiệm nhà giáo ở cơ sở giáo dục công lập liên quan đến phạm vi từ 02 đơn vị hành chính cấp xã trở lên trên địa bàn tỉnh thuộc thẩm quyền của ai?", "o": ["Chủ tịch Ủy ban nhân dân cấp xã nơi có nhiều cơ sở nhất", "Chủ tịch Ủy ban nhân dân cấp tỉnh", "Hiệu trưởng cơ sở giáo dục", "Giám đốc Sở Giáo dục và Đào tạo"], "a": [3], "e": "Điều 2.1.a: Giám đốc Sở thực hiện thẩm quyền này đối với cơ sở thuộc thẩm quyền quản lý và cơ sở liên quan từ 02 đơn vị cấp xã trở lên; trong phạm vi 01 xã thì thuộc Chủ tịch UBND cấp xã.", "r": "Điều 2 khoản 1 điểm a Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Mức phụ cấp ưu đãi nghề tối thiểu đối với giáo viên cơ sở giáo dục mầm non, phổ thông công lập (theo lộ trình do Chính phủ quy định) là bao nhiêu?", "o": ["30%", "70%", "50%", "100%"], "a": [1], "e": "Điều 2.2.a: tối thiểu 70% đối với giáo viên; tối thiểu 30% đối với nhân viên; 100% đối với giáo viên ở khu vực đặc biệt. Bẫy: nhầm mức của nhân viên (30%) hoặc mức đặc thù (100%).", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Mức phụ cấp ưu đãi nghề tối thiểu đối với NHÂN VIÊN trong cơ sở giáo dục mầm non, phổ thông công lập theo Nghị quyết 248 là bao nhiêu?", "o": ["70%", "30%", "100%", "20%"], "a": [1], "e": "Điều 2.2.a quy định tối thiểu 30% đối với nhân viên; 70% là mức của giáo viên. Cần chú ý đổi chủ thể.", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Đối tượng nào được hưởng phụ cấp ưu đãi n
