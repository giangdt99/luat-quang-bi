<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn thi viên chức GV THCS – Phần Luật</title>
<style>:root{--blue:#2aa7e0;--dark:#23272d;--green:#16a34a;--red:#dc2626;--amber:#f5b50a;--bg:#f4f6f9;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit;text-decoration:none}
.nav{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}
.nav .in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:22px;padding:0 16px;height:54px}
.nav .logo{font-weight:700;color:var(--blue);font-size:18px;margin-right:auto}
.nav a.l{font-size:14px;opacity:.85}.nav a.l:hover,.nav a.act{opacity:1;color:var(--blue)}
.hero{background:linear-gradient(135deg,#1e293b,#2aa7e0);color:#fff;padding:34px 16px;text-align:center}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.9}
.wrap{max-width:1180px;margin:22px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px}
.card h3{margin:0 0 6px;font-size:17px}
.card .meta{color:var(--mut);font-size:13px;margin-bottom:10px}
.btn{display:inline-block;border:0;border-radius:6px;padding:8px 16px;background:var(--green);color:#fff;font-size:14px;cursor:pointer}
.btn.blue{background:var(--blue)}.btn.gray{background:#9ca3af}.btn.red{background:var(--red)}.btn.amber{background:var(--amber);color:#222}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:12px;border-radius:10px;padding:1px 9px;background:#e0f2fe;color:#0369a1;margin-right:4px}
.bar{height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.crumb{font-size:14px;color:var(--mut);margin-bottom:12px}.crumb a{color:var(--blue)}
.sec{background:#fff;border-radius:10px;padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec h2{margin:0 0 10px;font-size:19px}
.sec ul{margin:0;padding-left:20px}.sec li{margin-bottom:6px}
.bay{background:#fff7ed;border-left:4px solid #fb923c}
.bay h2{color:#c2410c}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs a{padding:6px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:14px}
.tabs a.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.q{background:#fff;border-radius:10px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.q .no{display:inline-block;min-width:30px;height:30px;line-height:30px;text-align:center;border-radius:15px;background:#e0f2fe;color:#0369a1;font-weight:600;margin-right:8px;padding:0 6px}
.q .qt{font-weight:600;margin-bottom:10px}
.tag{font-size:12px;border-radius:4px;padding:1px 7px;margin-left:6px;font-weight:400}
.tag.s{background:#dbeafe;color:#1d4ed8}.tag.m{background:#ede9fe;color:#6d28d9}.tag.f{background:#fef3c7;color:#92400e}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#f9fafb;border-radius:22px;padding:9px 16px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:#eef6fc}
.opt.sel{border-color:var(--blue);background:#e0f2fe}
.opt b{min-width:18px}
.opt.ok{border-color:var(--green);background:#dcfce7}
.opt.bad{border-color:var(--red);background:#fee2e2}
.opt.miss{border-color:var(--green);border-style:dashed}
.fill{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:#f0f9ff;padding:2px 6px;min-width:110px;font:inherit;text-align:center;border-radius:3px}
.fill.ok{border-color:var(--green);background:#dcfce7}.fill.bad{border-color:var(--red);background:#fee2e2}
.fillq{line-height:2.2;font-weight:600;margin-bottom:8px}
.exp{margin-top:10px;padding:10px 14px;border-radius:8px;background:#f1f5f9;font-size:14px}
.exp.ok{background:#f0fdf4}.exp.bad{background:#fef2f2}
.exp .r{color:var(--mut);margin-top:4px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sum{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;box-shadow:0 -2px 8px rgba(0,0,0,.06);margin:0 -16px;z-index:10}
.exam{display:grid;grid-template-columns:1fr 290px;gap:16px}
@media(max-width:860px){.exam{grid-template-columns:1fr}}
.side{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);height:fit-content;position:sticky;top:70px}
.timer{font-size:28px;font-weight:700;color:var(--green);text-align:center}
.timer.low{color:var(--red)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:12px 0}
.pal span{height:32px;line-height:30px;text-align:center;border-radius:16px;border:1px solid #cbd5e1;font-size:13px;cursor:pointer;background:#fff}
.pal .done{background:var(--green);color:#fff;border-color:var(--green)}
.pal .flag{background:var(--amber);border-color:var(--amber)}
.pal .cur{outline:3px solid var(--blue)}
.pal .ok{background:var(--green);color:#fff;border-color:var(--green)}.pal .bad{background:var(--red);color:#fff;border-color:var(--red)}
.leg{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.score{font-size:36px;font-weight:700;text-align:center}
.nvg{display:flex;justify-content:space-between;margin-top:6px}
.empty{padding:30px;text-align:center;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}

.sh{font-size:16px;margin:16px 0 8px;color:#0369a1}
.ynho{background:#fefce8;border:1px solid #fde047;border-radius:8px;padding:10px 16px;margin-bottom:6px}
.ynho ol{margin:6px 0 2px;padding-left:22px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#e0f2fe;text-align:left}
th,td{border:1px solid #cbd5e1;padding:7px 10px;vertical-align:top}
tbody tr:nth-child(even){background:#f8fafc}
.vd{border-left:4px solid #38bdf8;background:#f0f9ff;border-radius:6px;padding:8px 14px;margin-bottom:10px}
.vd .kl{margin-top:4px;color:#166534;font-weight:600}
.nho{background:#f5f3ff;border-left:4px solid #8b5cf6}
</style>
</head>

<footer>Ôn thi viên chức giáo viên THCS – giới hạn 9 văn bản pháp luật. Câu hỏi tự soạn, đối chiếu văn bản gốc khi cần. Tiến độ lưu ngay trên trình duyệt của bạn.</footer>
<script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L1", "ten": "Luật Viên chức 2025", "so": "Luật số 129/2025/QH15", "hieuluc": "01/07/2026", "mota": "Luật Viên chức do Quốc hội khóa XV thông qua ngày 10/12/2025, thay thế Luật Viên chức 2010 (sửa đổi 2019), quy định về viên chức, nghĩa vụ, quyền, tuyển dụng, hợp đồng làm việc, đánh giá, bổ nhiệm và kỷ luật. Gồm 6 chương, 43 điều.", "baihoc": [{"id": "L1-1", "ten": "Tổng quan, khái niệm, nguyên tắc và hiệu lực của Luật", "tomtat": ["Luật Viên chức số **129/2025/QH15** do Quốc hội khóa **XV**, Kỳ họp thứ **10** thông qua ngày **10/12/2025**; có hiệu lực từ ngày **01/7/2026** (Điều 43 khoản 1).", "Luật Viên chức **58/2010/QH12** (sửa đổi bởi Luật 52/2019/QH14) **hết hiệu lực** từ ngày Luật mới có hiệu lực (Điều 43 khoản 2).", "Cấu trúc Luật: **6 chương, 43 điều**.", "**Viên chức** (Điều 1) là **công dân Việt Nam**, được **tuyển dụng theo vị trí việc làm**, làm việc tại **đơn vị sự nghiệp công lập** theo chế độ **hợp đồng làm việc**, hưởng lương từ **quỹ tiền lương của đơn vị sự nghiệp công lập** và từ các nguồn thu hợp pháp khác.", "Điều 2 – nguyên tắc trong **hoạt động nghề nghiệp** (5 khoản): gắn với lĩnh vực của đơn vị; tuân thủ Hiến pháp, pháp luật; đúng quy trình chuyên môn, đạo đức nghề nghiệp, quy tắc ứng xử, **chịu kiểm tra, giám sát của cơ quan có thẩm quyền và Nhân dân**; phục vụ Nhân dân; bảo đảm chất lượng, hiệu quả, tiến độ, không ngừng học tập.", "Điều 3 – nguyên tắc **quản lý viên chức** (5 khoản): sự lãnh đạo của Đảng, quản lý của Nhà nước; quản lý theo **vị trí việc làm** và căn cứ **hợp đồng làm việc**; **phân cấp, phân quyền, tự chủ toàn diện** của đơn vị sự nghiệp gắn với trách nhiệm người đứng đầu; **bình đẳng giới**; ứng dụng khoa học công nghệ, chuyển đổi số; khuyến khích, bảo vệ đổi mới sáng tạo.", "Điều 4 – giải thích từ ngữ (**11 khoản**): **viên chức quản lý** là người được bổ nhiệm giữ chức vụ quản lý **có thời hạn** (khoản 2); còn giải thích vị trí việc làm, điều động, bổ nhiệm, biệt phái, từ chức, miễn nhiệm, tạm đình chỉ công tác.", "Điều 5 – **đơn vị sự nghiệp công lập**: do cơ quan có thẩm quyền thành lập, có **tư cách pháp nhân**, hoạt động **không vì mục tiêu lợi nhuận**, cung cấp **dịch vụ công**.", "Điều 6 – chính sách đội ngũ viên chức: được bồi dưỡng **thường xuyên, định kỳ** (khoản 2); chính sách **liên thông nhân lực công – tư** (khoản 3).", "Điều 43 khoản 3: **chậm nhất 01/7/2027** phải hoàn thành bố trí vào vị trí việc làm và xếp lương tương ứng đối với viên chức tuyển dụng trước 01/7/2026.", "Điều 43 khoản 4: người đang tập sự theo luật cũ, từ ngày Luật có hiệu lực được **xếp lương tương ứng với vị trí việc làm tuyển dụng**; Luật mới **không có điều quy định chế độ tập sự**.", "Điều 43 khoản 5: viên chức tuyển dụng **trước 01/7/2003** được coi như hợp đồng **không xác định thời hạn**; tuyển từ 01/7/2003 đến trước ngày Luật hiệu lực thì **tiếp tục thực hiện hợp đồng đã ký**."], "bay": ["⚠ **01/7/2026** (hiệu lực) ≠ **01/7/2027** (hạn chót hoàn thành bố trí vị trí việc làm, xếp lương) ≠ **01/7/2003** (mốc coi như hợp đồng không xác định thời hạn).", "⚠ Viên chức quản lý được bổ nhiệm giữ chức vụ **có thời hạn** – không phải không thời hạn.", "⚠ Lương từ **quỹ tiền lương của đơn vị sự nghiệp công lập** và nguồn thu hợp pháp khác – không phải \"ngân sách nhà nước trả trực tiếp\"; làm việc theo **hợp đồng làm việc** chứ không phải biên chế.", "⚠ Đơn vị sự nghiệp công lập **không vì mục tiêu lợi nhuận** (khác doanh nghiệp); \"có tư cách pháp nhân\" chứ không phải \"không có\".", "⚠ Luật mới **không còn điều quy định tập sự**: người đang tập sự được xếp lương theo vị trí việc làm, không tiếp tục tập sự."], "cauhoi": [{"t": "s", "q": "Luật Viên chức 2025 (Luật số 129/2025/QH15) có hiệu lực thi hành từ ngày nào?", "o": ["01/7/2026", "01/01/2026", "10/12/2025", "01/7/2027"], "a": [0], "e": "Điều 43 khoản 1: hiệu lực 01/7/2026. 10/12/2025 là ngày thông qua; 01/7/2027 là hạn chót hoàn thành bố trí vị trí việc làm, xếp lương.", "r": "Điều 43 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức làm việc tại đơn vị sự nghiệp công lập theo chế độ nào?", "o": ["Biên chế suốt đời", "Hợp đồng làm việc", "Bổ nhiệm vào ngạch", "Hợp đồng lao động theo Bộ luật Lao động"], "a": [1], "e": "Điều 1: viên chức làm việc theo chế độ hợp đồng làm việc. Hợp đồng lao động (Điều 21) chỉ ký với chuyên gia, nhà khoa học... hoặc vị trí việc làm hỗ trợ, không phải viên chức.", "r": "Điều 1 Luật Viên chức 2025"}, {"t": "s", "q": "Theo Điều 1 Luật Viên chức 2025, viên chức hưởng lương từ nguồn nào?", "o": ["Chỉ từ ngân sách nhà nước cấp trực tiếp cho cá nhân", "Chỉ từ nguồn thu sự nghiệp của đơn vị", "Quỹ tiền lương của cơ quan quản lý đơn vị sự nghiệp công lập", "Quỹ tiền lương của đơn vị sự nghiệp công lập và từ các nguồn thu hợp pháp khác"], "a": [3], "e": "Điều 1: quỹ tiền lương của đơn vị sự nghiệp công lập và từ các nguồn thu hợp pháp khác. Các phương án sai dùng \"chỉ\" hoặc đổi chủ thể thành cơ quan quản lý.", "r": "Điều 1 Luật Viên chức 2025"}, {"t": "s", "q": "Luật Viên chức 2025 có cấu trúc gồm bao nhiêu chương, bao nhiêu điều?", "o": ["5 chương, 43 điều", "6 chương, 42 điều", "7 chương, 45 điều", "6 chương, 43 điều"], "a": [3], "e": "Luật gồm 6 chương và 43 điều. Các phương án sai đổi 1 con số.", "r": "Cấu trúc Luật Viên chức 2025"}, {"t": "s", "q": "Phát biểu nào sau đây đúng về đơn vị sự nghiệp công lập theo Điều 5?", "o": ["Do cơ quan có thẩm quyền thành lập, có tư cách pháp nhân, hoạt động vì mục tiêu lợi nhuận, cung cấp dịch vụ công", "Do cơ quan có thẩm quyền thành lập, có tư cách pháp nhân, hoạt động không vì mục tiêu lợi nhuận, cung cấp dịch vụ công", "Do cơ quan có thẩm quyền thành lập, không có tư cách pháp nhân, hoạt động không vì mục tiêu lợi nhuận", "Do Chính phủ thành lập trong mọi trường hợp, có tư cách pháp nhân, cung cấp dịch vụ công"], "a": [1], "e": "Điều 5 khoản 1: có tư cách pháp nhân và hoạt động KHÔNG vì mục tiêu lợi nhuận; thẩm quyền thành lập thuộc cơ quan có thẩm quyền chứ không chỉ Chính phủ.", "r": "Điều 5 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Chậm nhất đến ngày nào phải hoàn thành việc bố trí vào vị trí việc làm và xếp lương tương ứng đối với viên chức tuyển dụng trước 01/7/2026?", "o": ["01/7/2027", "01/7/2026", "01/01/2027", "01/7/2028"], "a": [0], "e": "Điều 43 khoản 3: chậm nhất 01/7/2027. Bẫy: nhầm với ngày hiệu lực 01/7/2026.", "r": "Điều 43 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Theo Điều 4, viên chức quản lý là người như thế nào?", "o": ["Được bổ nhiệm giữ chức vụ quản lý không thời hạn", "Được bầu giữ chức vụ quản lý trong đơn vị sự nghiệp công lập", "Được bổ nhiệm giữ chức vụ quản lý có thời hạn", "Được điều động giữ chức vụ quản lý trong suốt thời gian công tác"], "a": [2], "e": "Điều 4 khoản 2: bổ nhiệm giữ chức vụ quản lý CÓ THỜI HẠN. Bẫy: \"không thời hạn\", \"bầu\", \"điều động\".", "r": "Điều 4 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Người đang tập sự theo quy định cũ, kể từ ngày Luật Viên chức 2025 có hiệu lực thì được giải quyết như thế nào?", "o": ["Tiếp tục tập sự cho đến hết thời gian tập sự đã ghi trong quyết định tuyển dụng", "Được xếp lương tương ứng với vị trí việc làm tuyển dụng", "Phải thi lại để được bổ nhiệm vào vị trí việc làm", "Chỉ được hưởng lương thử việc cho đến khi ký hợp đồng chính thức"], "a": [1], "e": "Điều 43 khoản 4: xếp lương tương ứng vị trí việc làm tuyển dụng; Luật mới không có điều về tập sự.", "r": "Điều 43 khoản 4 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức tuyển dụng trước ngày 01/7/2003 được coi như thế nào theo Luật Viên chức 2025?", "o": ["Đã ký hợp đồng làm việc xác định thời hạn", "Đã ký hợp đồng làm việc không xác định thời hạn", "Phải ký lại hợp đồng làm việc mới trước 01/7/2026", "Đã ký hợp đồng lao động theo Bộ luật Lao động"], "a": [1], "e": "Điều 43 khoản 5: trước 01/7/2003 coi như hợp đồng không xác định thời hạn; từ 01/7/2003 đến trước ngày Luật hiệu lực thì tiếp tục hợp đồng đã ký.", "r": "Điều 43 khoản 5 Luật Viên chức 2025"}, {"t": "s", "q": "Theo Điều 2 Luật Viên chức 2025, trong hoạt động nghề nghiệp viên chức chịu sự kiểm tra, giám sát của ai?", "o": ["Cơ quan có thẩm quyền và Nhân dân", "Chỉ người đứng đầu đơn vị sự nghiệp công lập", "Chỉ cơ quan quản lý đơn vị sự nghiệp công lập", "Hội đồng nhân dân cùng cấp"], "a": [0], "e": "Điều 2 khoản 3: chịu kiểm tra, giám sát của cơ quan có thẩm quyền VÀ Nhân dân. Bẫy: giới hạn bằng \"chỉ\".", "r": "Điều 2 khoản 3 Luật Viên chức 2025"}, {"t": "m", "q": "Nguyên tắc quản lý viên chức theo Điều 3 Luật Viên chức 2025 gồm (chọn tất cả đáp án đúng)", "o": ["Sự lãnh đạo của Đảng, quản lý của Nhà nước", "Tự chủ một phần của đơn vị sự nghiệp, không gắn với trách nhiệm người đứng đầu", "Phân cấp, phân quyền, tự chủ toàn diện của đơn vị sự nghiệp gắn với trách nhiệm người đứng đầu", "Bảo đảm bình đẳng giới", "Tuyển dụng, sử dụng, quản lý theo vị trí việc làm và căn cứ hợp đồng làm việc"], "a": [0, 2, 3, 4], "e": "Điều 3 nêu 5 nguyên tắc, trong đó tự chủ TOÀN DIỆN gắn với trách nhiệm người đứng đầu. Phương án sai đổi thành tự chủ một phần, bỏ trách nhiệm.", "r": "Điều 3 Luật Viên chức 2025"}, {"t": "m", "q": "Nguyên tắc trong hoạt động nghề nghiệp của viên chức theo Điều 2 gồm (chọn tất cả đáp án đúng)", "o": ["Chỉ chịu sự giám sát của người đứng đầu đơn vị", "Gắn với lĩnh vực hoạt động của đơn vị sự nghiệp công lập", "Chịu sự kiểm tra, giám sát của cơ quan có thẩm quyền và Nhân dân", "Tuân thủ Hiến pháp, pháp luật", "Bảo đảm chất lượng, hiệu quả, tiến độ và không ngừng học tập", "Ưu tiên chỉ tiêu doanh thu của đơn vị"], "a": [1, 2, 3, 4], "e": "Đúng: 4 phương án đầu (Điều 2 khoản 1, 2, 3, 5). Sai: \"chỉ chịu giám sát của người đứng đầu\" (thực tế còn cơ quan có thẩm quyền và Nhân dân), chỉ tiêu doanh thu không phải nguyên tắc.", "r": "Điều 2 Luật Viên chức 2025"}, {"t": "m", "q": "Những quy định chuyển tiếp nào sau đây đúng theo Điều 43 Luật Viên chức 2025? (chọn tất cả đáp án đúng)", "o": ["Viên chức tuyển dụng từ 01/7/2003 phải ký lại hợp đồng làm việc mới trước 01/7/2026", "Người đang tập sự được xếp lương tương ứng với vị trí việc làm tuyển dụng", "Chậm nhất 01/7/2028 phải hoàn thành bố trí vào vị trí việc làm và xếp lương", "Viên chức tuyển dụng từ 01/7/2003 đến trước ngày Luật hiệu lực tiếp tục thực hiện hợp đồng đã ký", "Viên chức tuyển dụng trước 01/7/2003 được coi như hợp đồng không xác định thời hạn"], "a": [1, 3, 4], "e": "Điều 43 khoản 3, 4, 5: mốc hoàn thành là 01/7/2027 (không phải 2028); người tuyển từ 01/7/2003 tiếp tục hợp đồng đã ký chứ không phải ký lại.", "r": "Điều 43 Luật Viên chức 2025"}, {"t": "m", "q": "Theo Điều 1 Luật Viên chức 2025, viên chức có các đặc điểm nào? (chọn tất cả đáp án đúng)", "o": ["Là công dân Việt Nam", "Được bổ nhiệm vào ngạch và hưởng lương từ ngân sách nhà nước cấp trực tiếp", "Làm việc tại đơn vị sự nghiệp công lập", "Làm việc theo chế độ hợp đồng làm việc", "Được tuyển dụng theo vị trí việc làm"], "a": [0, 2, 3, 4], "e": "Điều 1 định nghĩa viên chức theo vị trí việc làm, hợp đồng làm việc, lương từ quỹ tiền lương của đơn vị và nguồn thu hợp pháp. \"Bổ nhiệm vào ngạch\" là cách nói của chế độ cũ.", "r": "Điều 1 Luật Viên chức 2025"}, {"t": "f", "q": "Luật Viên chức 2025 do Quốc hội khóa ____ thông qua tại Kỳ họp thứ ____.", "a": [["xv", "15", "mười lăm"], ["10", "mười"]], "e": "Quốc hội khóa XV, Kỳ họp thứ 10 (ngày 10/12/2025).", "r": "Phần thông tin chung Luật Viên chức 2025", "o": [["xv", "10"], ["xiv", "10"], ["xv", "11"], ["xiii", "9"]], "k": 0}, {"t": "f", "q": "Luật Viên chức 2025 có hiệu lực thi hành từ ngày ____.", "a": [["01/7/2026", "1/7/2026", "01/07/2026", "ngày 01/7/2026"]], "e": "Điều 43 khoản 1: 01/7/2026.", "r": "Điều 43 khoản 1 Luật Viên chức 2025", "o": [["01/01/2026"], ["01/7/2027"], ["01/10/2026"], ["01/7/2026"]], "k": 3}, {"t": "f", "q": "Viên chức là công dân Việt Nam, được tuyển dụng theo ____, làm việc tại đơn vị ____ theo chế độ hợp đồng làm việc.", "a": [["vị trí việc làm"], ["sự nghiệp công lập"]], "e": "Điều 1: tuyển dụng theo vị trí việc làm; làm việc tại đơn vị sự nghiệp công lập.", "r": "Điều 1 Luật Viên chức 2025", "o": [["chức danh nghề nghiệp", "sự nghiệp công lập"], ["vị trí việc làm", "hành chính nhà nước"], ["vị trí việc làm", "sự nghiệp công lập"], ["ngạch công chức", "sự nghiệp ngoài công lập"]], "k": 2}, {"t": "f", "q": "Đơn vị sự nghiệp công lập hoạt động không vì mục tiêu ____ và cung cấp ____.", "a": [["lợi nhuận"], ["dịch vụ công"]], "e": "Điều 5 khoản 1: không vì mục tiêu lợi nhuận, cung cấp dịch vụ công.", "r": "Điều 5 khoản 1 Luật Viên chức 2025", "o": [["thu nhập", "dịch vụ công"], ["lợi nhuận", "dịch vụ công"], ["lợi nhuận", "dịch vụ thương mại"], ["tích lũy", "dịch vụ hành chính công"]], "k": 1}, {"t": "f", "q": "Chậm nhất ngày ____ phải hoàn thành việc bố trí vào ____ và xếp lương tương ứng đối với viên chức tuyển dụng trước ngày 01/7/2026.", "a": [["01/7/2027", "1/7/2027", "01/07/2027"], ["vị trí việc làm"]], "e": "Điều 43 khoản 3: chậm nhất 01/7/2027.", "r": "Điều 43 khoản 3 Luật Viên chức 2025", "o": [["01/7/2026", "vị trí việc làm"], ["01/7/2028", "chức danh nghề nghiệp"], ["01/7/2027", "chức danh nghề nghiệp"], ["01/7/2027", "vị trí việc làm"]], "k": 3}], "ynho": ["Luật Viên chức **129/2025/QH15**, thông qua **10/12/2025**, hiệu lực **01/7/2026**.", "Cấu trúc: **6 chương, 43 điều**.", "Viên chức làm theo **hợp đồng làm việc**, tuyển theo **vị trí việc làm**, ở **đơn vị sự nghiệp công lập**.", "Viên chức quản lý được bổ nhiệm **có thời hạn**.", "Hạn chót bố trí vị trí việc làm, xếp lương: **01/7/2027**; tuyển trước **01/7/2003** = hợp đồng **không xác định thời hạn**."], "bang": [{"tieu_de": "Các mốc thời gian cần phân biệt", "cot": ["Mốc", "Ý nghĩa"], "dong": [["10/12/2025", "Quốc hội thông qua Luật 129/2025/QH15"], ["01/7/2026", "Luật có hiệu lực (Điều 43 khoản 1)"], ["01/7/2027", "Chậm nhất hoàn thành bố trí vị trí việc làm, xếp lương (Điều 43 khoản 3)"], ["01/7/2003", "Tuyển trước mốc này = coi như hợp đồng không xác định thời hạn (Điều 43 khoản 5)"], ["01/7/2003 → trước 01/7/2026", "Tiếp tục thực hiện hợp đồng đã ký"]]}, {"tieu_de": "Điều 2 và Điều 3: hai loại nguyên tắc", "cot": ["Điều", "Nói về", "Điểm nhấn"], "dong": [["Điều 2", "Hoạt động nghề nghiệp (5 khoản)", "Chịu kiểm tra, giám sát của cơ quan có thẩm quyền và Nhân dân"], ["Điều 3", "Quản lý viên chức (5 khoản)", "Phân cấp, phân quyền, tự chủ toàn diện; bình đẳng giới"], ["Điều 4", "Giải thích từ ngữ (11 khoản)", "Viên chức quản lý = bổ nhiệm chức vụ quản lý có thời hạn"], ["Điều 5", "Đơn vị sự nghiệp công lập", "Có tư cách pháp nhân, không vì lợi nhuận, cung cấp dịch vụ công"]]}], "vidu": [{"tinh_huong": "Thầy Nam là giáo viên Tin học, được tuyển vào trường THCS công lập, ký hợp đồng làm việc và hưởng lương từ quỹ tiền lương của đơn vị sự nghiệp công lập cùng nguồn thu hợp pháp khác.", "ket_luan": "→ Đúng, thầy là viên chức theo Điều 1: công dân Việt Nam, tuyển theo vị trí việc làm, làm việc theo hợp đồng làm việc, lương từ quỹ tiền lương của đơn vị."}, {"tinh_huong": "Cô Lan được tuyển dụng vào trường từ năm 2001 (trước 01/7/2003). Cô thắc mắc hợp đồng của mình thuộc loại nào khi Luật mới có hiệu lực.", "ket_luan": "→ Được coi như hợp đồng không xác định thời hạn vì tuyển trước 01/7/2003 (Điều 43 khoản 5)."}, {"tinh_huong": "Cô Hoa tuyển năm 2015, hiện đang làm việc ở trường. Hiệu trưởng hỏi chậm nhất khi nào phải xong việc bố trí vào vị trí việc làm và xếp lương.", "ket_luan": "→ Chậm nhất 01/7/2027 đối với viên chức tuyển dụng trước 01/7/2026 (Điều 43 khoản 3)."}, {"tinh_huong": "Em Mai đang tập sự theo luật cũ thì Luật Viên chức 2025 có hiệu lực. Em hỏi có phải tiếp tục tập sự không.", "ket_luan": "→ Không tiếp tục: từ ngày Luật có hiệu lực, em được xếp lương tương ứng với vị trí việc làm tuyển dụng; Luật mới không có điều quy định chế độ tập sự (Điều 43 khoản 4)."}, {"tinh_huong": "Thầy Phó hiệu trưởng được bổ nhiệm giữ chức vụ quản lý. Có người nói thầy giữ chức vụ này vô thời hạn.", "ket_luan": "→ Sai: viên chức quản lý được bổ nhiệm giữ chức vụ quản lý có thời hạn (Điều 4 khoản 2)."}], "nho": ["Mốc ngày: **26 – 27 – 03**: 01/7/**2026** (hiệu lực), 01/7/**2027** (hạn chót xếp lương), 01/7/**2003** (hợp đồng không xác định thời hạn). Hiệu lực và hạn chót cách nhau đúng 1 năm.", "Viên chức = **4 chữ H–V–L–C**: Hợp đồng làm việc – Vị trí việc làm – Lương từ quỹ đơn vị – Công lập.", "Đơn vị sự nghiệp công lập = **P-K-D**: Pháp nhân – Không vì lợi nhuận – Dịch vụ công.", "Luật cũ 58/2010 (sửa 52/2019) hết hiệu lực; Luật mới **không còn tập sự**."]}, {"id": "L1-2", "ten": "Nghĩa vụ của viên chức và những việc viên chức không được làm", "tomtat": ["Điều 7 – **nghĩa vụ chung** (5 khoản): trung thành với Đảng, Nhà nước, bảo vệ danh dự Tổ quốc; đạo đức trong sáng, mẫu mực; chấp hành đường lối, chính sách, pháp luật; **bảo vệ bí mật nhà nước, giữ gìn tài sản công**; tu dưỡng đạo đức nghề nghiệp, thực hiện quy tắc ứng xử.", "Điều 8 – **nghĩa vụ trong hoạt động nghề nghiệp** (**6 khoản**).", "Điều 8 khoản 1: thực hiện đúng, đầy đủ và **chịu trách nhiệm** về kết quả nhiệm vụ được giao; chủ động nâng cao năng lực; ứng dụng khoa học công nghệ, chuyển đổi số.", "Điều 8 khoản 2: có ý thức tổ chức kỷ luật; chấp hành nội quy, quy chế đơn vị; **báo cáo người có thẩm quyền** khi phát hiện vi phạm pháp luật trong đơn vị.", "Điều 8 khoản 4 – khi phục vụ Nhân dân: thái độ **lịch sự, tôn trọng**; tinh thần **hợp tác, tác phong khiêm tốn**; **không hách dịch, cửa quyền, gây khó khăn, phiền hà**; chấp hành quy định đạo đức nghề nghiệp.", "Điều 8 khoản 5: **chỉ** được ký hợp đồng làm việc với **01** đơn vị sự nghiệp công lập và chịu sự quản lý của đơn vị đó.", "Điều 9 – viên chức quản lý thực hiện Điều 7, Điều 8 và thêm **8 nghĩa vụ bổ sung** (lãnh đạo, kiểm tra đôn đốc, chịu trách nhiệm khi để xảy ra quan liêu, tham nhũng, tiêu cực, lãng phí; xử lý kịp thời viên chức vi phạm...).", "Điều 10 – những việc viên chức **không được làm** gồm **7 khoản**.", "Điều 10 khoản 1: trốn tránh, thoái thác, đùn đẩy chức trách; gây bè phái, mất đoàn kết; **tự ý nghỉ việc, bỏ việc**; **tham gia đình công**; đăng tải, phát tán, phát ngôn **thông tin sai lệch** làm ảnh hưởng hình ảnh, uy tín của **đất nước, địa phương, đơn vị** nơi công tác.", "Điều 10 khoản 2: lợi dụng hoạt động nghề nghiệp để tuyên truyền chống lại chủ trương, đường lối, chính sách của **Đảng**, pháp luật của **Nhà nước** **hoặc** gây phương hại đến thuần phong mỹ tục, đời sống văn hóa tinh thần của Nhân dân và xã hội.", "Điều 10 khoản 3: tham ô, tham nhũng, lãng phí, tiêu cực, trục lợi, nhũng nhiễu...; khoản 4: sử dụng **tài sản công, tài sản của Nhân dân** trái pháp luật.", "Điều 10 khoản 5: **phân biệt đối xử** về dân tộc, giới tính, **độ tuổi, khuyết tật**, tôn giáo, tín ngưỡng, thành phần xã hội dưới mọi hình thức; khoản 6: xúc phạm danh dự, nhân phẩm, uy tín của người khác khi thực hiện hoạt động nghề nghiệp.", "Điều 10 khoản 7: những việc không được làm theo pháp luật về phòng, chống tham nhũng; tiết kiệm, chống lãng phí; doanh nghiệp; bảo vệ bí mật nhà nước và theo quy định khác."], "bay": ["⚠ Số khoản: Điều 7 = **5**, Điều 8 = **6**, Điều 10 = **7**; viên chức quản lý thêm **8** nghĩa vụ bổ sung.", "⚠ \"**chỉ** được ký hợp đồng làm việc với **01** đơn vị\" ≠ \"được ký với nhiều đơn vị\".", "⚠ **báo cáo** người có thẩm quyền khi phát hiện vi phạm (nghĩa vụ) ≠ **từ chối** thực hiện công việc trái pháp luật (quyền, Điều 11).", "⚠ Điều 10 khoản 5 bổ sung phân biệt đối xử về **độ tuổi, khuyết tật**; khoản 1 bổ sung **tự ý bỏ việc, đình công, phát ngôn thông tin sai lệch**.", "⚠ Khoản 2 Điều 10 dùng \"**hoặc**\": chống Đảng/pháp luật HOẶC gây phương hại thuần phong mỹ tục – chỉ cần một trong hai; khoản 4 là tài sản công **và** tài sản của Nhân dân."], "cauhoi": [{"t": "s", "q": "Theo Điều 8 Luật Viên chức 2025, viên chức chỉ được ký hợp đồng làm việc với tối đa bao nhiêu đơn vị sự nghiệp công lập?", "o": ["02 đơn vị", "03 đơn vị", "01 đơn vị", "Không giới hạn nếu làm ngoài giờ"], "a": [2], "e": "Điều 8 khoản 5: chỉ được ký hợp đồng làm việc với 01 đơn vị sự nghiệp công lập và chịu sự quản lý của đơn vị đó.", "r": "Điều 8 khoản 5 Luật Viên chức 2025"}, {"t": "s", "q": "Nghĩa vụ nào sau đây đúng với quy định tại Điều 8 khoản 4 khi viên chức phục vụ Nhân dân?", "o": ["Có tác phong nghiêm nghị, đề cao uy quyền của cơ quan", "Ưu tiên giải quyết trước cho người quen biết", "Chỉ phục vụ khi có yêu cầu bằng văn bản", "Có tinh thần hợp tác, tác phong khiêm tốn"], "a": [3], "e": "Điều 8 khoản 4: hợp tác, khiêm tốn; không hách dịch, cửa quyền. Các phương án sai trái tinh thần phục vụ Nhân dân.", "r": "Điều 8 khoản 4 Luật Viên chức 2025"}, {"t": "s", "q": "Điều 10 Luật Viên chức 2025 quy định những việc viên chức không được làm gồm bao nhiêu khoản?", "o": ["7 khoản", "5 khoản", "6 khoản", "8 khoản"], "a": [0], "e": "Điều 10 có 7 khoản (Điều 7: 5 khoản; Điều 8: 6 khoản).", "r": "Điều 10 Luật Viên chức 2025"}, {"t": "s", "q": "Hành vi nào sau đây là việc viên chức KHÔNG được làm theo Điều 10?", "o": ["Xin nghỉ việc riêng theo quy định của pháp luật lao động", "Báo cáo người có thẩm quyền khi phát hiện vi phạm pháp luật trong đơn vị", "Tự ý nghỉ việc, bỏ việc", "Từ chối thực hiện công việc mà mình cho là trái pháp luật"], "a": [2], "e": "Điều 10 khoản 1 cấm tự ý nghỉ việc, bỏ việc. Các phương án còn lại là quyền (Điều 11 khoản 6, Điều 14) hoặc nghĩa vụ (Điều 8 khoản 2), không bị cấm.", "r": "Điều 10 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Căn cứ nào sau đây KHÔNG nằm trong các căn cứ phân biệt đối xử bị cấm tại Điều 10 khoản 5?", "o": ["Trình độ chuyên môn", "Độ tuổi", "Khuyết tật", "Thành phần xã hội"], "a": [0], "e": "Khoản 5 cấm phân biệt đối xử về dân tộc, giới tính, độ tuổi, khuyết tật, tôn giáo, tín ngưỡng, thành phần xã hội. Bẫy: độ tuổi và khuyết tật là các căn cứ mới được bổ sung.", "r": "Điều 10 khoản 5 Luật Viên chức 2025"}, {"t": "s", "q": "Phát biểu nào đúng về Điều 10 khoản 2?", "o": ["Viên chức chỉ bị cấm tuyên truyền chống lại pháp luật của Nhà nước, không bị cấm đối với chủ trương, đường lối của Đảng", "Viên chức không được lợi dụng hoạt động nghề nghiệp để tuyên truyền chống lại chủ trương, đường lối, chính sách của Đảng, pháp luật của Nhà nước hoặc gây phương hại đến thuần phong mỹ tục, đời sống văn hóa tinh thần của Nhân dân và xã hội", "Viên chức chỉ bị cấm khi hành vi đồng thời chống lại Đảng, Nhà nước và gây phương hại thuần phong mỹ tục", "Viên chức bị cấm lợi dụng hoạt động nghề nghiệp, trừ khi thực hiện ngoài giờ làm việc"], "a": [1], "e": "Khoản 2 cấm cả chống chủ trương, đường lối, chính sách của Đảng và pháp luật của Nhà nước, và liên kết bằng \"hoặc\" chứ không cần đồng thời. Không có ngoại lệ ngoài giờ.", "r": "Điều 10 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Hành vi \"sử dụng tài sản công, tài sản của Nhân dân trái pháp luật\" được quy định tại khoản nào của Điều 10 là đúng nhất, và đối tượng tài sản là gì?", "o": ["Khoản 4 – tài sản công, tài sản của Nhân dân", "Khoản 4 – tài sản công, tài sản của đơn vị sự nghiệp", "Khoản 3 – tài sản công, tài sản của cơ quan quản lý", "Khoản 6 – tài sản của Nhà nước và của người đứng đầu"], "a": [0], "e": "Điều 10 khoản 4: sử dụng tài sản công, tài sản của Nhân dân trái pháp luật. Bẫy: đổi \"Nhân dân\" thành \"đơn vị\", đổi số khoản.", "r": "Điều 10 khoản 4 Luật Viên chức 2025"}, {"t": "s", "q": "Ngoài nghĩa vụ chung (Điều 7) và nghĩa vụ trong hoạt động nghề nghiệp (Điều 8), viên chức quản lý còn phải thực hiện thêm bao nhiêu nghĩa vụ bổ sung theo Điều 9?", "o": ["5 nghĩa vụ", "6 nghĩa vụ", "8 nghĩa vụ", "10 nghĩa vụ"], "a": [2], "e": "Điều 9: thực hiện Điều 7, Điều 8 và 8 nghĩa vụ bổ sung.", "r": "Điều 9 Luật Viên chức 2025"}, {"t": "s", "q": "Khi phát hiện vi phạm pháp luật trong đơn vị, viên chức có nghĩa vụ gì theo Điều 8 khoản 2?", "o": ["Tự xử lý, không cần báo cáo", "Chỉ báo cáo khi được yêu cầu", "Góp ý trực tiếp với người vi phạm và không báo cáo", "Báo cáo người có thẩm quyền"], "a": [3], "e": "Điều 8 khoản 2: báo cáo người có thẩm quyền khi phát hiện vi phạm pháp luật trong đơn vị – là nghĩa vụ.", "r": "Điều 8 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Hành vi \"đăng tải, phát tán, phát ngôn thông tin sai lệch\" bị cấm tại Điều 10 khoản 1 khi làm ảnh hưởng đến hình ảnh, uy tín của đối tượng nào?", "o": ["Đất nước, cơ quan quản lý cấp trên", "Đất nước, địa phương, đơn vị nơi công tác", "Địa phương, đồng nghiệp nơi công tác", "Cá nhân người đứng đầu đơn vị"], "a": [1], "e": "Điều 10 khoản 1: ảnh hưởng hình ảnh, uy tín của đất nước, địa phương, đơn vị nơi công tác.", "r": "Điều 10 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Khi phục vụ Nhân dân, viên chức phải thực hiện các quy định nào theo Điều 8 khoản 4? (chọn tất cả đáp án đúng)", "o": ["Ưu tiên giải quyết trước cho người quen", "Thái độ lịch sự, tôn trọng", "Tinh thần hợp tác, tác phong khiêm tốn", "Không hách dịch, cửa quyền, gây khó khăn, phiền hà", "Chấp hành quy định đạo đức nghề nghiệp"], "a": [1, 2, 3, 4], "e": "Điều 8 khoản 4 có 4 yêu cầu (a–d). Phương án cuối trái tinh thần công bằng, không phải quy định.", "r": "Điều 8 khoản 4 Luật Viên chức 2025"}, {"t": "m", "q": "Hành vi nào sau đây viên chức KHÔNG được làm theo Điều 10 khoản 1? (chọn tất cả đáp án đúng)", "o": ["Từ chối thực hiện công việc mà mình cho là trái pháp luật", "Tự ý nghỉ việc, bỏ việc", "Báo cáo người có thẩm quyền khi phát hiện vi phạm trong đơn vị", "Trốn tránh, thoái thác, đùn đẩy thực hiện chức trách, nhiệm vụ", "Tham gia đình công"], "a": [1, 3, 4], "e": "Hai phương án sai là quyền (Điều 11 khoản 6) và nghĩa vụ (Điều 8 khoản 2), không bị cấm.", "r": "Điều 10 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Nghĩa vụ trong hoạt động nghề nghiệp theo Điều 8 gồm (chọn tất cả đáp án đúng)", "o": ["Được ký đồng thời hợp đồng làm việc với nhiều đơn vị sự nghiệp công lập nếu làm ngoài giờ", "Chủ động nâng cao năng lực, ứng dụng khoa học công nghệ, chuyển đổi số", "Chấp hành nội quy, quy chế của đơn vị", "Chỉ ký hợp đồng làm việc với 01 đơn vị sự nghiệp công lập", "Chủ động, sáng tạo, phối hợp đồng nghiệp, giữ đoàn kết trong đơn vị"], "a": [1, 2, 3, 4], "e": "Điều 8 khoản 1, 2, 3, 5. Phương án sai trái Điều 8 khoản 5 (chỉ 01 đơn vị).", "r": "Điều 8 Luật Viên chức 2025"}, {"t": "m", "q": "Nghĩa vụ chung của viên chức theo Điều 7 gồm (chọn tất cả đáp án đúng)", "o": ["Trung thành với Đảng, Nhà nước, bảo vệ danh dự Tổ quốc", "Có đạo đức trong sáng, mẫu mực", "Bảo vệ bí mật nhà nước, giữ gìn tài sản công", "Tu dưỡng đạo đức nghề nghiệp, thực hiện quy tắc ứng xử", "Ưu tiên lợi ích của đơn vị khi lợi ích đó trái quy định pháp luật"], "a": [0, 1, 2, 3], "e": "Điều 7 có 5 khoản; phương án cuối trái khoản 3 (chấp hành đường lối, chính sách, pháp luật).", "r": "Điều 7 Luật Viên chức 2025"}, {"t": "f", "q": "Viên chức chỉ được ký hợp đồng làm việc với ____ đơn vị sự nghiệp công lập.", "a": [["01", "1", "một"]], "e": "Điều 8 khoản 5.", "r": "Điều 8 khoản 5 Luật Viên chức 2025", "o": [["01"], ["02"], ["03"], ["04"]], "k": 0}, {"t": "f", "q": "Viên chức không được tự ý ____ việc, bỏ việc và không được tham gia ____.", "a": [["nghỉ"], ["đình công"]], "e": "Điều 10 khoản 1 – điểm mới của Luật 2025.", "r": "Điều 10 khoản 1 Luật Viên chức 2025", "o": [["nghỉ", "biểu tình"], ["nghỉ", "đình công"], ["thôi", "đình công"], ["thôi", "khiếu nại tập thể"]], "k": 1}, {"t": "f", "q": "Khi phục vụ Nhân dân, viên chức không hách dịch, ____, gây khó khăn, phiền hà.", "a": [["cửa quyền"]], "e": "Điều 8 khoản 4 điểm c.", "r": "Điều 8 khoản 4 Luật Viên chức 2025", "o": [["quan liêu"], ["lãng phí"], ["cửa quyền"], ["vô cảm"]], "k": 2}, {"t": "f", "q": "Điều 10 quy định những việc viên chức không được làm gồm ____ khoản; Điều 8 quy định nghĩa vụ trong hoạt động nghề nghiệp gồm ____ khoản.", "a": [["7", "bảy"], ["6", "sáu"]], "e": "Điều 10: 7 khoản; Điều 8: 6 khoản (Điều 7: 5 khoản).", "r": "Điều 8, Điều 10 Luật Viên chức 2025", "o": [["6", "7"], ["7", "5"], ["7", "6"], ["5", "6"]], "k": 2}, {"t": "f", "q": "Viên chức không được phân biệt đối xử về dân tộc, giới tính, ____, khuyết tật, tôn giáo, tín ngưỡng, thành phần xã hội dưới mọi hình thức khi thực hiện nhiệm vụ.", "a": [["độ tuổi"]], "e": "Điều 10 khoản 5.", "r": "Điều 10 khoản 5 Luật Viên chức 2025", "o": [["độ tuổi"], ["xuất thân"], ["nơi cư trú"], ["ngoại hình"]], "k": 0}], "ynho": ["Số khoản: Điều 7 = **5**, Điều 8 = **6**, Điều 10 = **7**.", "Viên chức quản lý thêm **8** nghĩa vụ bổ sung (Điều 9).", "**Chỉ** được ký hợp đồng làm việc với **01** đơn vị sự nghiệp công lập.", "Phát hiện vi phạm trong đơn vị: **báo cáo** người có thẩm quyền.", "Không được: **tự ý bỏ việc, đình công**, tung thông tin sai lệch, **phân biệt đối xử** (kể cả độ tuổi, khuyết tật)."], "bang": [{"tieu_de": "Nghĩa vụ và việc không được làm", "cot": ["Điều", "Nội dung", "Số khoản"], "dong": [["Điều 7", "Nghĩa vụ chung (trung thành, đạo đức, bảo vệ bí mật nhà nước, giữ gìn tài sản công)", "5"], ["Điều 8", "Nghĩa vụ trong hoạt động nghề nghiệp", "6"], ["Điều 9", "Viên chức quản lý: Điều 7, 8 và thêm nghĩa vụ bổ sung", "8 nghĩa vụ bổ sung"], ["Điều 10", "Những việc không được làm", "7"]]}, {"tieu_de": "Điều 10: việc không được làm theo từng khoản", "cot": ["Khoản", "Nội dung chính"], "dong": [["1", "Trốn tránh, đùn đẩy; gây bè phái; tự ý bỏ việc; đình công; phát tán thông tin sai lệch"], ["2", "Lợi dụng nghề nghiệp chống Đảng, pháp luật HOẶC gây phương hại thuần phong mỹ tục"], ["3", "Tham ô, tham nhũng, lãng phí, tiêu cực, trục lợi, nhũng nhiễu"], ["4", "Dùng tài sản công, tài sản của Nhân dân trái pháp luật"], ["5", "Phân biệt đối xử: dân tộc, giới tính, độ tuổi, khuyết tật, tôn giáo..."], ["6", "Xúc phạm danh dự, nhân phẩm, uy tín người khác"], ["7", "Các việc khác theo luật phòng chống tham nhũng, doanh nghiệp, bí mật nhà nước..."]]}], "vidu": [{"tinh_huong": "Cô Thu, giáo viên một trường THCS công lập, cùng lúc ký hợp đồng làm việc với trường mình và với một trung tâm giáo dục công lập khác.", "ket_luan": "→ Vi phạm: viên chức chỉ được ký hợp đồng làm việc với 01 đơn vị sự nghiệp công lập (Điều 8 khoản 5)."}, {"tinh_huong": "Thầy Bình phát hiện một đồng nghiệp trong trường làm sai quy định pháp luật nên đã báo cáo với hiệu trưởng.", "ket_luan": "→ Đúng nghĩa vụ: phát hiện vi phạm pháp luật trong đơn vị thì báo cáo người có thẩm quyền (Điều 8 khoản 2)."}, {"tinh_huong": "Cô Hạnh nghỉ dạy không báo cáo vì rủ đồng nghiệp tham gia đình công để phản đối nhà trường.", "ket_luan": "→ Vi phạm: tự ý nghỉ việc, bỏ việc và tham gia đình công là việc không được làm (Điều 10 khoản 1)."}, {"tinh_huong": "Thầy Tuấn đăng lên mạng thông tin sai lệch về trường, làm ảnh hưởng uy tín đơn vị nơi công tác.", "ket_luan": "→ Vi phạm: đăng tải, phát tán thông tin sai lệch làm ảnh hưởng uy tín của đất nước, địa phương, đơn vị nơi công tác (Điều 10 khoản 1)."}, {"tinh_huong": "Cô Vy từ chối nhận hồ sơ của một phụ huynh lớn tuổi vì cho rằng bà có tuổi nên nói chuyện chậm, lại có thái độ cửa quyền, hách dịch.", "ket_luan": "→ Vi phạm: phân biệt đối xử về độ tuổi (Điều 10 khoản 5) và trái thái độ khi phục vụ Nhân dân, không hách dịch, cửa quyền (Điều 8 khoản 4)."}], "nho": ["**5 – 6 – 7**: Điều 7 có 5 khoản, Điều 8 có 6, Điều 10 có 7 (tăng dần theo thứ tự điều).", "**Chỉ 01** = một chủ: viên chức chỉ có một hợp đồng làm việc với một đơn vị sự nghiệp công lập.", "Báo cáo là **nghĩa vụ** (Điều 8), còn từ chối việc trái luật là **quyền** (Điều 11).", "Điều 10 khoản 1 nhớ cụm **\"Bỏ – Đình – Sai\"**: bỏ việc, đình công, thông tin sai lệch."]}, {"id": "L1-3", "ten": "Quyền của viên chức và vị trí việc làm", "tomtat": ["Điều 11 – quyền về hoạt động nghề nghiệp: được pháp luật bảo vệ, đối xử bình đẳng (khoản 1); được đào tạo, bồi dưỡng (khoản 2); **từ chối thực hiện công việc nếu cho rằng trái pháp luật** (khoản 6); **đơn phương chấm dứt hợp đồng làm việc** theo pháp luật (khoản 7).", "Điều 12 – quyền về tiền lương, thưởng: hưởng lương, thưởng theo **kết quả, hiệu quả công việc** theo vị trí việc làm (khoản 1); tiền làm thêm giờ, lương ban đêm, công tác phí (khoản 2); ưu đãi vùng khó khăn, nghề nặng nhọc, độc hại (khoản 3).", "Điều 13 khoản 1: được ký hợp đồng lao động/dịch vụ với nơi khác nếu **pháp luật không cấm**, **không xung đột lợi ích**, **không trái hợp đồng làm việc** (nếu chưa thỏa thuận thì phải được **người đứng đầu đơn vị đồng ý bằng văn bản**).", "Điều 13 khoản 2: được **hành nghề cá nhân** nếu pháp luật không cấm.", "Điều 13 khoản 3: được **góp vốn, tham gia quản lý, điều hành** doanh nghiệp, hợp tác xã, bệnh viện, cơ sở giáo dục, tổ chức khoa học **ngoài công lập**, **trừ** trường hợp pháp luật phòng, chống tham nhũng, doanh nghiệp hoặc ngành, lĩnh vực khác có quy định khác.", "Điều 14 khoản 1 – nghỉ ngơi: nghỉ hằng năm, nghỉ lễ, tết, nghỉ việc riêng theo pháp luật lao động; **không nghỉ hết** thì được **thanh toán tiền**.", "Điều 23 khoản 3 – phân loại vị trí việc làm: (a) **quản lý**; (b) **chuyên môn, nghiệp vụ**; (c) **hỗ trợ**.", "Điều 23 khoản 2 – nội dung vị trí việc làm gồm: **tên gọi**, **bản mô tả công việc** và **khung năng lực**.", "Điều 24 khoản 1: viên chức được chuyển sang vị trí việc làm mới nếu **đủ tiêu chuẩn** (của vị trí mới) **và** đơn vị còn **nhu cầu**."], "bay": ["⚠ Loại vị trí việc làm: quản lý – chuyên môn, nghiệp vụ – **hỗ trợ** (không phải \"phục vụ\", \"lãnh đạo\").", "⚠ Nội dung vị trí việc làm: tên gọi, **bản mô tả công việc**, **khung năng lực** (không phải mức lương, hạng chức danh).", "⚠ Điều 13: hợp đồng với nơi khác chưa có thỏa thuận thì cần **người đứng đầu đơn vị** đồng ý **bằng văn bản**; góp vốn, quản lý doanh nghiệp là được, **trừ** trường hợp luật khác cấm.", "⚠ Lương, thưởng theo **kết quả, hiệu quả công việc theo vị trí việc làm** – không phải theo thâm niên, bằng cấp.", "⚠ Điều 24: chuyển vị trí cần **đủ tiêu chuẩn VÀ đơn vị còn nhu cầu** (cả hai điều kiện)."], "cauhoi": [{"t": "s", "q": "Theo Điều 23 khoản 3 Luật Viên chức 2025, vị trí việc làm được phân loại thành những loại nào?", "o": ["Lãnh đạo; chuyên môn, nghiệp vụ; phục vụ", "Quản lý; chuyên môn, nghiệp vụ; phục vụ", "Lãnh đạo; quản lý; chuyên môn, nghiệp vụ", "Quản lý; chuyên môn, nghiệp vụ; hỗ trợ"], "a": [3], "e": "Điều 23 khoản 3: quản lý; chuyên môn, nghiệp vụ; HỖ TRỢ. Bẫy: \"phục vụ\" thay cho \"hỗ trợ\", \"lãnh đạo\" thay cho \"quản lý\".", "r": "Điều 23 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Nội dung của vị trí việc làm theo Điều 23 khoản 2 gồm những gì?", "o": ["Tên gọi, bản mô tả công việc và mức lương", "Tên gọi, chức danh nghề nghiệp và hạng", "Bản mô tả công việc, khung năng lực và biên chế được giao", "Tên gọi, bản mô tả công việc và khung năng lực"], "a": [3], "e": "Điều 23 khoản 2: tên gọi, bản mô tả công việc, khung năng lực.", "r": "Điều 23 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Nếu hợp đồng làm việc chưa có thỏa thuận về việc ký hợp đồng lao động, hợp đồng dịch vụ với nơi khác thì viên chức phải làm gì để được ký?", "o": ["Chỉ cần thông báo bằng miệng cho người đứng đầu đơn vị", "Được cơ quan quản lý cấp trên đồng ý bằng văn bản", "Được người đứng đầu đơn vị đồng ý bằng văn bản", "Không cần xin ý kiến nếu pháp luật không cấm"], "a": [2], "e": "Điều 13 khoản 1: phải được người đứng đầu đơn vị đồng ý bằng văn bản. Bẫy: \"thông báo miệng\", đổi chủ thể thành cơ quan cấp trên.", "r": "Điều 13 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức không nghỉ hết số ngày nghỉ hằng năm thì được giải quyết như thế nào theo Điều 14 khoản 1?", "o": ["Bị trừ vào số ngày nghỉ của năm sau", "Bảo lưu sang năm sau và không được thanh toán tiền", "Được thanh toán tiền", "Bị coi là tự nguyện từ bỏ quyền nghỉ"], "a": [2], "e": "Điều 14 khoản 1: không nghỉ hết thì được thanh toán tiền.", "r": "Điều 14 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Quyền nào sau đây của viên chức được quy định tại Điều 11?", "o": ["Từ chối thực hiện công việc nếu cho rằng công việc đó trái pháp luật", "Từ chối mọi công việc nằm ngoài bản mô tả vị trí việc làm", "Từ chối thực hiện công việc khi chưa được tăng lương", "Từ chối chịu sự kiểm tra, giám sát của Nhân dân"], "a": [0], "e": "Điều 11 khoản 6. Các phương án sai không có trong Luật (và trái Điều 2 khoản 3).", "r": "Điều 11 khoản 6 Luật Viên chức 2025"}, {"t": "s", "q": "Phát biểu nào đúng về quyền hành nghề cá nhân của viên chức theo Điều 13 khoản 2?", "o": ["Được hành nghề cá nhân nếu pháp luật không cấm", "Không được hành nghề cá nhân trong mọi trường hợp", "Chỉ được hành nghề cá nhân sau khi nghỉ việc", "Được hành nghề cá nhân khi cơ quan quản lý cấp trên đồng ý"], "a": [0], "e": "Điều 13 khoản 2: được hành nghề cá nhân nếu không bị cấm.", "r": "Điều 13 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Phát biểu nào đúng về quyền góp vốn, tham gia quản lý, điều hành tại Điều 13 khoản 3?", "o": ["Tuyệt đối không được tham gia quản lý, điều hành bất kỳ doanh nghiệp nào", "Chỉ được góp vốn, không được tham gia quản lý, điều hành", "Được tham gia quản lý, điều hành cả các cơ sở công lập, không có ngoại lệ", "Được góp vốn, tham gia quản lý, điều hành doanh nghiệp, hợp tác xã, bệnh viện, cơ sở giáo dục, tổ chức khoa học ngoài công lập, trừ trường hợp luật khác có quy định"], "a": [3], "e": "Khoản 3 cho phép nhưng \"trừ\" trường hợp luật chống tham nhũng, doanh nghiệp, luật ngành quy định khác; đối tượng là cơ sở NGOÀI công lập.", "r": "Điều 13 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Theo Điều 24 khoản 1, viên chức được chuyển sang vị trí việc làm mới khi nào?", "o": ["Đủ tiêu chuẩn của vị trí mới và đơn vị còn nhu cầu", "Đủ tiêu chuẩn của vị trí mới hoặc đơn vị còn nhu cầu", "Chỉ cần đơn vị còn nhu cầu", "Chỉ cần viên chức có nguyện vọng"], "a": [0], "e": "Điều 24 khoản 1: cần cả hai điều kiện (\"và\"). Bẫy: đổi \"và\" thành \"hoặc\".", "r": "Điều 24 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Theo Điều 12 khoản 1, viên chức được hưởng lương, thưởng theo căn cứ nào?", "o": ["Thâm niên công tác và bằng cấp", "Kết quả, hiệu quả công việc theo vị trí việc làm", "Ngạch, bậc đã được bổ nhiệm", "Hạng chức danh nghề nghiệp"], "a": [1], "e": "Điều 12 khoản 1: lương, thưởng theo kết quả, hiệu quả công việc theo vị trí việc làm.", "r": "Điều 12 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Quyền hưởng tiền làm thêm giờ, lương làm việc ban đêm, công tác phí được quy định tại điều nào của Luật Viên chức 2025?", "o": ["Điều 12", "Điều 11", "Điều 13", "Điều 14"], "a": [0], "e": "Điều 12 khoản 2 (quyền về tiền lương, thưởng).", "r": "Điều 12 khoản 2 Luật Viên chức 2025"}, {"t": "m", "q": "Quyền về tiền lương, thưởng của viên chức theo Điều 12 gồm (chọn tất cả đáp án đúng)", "o": ["Hưởng ưu đãi khi làm việc ở vùng khó khăn hoặc nghề nặng nhọc, độc hại", "Tự quyết định mức thưởng của mình", "Hưởng tiền làm thêm giờ, lương làm việc ban đêm, công tác phí", "Hưởng lương theo thâm niên, không phụ thuộc kết quả công việc", "Hưởng lương, thưởng theo kết quả, hiệu quả công việc theo vị trí việc làm"], "a": [0, 2, 4], "e": "Điều 12 khoản 1, 2, 3. Hai phương án sai trái nguyên tắc theo kết quả, hiệu quả.", "r": "Điều 12 Luật Viên chức 2025"}, {"t": "m", "q": "Quyền nghỉ ngơi của viên chức theo Điều 14 gồm (chọn tất cả đáp án đúng)", "o": ["Được thanh toán tiền nếu không nghỉ hết ngày nghỉ hằng năm", "Nghỉ việc riêng theo pháp luật lao động", "Nghỉ không lương tùy ý, không cần xin phép", "Nghỉ hằng năm", "Nghỉ lễ, tết"], "a": [0, 1, 3, 4], "e": "Điều 14 khoản 1.", "r": "Điều 14 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Điều kiện để viên chức ký hợp đồng lao động, hợp đồng dịch vụ với nơi khác theo Điều 13 khoản 1 gồm (chọn tất cả đáp án đúng)", "o": ["Nơi ký hợp đồng phải là đơn vị sự nghiệp công lập", "Phải được cơ quan quản lý cấp trên đồng ý bằng văn bản trong mọi trường hợp", "Không xung đột lợi ích", "Không trái hợp đồng làm việc", "Pháp luật không cấm"], "a": [2, 3, 4], "e": "Khoản 1 có 3 điều kiện; nếu chưa thỏa thuận thì người đứng đầu ĐƠN VỊ đồng ý bằng văn bản (không phải cấp trên, không bắt buộc đơn vị công lập).", "r": "Điều 13 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Các loại vị trí việc làm theo Điều 23 khoản 3 gồm (chọn tất cả đáp án đúng)", "o": ["Vị trí việc làm phục vụ", "Vị trí việc làm lãnh đạo", "Vị trí việc làm hỗ trợ", "Vị trí việc làm chuyên môn, nghiệp vụ", "Vị trí việc làm quản lý"], "a": [2, 3, 4], "e": "Ba loại: quản lý, chuyên môn nghiệp vụ, hỗ trợ.", "r": "Điều 23 khoản 3 Luật Viên chức 2025"}, {"t": "f", "q": "Viên chức được hưởng lương, thưởng theo ____, hiệu quả công việc theo ____.", "a": [["kết quả"], ["vị trí việc làm"]], "e": "Điều 12 khoản 1.", "r": "Điều 12 khoản 1 Luật Viên chức 2025", "o": [["thâm niên", "vị trí việc làm"], ["kết quả", "vị trí việc làm"], ["kết quả", "chức danh nghề nghiệp"], ["thâm niên", "chức danh nghề nghiệp"]], "k": 1}, {"t": "f", "q": "Vị trí việc làm gồm các loại: quản lý; chuyên môn, nghiệp vụ; ____.", "a": [["hỗ trợ"]], "e": "Điều 23 khoản 3.", "r": "Điều 23 khoản 3 Luật Viên chức 2025", "o": [["phục vụ"], ["điều hành"], ["kỹ thuật"], ["hỗ trợ"]], "k": 3}, {"t": "f", "q": "Nội dung vị trí việc làm gồm tên gọi, bản mô tả công việc và khung ____.", "a": [["năng lực"]], "e": "Điều 23 khoản 2.", "r": "Điều 23 khoản 2 Luật Viên chức 2025", "o": [["chuyên môn"], ["tiêu chuẩn"], ["năng lực"], ["trình độ"]], "k": 2}, {"t": "f", "q": "Viên chức không nghỉ hết số ngày nghỉ hằng năm thì được ____ tiền cho những ngày chưa nghỉ.", "a": [["thanh toán"]], "e": "Điều 14 khoản 1.", "r": "Điều 14 khoản 1 Luật Viên chức 2025", "o": [["thanh toán"], ["hỗ trợ"], ["bồi thường"], ["bảo lưu"]], "k": 0}, {"t": "f", "q": "Viên chức được chuyển sang vị trí việc làm mới nếu đủ ____ và đơn vị còn ____.", "a": [["tiêu chuẩn"], ["nhu cầu"]], "e": "Điều 24 khoản 1.", "r": "Điều 24 khoản 1 Luật Viên chức 2025", "o": [["điều kiện", "nhu cầu"], ["tiêu chuẩn", "biên chế"], ["trình độ", "kinh phí"], ["tiêu chuẩn", "nhu cầu"]], "k": 3}], "ynho": ["Điều 11 khoản 6: được **từ chối** công việc nếu cho rằng **trái pháp luật**; khoản 7: được **đơn phương chấm dứt** hợp đồng.", "Lương, thưởng theo **kết quả, hiệu quả công việc** theo vị trí việc làm.", "Làm thêm hợp đồng nơi khác: pháp luật không cấm, **không xung đột lợi ích**, không trái hợp đồng; chưa thỏa thuận thì cần **người đứng đầu đồng ý bằng văn bản**.", "Vị trí việc làm có **3 loại**: quản lý, chuyên môn nghiệp vụ, **hỗ trợ**.", "Nội dung vị trí việc làm: **tên gọi, bản mô tả công việc, khung năng lực**."], "bang": [{"tieu_de": "Quyền của viên chức", "cot": ["Điều", "Quyền", "Lưu ý"], "dong": [["Điều 11", "Bảo vệ, bình đẳng; đào tạo bồi dưỡng; từ chối việc trái luật; đơn phương chấm dứt hợp đồng", "Khoản 6 và khoản 7"], ["Điều 12", "Lương, thưởng theo kết quả, hiệu quả; làm thêm giờ, ban đêm, công tác phí; ưu đãi nghề nặng nhọc, độc hại", "Theo vị trí việc làm"], ["Điều 13", "Ký hợp đồng nơi khác; hành nghề cá nhân; góp vốn, quản lý cơ sở ngoài công lập", "Trừ khi luật khác cấm"], ["Điều 14", "Nghỉ hằng năm, lễ, tết, việc riêng", "Không nghỉ hết thì được thanh toán tiền"]]}, {"tieu_de": "Vị trí việc làm", "cot": ["Nội dung", "Gồm"], "dong": [["Phân loại (Điều 23 khoản 3)", "Quản lý; chuyên môn, nghiệp vụ; hỗ trợ"], ["Nội dung (Điều 23 khoản 2)", "Tên gọi; bản mô tả công việc; khung năng lực"], ["Chuyển vị trí (Điều 24 khoản 1)", "Đủ tiêu chuẩn của vị trí mới VÀ đơn vị còn nhu cầu"]]}], "vidu": [{"tinh_huong": "Cô Mai được giao một việc mà cô cho là trái pháp luật, nên cô từ chối thực hiện.", "ket_luan": "→ Đúng quyền: viên chức được từ chối thực hiện công việc nếu cho rằng trái pháp luật (Điều 11 khoản 6)."}, {"tinh_huong": "Thầy Long dạy thêm theo hợp đồng dịch vụ ở trung tâm khác; hợp đồng làm việc với trường chưa có thỏa thuận về việc này. Thầy không xung đột lợi ích và pháp luật không cấm.", "ket_luan": "→ Được, nhưng phải được người đứng đầu đơn vị đồng ý bằng văn bản (Điều 13 khoản 1)."}, {"tinh_huong": "Cô Ngọc nghỉ phép năm không hết ngày, cuối năm hỏi quyền lợi của mình.", "ket_luan": "→ Được thanh toán tiền cho những ngày không nghỉ hết (Điều 14 khoản 1)."}, {"tinh_huong": "Thầy Khôi đang là nhân viên thiết bị (vị trí hỗ trợ), muốn chuyển sang vị trí giáo viên. Trường hiện chưa có nhu cầu thêm giáo viên.", "ket_luan": "→ Chưa được: chuyển vị trí cần vừa đủ tiêu chuẩn vừa phải có nhu cầu của đơn vị (Điều 24 khoản 1)."}, {"tinh_huong": "Cô Phương muốn góp vốn và tham gia điều hành một cơ sở giáo dục ngoài công lập, không có luật khác cấm.", "ket_luan": "→ Được: viên chức có quyền góp vốn, tham gia quản lý, điều hành cơ sở giáo dục ngoài công lập, trừ khi luật khác quy định khác (Điều 13 khoản 3)."}], "nho": ["Vị trí việc làm 3 loại = **Q – C – H**: Quản lý, Chuyên môn nghiệp vụ, **H**ỗ trợ.", "Nội dung vị trí việc làm = **T – M – K**: Tên gọi, Mô tả công việc, Khung năng lực.", "Điều 13 = **3 \"được\"**: ký hợp đồng nơi khác, hành nghề cá nhân, góp vốn quản lý cơ sở ngoài công lập (đều có điều kiện \"trừ\" hoặc \"không cấm\").", "Chuyển vị trí cần **2 điều kiện cùng lúc**: đủ tiêu chuẩn và đơn vị còn nhu cầu."]}, {"id": "L1-4", "ten": "Tuyển dụng viên chức, hợp đồng làm việc và chấm dứt hợp đồng", "tomtat": ["Điều 15 – căn cứ tuyển dụng: nhu cầu thực tế, vị trí việc làm, quỹ tiền lương và nguồn thu hợp pháp.", "Điều 16 – nguyên tắc tuyển dụng: công khai, minh bạch, khách quan, cạnh tranh, bình đẳng, đúng pháp luật (khoản 1); đúng nhu cầu thực tế (khoản 2); người được tuyển phải đáp ứng **ngay** yêu cầu vị trí việc làm (khoản 3); **ưu tiên** người có công, thân nhân người có công, dân tộc thiểu số, sĩ quan/quân nhân chuyên nghiệp phục viên, đối tượng chính sách (khoản 4).", "Điều 17 khoản 1 – phương thức tuyển dụng: a) **thi tuyển**; b) **xét tuyển** đối với từng nhóm đối tượng theo quy định của Chính phủ.", "Điều 17 khoản 2 – **tiếp nhận** (không qua thi, xét): chuyên gia, nhà khoa học, người có tài năng, năng khiếu đặc biệt, người có kinh nghiệm phù hợp; người đang ký hợp đồng làm công việc tại đơn vị sự nghiệp công lập; đối tượng khác theo pháp luật ngành.", "Điều 17 khoản 3: cán bộ, công chức, viên chức, người hưởng lương trong quân đội, công an, cơ yếu đáp ứng điều kiện và được cơ quan đồng ý **bằng văn bản** chuyển sang làm viên chức thì **không phải tuyển dụng**.", "Điều 18 – thẩm quyền tuyển dụng: cơ quan quản lý đơn vị sự nghiệp công lập theo **phân cấp, ủy quyền** (khoản 1); Chính phủ quy định thẩm quyền theo quy mô, lĩnh vực (khoản 2).", "Điều 19 khoản 1 – điều kiện đăng ký dự tuyển (8 điểm a–h): có **01 quốc tịch Việt Nam**; **đang cư trú tại Việt Nam**; **đủ 18 tuổi trở lên** (trừ ngành nghề đặc thù); có đăng ký dự tuyển; phẩm chất chính trị, đạo đức tốt, lý lịch rõ ràng; đủ sức khỏe; đáp ứng điều kiện vị trí việc làm; tiêu chuẩn khác theo pháp luật nghề nghiệp.", "Điều 19 khoản 3 – **không được đăng ký dự tuyển**: mất hoặc bị hạn chế năng lực hành vi dân sự, khó khăn trong nhận thức, làm chủ hành vi; **đang bị truy cứu trách nhiệm hình sự**; đang chấp hành hoặc đã chấp hành xong bản án hình sự **chưa được xóa án tích**; đang chấp hành biện pháp xử lý hành chính tại cơ sở cai nghiện bắt buộc, giáo dục bắt buộc; trường hợp khác theo pháp luật nghề nghiệp.", "Điều 20 – hợp đồng làm việc: thỏa thuận **bằng văn bản** giữa viên chức/người được tuyển với **người đứng đầu đơn vị sự nghiệp công lập** (khoản 1); gồm hợp đồng **xác định thời hạn** và **không xác định thời hạn** (khoản 3).", "Điều 21 – hợp đồng lao động, hợp đồng dịch vụ: ký với chuyên gia, nhà khoa học... (khoản 1 điểm a); ký để thực hiện công việc thuộc vị trí việc làm **hỗ trợ** (điểm b).", "Điều 22 khoản 2, 3 – viên chức có quyền đơn phương chấm dứt hợp đồng theo pháp luật lao động, dân sự; đơn vị sự nghiệp công lập **chỉ được** đơn phương chấm dứt trong các trường hợp tương ứng theo pháp luật lao động, dân sự và quy định khác.", "Điều 22 khoản 4 – hợp đồng làm việc còn chấm dứt khi: viên chức bị **kỷ luật buộc thôi việc**; bị xếp loại **không hoàn thành nhiệm vụ** vì lý do chuyên môn, nghiệp vụ hoặc không đáp ứng yêu cầu vị trí việc làm; trường hợp khác theo pháp luật ngành, lĩnh vực hoặc thỏa thuận."], "bay": ["⚠ Điều 19: đủ **18 tuổi trở lên** (trừ ngành nghề đặc thù) – không phải \"trên 18\"; **01 quốc tịch** Việt Nam và **đang cư trú** tại Việt Nam.", "⚠ Điều 19 khoản 3: \"đang chấp hành hoặc đã chấp hành xong bản án hình sự **chưa được xóa án tích**\" bị cấm; đã được xóa án tích thì không bị cấm.", "⚠ Phương thức tuyển dụng: **thi tuyển** và **xét tuyển** (khoản 1); **tiếp nhận** là trường hợp riêng (khoản 2); cán bộ, công chức chuyển sang **không phải tuyển dụng** (khoản 3).", "⚠ Hợp đồng làm việc: **xác định thời hạn** / **không xác định thời hạn**; hợp đồng lao động, hợp đồng dịch vụ (Điều 21) là loại hợp đồng khác, không phải hợp đồng làm việc.", "⚠ Điều 22 khoản 3: đơn vị **chỉ được** đơn phương chấm dứt trong các trường hợp luật định – không phải bất cứ lúc nào; người được tuyển phải đáp ứng **ngay** yêu cầu vị trí việc làm."], "cauhoi": [{"t": "s", "q": "Theo Điều 16 khoản 3 Luật Viên chức 2025, người được tuyển dụng phải đáp ứng yêu cầu của vị trí việc làm vào thời điểm nào?", "o": ["Đáp ứng sau thời gian tập sự", "Đáp ứng trong vòng 12 tháng kể từ khi ký hợp đồng", "Đáp ứng sau khi được đào tạo, bồi dưỡng bổ sung", "Đáp ứng ngay yêu cầu của vị trí việc làm"], "a": [3], "e": "Điều 16 khoản 3: đáp ứng NGAY. Luật mới không có chế độ tập sự.", "r": "Điều 16 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Phương thức tuyển dụng viên chức theo Điều 17 khoản 1 là gì?", "o": ["Thi tuyển; bổ nhiệm đối với từng nhóm đối tượng theo quy định của Chính phủ", "Thi tuyển; xét tuyển đối với từng nhóm đối tượng theo quy định của Chính phủ", "Xét tuyển đối với mọi đối tượng theo quy định của Bộ trưởng Bộ Nội vụ", "Thi tuyển; tiếp nhận đối với từng nhóm đối tượng theo quy định của Chính phủ"], "a": [1], "e": "Khoản 1: thi tuyển và xét tuyển đối với từng nhóm đối tượng theo quy định của Chính phủ. Tiếp nhận quy định riêng ở khoản 2.", "r": "Điều 17 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Cán bộ, công chức, viên chức đáp ứng điều kiện và được cơ quan đồng ý bằng văn bản chuyển sang làm viên chức thì sao (Điều 17 khoản 3)?", "o": ["Phải thi tuyển", "Phải xét tuyển", "Không phải tuyển dụng", "Phải tập sự"], "a": [2], "e": "Điều 17 khoản 3: không phải tuyển dụng.", "r": "Điều 17 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Độ tuổi tối thiểu để đăng ký dự tuyển viên chức theo Điều 19 khoản 1 là?", "o": ["Trên 18 tuổi, không có ngoại lệ", "Đủ 16 tuổi trở lên", "Đủ 18 tuổi trở lên (trừ ngành nghề đặc thù)", "Đủ 21 tuổi trở lên"], "a": [2], "e": "Điều 19 khoản 1 điểm c: đủ 18 tuổi trở lên, trừ ngành nghề đặc thù. Bẫy: \"trên 18\" ≠ \"đủ 18 trở lên\".", "r": "Điều 19 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Điều kiện về quốc tịch và nơi cư trú khi đăng ký dự tuyển viên chức là?", "o": ["Có quốc tịch Việt Nam, được mang thêm quốc tịch nước ngoài, đang cư trú tại Việt Nam", "Có quốc tịch Việt Nam và có hộ khẩu thường trú tại nơi dự tuyển", "Có 01 quốc tịch Việt Nam và đang cư trú tại Việt Nam", "Có quốc tịch Việt Nam và đang cư trú tại địa phương nơi có đơn vị tuyển dụng"], "a": [2], "e": "Điều 19 khoản 1: 01 quốc tịch Việt Nam; đang cư trú tại Việt Nam.", "r": "Điều 19 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Người nào sau đây KHÔNG được đăng ký dự tuyển viên chức theo Điều 19 khoản 3?", "o": ["Người đã chấp hành xong bản án hình sự và đã được xóa án tích", "Người đang bị truy cứu trách nhiệm hình sự", "Người đã bị kỷ luật khiển trách khi làm việc ở nơi khác", "Người đã từng có đơn xin thôi việc tại đơn vị cũ"], "a": [1], "e": "Khoản 3 cấm người đang bị truy cứu trách nhiệm hình sự; bản án đã được xóa án tích thì không bị cấm.", "r": "Điều 19 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Hợp đồng làm việc theo Điều 20 khoản 3 gồm những loại nào?", "o": ["Xác định thời hạn và theo mùa vụ", "Không xác định thời hạn và thử việc", "Xác định thời hạn và hợp đồng dịch vụ", "Xác định thời hạn và không xác định thời hạn"], "a": [3], "e": "Điều 20 khoản 3: hai loại – xác định thời hạn và không xác định thời hạn.", "r": "Điều 20 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Hợp đồng làm việc là thỏa thuận bằng văn bản giữa viên chức hoặc người được tuyển dụng với ai?", "o": ["Cơ quan quản lý đơn vị sự nghiệp công lập", "Hội đồng tuyển dụng", "Chủ tịch Ủy ban nhân dân cùng cấp", "Người đứng đầu đơn vị sự nghiệp công lập"], "a": [3], "e": "Điều 20 khoản 1: ký với người đứng đầu đơn vị sự nghiệp công lập.", "r": "Điều 20 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Phát biểu nào đúng về chấm dứt hợp đồng làm việc theo Điều 22?", "o": ["Đơn vị sự nghiệp công lập được đơn phương chấm dứt hợp đồng làm việc vào bất cứ lúc nào", "Viên chức có quyền đơn phương chấm dứt hợp đồng làm việc theo pháp luật lao động, dân sự", "Viên chức không có quyền đơn phương chấm dứt hợp đồng làm việc", "Viên chức đơn phương chấm dứt hợp đồng thì được miễn mọi nghĩa vụ đền bù chi phí đào tạo"], "a": [1], "e": "Điều 22 khoản 2 cho phép; khoản 3 giới hạn quyền của đơn vị (\"chỉ được\"); Điều 29 khoản 3: đơn phương chấm dứt hợp đồng phải đền bù chi phí đào tạo.", "r": "Điều 22 khoản 2, 3 Luật Viên chức 2025"}, {"t": "s", "q": "Hợp đồng lao động, hợp đồng dịch vụ theo Điều 21 được ký với đối tượng nào?", "o": ["Mọi viên chức đang làm việc tại đơn vị", "Người giữ vị trí việc làm quản lý", "Chuyên gia, nhà khoa học...; và để thực hiện công việc thuộc vị trí việc làm hỗ trợ", "Chỉ người chưa đủ điều kiện dự tuyển viên chức"], "a": [2], "e": "Điều 21 khoản 1: điểm a chuyên gia, nhà khoa học...; điểm b công việc thuộc vị trí việc làm hỗ trợ.", "r": "Điều 21 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Nguyên tắc tuyển dụng viên chức theo Điều 16 gồm (chọn tất cả đáp án đúng)", "o": ["Ưu tiên người có công, thân nhân người có công, người dân tộc thiểu số", "Người được tuyển phải đáp ứng ngay yêu cầu vị trí việc làm", "Đúng nhu cầu thực tế", "Công khai, minh bạch, khách quan, cạnh tranh, bình đẳng, đúng pháp luật", "Ưu tiên người nhà của người đứng đầu đơn vị"], "a": [0, 1, 2, 3], "e": "Điều 16 khoản 1–4. Phương án cuối trái nguyên tắc khách quan, bình đẳng.", "r": "Điều 16 Luật Viên chức 2025"}, {"t": "m", "q": "Những đối tượng nào được tiếp nhận vào làm viên chức theo Điều 17 khoản 2? (chọn tất cả đáp án đúng)", "o": ["Người có kinh nghiệm phù hợp", "Người đã bị kỷ luật buộc thôi việc", "Người đang ký hợp đồng làm công việc tại đơn vị sự nghiệp công lập", "Chuyên gia, nhà khoa học", "Người có tài năng, năng khiếu đặc biệt"], "a": [0, 2, 3, 4], "e": "Điều 17 khoản 2 liệt kê các đối tượng được tiếp nhận không qua thi tuyển, xét tuyển; người bị buộc thôi việc không thuộc danh sách.", "r": "Điều 17 khoản 2 Luật Viên chức 2025"}, {"t": "m", "q": "Những người nào KHÔNG được đăng ký dự tuyển viên chức theo Điều 19 khoản 3? (chọn tất cả đáp án đúng)", "o": ["Người đang chấp hành biện pháp xử lý hành chính tại cơ sở cai nghiện bắt buộc, giáo dục bắt buộc", "Người đang bị truy cứu trách nhiệm hình sự", "Người mất hoặc bị hạn chế năng lực hành vi dân sự", "Người đã chấp hành xong bản án hình sự và đã được xóa án tích", "Người đang chấp hành bản án hình sự chưa được xóa án tích"], "a": [0, 1, 2, 4], "e": "Khoản 3 chỉ cấm người đã chấp hành xong bản án nhưng CHƯA được xóa án tích; đã xóa án tích thì được dự tuyển.", "r": "Điều 19 khoản 3 Luật Viên chức 2025"}, {"t": "m", "q": "Hợp đồng làm việc còn chấm dứt trong các trường hợp nào theo Điều 22 khoản 4? (chọn tất cả đáp án đúng)", "o": ["Viên chức bị kỷ luật khiển trách", "Viên chức bị xếp loại không hoàn thành nhiệm vụ vì lý do chuyên môn, nghiệp vụ", "Trường hợp khác theo pháp luật ngành, lĩnh vực hoặc theo thỏa thuận", "Viên chức bị kỷ luật buộc thôi việc", "Viên chức không đáp ứng yêu cầu vị trí việc làm"], "a": [1, 2, 3, 4], "e": "Khoản 4: chỉ kỷ luật BUỘC THÔI VIỆC mới làm chấm dứt hợp đồng, khiển trách thì không.", "r": "Điều 22 khoản 4 Luật Viên chức 2025"}, {"t": "f", "q": "Người dự tuyển viên chức phải đủ ____ tuổi trở lên (trừ ngành nghề đặc thù).", "a": [["18", "mười tám"]], "e": "Điều 19 khoản 1.", "r": "Điều 19 khoản 1 Luật Viên chức 2025", "o": [["16"], ["18"], ["20"], ["22"]], "k": 1}, {"t": "f", "q": "Người được tuyển dụng phải đáp ứng ____ yêu cầu của vị trí việc làm.", "a": [["ngay"]], "e": "Điều 16 khoản 3.", "r": "Điều 16 khoản 3 Luật Viên chức 2025", "o": [["một phần"], ["ngay"], ["tối thiểu"], ["từng bước"]], "k": 1}, {"t": "f", "q": "Hợp đồng làm việc là thỏa thuận bằng ____ giữa viên chức hoặc người được tuyển dụng với ____ đơn vị sự nghiệp công lập.", "a": [["văn bản"], ["người đứng đầu"]], "e": "Điều 20 khoản 1.", "r": "Điều 20 khoản 1 Luật Viên chức 2025", "o": [["văn bản", "cấp trên trực tiếp của"], ["lời nói", "người đứng đầu"], ["văn bản", "người đứng đầu"], ["biên bản", "người đại diện theo pháp luật của"]], "k": 2}, {"t": "f", "q": "Tuyển dụng viên chức theo phương thức thi tuyển hoặc ____ đối với từng nhóm đối tượng theo quy định của Chính phủ.", "a": [["xét tuyển"]], "e": "Điều 17 khoản 1.", "r": "Điều 17 khoản 1 Luật Viên chức 2025", "o": [["bổ nhiệm"], ["điều động"], ["tiếp nhận"], ["xét tuyển"]], "k": 3}, {"t": "f", "q": "Đơn vị sự nghiệp công lập ____ được đơn phương chấm dứt hợp đồng làm việc trong các trường hợp tương ứng theo pháp luật lao động, dân sự và quy định khác.", "a": [["chỉ"]], "e": "Điều 22 khoản 3: dùng \"chỉ được\" – giới hạn quyền của đơn vị.", "r": "Điều 22 khoản 3 Luật Viên chức 2025", "o": [["chỉ"], ["không"], ["cũng"], ["đương nhiên"]], "k": 0}], "ynho": ["Tuyển dụng: **thi tuyển** hoặc **xét tuyển** (khoản 1); **tiếp nhận** là trường hợp riêng (khoản 2).", "Đăng ký dự tuyển: **01 quốc tịch Việt Nam**, đang cư trú ở Việt Nam, **đủ 18 tuổi trở lên**.", "Không được dự tuyển nếu **đang bị truy cứu trách nhiệm hình sự** hoặc **án tích chưa xóa**.", "Hợp đồng làm việc: **văn bản**, ký với **người đứng đầu đơn vị**; có xác định và không xác định thời hạn.", "Hợp đồng chấm dứt khi **buộc thôi việc** hoặc **không hoàn thành nhiệm vụ**."], "bang": [{"tieu_de": "Các cách trở thành viên chức (Điều 17)", "cot": ["Cách", "Đối tượng", "Lưu ý"], "dong": [["Thi tuyển", "Theo quy định", "Khoản 1 điểm a"], ["Xét tuyển", "Từng nhóm đối tượng theo quy định của Chính phủ", "Khoản 1 điểm b"], ["Tiếp nhận", "Chuyên gia, nhà khoa học, người có tài năng, kinh nghiệm phù hợp...", "Không qua thi, xét (khoản 2)"], ["Chuyển sang", "Cán bộ, công chức, viên chức, lực lượng vũ trang...", "Có văn bản đồng ý của cơ quan thì không phải tuyển dụng (khoản 3)"]]}, {"tieu_de": "Các loại hợp đồng", "cot": ["Loại", "Ký với ai / dùng khi nào"], "dong": [["Hợp đồng làm việc (Điều 20)", "Với viên chức, bằng văn bản, với người đứng đầu đơn vị; xác định hoặc không xác định thời hạn"], ["Hợp đồng lao động, dịch vụ (Điều 21)", "Chuyên gia, nhà khoa học...; công việc thuộc vị trí việc làm hỗ trợ"]]}], "vidu": [{"tinh_huong": "Em Thảo 17 tuổi 11 tháng muốn nộp hồ sơ dự tuyển viên chức giáo viên THCS (không thuộc ngành nghề đặc thù).", "ket_luan": "→ Chưa đủ điều kiện: phải đủ 18 tuổi trở lên (Điều 19 khoản 1)."}, {"tinh_huong": "Anh Hải đã chấp hành xong bản án hình sự nhưng chưa được xóa án tích, nộp hồ sơ dự tuyển giáo viên.", "ket_luan": "→ Không được đăng ký dự tuyển (Điều 19 khoản 3)."}, {"tinh_huong": "Cô Yến là công chức, được cơ quan đồng ý bằng văn bản chuyển sang làm viên chức ở một trường công lập.", "ket_luan": "→ Không phải qua tuyển dụng (Điều 17 khoản 3)."}, {"tinh_huong": "Thầy Đức bị xếp loại không hoàn thành nhiệm vụ vì không đáp ứng yêu cầu vị trí việc làm, nhà trường chấm dứt hợp đồng làm việc.", "ket_luan": "→ Đúng: là trường hợp chấm dứt hợp đồng làm việc theo Điều 22 khoản 4."}, {"tinh_huong": "Cô Lài là người nước ngoài định cư lâu năm, có thêm quốc tịch khác, muốn dự tuyển viên chức.", "ket_luan": "→ Không đáp ứng: điều kiện dự tuyển là có 01 quốc tịch Việt Nam (Điều 19 khoản 1)."}], "nho": ["Điều kiện dự tuyển = **\"1 – 18 – cư trú\"**: 01 quốc tịch, đủ 18 tuổi, đang cư trú tại Việt Nam.", "Tuyển dụng có **Thi – Xét** là chính; **Tiếp nhận** là ngoại lệ cho người tài, chuyên gia.", "Hợp đồng làm việc ký với **người đứng đầu** đơn vị, bằng **văn bản**; hợp đồng lao động/dịch vụ là loại **khác**.", "Hợp đồng làm việc chấm dứt thêm **2 trường hợp nặng**: buộc thôi việc và không hoàn thành nhiệm vụ."]}, {"id": "L1-5", "ten": "Đánh giá, xếp loại, đào tạo bồi dưỡng, bổ nhiệm và điều động", "tomtat": ["Điều 25 khoản 1 – nguyên tắc đánh giá: dân chủ, công khai, công bằng, minh bạch, khách quan, xuyên suốt, liên tục, **đa chiều**; **định lượng** theo tiêu chí gắn với kết quả từng vị trí việc làm; **gắn với tiền lương, thưởng**.", "Điều 25 khoản 2: người đứng đầu đơn vị sự nghiệp (hoặc người đứng đầu đơn vị trực thuộc) đánh giá theo quy chế; **người đứng đầu do cấp trên quản lý trực tiếp đánh giá**.", "Điều 25 khoản 3 – nội dung đánh giá (a–đ): chính trị, đạo đức, kỷ luật; năng lực chuyên môn; đổi mới sáng tạo; kết quả sản phẩm; nội dung khác.", "Điều 26 khoản 1 – xếp loại hằng năm **4 mức**: **Hoàn thành xuất sắc nhiệm vụ**; **Hoàn thành tốt nhiệm vụ**; **Hoàn thành nhiệm vụ**; **Không hoàn thành nhiệm vụ**. Kết quả được thông báo cá nhân, công khai trong đơn vị, lưu hồ sơ.", "Điều 26 khoản 2 điểm c: không hoàn thành nhiệm vụ/không đáp ứng yêu cầu thì **bố trí vị trí việc làm thấp hơn** hoặc **cho thôi việc**.", "Điều 27 – kiến nghị kết quả xếp loại: **bằng văn bản**; thời hạn kiến nghị **05 ngày** kể từ ngày công khai (khoản 2); cấp có thẩm quyền giải quyết trong **10 ngày làm việc** kể từ ngày nhận kiến nghị (khoản 3); **không xem xét lại** kết quả giải quyết kiến nghị (khoản 4).", "Điều 29 khoản 2: thời gian đào tạo, bồi dưỡng được tính là thời gian công tác **liên tục**; khoản 3: tự ý bỏ việc, đơn phương chấm dứt hợp đồng phải **đền bù chi phí đào tạo**.", "Điều 30 khoản 2 – thời hạn bổ nhiệm viên chức quản lý: **05 năm** (trừ trường hợp pháp luật nghề nghiệp có quy định khác; chức danh đặc thù có thể dưới 5 năm); hết hạn phải xem xét bổ nhiệm lại hoặc không.", "Điều 31 – **điều động**: từ đơn vị sự nghiệp công lập này sang đơn vị sự nghiệp công lập khác trong phạm vi quản lý theo quy định của Đảng hoặc pháp luật hoạt động nghề nghiệp.", "Điều 32 khoản 1 – thôi việc: theo chấm dứt/đơn phương chấm dứt hợp đồng theo pháp luật lao động hoặc các trường hợp tại Điều 22 khoản 4; chế độ trợ cấp thôi việc, mất việc, thất nghiệp theo pháp luật."], "bay": ["⚠ Kiến nghị xếp loại: **05 ngày** (viên chức kiến nghị) ≠ **10 ngày làm việc** (cơ quan giải quyết); sau đó **không xem xét lại**.", "⚠ Xếp loại có **4 mức**: hoàn thành xuất sắc – hoàn thành tốt – hoàn thành – **không hoàn thành** (không có mức \"hoàn thành nhưng còn hạn chế về năng lực\").", "⚠ Thời hạn bổ nhiệm viên chức quản lý **05 năm**; chức danh đặc thù có thể **dưới** 5 năm.", "⚠ Đánh giá người đứng đầu do **cấp trên quản lý trực tiếp** thực hiện; không hoàn thành nhiệm vụ → **vị trí thấp hơn hoặc thôi việc**.", "⚠ Thời gian đào tạo, bồi dưỡng **tính là** thời gian công tác liên tục; tự ý bỏ việc, đơn phương chấm dứt hợp đồng thì **phải đền bù** chi phí đào tạo."], "cauhoi": [{"t": "s", "q": "Mức xếp loại nào sau đây KHÔNG thuộc 4 mức xếp loại viên chức hằng năm theo Điều 26 khoản 1?", "o": ["Hoàn thành xuất sắc nhiệm vụ", "Hoàn thành nhiệm vụ nhưng còn hạn chế về năng lực", "Hoàn thành tốt nhiệm vụ", "Không hoàn thành nhiệm vụ"], "a": [1], "e": "4 mức: hoàn thành xuất sắc, hoàn thành tốt, hoàn thành, không hoàn thành nhiệm vụ. Mức \"hoàn thành nhưng còn hạn chế về năng lực\" là bẫy.", "r": "Điều 26 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Thời hạn viên chức kiến nghị bằng văn bản về kết quả xếp loại theo Điều 27 khoản 2 là bao lâu?", "o": ["03 ngày kể từ ngày công khai kết quả xếp loại", "05 ngày làm việc kể từ ngày nhận được kết quả", "10 ngày kể từ ngày công khai kết quả xếp loại", "05 ngày kể từ ngày công khai kết quả xếp loại"], "a": [3], "e": "Điều 27 khoản 2: 05 ngày kể từ ngày công khai. Bẫy: 10 ngày làm việc là thời hạn giải quyết kiến nghị.", "r": "Điều 27 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Cấp có thẩm quyền phải giải quyết kiến nghị về kết quả xếp loại trong thời hạn nào?", "o": ["05 ngày làm việc kể từ ngày nhận được kiến nghị", "10 ngày kể từ ngày công khai kết quả", "10 ngày làm việc kể từ ngày nhận được kiến nghị", "15 ngày làm việc kể từ ngày nhận được kiến nghị"], "a": [2], "e": "Điều 27 khoản 3: 10 ngày làm việc kể từ ngày nhận kiến nghị.", "r": "Điều 27 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Sau khi cấp có thẩm quyền đã giải quyết kiến nghị về kết quả xếp loại, kết quả giải quyết đó được xử lý thế nào?", "o": ["Không xem xét lại", "Viên chức được kiến nghị lần hai lên cấp trên trực tiếp", "Được xem xét lại một lần nếu có chứng cứ mới", "Được xem xét lại khi người đứng đầu đơn vị có yêu cầu"], "a": [0], "e": "Điều 27 khoản 4: không xem xét lại kết quả giải quyết kiến nghị.", "r": "Điều 27 khoản 4 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức bị xếp loại không hoàn thành nhiệm vụ thì bị xử lý thế nào theo Điều 26 khoản 2 điểm c?", "o": ["Bố trí vào vị trí việc làm thấp hơn hoặc cho thôi việc", "Chỉ bị cho thôi việc", "Chỉ bị bố trí vào vị trí việc làm thấp hơn", "Bị cách chức nhưng vẫn giữ nguyên vị trí việc làm"], "a": [0], "e": "Điều 26 khoản 2c: vị trí thấp hơn HOẶC thôi việc.", "r": "Điều 26 khoản 2 điểm c Luật Viên chức 2025"}, {"t": "s", "q": "Theo Điều 25 khoản 2, việc đánh giá người đứng đầu đơn vị sự nghiệp công lập do ai thực hiện?", "o": ["Tập thể viên chức trong đơn vị", "Cấp phó của người đứng đầu", "Cấp trên quản lý trực tiếp", "Hội đồng đánh giá do người đứng đầu thành lập"], "a": [2], "e": "Điều 25 khoản 2 điểm b: do cấp trên quản lý trực tiếp đánh giá.", "r": "Điều 25 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Thời hạn bổ nhiệm viên chức quản lý theo Điều 30 khoản 2 là bao lâu?", "o": ["03 năm", "05 năm", "10 năm", "Đến khi đủ tuổi nghỉ hưu"], "a": [1], "e": "Điều 30 khoản 2: 05 năm (trừ quy định khác của pháp luật nghề nghiệp; chức danh đặc thù có thể dưới 5 năm).", "r": "Điều 30 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Thời gian đào tạo, bồi dưỡng của viên chức được tính như thế nào theo Điều 29 khoản 2?", "o": ["Không tính là thời gian công tác", "Tính 50% vào thời gian công tác", "Tính là thời gian công tác nhưng bị gián đoạn", "Tính là thời gian công tác liên tục"], "a": [3], "e": "Điều 29 khoản 2: tính là thời gian công tác liên tục.", "r": "Điều 29 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức tự ý bỏ việc hoặc đơn phương chấm dứt hợp đồng thì phải thực hiện nghĩa vụ nào theo Điều 29 khoản 3?", "o": ["Chỉ phải báo cáo bằng văn bản", "Hoàn trả toàn bộ tiền lương đã nhận", "Đền bù chi phí đào tạo", "Chịu hình thức kỷ luật cách chức"], "a": [2], "e": "Điều 29 khoản 3: phải đền bù chi phí đào tạo.", "r": "Điều 29 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Điều động viên chức theo Điều 31 là việc chuyển viên chức từ đơn vị sự nghiệp công lập này sang đâu?", "o": ["Cơ quan hành chính nhà nước", "Doanh nghiệp nhà nước", "Bất kỳ đơn vị nào, kể cả ngoài phạm vi quản lý", "Đơn vị sự nghiệp công lập khác trong phạm vi quản lý"], "a": [3], "e": "Điều 31: sang đơn vị sự nghiệp công lập khác trong phạm vi quản lý theo quy định của Đảng hoặc pháp luật hoạt động nghề nghiệp.", "r": "Điều 31 Luật Viên chức 2025"}, {"t": "m", "q": "Nguyên tắc đánh giá viên chức theo Điều 25 khoản 1 gồm (chọn tất cả đáp án đúng)", "o": ["Định lượng theo tiêu chí gắn với kết quả từng vị trí việc làm", "Gắn với tiền lương, thưởng", "Xuyên suốt, liên tục, đa chiều", "Dân chủ, công khai, công bằng, minh bạch, khách quan", "Bí mật, do người đứng đầu quyết định"], "a": [0, 1, 2, 3], "e": "Điều 25 khoản 1 yêu cầu công khai, khách quan; phương án cuối trái nguyên tắc.", "r": "Điều 25 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Nội dung đánh giá viên chức theo Điều 25 khoản 3 gồm (chọn tất cả đáp án đúng)", "o": ["Năng lực chuyên môn", "Thâm niên công tác", "Đổi mới sáng tạo", "Kết quả, sản phẩm", "Chính trị, đạo đức, kỷ luật"], "a": [0, 2, 3, 4], "e": "Khoản 3 (a–đ) không có tiêu chí thâm niên; căn cứ là kết quả, năng lực.", "r": "Điều 25 khoản 3 Luật Viên chức 2025"}, {"t": "m", "q": "Việc công khai kết quả xếp loại hằng năm theo Điều 26 khoản 1 gồm (chọn tất cả đáp án đúng)", "o": ["Chỉ thông báo cá nhân, không lưu hồ sơ", "Công khai trong đơn vị", "Thông báo đến cá nhân viên chức", "Đăng công khai trên phương tiện thông tin đại chúng", "Lưu vào hồ sơ viên chức"], "a": [1, 2, 4], "e": "Điều 26 khoản 1: thông báo cá nhân, công khai trong đơn vị, lưu hồ sơ.", "r": "Điều 26 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Quy định về kiến nghị kết quả xếp loại theo Điều 27 gồm (chọn tất cả đáp án đúng)", "o": ["Không xem xét lại kết quả giải quyết kiến nghị", "Cấp có thẩm quyền giải quyết trong 05 ngày làm việc", "Cấp có thẩm quyền giải quyết trong 10 ngày làm việc kể từ ngày nhận kiến nghị", "Thời hạn kiến nghị 05 ngày kể từ ngày công khai", "Kiến nghị bằng văn bản"], "a": [0, 2, 3, 4], "e": "Điều 27 khoản 2, 3, 4. Bẫy đổi 10 ngày làm việc thành 05.", "r": "Điều 27 Luật Viên chức 2025"}, {"t": "f", "q": "Viên chức kiến nghị bằng văn bản về kết quả xếp loại trong thời hạn ____ ngày kể từ ngày công khai.", "a": [["05", "5", "năm"]], "e": "Điều 27 khoản 2.", "r": "Điều 27 khoản 2 Luật Viên chức 2025", "o": [["03"], ["05"], ["07"], ["10"]], "k": 1}, {"t": "f", "q": "Cấp có thẩm quyền giải quyết kiến nghị trong ____ ngày ____ kể từ ngày nhận được kiến nghị.", "a": [["10", "mười"], ["làm việc"]], "e": "Điều 27 khoản 3.", "r": "Điều 27 khoản 3 Luật Viên chức 2025", "o": [["15", "làm việc"], ["10", "dương lịch"], ["10", "làm việc"], ["30", "làm việc"]], "k": 2}, {"t": "f", "q": "Thời hạn bổ nhiệm viên chức quản lý là ____ năm (trừ trường hợp pháp luật nghề nghiệp có quy định khác).", "a": [["05", "5", "năm"]], "e": "Điều 30 khoản 2.", "r": "Điều 30 khoản 2 Luật Viên chức 2025", "o": [["05"], ["03"], ["07"], ["10"]], "k": 0}, {"t": "f", "q": "Thời gian đào tạo, bồi dưỡng được tính là thời gian công tác ____.", "a": [["liên tục"]], "e": "Điều 29 khoản 2.", "r": "Điều 29 khoản 2 Luật Viên chức 2025", "o": [["gián đoạn"], ["bổ sung"], ["tại đơn vị"], ["liên tục"]], "k": 3}, {"t": "f", "q": "Viên chức tự ý bỏ việc, đơn phương chấm dứt hợp đồng phải ____ chi phí đào tạo.", "a": [["đền bù"]], "e": "Điều 29 khoản 3.", "r": "Điều 29 khoản 3 Luật Viên chức 2025", "o": [["bồi thường"], ["hoàn trả"], ["chịu một phần"], ["đền bù"]], "k": 3}], "ynho": ["Xếp loại hằng năm **4 mức**: xuất sắc – tốt – hoàn thành – **không hoàn thành**.", "Kiến nghị kết quả: **05 ngày** (viên chức); giải quyết: **10 ngày làm việc**; sau đó **không xem xét lại**.", "Bổ nhiệm viên chức quản lý: **05 năm**.", "Không hoàn thành nhiệm vụ: **vị trí thấp hơn** hoặc **thôi việc**.", "Bỏ việc, đơn phương chấm dứt hợp đồng phải **đền bù** chi phí đào tạo."], "bang": [{"tieu_de": "Đánh giá và xếp loại", "cot": ["Nội dung", "Quy định"], "dong": [["Nguyên tắc (Điều 25)", "Đa chiều, định lượng, gắn với tiền lương, thưởng"], ["Người đánh giá", "Người đứng đầu đơn vị; người đứng đầu do cấp trên quản lý trực tiếp đánh giá"], ["4 mức xếp loại (Điều 26)", "Hoàn thành xuất sắc; Hoàn thành tốt; Hoàn thành; Không hoàn thành nhiệm vụ"], ["Không hoàn thành nhiệm vụ", "Bố trí vị trí thấp hơn hoặc cho thôi việc"]]}, {"tieu_de": "Các con số kiến nghị và bổ nhiệm", "cot": ["Nội dung", "Số liệu"], "dong": [["Thời hạn viên chức kiến nghị (Điều 27 khoản 2)", "05 ngày kể từ ngày công khai"], ["Thời hạn giải quyết kiến nghị (Điều 27 khoản 3)", "10 ngày làm việc kể từ ngày nhận kiến nghị"], ["Sau khi giải quyết (khoản 4)", "Không xem xét lại"], ["Thời hạn bổ nhiệm viên chức quản lý (Điều 30 khoản 2)", "05 năm (chức danh đặc thù có thể dưới 5 năm)"]]}], "vidu": [{"tinh_huong": "Cô Dung nhận kết quả xếp loại cuối năm bị thấp hơn mong đợi và muốn kiến nghị.", "ket_luan": "→ Cô kiến nghị bằng văn bản trong 05 ngày kể từ ngày công khai; cấp có thẩm quyền giải quyết trong 10 ngày làm việc; kết quả giải quyết không xem xét lại (Điều 27)."}, {"tinh_huong": "Thầy Sơn được cử đi bồi dưỡng 3 tháng. Có đồng nghiệp lo thời gian này làm gián đoạn thời gian công tác.", "ket_luan": "→ Không: thời gian đào tạo, bồi dưỡng được tính là thời gian công tác liên tục (Điều 29 khoản 2)."}, {"tinh_huong": "Thầy Hiếu được cử học nâng cao bằng kinh phí đơn vị, sau đó tự ý bỏ việc.", "ket_luan": "→ Phải
