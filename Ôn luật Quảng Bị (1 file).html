ĐT ban hành Điều lệ trường tiểu học, THCS, THPT và trường phổ thông nhiều cấp học", "so": "Thông tư số 15/2026/TT-BGDĐT", "ngay": "24/03/2026", "hieuluc": "10/05/2026", "mota": "Điều lệ chung cho trường tiểu học, THCS, THPT và trường phổ thông nhiều cấp học: tổ chức, quản lý nhà trường, hoạt động giáo dục, giáo viên và nhiệm vụ, quyền của học sinh; thay thế TT 28/2020, TT 32/2020 và một số văn bản khác.", "baihoc": [{"id": "L9-1", "ten": "Thông tin chung và Chương I: Quy định chung (Điều 1–7)", "tomtat": ["Thông tư 15/2026/TT-BGDĐT ký ngày **24/3/2026**, có hiệu lực từ **10/5/2026**; đăng Công báo số 244 ngày 23/4/2026.", "Thông tư gồm **3 điều** (Điều 1 ban hành Điều lệ, Điều 2 hiệu lực, Điều 3 trách nhiệm thi hành); Điều lệ ban hành kèm theo có nhiều chương, Điều 1–34 là phần đã đối chiếu nguyên văn.", "Thông tư thay thế **TT 28/2020** (Điều lệ trường tiểu học), **TT 32/2020** (Điều lệ THCS, THPT, nhiều cấp), **QĐ 51/2002** (chuyển trường), **TT 50/2021** và **TT 31/2023**.", "Điều 1: Điều lệ áp dụng cho trường tiểu học, THCS, THPT, trường **phổ thông nhiều cấp học**, trường chuyên biệt và cơ sở giáo dục khác thực hiện chương trình GDPT.", "Điều 2: trường phổ thông là cơ sở giáo dục phổ thông thuộc hệ thống giáo dục quốc dân, có **tư cách pháp nhân, tài khoản và con dấu** riêng.", "Điều 3: nhà trường có **11 khoản** nhiệm vụ, quyền hạn (tầm nhìn, sứ mạng; thực hiện CTGDPT; chuyển đổi số; tuyển sinh; trách nhiệm giải trình, công khai...).", "Điều 4: có **2 loại hình** là **công lập** và **tư thục**; trường 1 cấp (TH, THCS, THPT); trường nhiều cấp (TH+THCS; THCS+THPT; TH+THCS+THPT); trường chuyên biệt.", "Điều 5: biển tên trường — nếu cấp cao nhất là **THCS** thì góc trái trên ghi **UBND cấp xã** và tên xã; nếu cấp cao nhất là **THPT** thì ghi **UBND cấp tỉnh** và **Sở GDĐT**.", "Điều 6: trường tiểu học, THCS và trường nhiều cấp có cấp cao nhất là THCS do **UBND cấp xã** quản lý (Phòng Văn hóa - Xã hội tham mưu); trường THPT và nhiều cấp có cấp cao nhất là THPT do **Sở GDĐT** quản lý.", "Điều 7: trường chuyên biệt, trường tư thục, cơ sở giáo dục khác thực hiện Điều lệ này và **quy chế riêng của Bộ trưởng**."], "bay": ["⚠ Tư cách **pháp nhân + tài khoản + con dấu** riêng (Điều 2) — đừng nhầm với \"dùng chung con dấu của cơ quan quản lý\".", "⚠ Cấp cao nhất **THCS** → UBND **cấp xã** quản lý; cấp cao nhất **THPT** → **Sở GDĐT** quản lý (Điều 6); đừng đảo.", "⚠ Loại hình chỉ có **công lập** và **tư thục** (Điều 4); trường nhiều cấp không có tổ hợp \"TH+THPT\" bỏ qua THCS.", "⚠ Thông tư có **3 điều**, còn Điều lệ ban hành kèm theo mới có nhiều điều — đừng nhầm số điều."], "cauhoi": [{"t": "s", "q": "Thông tư 15/2026/TT-BGDĐT được ký ban hành ngày nào?", "o": ["24/3/2026", "30/01/2026", "10/5/2026", "23/4/2026"], "a": [0], "e": "Ký ngày 24/3/2026. 30/01/2026 là ngày ban hành TT03/2026 (quy tắc ứng xử); 10/5/2026 là ngày có hiệu lực; 23/4/2026 là ngày đăng Công báo.", "r": "Điều 2 Thông tư 15/2026/TT-BGDĐT Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Thông tư 15/2026/TT-BGDĐT có hiệu lực thi hành từ ngày nào?", "o": ["24/3/2026", "01/9/2026", "10/5/2026", "30/01/2026"], "a": [2], "e": "Hiệu lực từ 10/5/2026, không phải ngày ký (24/3/2026) hay ngày hiệu lực của TT03/2026 (30/01/2026).", "r": "Điều 2 Thông tư 15/2026/TT-BGDĐT Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Văn bản nào dưới đây là Điều lệ trường tiểu học bị thay thế bởi Thông tư 15/2026/TT-BGDĐT?", "o": ["Thông tư 31/2023/TT-BGDĐT", "Thông tư 50/2021/TT-BGDĐT", "Thông tư 32/2020/TT-BGDĐT", "Thông tư 28/2020/TT-BGDĐT"], "a": [3], "e": "TT 28/2020 là Điều lệ trường tiểu học; TT 32/2020 là Điều lệ THCS, THPT và trường nhiều cấp; TT 50/2021 liên quan chuyển trường; TT 31/2023 là quy chế xét tốt nghiệp THCS. Phương án nhiễu cũng bị thay thế nhưng không phải Điều lệ trường tiểu học.", "r": "Thông tư 15/2026/TT-BGDĐT (phần thay thế văn bản) Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Theo Điều lệ, trường phổ thông là cơ sở giáo dục có đặc điểm nào sau đây?", "o": ["Thuộc hệ thống giáo dục quốc dân, có tư cách pháp nhân và con dấu riêng nhưng dùng chung tài khoản của cơ quan quản lý", "Thuộc hệ thống giáo dục quốc dân, có tài khoản và con dấu riêng nhưng không có tư cách pháp nhân", "Thuộc hệ thống giáo dục nghề nghiệp, có tư cách pháp nhân, tài khoản và con dấu riêng", "Thuộc hệ thống giáo dục quốc dân, có tư cách pháp nhân, tài khoản và con dấu riêng"], "a": [3], "e": "Điều 2: trường phổ thông là cơ sở GDPT thuộc hệ thống giáo dục quốc dân, có đủ 3 yếu tố pháp nhân – tài khoản – con dấu riêng. Các phương án nhiễu bớt một yếu tố hoặc đổi hệ thống.", "r": "Điều 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Theo Điều 4, Điều lệ phân loại trường phổ thông theo loại hình nào?", "o": ["Công lập và bán công", "Công lập, tư thục và dân lập", "Công lập và tư thục", "Quốc lập và tư thục"], "a": [2], "e": "Chỉ có 2 loại hình: công lập và tư thục. \"Dân lập\", \"bán công\" không có trong Điều lệ.", "r": "Điều 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Trường THCS và trường tiểu học công lập do cơ quan nào quản lý theo Điều lệ?", "o": ["Sở Giáo dục và Đào tạo", "UBND cấp tỉnh", "UBND cấp xã", "Bộ Giáo dục và Đào tạo"], "a": [2], "e": "Điều 6: trường tiểu học, THCS và trường nhiều cấp có cấp cao nhất là THCS do UBND cấp xã quản lý; Sở GDĐT quản lý trường THPT và trường nhiều cấp có cấp cao nhất là THPT.", "r": "Điều 6 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Trường phổ thông nhiều cấp học có cấp cao nhất là THPT do cơ quan nào quản lý?", "o": ["UBND cấp huyện", "Phòng Văn hóa - Xã hội", "Sở Giáo dục và Đào tạo", "UBND cấp xã"], "a": [2], "e": "Điều 6: cấp cao nhất là THPT thì do Sở GDĐT quản lý. UBND cấp xã chỉ quản lý trường có cấp cao nhất là THCS trở xuống.", "r": "Điều 6 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Biển tên trường có cấp học cao nhất là THPT, góc trái phía trên ghi nội dung nào?", "o": ["Bộ Giáo dục và Đào tạo", "UBND cấp tỉnh và Sở Giáo dục và Đào tạo", "Chỉ Sở Giáo dục và Đào tạo", "UBND cấp xã và tên xã"], "a": [1], "e": "Điều 5: nếu cấp cao nhất là THPT ghi UBND cấp tỉnh và Sở GDĐT; nếu cấp cao nhất là THCS ghi UBND cấp xã và tên xã.", "r": "Điều 5 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Thông tư 15/2026/TT-BGDĐT (chưa tính Điều lệ ban hành kèm theo) có mấy điều?", "o": ["5 điều", "3 điều", "34 điều", "2 điều"], "a": [1], "e": "Thông tư có 3 điều: Điều 1 ban hành Điều lệ, Điều 2 hiệu lực, Điều 3 trách nhiệm thi hành. Số 34 là số điều đã đối chiếu của Điều lệ, không phải của Thông tư.", "r": "Thông tư 15/2026/TT-BGDĐT Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Theo Điều 4, những cặp cấp học nào sau đây có thể hợp thành trường phổ thông nhiều cấp học? (chọn tất cả đáp án đúng)", "o": ["Tiểu học và THPT (không có THCS)", "Tiểu học và THCS", "Mầm non và tiểu học", "THCS và THPT", "Tiểu học, THCS và THPT"], "a": [1, 3, 4], "e": "Điều 4: nhiều cấp gồm TH+THCS; THCS+THPT; TH+THCS+THPT. Không có tổ hợp bỏ qua THCS; mầm non không thuộc trường phổ thông.", "r": "Điều 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về trường phổ thông theo Điều 2? (chọn tất cả đáp án đúng)", "o": ["Có con dấu và tài khoản riêng", "Không có tư cách pháp nhân", "Thực hiện chương trình giáo dục phổ thông", "Là cơ sở giáo dục phổ thông thuộc hệ thống giáo dục quốc dân", "Chỉ có loại hình công lập"], "a": [0, 2, 3], "e": "Điều 2 nêu 3 đặc điểm trên; trường phổ thông có cả công lập và tư thục, và có tư cách pháp nhân.", "r": "Điều 2 và Điều 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Trường chuyên biệt theo Điều 4 gồm những loại nào? (chọn tất cả đáp án đúng)", "o": ["Trường mầm non tư thục", "Trường phổ thông dân tộc nội trú", "Trường THPT chuyên, trường năng khiếu", "Trường, lớp dành cho người khuyết tật", "Trường giáo dưỡng"], "a": [1, 2, 3, 4], "e": "Các loại 1–4 thuộc nhóm trường chuyên biệt; trường mầm non không thuộc phạm vi trường phổ thông.", "r": "Điều 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Thông tư 15/2026/TT-BGDĐT thay thế những văn bản nào sau đây? (chọn tất cả đáp án đúng)", "o": ["Quyết định 51/2002/QĐ-BGDĐT", "Thông tư 31/2023/TT-BGDĐT", "Thông tư 03/2026/TT-BGDĐT", "Thông tư 28/2020/TT-BGDĐT", "Thông tư 32/2020/TT-BGDĐT"], "a": [0, 1, 3, 4], "e": "TT03/2026 là quy tắc ứng xử của nhà giáo, ban hành trước đó và không bị Thông tư 15 thay thế.", "r": "Thông tư 15/2026/TT-BGDĐT (phần thay thế văn bản) Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "f", "q": "Thông tư 15/2026/TT-BGDĐT được ký ngày ____ và có hiệu lực từ ngày ____.", "a": [["24/3/2026", "24/03/2026"], ["10/5/2026", "10/05/2026"]], "e": "Ký 24/3/2026, hiệu lực 10/5/2026.", "r": "Điều 2 Thông tư 15/2026/TT-BGDĐT Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["24/3/2026", "10/5/2026"], ["24/3/2026", "10/6/2026"], ["14/3/2026", "10/5/2026"], ["10/5/2026", "24/3/2026"]], "k": 0}, {"t": "f", "q": "Trường phổ thông có tư cách ____, tài khoản và ____ riêng.", "a": [["pháp nhân"], ["con dấu"]], "e": "Điều 2: tư cách pháp nhân, tài khoản và con dấu riêng.", "r": "Điều 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["pháp nhân", "trụ sở"], ["pháp nhân", "con dấu"], ["thể nhân", "con dấu"], ["quyền tự chủ", "con dấu"]], "k": 1}, {"t": "f", "q": "Trường tiểu học, THCS và trường nhiều cấp có cấp cao nhất là THCS do UBND cấp ____ quản lý.", "a": [["xã"]], "e": "Điều 6: UBND cấp xã (không phải cấp tỉnh).", "r": "Điều 6 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["huyện"], ["tỉnh"], ["xã"], ["thôn"]], "k": 2}, {"t": "f", "q": "Theo Điều 4, trường phổ thông có hai loại hình là ____ và ____.", "a": [["công lập"], ["tư thục"]], "e": "Hai loại hình: công lập và tư thục.", "r": "Điều 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["công lập", "dân lập"], ["bán công", "tư thục"], ["công lập", "quốc tế"], ["công lập", "tư thục"]], "k": 3}, {"t": "f", "q": "Thông tư 15/2026/TT-BGDĐT gồm ____ điều.", "a": [["3", "03", "ba"]], "e": "Thông tư có 3 điều.", "r": "Thông tư 15/2026/TT-BGDĐT Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["4"], ["3"], ["5"], ["2"]], "k": 1}], "ynho": ["Thông tư 15/2026 ký **24/3/2026**, hiệu lực **10/5/2026**.", "Thông tư chỉ có **3 điều**; Điều lệ kèm theo mới có nhiều chương, nhiều điều.", "Trường phổ thông có **pháp nhân, tài khoản, con dấu** riêng (Điều 2).", "Chỉ có **2 loại hình**: công lập và tư thục (Điều 4).", "Cấp cao nhất **THCS** → **UBND cấp xã**; **THPT** → **Sở GDĐT** (Điều 6)."], "bang": [{"tieu_de": "Ai quản lý trường? (Điều 6)", "cot": ["Loại trường", "Cơ quan quản lý", "Góc trái trên biển tên (Điều 5)"], "dong": [["Tiểu học, THCS", "UBND cấp xã", "—"], ["Nhiều cấp, cấp cao nhất là THCS", "UBND cấp xã", "UBND cấp xã + tên xã"], ["THPT", "Sở GDĐT", "UBND cấp tỉnh + Sở GDĐT"], ["Nhiều cấp, cấp cao nhất là THPT", "Sở GDĐT", "UBND cấp tỉnh + Sở GDĐT"]]}, {"tieu_de": "Mốc và con số của Thông tư 15/2026", "cot": ["Nội dung", "Con số"], "dong": [["Ngày ký", "24/3/2026"], ["Hiệu lực", "10/5/2026"], ["Công báo", "Số 244 ngày 23/4/2026"], ["Số điều của Thông tư", "3 điều"], ["Số khoản nhiệm vụ nhà trường (Điều 3)", "11 khoản"], ["Loại hình (Điều 4)", "2: công lập, tư thục"]]}], "vidu": [{"tinh_huong": "Thầy Nam hỏi: trường THCS của mình có tư cách pháp nhân và con dấu riêng hay dùng chung dấu của UBND xã?", "ket_luan": "→ Có con dấu riêng: trường phổ thông có tư cách pháp nhân, tài khoản và con dấu riêng (Điều 2)."}, {"tinh_huong": "Trường THCS Hoa Sen chỉ có cấp THCS. Cô Lan hỏi cơ quan nào quản lý trường và ghi gì ở góc trái trên biển tên.", "ket_luan": "→ UBND cấp xã quản lý (Phòng Văn hóa - Xã hội tham mưu); biển ghi UBND cấp xã và tên xã (Điều 5, Điều 6)."}, {"tinh_huong": "Một trường dự định mô hình nhiều cấp gồm tiểu học, THCS và THPT. Thầy hiệu trưởng hỏi mô hình này có hợp lệ không và do ai quản lý.", "ket_luan": "→ Hợp lệ (Điều 4: TH+THCS+THPT). Cấp cao nhất là THPT nên do Sở GDĐT quản lý (Điều 6)."}, {"tinh_huong": "Một trường tư thục muốn tổ chức theo Điều lệ này nhưng cũng có quy chế riêng. Cô Hạnh hỏi có phải chỉ áp dụng quy chế riêng không.", "ket_luan": "→ Sai: trường tư thục thực hiện Điều lệ này và quy chế riêng của Bộ trưởng (Điều 7)."}], "nho": ["Pháp nhân - Tài khoản - Con dấu = '3 cái riêng' của trường (Điều 2). Thông tư cũng có '3 điều'.", "Cấp cao nhất THCS thì xuống xã, THPT thì lên Sở: thấp - xã, cao - Sở (Điều 6).", "Loại hình chỉ 2: 'công - tư'; nhiều cấp có 3 tổ hợp, đều có THCS (TH+THCS; THCS+THPT; TH+THCS+THPT)."]}, {"id": "L9-2", "ten": "Chương II (1): Cơ cấu tổ chức, Hiệu trưởng, Hội đồng (Điều 8–12)", "tomtat": ["Điều 8: cơ cấu gồm hội đồng trường (**chỉ đối với trường tư thục**), hiệu trưởng và phó hiệu trưởng, hội đồng thi đua khen thưởng, hội đồng kỉ luật, hội đồng tư vấn, tổ chức Đảng, các tổ chuyên môn, tổ văn phòng, lớp học sinh...", "Điều 9: hội đồng trường của trường tư thục là tổ chức quản trị, đại diện nhà đầu tư; thành viên do hội nghị nhà đầu tư bầu, quyết định theo **tỷ lệ vốn góp**.", "Điều 10 khoản 1: hiệu trưởng là nhà giáo giữ chức vụ cán bộ quản lý, chịu **trách nhiệm giải trình cá nhân** về chất lượng giáo dục, an toàn trường học và hoạt động nhà trường.", "Nhiệm kỳ hiệu trưởng là **05 năm**; giữ chức vụ tại một trường công lập **không quá hai nhiệm kỳ liên tiếp** (vùng sâu, vùng xa, đặc biệt khó khăn do cấp bổ nhiệm xem xét quyết định).", "Hiệu trưởng **bổ nhiệm tổ trưởng, tổ phó** và quyết định cử giáo viên làm Tổng phụ trách Đội (Điều 10 khoản 1 điểm d).", "Điều 10 khoản 2: phó hiệu trưởng có nhiệm kỳ **05 năm**; quản lý, điều hành phần việc hiệu trưởng phân công hoặc ủy quyền; chịu trách nhiệm trước hiệu trưởng, cấp có thẩm quyền và pháp luật.", "Điều 10 khoản 3 — tiêu chuẩn hiệu trưởng, phó hiệu trưởng: đạt trình độ chuẩn được đào tạo; đã dạy học **ít nhất 05 năm** (**04 năm** với miền núi, hải đảo, vùng cao, vùng sâu, vùng xa, vùng dân tộc thiểu số, vùng khó khăn) hoặc tổng thời gian giảng dạy và công tác tại cơ quan quản lý giáo dục ít nhất 05 năm; đạt chuẩn hiệu trưởng cơ sở GDPT.", "Điều 11: hội đồng thi đua, khen thưởng do hiệu trưởng thành lập **đầu mỗi năm học**, hiệu trưởng làm chủ tịch, số lượng thành viên là **số lẻ**; họp định kỳ đầu năm học, cuối học kì I, cuối năm học và đột xuất.", "Điều 11: hội đồng kỉ luật xét hoặc xóa kỉ luật đối với cán bộ quản lý, giáo viên, nhân sự hỗ trợ giáo dục theo từng vụ việc; hội đồng tư vấn lập theo nhiệm vụ cụ thể.", "Điều 12: tổ chức Đảng **lãnh đạo toàn diện** nhà trường; đoàn thể, tổ chức xã hội hoạt động theo pháp luật."], "bay": ["⚠ **Hội đồng trường chỉ có ở trường tư thục** — trường công lập không có theo Điều lệ này.", "⚠ **05 năm** (nhiệm kỳ) ≠ **05 năm** (thời gian dạy học tối thiểu) — hai con số 05 khác nghĩa; vùng khó khăn là **04 năm** (thời gian dạy), không phải rút ngắn nhiệm kỳ.", "⚠ \"**Không quá hai nhiệm kỳ liên tiếp**\" áp dụng với hiệu trưởng ở **một trường công lập**; đừng nhầm \"liên tiếp\" với \"cộng dồn\".", "⚠ Số thành viên hội đồng thi đua, khen thưởng là **số lẻ** (không phải số chẵn hay \"ít nhất 7\").", "⚠ \"Hiệu trưởng **bổ nhiệm** tổ trưởng\" ≠ \"giáo viên trong tổ bầu tổ trưởng\"."], "cauhoi": [{"t": "s", "q": "Theo Điều 8 Điều lệ, hội đồng trường được tổ chức đối với loại trường nào?", "o": ["Chỉ trường phổ thông công lập", "Chỉ trường phổ thông tư thục", "Tất cả trường phổ thông", "Trường THPT công lập và trường tư thục"], "a": [1], "e": "Hội đồng trường chỉ có ở trường tư thục (Điều 8, 9); trường công lập không có hội đồng trường theo Điều lệ này.", "r": "Điều 8, Điều 9 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Nhiệm kỳ của hiệu trưởng trường phổ thông là bao lâu?", "o": ["04 năm", "03 năm", "07 năm", "05 năm"], "a": [3], "e": "Điều 10: nhiệm kỳ hiệu trưởng là 05 năm.", "r": "Điều 10 khoản 1 điểm c Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Hiệu trưởng giữ chức vụ tại một trường công lập không quá bao nhiêu nhiệm kỳ liên tiếp?", "o": ["Ba nhiệm kỳ liên tiếp", "Hai nhiệm kỳ cộng dồn trong toàn ngành", "Một nhiệm kỳ", "Hai nhiệm kỳ liên tiếp"], "a": [3], "e": "Điều 10: không quá hai nhiệm kỳ liên tiếp tại một trường công lập; vùng đặc biệt khó khăn do cấp bổ nhiệm xem xét quyết định.", "r": "Điều 10 khoản 1 điểm c Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Hiệu trưởng chịu trách nhiệm giải trình như thế nào theo Điều 10?", "o": ["Giải trình tập thể cùng hội đồng thi đua về chất lượng giáo dục", "Giải trình thay cho cấp quản lý trực tiếp", "Chỉ giải trình về chất lượng giáo dục, không chịu trách nhiệm về an toàn trường học", "Giải trình cá nhân về chất lượng giáo dục, an toàn trường học và hoạt động nhà trường"], "a": [3], "e": "Điều 10 khoản 1: trách nhiệm giải trình cá nhân về chất lượng giáo dục, an toàn trường học và hoạt động nhà trường — đủ 3 nội dung, không phải tập thể.", "r": "Điều 10 khoản 1 điểm a Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Theo tiêu chuẩn hiệu trưởng tại Điều 10, thời gian dạy học tối thiểu đối với người công tác ở vùng sâu, vùng xa là bao nhiêu?", "o": ["05 năm", "04 năm", "02 năm", "03 năm"], "a": [1], "e": "Thông thường ít nhất 05 năm; riêng miền núi, hải đảo, vùng cao, vùng sâu, vùng xa, vùng dân tộc thiểu số, vùng khó khăn là 04 năm.", "r": "Điều 10 khoản 3 điểm b Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Ai bổ nhiệm tổ trưởng, tổ phó của các tổ trong trường phổ thông?", "o": ["Phó hiệu trưởng", "Giáo viên trong tổ bầu", "Hội đồng thi đua, khen thưởng", "Hiệu trưởng"], "a": [3], "e": "Điều 10 khoản 1 điểm d, Điều 13, Điều 14: hiệu trưởng bổ nhiệm tổ trưởng, tổ phó.", "r": "Điều 10, Điều 13, Điều 14 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Ai là chủ tịch hội đồng thi đua, khen thưởng của nhà trường?", "o": ["Tổ trưởng tổ chuyên môn", "Phó hiệu trưởng", "Bí thư chi bộ", "Hiệu trưởng"], "a": [3], "e": "Điều 11: hiệu trưởng thành lập hội đồng đầu mỗi năm học và làm chủ tịch.", "r": "Điều 11 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Số lượng thành viên hội đồng thi đua, khen thưởng theo Điều 11 phải như thế nào?", "o": ["Ít nhất 07 người", "Là số lẻ", "Không quá 09 người", "Là số chẵn"], "a": [1], "e": "Điều 11 quy định số lượng thành viên là số lẻ; không quy định cụ thể 07 hay 09.", "r": "Điều 11 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Theo Điều 12, tổ chức Đảng trong nhà trường giữ vai trò nào?", "o": ["Chỉ đạo riêng về chuyên môn", "Giám sát hoạt động của hiệu trưởng", "Lãnh đạo toàn diện nhà trường", "Quản lý tài chính, tài sản nhà trường"], "a": [2], "e": "Điều 12: tổ chức Đảng lãnh đạo toàn diện nhà trường trong khuôn khổ Hiến pháp, pháp luật, Điều lệ Đảng.", "r": "Điều 12 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về hội đồng trường theo Điều 8 và Điều 9? (chọn tất cả đáp án đúng)", "o": ["Thành viên trong và ngoài trường do hội nghị nhà đầu tư bầu", "Đại diện nhà đầu tư", "Chỉ tổ chức ở trường tư thục", "Là tổ chức quản trị của trường tư thục", "Quyết định theo nguyên tắc mỗi thành viên một phiếu, không phụ thuộc vốn góp"], "a": [0, 1, 2, 3], "e": "Điều 9: quyết định theo tỷ lệ vốn góp, không phải mỗi thành viên một phiếu bằng nhau.", "r": "Điều 8, Điều 9 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Theo Điều 10 khoản 3, tiêu chuẩn của hiệu trưởng, phó hiệu trưởng gồm những điều kiện nào? (chọn tất cả đáp án đúng)", "o": ["Đã dạy học ít nhất 05 năm (04 năm đối với vùng khó khăn)", "Đã dạy học ít nhất 10 năm", "Bắt buộc có trình độ thạc sĩ", "Đạt chuẩn hiệu trưởng cơ sở giáo dục phổ thông", "Đạt trình độ chuẩn được đào tạo của nhà giáo đối với cấp học"], "a": [0, 3, 4], "e": "Điều 10 khoản 3 chỉ yêu cầu trình độ chuẩn, thời gian dạy học (hoặc tương đương) và chuẩn hiệu trưởng; không yêu cầu thạc sĩ hay 10 năm.", "r": "Điều 10 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Hội đồng thi đua, khen thưởng họp định kỳ vào những thời điểm nào? (chọn tất cả đáp án đúng)", "o": ["Đầu mỗi tháng", "Cuối học kì I", "Đột xuất khi cần", "Đầu năm học", "Cuối năm học"], "a": [1, 2, 3, 4], "e": "Điều 11 quy định họp định kỳ đầu năm học, cuối học kì I, cuối năm học và đột xuất; không họp hằng tháng.", "r": "Điều 11 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về cơ cấu tổ chức nhà trường theo Điều 8? (chọn tất cả đáp án đúng)", "o": ["Có hội đồng trường ở mọi loại hình trường", "Có hiệu trưởng và phó hiệu trưởng", "Có tổ chuyên môn và tổ văn phòng", "Có hội đồng quản trị bắt buộc ở trường công lập", "Có hội đồng thi đua, khen thưởng và hội đồng kỉ luật"], "a": [1, 2, 4], "e": "Hội đồng trường chỉ đối với trường tư thục; không có hội đồng quản trị bắt buộc ở trường công lập.", "r": "Điều 8 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "f", "q": "Nhiệm kỳ của hiệu trưởng là ____ năm; giữ chức vụ tại một trường công lập không quá ____ nhiệm kỳ liên tiếp.", "a": [["05", "5"], ["hai", "02", "2"]], "e": "Nhiệm kỳ 05 năm; không quá hai nhiệm kỳ liên tiếp.", "r": "Điều 10 khoản 1 điểm c Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["3", "2"], ["5", "3"], ["5", "hai"], ["7", "2"]], "k": 2}, {"t": "f", "q": "Hiệu trưởng chịu trách nhiệm giải trình ____ về chất lượng giáo dục, an toàn trường học và hoạt động nhà trường.", "a": [["cá nhân"]], "e": "Điều 10 khoản 1: giải trình cá nhân.", "r": "Điều 10 khoản 1 điểm a Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["tập thể"], ["chung"], ["trực tiếp"], ["cá nhân"]], "k": 3}, {"t": "f", "q": "Hiệu trưởng, phó hiệu trưởng phải đã dạy học ít nhất ____ năm (____ năm với vùng khó khăn như miền núi, hải đảo, vùng sâu, vùng xa).", "a": [["05", "5"], ["04", "4"]], "e": "Ít nhất 05 năm; vùng khó khăn là 04 năm.", "r": "Điều 10 khoản 3 điểm b Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["5", "4"], ["3", "2"], ["5", "3"], ["7", "5"]], "k": 0}, {"t": "f", "q": "Hội đồng thi đua, khen thưởng có số lượng thành viên là số ____ và do hiệu trưởng thành lập vào ____ mỗi năm học.", "a": [["lẻ"], ["đầu"]], "e": "Số lẻ; thành lập đầu mỗi năm học.", "r": "Điều 11 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["chẵn", "đầu"], ["lẻ", "cuối"], ["lẻ", "đầu"], ["lẻ", "giữa"]], "k": 2}, {"t": "f", "q": "Hội đồng trường chỉ có đối với trường phổ thông ____.", "a": [["tư thục"]], "e": "Chỉ trường tư thục có hội đồng trường.", "r": "Điều 8, Điều 9 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["công lập"], ["dân tộc nội trú"], ["chuyên biệt"], ["tư thục"]], "k": 3}], "ynho": ["Hội đồng trường **chỉ có ở trường tư thục** (Điều 8, 9).", "Nhiệm kỳ hiệu trưởng và phó hiệu trưởng là **05 năm**.", "Hiệu trưởng giữ chức một trường công lập **không quá hai nhiệm kỳ liên tiếp**.", "Đã dạy học **ít nhất 05 năm** (**04 năm** vùng khó khăn) mới đủ tiêu chuẩn.", "Hội đồng thi đua, khen thưởng: số thành viên là **số lẻ**, lập **đầu mỗi năm học**."], "bang": [{"tieu_de": "Hiệu trưởng và phó hiệu trưởng (Điều 10)", "cot": ["Nội dung", "Hiệu trưởng", "Phó hiệu trưởng"], "dong": [["Nhiệm kỳ", "05 năm", "05 năm"], ["Giới hạn nhiệm kỳ", "Không quá 2 nhiệm kỳ liên tiếp tại một trường công lập", "Điều 10 khoản 2 không quy định giới hạn"], ["Trách nhiệm", "Giải trình cá nhân về chất lượng, an toàn trường học", "Trước hiệu trưởng, cấp có thẩm quyền và pháp luật"], ["Việc được giao", "Bổ nhiệm tổ trưởng, tổ phó", "Phần việc hiệu trưởng phân công hoặc ủy quyền"]]}, {"tieu_de": "Các hội đồng và tổ chức (Điều 8–12)", "cot": ["Tên", "Ai lập / đặc điểm"], "dong": [["Hội đồng trường", "Chỉ trường tư thục; nhà đầu tư bầu, theo tỷ lệ vốn góp"], ["Hội đồng thi đua, khen thưởng", "Hiệu trưởng lập đầu năm học, làm chủ tịch, số lẻ"], ["Hội đồng kỉ luật", "Xét hoặc xóa kỉ luật theo từng vụ việc"], ["Hội đồng tư vấn", "Lập theo nhiệm vụ cụ thể"], ["Tổ chức Đảng", "Lãnh đạo toàn diện nhà trường"]]}], "vidu": [{"tinh_huong": "Phụ huynh hỏi trường THCS công lập của em có hội đồng trường như trường tư thục không.", "ket_luan": "→ Không: hội đồng trường chỉ đối với trường tư thục (Điều 8, Điều 9)."}, {"tinh_huong": "Thầy Bình đã dạy học 04 năm tại một xã vùng cao và được đề nghị làm phó hiệu trưởng. Thầy đã đủ thời gian dạy học theo tiêu chuẩn chưa (các tiêu chuẩn khác đã đủ)?", "ket_luan": "→ Đủ: vùng cao, vùng khó khăn chỉ cần 04 năm dạy học (Điều 10 khoản 3)."}, {"tinh_huong": "Hiệu trưởng một trường THCS công lập hết hai nhiệm kỳ liên tiếp tại trường này. Có được bổ nhiệm tiếp nhiệm kỳ thứ ba ở cùng trường không?", "ket_luan": "→ Không (trừ vùng sâu, vùng xa, đặc biệt khó khăn do cấp bổ nhiệm xem xét): không quá hai nhiệm kỳ liên tiếp (Điều 10 khoản 1)."}, {"tinh_huong": "Đầu năm học, hiệu trưởng thành lập hội đồng thi đua, khen thưởng gồm 8 thành viên, tự làm chủ tịch.", "ket_luan": "→ Sai ở số lượng: chủ tịch là hiệu trưởng đúng, nhưng số thành viên phải là số lẻ (Điều 11)."}, {"tinh_huong": "Cô Mai là tổ trưởng chuyên môn do hiệu trưởng bổ nhiệm. Một giáo viên cho rằng tổ phải tự bầu tổ trưởng.", "ket_luan": "→ Sai: hiệu trưởng bổ nhiệm tổ trưởng, tổ phó (Điều 10 khoản 1 điểm d)."}], "nho": ["'5-5-4': nhiệm kỳ 05 năm; dạy ít nhất 05 năm; vùng khó khăn rút còn 04 năm (chỉ rút thời gian dạy).", "Hội đồng trường = 'T' của Tư thục: chỉ trường Tư có.", "Hội đồng thi đua: 'Lẻ - Đầu năm - Hiệu trưởng làm chủ tịch'."]}, {"id": "L9-3", "ten": "Chương II (2): Tổ chuyên môn, Tổ văn phòng, Lớp học (Điều 13–16)", "tomtat": ["Điều 13: hiệu trưởng, phó hiệu trưởng, giáo viên, nhân sự thư viện, thiết bị, tư vấn học sinh được tổ chức thành **tổ chuyên môn**; có tổ trưởng; từ **07 thành viên** trở lên có **tổ phó**.", "Tổ trưởng, tổ phó tổ chuyên môn do **hiệu trưởng bổ nhiệm**; tổ chuyên môn sinh hoạt **ít nhất 01 lần trong 02 tuần**, có thể họp đột xuất.", "Nhiệm vụ tổ chuyên môn: tham gia xây dựng kế hoạch giáo dục; thực hiện linh hoạt kế hoạch của tổ; đề xuất tài liệu, học liệu; đề xuất phân công dạy và chủ nhiệm; tham gia đánh giá, xếp loại giáo viên theo chuẩn nghề nghiệp; bồi dưỡng chuyên môn.", "Điều 14: **tổ văn phòng** gồm văn thư, kế toán, thủ quỹ, y tế, CNTT, giáo vụ, bảo vệ...; từ 07 thành viên có tổ phó; tổ trưởng, tổ phó do hiệu trưởng bổ nhiệm; sinh hoạt **ít nhất 01 lần/tháng**.", "Điều 15: tổ giáo dục đặc thù trong trường chuyên biệt hoạt động theo quy chế riêng.", "Điều 16 khoản 1: lớp có lớp trưởng, các lớp phó do **học sinh bầu** vào đầu năm học; lớp chia thành tổ học sinh có tổ trưởng, tổ phó.", "Điều 16 khoản 3 — **sĩ số**: Chủ tịch UBND cấp tỉnh quy định cụ thể theo hướng giảm sĩ số; mỗi lớp **không quá 35** học sinh cấp tiểu học, **không quá 45** học sinh cấp THCS và THPT.", "Điều 16 khoản 5: lớp hòa nhập không quá **02** học sinh khuyết tật (trường hợp đặc biệt hiệu trưởng căn cứ thực tế).", "Điều 16 khoản 6: lớp ghép (miền núi, vùng sâu, vùng xa, đặc biệt khó khăn) không quá **02 nhóm trình độ** (đặc biệt không quá 03) và không quá **15 học sinh**.", "Điều 16 khoản 8: điểm trường do **phó hiệu trưởng** phụ trách."], "bay": ["⚠ Tổ chuyên môn sinh hoạt **ít nhất 01 lần/02 tuần**; tổ văn phòng **ít nhất 01 lần/tháng** — dễ đổi cho nhau.", "⚠ Tổ phó khi từ **07** thành viên trở lên (cả tổ chuyên môn lẫn tổ văn phòng), không phải 05 hay 10.", "⚠ Sĩ số: tiểu học **35**, THCS và THPT **45**; do **Chủ tịch UBND cấp tỉnh** quy định cụ thể (không phải hiệu trưởng hay Bộ trưởng).", "⚠ Lớp trưởng do **học sinh bầu**, không phải giáo viên chủ nhiệm chỉ định; lớp hòa nhập **02** học sinh khuyết tật, lớp ghép **15** học sinh."], "cauhoi": [{"t": "s", "q": "Tổ chuyên môn có từ bao nhiêu thành viên trở lên thì có tổ phó?", "o": ["05 thành viên", "07 thành viên", "10 thành viên", "09 thành viên"], "a": [1], "e": "Điều 13: từ 07 thành viên trở lên có tổ phó.", "r": "Điều 13 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Tổ chuyên môn sinh hoạt như thế nào theo Điều 13?", "o": ["Tối đa 01 lần trong 02 tuần", "Ít nhất 01 lần mỗi tuần", "Ít nhất 01 lần trong 02 tuần", "Ít nhất 01 lần mỗi tháng"], "a": [2], "e": "Điều 13: ít nhất 01 lần trong 02 tuần; 01 lần/tháng là của tổ văn phòng. \"Tối đa\" đảo nghĩa \"ít nhất\".", "r": "Điều 13 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Tổ văn phòng sinh hoạt ít nhất bao lâu một lần?", "o": ["01 lần trong 02 tuần", "01 lần/tuần", "01 lần/tháng", "01 lần/học kì"], "a": [2], "e": "Điều 14: tổ văn phòng ít nhất 01 lần/tháng; tổ chuyên môn là 01 lần trong 02 tuần.", "r": "Điều 14 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Mỗi lớp cấp tiểu học có không quá bao nhiêu học sinh theo Điều 16?", "o": ["45 học sinh", "35 học sinh", "40 học sinh", "30 học sinh"], "a": [1], "e": "Tiểu học không quá 35; THCS, THPT không quá 45.", "r": "Điều 16 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Mỗi lớp cấp THCS và THPT có không quá bao nhiêu học sinh theo Điều 16?", "o": ["45 học sinh", "35 học sinh", "40 học sinh", "50 học sinh"], "a": [0], "e": "Điều 16 khoản 3: không quá 45 học sinh cấp THCS và THPT; 35 là của tiểu học.", "r": "Điều 16 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Ai quy định cụ thể sĩ số học sinh mỗi lớp theo hướng giảm sĩ số?", "o": ["Hiệu trưởng", "Chủ tịch UBND cấp xã", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Chủ tịch UBND cấp tỉnh"], "a": [3], "e": "Điều 16 khoản 3: Chủ tịch UBND cấp tỉnh quy định cụ thể, theo hướng giảm sĩ số.", "r": "Điều 16 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Lớp hòa nhập có không quá bao nhiêu học sinh khuyết tật theo Điều 16?", "o": ["03 học sinh", "05 học sinh", "02 học sinh", "01 học sinh"], "a": [2], "e": "Điều 16 khoản 5: không quá 02 học sinh khuyết tật (trường hợp đặc biệt hiệu trưởng căn cứ thực tế).", "r": "Điều 16 khoản 5 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Lớp ghép ở vùng đặc biệt khó khăn có không quá bao nhiêu học sinh?", "o": ["35 học sinh", "15 học sinh", "20 học sinh", "25 học sinh"], "a": [1], "e": "Điều 16 khoản 6: lớp ghép không quá 02 nhóm trình độ (đặc biệt không quá 03) và không quá 15 học sinh.", "r": "Điều 16 khoản 6 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Lớp trưởng và các lớp phó được xác định bằng cách nào theo Điều 16?", "o": ["Do học sinh bầu vào đầu năm học", "Do giáo viên chủ nhiệm chỉ định", "Do Ban đại diện cha mẹ học sinh cử", "Do hiệu trưởng bổ nhiệm"], "a": [0], "e": "Điều 16 khoản 1: học sinh bầu vào đầu năm học (ứng cử hoặc giáo viên chủ nhiệm giới thiệu).", "r": "Điều 16 khoản 1 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về tổ chuyên môn và tổ văn phòng (Điều 13, 14)? (chọn tất cả đáp án đúng)", "o": ["Tổ chuyên môn sinh hoạt ít nhất 01 lần trong 02 tuần", "Tổ trưởng, tổ phó do hiệu trưởng bổ nhiệm", "Tổ văn phòng sinh hoạt ít nhất 01 lần trong 02 tuần", "Tổ trưởng do giáo viên trong tổ bầu", "Cả hai tổ từ 07 thành viên trở lên có tổ phó"], "a": [0, 1, 4], "e": "Tổ văn phòng sinh hoạt 01 lần/tháng; tổ trưởng do hiệu trưởng bổ nhiệm, không do tổ bầu.", "r": "Điều 13, Điều 14 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Nhiệm vụ nào sau đây thuộc tổ chuyên môn theo Điều 13? (chọn tất cả đáp án đúng)", "o": ["Tham gia xây dựng kế hoạch giáo dục", "Tham gia đánh giá, xếp loại giáo viên theo chuẩn nghề nghiệp", "Đề xuất phân công giáo viên dạy và chủ nhiệm", "Bồi dưỡng chuyên môn", "Bổ nhiệm tổ trưởng, tổ phó"], "a": [0, 1, 2, 3], "e": "Bổ nhiệm tổ trưởng, tổ phó là quyền của hiệu trưởng.", "r": "Điều 13 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về lớp ghép theo Điều 16 khoản 6? (chọn tất cả đáp án đúng)", "o": ["Trường hợp đặc biệt không quá 03 nhóm trình độ", "Không quá 15 học sinh", "Không quá 25 học sinh", "Áp dụng ở miền núi, vùng sâu, vùng xa, vùng đặc biệt khó khăn", "Không quá 02 nhóm trình độ"], "a": [0, 1, 3, 4], "e": "Lớp ghép không quá 15 học sinh; 25 là số bịa.", "r": "Điều 16 khoản 6 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về sĩ số lớp theo Điều 16 khoản 3? (chọn tất cả đáp án đúng)", "o": ["Bộ trưởng quy định cụ thể sĩ số từng lớp", "Cấp THCS không quá 45 học sinh", "Cấp THPT không quá 45 học sinh", "Chủ tịch UBND cấp tỉnh quy định cụ thể theo hướng giảm sĩ số", "Cấp tiểu học không quá 35 học sinh"], "a": [1, 2, 3, 4], "e": "Người quy định cụ thể là Chủ tịch UBND cấp tỉnh, không phải Bộ trưởng.", "r": "Điều 16 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "f", "q": "Tổ chuyên môn có từ ____ thành viên trở lên thì có tổ phó.", "a": [["07", "7", "bảy"]], "e": "Điều 13: từ 07 thành viên.", "r": "Điều 13 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["7"], ["5"], ["9"], ["10"]], "k": 0}, {"t": "f", "q": "Tổ chuyên môn sinh hoạt ít nhất ____ lần trong ____ tuần.", "a": [["01", "1", "một"], ["02", "2", "hai"]], "e": "Điều 13: ít nhất 01 lần trong 02 tuần.", "r": "Điều 13 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["2", "2"], ["1", "2"], ["1", "1"], ["1", "4"]], "k": 1}, {"t": "f", "q": "Tổ văn phòng sinh hoạt ít nhất 01 lần/____.", "a": [["tháng"]], "e": "Điều 14: ít nhất 01 lần/tháng.", "r": "Điều 14 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["tuần"], ["quý"], ["học kỳ"], ["tháng"]], "k": 3}, {"t": "f", "q": "Mỗi lớp không quá ____ học sinh cấp tiểu học và không quá ____ học sinh cấp THCS, THPT.", "a": [["35", "ba mươi lăm"], ["45", "bốn mươi lăm"]], "e": "Tiểu học 35; THCS, THPT 45.", "r": "Điều 16 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["35", "45"], ["30", "45"], ["35", "50"], ["40", "40"]], "k": 0}, {"t": "f", "q": "Điểm trường do ____ phụ trách.", "a": [["phó hiệu trưởng"]], "e": "Điều 16 khoản 8: phó hiệu trưởng phụ trách điểm trường.", "r": "Điều 16 khoản 8 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["hiệu trưởng"], ["phó hiệu trưởng"], ["tổ trưởng chuyên môn"], ["giáo viên chủ nhiệm"]], "k": 1}], "ynho": ["Từ **07 thành viên** trở lên có **tổ phó** (tổ chuyên môn và tổ văn phòng).", "Tổ chuyên môn sinh hoạt **ít nhất 01 lần/02 tuần**; tổ văn phòng **01 lần/tháng**.", "Sĩ số: tiểu học **không quá 35**; THCS, THPT **không quá 45**.", "Chủ tịch **UBND cấp tỉnh** quy định cụ thể sĩ số, theo hướng giảm.", "Lớp hòa nhập **02** học sinh khuyết tật; lớp ghép **15** học sinh, **02** nhóm trình độ."], "bang": [{"tieu_de": "Tổ chuyên môn và tổ văn phòng", "cot": ["Nội dung", "Tổ chuyên môn (Điều 13)", "Tổ văn phòng (Điều 14)"], "dong": [["Thành viên", "Hiệu trưởng, phó HT, giáo viên, nhân sự thư viện, thiết bị, tư vấn học sinh", "Văn thư, kế toán, thủ quỹ, y tế, CNTT, giáo vụ, bảo vệ..."], ["Tổ phó khi", "Từ 07 thành viên", "Từ 07 thành viên"], ["Ai bổ nhiệm tổ trưởng, tổ phó", "Hiệu trưởng", "Hiệu trưởng"], ["Sinh hoạt", "Ít nhất 01 lần/02 tuần", "Ít nhất 01 lần/tháng"]]}, {"tieu_de": "Con số về lớp học (Điều 16)", "cot": ["Nội dung", "Con số"], "dong": [["Sĩ số tiểu học", "Không quá 35"], ["Sĩ số THCS, THPT", "Không quá 45"], ["Lớp hòa nhập", "Không quá 02 học sinh khuyết tật"], ["Lớp ghép", "Không quá 02 nhóm trình độ (đặc biệt 03); không quá 15 học sinh"], ["Lớp trưởng, lớp phó", "Học sinh bầu đầu năm học"], ["Điểm trường", "Phó hiệu trưởng phụ trách"]]}], "vidu": [{"tinh_huong": "Tổ Tin học - Công nghệ của trường THCS có 8 giáo viên. Tổ có cần tổ phó không và ai bổ nhiệm?", "ket_luan": "→ Có: từ 07 thành viên có tổ phó, do hiệu trưởng bổ nhiệm (Điều 13)."}, {"tinh_huong": "Tổ chuyên môn của cô Thu họp một lần mỗi tháng. Cô hỏi như vậy có đủ không.", "ket_luan": "→ Chưa đủ: tổ chuyên môn sinh hoạt ít nhất 01 lần trong 02 tuần (Điều 13); 01 lần/tháng là mức của tổ văn phòng (Điều 14)."}, {"tinh_huong": "Một lớp 7 có 46 học sinh. Hiệu trưởng cho rằng chấp nhận được vì thiếu phòng.", "ket_luan": "→ Vi phạm mức trần: lớp THCS không quá 45 học sinh (Điều 16 khoản 3); sĩ số cụ thể do Chủ tịch UBND cấp tỉnh quy định theo hướng giảm."}, {"tinh_huong": "Đầu năm học, cô giáo chủ nhiệm tự chỉ định lớp trưởng và các lớp phó.", "ket_luan": "→ Sai cách làm: lớp trưởng, lớp phó do học sinh bầu vào đầu năm học (Điều 16 khoản 1)."}, {"tinh_huong": "Một lớp ghép ở vùng đặc biệt khó khăn có 17 học sinh thuộc 2 nhóm trình độ.", "ket_luan": "→ Vượt mức: lớp ghép không quá 15 học sinh (Điều 16 khoản 6)."}], "nho": ["'Bảy có phó': đủ 07 người thì có tổ phó. Chuyên môn 'hai tuần', văn phòng 'một tháng'.", "Sĩ số '35 - 45': tiểu học nhỏ nhẹ 35; THCS, THPT 45.", "Hòa nhập 02, ghép 15 (và 02 nhóm trình độ): số 2 đi với hòa nhập, số 15 đi với lớp ghép."]}, {"id": "L9-4", "ten": "Chương III–IV: Hoạt động giáo dục, Giáo viên và nhân sự hỗ trợ (Điều 17–30)", "tomtat": ["Điều 17: nhà trường thực hiện CTGDPT do Bộ trưởng ban hành và **khung kế hoạch thời gian năm học** theo quy định của Bộ GDĐT phù hợp địa phương, nhà trường.", "Điều 17 khoản 3: trường dạy 2 buổi/ngày tăng trải nghiệm, STEM/STEAM, năng lực số, AI, tiếng Anh; học sinh vui chơi, hoạt động ngoài trời **01 giờ/ngày**.", "Điều 19: hoạt động giáo dục gồm học lí thuyết, bài tập, thực hành, thí nghiệm, dự án học tập, tham quan, trải nghiệm, đọc sách, sinh hoạt tập thể, câu lạc bộ, phục vụ cộng đồng.", "Điều 21: giáo viên có **kế hoạch bài dạy (giáo án)**; GVCN có **sổ chủ nhiệm**; Tổng phụ trách Đội có **sổ công tác Đội**.", "Điều 21 khoản 4: hồ sơ quản lý chủ yếu ở dạng **điện tử**, có giá trị pháp lý **tương đương** hồ sơ giấy; đã dùng hồ sơ điện tử hợp pháp thì **không bắt buộc** lập hồ sơ giấy.", "Điều 22: đánh giá toàn diện, công bằng, trung thực, khách quan; chú trọng đánh giá **quá trình**; **không so sánh** học sinh này với học sinh khác; bảo mật thông tin, kết quả học tập; không gây áp lực.", "Điều 22 khoản 4: học sinh học hết chương trình THCS đủ điều kiện được **hiệu trưởng trường THCS xác nhận vào học bạ**; THPT thi tốt nghiệp, cấp bằng.", "Điều 26 khoản 2: **GVCN** tổng hợp nhận xét, đánh giá học sinh cuối kỳ I và cuối năm học, hoàn chỉnh học bạ, báo cáo hiệu trưởng; **Tổng phụ trách Đội** (trường có TH, THCS), **Bí thư Đoàn** (trường có THPT) chịu trách nhiệm trước hiệu trưởng.", "Điều 26 khoản 3: quyền, nghĩa vụ giáo viên theo **Luật Nhà giáo**; GVCN được cho phép học sinh có lý do chính đáng nghỉ học **không quá 03 ngày liên tục**, được dự giờ lớp mình, được giảm định mức tiết dạy.", "Điều 29: giáo viên thực hiện **quy tắc ứng xử của nhà giáo** theo quy định của Bộ GDĐT; nhân sự hỗ trợ giáo dục thực hiện **theo pháp luật**."], "bay": ["⚠ GVCN được cho nghỉ **không quá 03 ngày liên tục** (không phải 01 ngày hay 07 ngày).", "⚠ Hồ sơ điện tử có giá trị pháp lý **tương đương** hồ sơ giấy (không \"thấp hơn\", không \"phải kèm bản giấy\").", "⚠ Hiệu trưởng THCS **xác nhận vào học bạ** hoàn thành chương trình THCS — không còn là \"cấp bằng tốt nghiệp THCS\".", "⚠ Điều 22: **không so sánh** học sinh với nhau — khác với \"khuyến khích thi đua xếp hạng\".", "⚠ Giáo viên theo quy tắc ứng xử **của nhà giáo**; nhân sự hỗ trợ giáo dục thực hiện **theo pháp luật** (chủ thể khác nhau)."], "cauhoi": [{"t": "s", "q": "Theo Điều 17, nhà trường thực hiện khung kế hoạch thời gian năm học theo quy định của cơ quan nào?", "o": ["Chủ tịch UBND cấp xã", "Thủ tướng Chính phủ", "Bộ Giáo dục và Đào tạo", "Hiệu trưởng tự quyết định hoàn toàn"], "a": [2], "e": "Điều 17 khoản 1: khung kế hoạch thời gian năm học theo quy định của Bộ GDĐT, phù hợp địa phương và nhà trường.", "r": "Điều 17 khoản 1 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Trường dạy học 2 buổi/ngày bảo đảm cho học sinh vui chơi, hoạt động ngoài trời bao lâu mỗi ngày?", "o": ["01 giờ/ngày", "45 phút/ngày", "02 giờ/ngày", "30 phút/ngày"], "a": [0], "e": "Điều 17 khoản 3: 01 giờ/ngày.", "r": "Điều 17 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Hồ sơ nào là hồ sơ của Tổng phụ trách Đội theo Điều 21?", "o": ["Sổ chủ nhiệm", "Kế hoạch bài dạy (giáo án)", "Sổ đăng bộ", "Sổ công tác Đội"], "a": [3], "e": "Điều 21: giáo viên có kế hoạch bài dạy; GVCN có sổ chủ nhiệm; Tổng phụ trách Đội có sổ công tác Đội.", "r": "Điều 21 khoản 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Theo Điều 21 khoản 4, giá trị pháp lý của hồ sơ điện tử so với hồ sơ giấy như thế nào?", "o": ["Thấp hơn, chỉ để tham khảo", "Chỉ có giá trị khi kèm bản giấy", "Tương đương", "Cao hơn hồ sơ giấy"], "a": [2], "e": "Điều 21 khoản 4: hồ sơ điện tử có giá trị pháp lý tương đương hồ sơ giấy; đã dùng hồ sơ điện tử hợp pháp thì không bắt buộc lập hồ sơ giấy.", "r": "Điều 21 khoản 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Phát biểu nào đúng về đánh giá học sinh theo Điều 22?", "o": ["Công khai kết quả học tập của từng học sinh trước cả lớp", "Chú trọng đánh giá tổng kết cuối kì hơn đánh giá quá trình", "Không so sánh học sinh này với học sinh khác và bảo mật thông tin, kết quả học tập", "Có thể so sánh học sinh với nhau nhằm tạo động lực học tập"], "a": [2], "e": "Điều 22: chú trọng đánh giá quá trình, không so sánh học sinh, bảo mật thông tin, không gây áp lực.", "r": "Điều 22 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Học sinh học hết chương trình THCS đủ điều kiện thì được xác nhận hoàn thành chương trình như thế nào?", "o": ["Giám đốc Sở GDĐT cấp bằng tốt nghiệp THCS", "Chủ tịch UBND cấp xã cấp giấy chứng nhận", "Hiệu trưởng cấp bằng tốt nghiệp THCS", "Hiệu trưởng trường THCS xác nhận vào học bạ"], "a": [3], "e": "Điều 22 khoản 4: hiệu trưởng trường THCS xác nhận vào học bạ; không cấp bằng tốt nghiệp THCS trong điều này. Bằng tốt nghiệp là của THPT.", "r": "Điều 22 khoản 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Giáo viên chủ nhiệm được cho phép cá nhân học sinh có lý do chính đáng nghỉ học tối đa bao lâu?", "o": ["Không quá 05 ngày liên tục", "Không quá 03 ngày liên tục", "Không quá 01 ngày", "Không quá 07 ngày liên tục"], "a": [1], "e": "Điều 26 khoản 3: không quá 03 ngày liên tục.", "r": "Điều 26 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Nhân sự hỗ trợ giáo dục thực hiện quy tắc ứng xử theo quy định nào theo Điều 29?", "o": ["Nội quy học sinh", "Theo quy định của pháp luật", "Quy tắc ứng xử của nhà giáo do Bộ GDĐT quy định", "Điều lệ Đảng"], "a": [1], "e": "Điều 29: giáo viên thực hiện quy tắc ứng xử của nhà giáo theo Bộ GDĐT; nhân sự hỗ trợ giáo dục thực hiện theo pháp luật.", "r": "Điều 29 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Quyền và nghĩa vụ của giáo viên trường phổ thông được xác định theo văn bản nào (Điều 26 khoản 3)?", "o": ["Luật Nhà giáo", "Luật Giáo dục 2019", "Luật Viên chức", "Bộ luật Lao động"], "a": [0], "e": "Điều 26 khoản 3 dẫn chiếu Luật Nhà giáo.", "r": "Điều 26 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Hồ sơ nào sau đây phù hợp với quy định tại Điều 21? (chọn tất cả đáp án đúng)", "o": ["Hồ sơ điện tử có giá trị pháp lý tương đương hồ sơ giấy", "Đã dùng hồ sơ điện tử hợp pháp vẫn bắt buộc lập hồ sơ giấy", "Tổng phụ trách Đội có sổ công tác Đội", "Giáo viên có kế hoạch bài dạy (giáo án)", "Giáo viên chủ nhiệm có sổ chủ nhiệm"], "a": [0, 2, 3, 4], "e": "Điều 21 khoản 4: đã dùng hồ sơ điện tử hợp pháp thì không bắt buộc lập hồ sơ giấy.", "r": "Điều 21 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Giáo viên chủ nhiệm có quyền nào sau đây theo Điều 26 khoản 3? (chọn tất cả đáp án đúng)", "o": ["Được giảm định mức tiết dạy", "Dự lớp bồi dưỡng về công tác chủ nhiệm", "Cho phép học sinh có lý do chính đáng nghỉ không quá 03 ngày liên tục", "Tự bổ nhiệm lớp trưởng không qua bầu", "Dự giờ học, hoạt động giáo dục của lớp mình"], "a": [0, 1, 2, 4], "e": "Lớp trưởng do học sinh bầu (Điều 16).", "r": "Điều 26 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Nhiệm vụ nào thuộc giáo viên chủ nhiệm theo Điều 26 khoản 2? (chọn tất cả đáp án đúng)", "o": ["Cấp bằng tốt nghiệp THPT", "Tổng hợp nhận xét, đánh giá học sinh cuối kỳ I và cuối năm học", "Báo cáo thường kỳ hoặc đột xuất với hiệu trưởng", "Hướng dẫn, quản lý học sinh tham gia hoạt động trải nghiệm, hướng nghiệp", "Hoàn chỉnh việc ghi học bạ"], "a": [1, 2, 3, 4], "e": "Cấp bằng tốt nghiệp THPT là thẩm quyền của hiệu trưởng trường THPT, không phải GVCN.", "r": "Điều 26 khoản 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Điều 22 nêu những yêu cầu nào đối với việc đánh giá học sinh? (chọn tất cả đáp án đúng)", "o": ["Công khai xếp hạng học sinh để thúc đẩy thi đua", "Toàn diện, công bằng, trung thực, khách quan", "Chú trọng đánh giá quá trình", "Không gây áp lực cho học sinh, giáo viên, cha mẹ học sinh", "Không so sánh học sinh này với học sinh khác"], "a": [1, 2, 3, 4], "e": "Điều 22 cấm so sánh học sinh, không gây áp lực.", "r": "Điều 22 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "f", "q": "Giáo viên thực hiện ____ của nhà giáo theo quy định của Bộ Giáo dục và Đào tạo.", "a": [["quy tắc ứng xử"]], "e": "Điều 29: quy tắc ứng xử của nhà giáo.", "r": "Điều 29 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["đạo đức nghề nghiệp"], ["nghĩa vụ"], ["quy tắc ứng xử"], ["chuẩn nghề nghiệp"]], "k": 2}, {"t": "f", "q": "Hồ sơ quản lý chủ yếu ở dạng ____, có giá trị pháp lý ____ hồ sơ giấy.", "a": [["điện tử"], ["tương đương"]], "e": "Điều 21 khoản 4.", "r": "Điều 21 khoản 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["điện tử", "tương đương"], ["giấy", "tương đương"], ["điện tử", "thấp hơn"], ["điện tử", "cao hơn"]], "k": 0}, {"t": "f", "q": "Giáo viên chủ nhiệm được cho phép học sinh có lý do chính đáng nghỉ học không quá ____ ngày liên tục.", "a": [["03", "3", "ba"]], "e": "Điều 26 khoản 3: không quá 03 ngày liên tục.", "r": "Điều 26 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["5"], ["3"], ["7"], ["2"]], "k": 1}, {"t": "f", "q": "Việc đánh giá học sinh không ____ học sinh này với học sinh khác.", "a": [["so sánh"]], "e": "Điều 22: không so sánh học sinh này với học sinh khác.", "r": "Điều 22 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["xếp loại"], ["đánh đồng"], ["so sánh"], ["thi đua"]], "k": 2}, {"t": "f", "q": "Trường dạy 2 buổi/ngày bảo đảm học sinh vui chơi, hoạt động ngoài trời ____ giờ/ngày.", "a": [["01", "1", "một"]], "e": "Điều 17 khoản 3: 01 giờ/ngày.", "r": "Điều 17 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["2"], ["3"], ["0,5"], ["1"]], "k": 3}], "ynho": ["Hồ sơ điện tử có giá trị pháp lý **tương đương** hồ sơ giấy (Điều 21).", "Giáo viên có **kế hoạch bài dạy (giáo án)**; GVCN có **sổ chủ nhiệm**.", "Đánh giá học sinh: **không so sánh** học sinh này với học sinh khác (Điều 22).", "GVCN cho học sinh nghỉ **không quá 03 ngày liên tục** (Điều 26).", "Học hết THCS: **hiệu trưởng xác nhận vào học bạ** (Điều 22 khoản 4)."], "bang": [{"tieu_de": "Hồ sơ và người phụ trách (Điều 21, Điều 26)", "cot": ["Đối tượng", "Hồ sơ / việc chính"], "dong": [["Giáo viên", "Kế hoạch bài dạy (giáo án)"], ["Giáo viên chủ nhiệm", "Sổ chủ nhiệm; tổng hợp đánh giá cuối kỳ I, cuối năm; hoàn chỉnh học bạ"], ["Tổng phụ trách Đội", "Sổ công tác Đội"], ["Hiệu trưởng THCS", "Xác nhận hoàn thành chương trình THCS vào học bạ"]]}, {"tieu_de": "Quy tắc ứng xử và quyền riêng của GVCN", "cot": ["Nội dung", "Quy định"], "dong": [["Giáo viên (Điều 29)", "Thực hiện quy tắc ứng xử của nhà giáo theo quy định của Bộ GDĐT"], ["Nhân sự hỗ trợ giáo dục (Điều 29)", "Thực hiện theo pháp luật"], ["GVCN cho nghỉ học (Điều 26)", "Lý do chính đáng, không quá 03 ngày liên tục"], ["Quyền, nghĩa vụ giáo viên (Điều 26)", "Theo Luật Nhà giáo"]]}], "vidu": [{"tinh_huong": "Nhà trường đã dùng sổ chủ nhiệm điện tử hợp pháp. Thầy tổng phụ trách hỏi có phải in thêm bản giấy không.", "ket_luan": "→ Không bắt buộc: hồ sơ điện tử có giá trị pháp lý tương đương hồ sơ giấy (Điều 21 khoản 4)."}, {"tinh_huong": "Em Hùng ốm nên gia đình xin cho nghỉ 5 ngày liên tục. Cô chủ nhiệm tự cho phép.", "ket_luan": "→ Vượt thẩm quyền: GVCN chỉ cho nghỉ không quá 03 ngày liên tục (Điều 26 khoản 3)."}, {"tinh_huong": "Cô Phương nhận xét trước lớp: 'Em A học kém hơn em B nhiều'. Cô cho rằng đây là đánh giá công bằng.", "ket_luan": "→ Sai: đánh giá không so sánh học sinh này với học sinh khác, đồng thời phải bảo mật kết quả học tập (Điều 22)."}, {"tinh_huong": "Em Lan học hết chương trình THCS. Ai xác nhận vào học bạ việc hoàn thành chương trình?", "ket_luan": "→ Hiệu trưởng trường THCS xác nhận vào học bạ (Điều 22 khoản 4)."}, {"tinh_huong": "Cô Hoa, giáo viên Tin học, cần căn cứ nào về ứng xử với học sinh theo Điều lệ?", "ket_luan": "→ Quy tắc ứng xử của nhà giáo theo quy định của Bộ GDĐT (Điều 29); quyền, nghĩa vụ theo Luật Nhà giáo (Điều 26 khoản 3)."}], "nho": ["Ba người - ba sổ: Giáo viên - giáo án; GVCN - sổ chủ nhiệm; Tổng phụ trách Đội - sổ công tác Đội.", "'Điện tử = giấy': hồ sơ điện tử tương đương, không thấp hơn, không phải kèm giấy.", "GVCN chỉ cho nghỉ tối đa '3 ngày liên tục', lý do phải chính đáng."]}, {"id": "L9-5", "ten": "Chương V: Nhiệm vụ và quyền của học sinh (Điều 31–34)", "tomtat": ["Điều 31 khoản 1: tuổi vào lớp 1 là **06 tuổi**; một số đối tượng (khuyết tật, dân tộc thiểu số, mồ côi không nơi nương tựa, ở nước ngoài về...) được vào lớp 1 cao hơn tuổi nhưng **không quá 03 tuổi**.", "Vượt quá 03 tuổi do **Chủ tịch UBND cấp xã** nơi cư trú quyết định trên cơ sở đề nghị của cơ sở giáo dục (Điều 31 khoản 1).", "Điều 31 khoản 2: tuổi vào **lớp sáu là 11 tuổi**, vào **lớp mười là 15 tuổi** (đã hoàn thành chương trình THCS hoặc tương đương).", "Điều 31 khoản 3: học sinh **không được lưu ban quá 03 lần** trong một cấp học.", "Điều 31 khoản 4: học vượt lớp khi thể lực tốt, phát triển sớm về trí tuệ; cha mẹ làm đơn → hiệu trưởng lập hội đồng khảo sát, tư vấn → **hiệu trưởng quyết định**.", "Điều 32 (5 khoản) — nhiệm vụ học sinh: học tập, rèn luyện; kính trọng cha mẹ, cán bộ, giáo viên, nhân sự hỗ trợ và người lớn tuổi; rèn luyện thân thể, giữ gìn vệ sinh cá nhân; tham gia hoạt động tập thể; giữ gìn, bảo vệ tài sản nhà trường.", "Điều 33 (7 khoản) — quyền học sinh: bình đẳng hưởng thụ giáo dục toàn diện; được tôn trọng, bảo vệ; **khiếu nại** với nhà trường và các cấp quản lý giáo dục về quyết định đối với bản thân.", "Điều 33: học sinh được học bổng, trợ cấp; **chuyển trường** nếu đủ điều kiện; được bảo vệ thân thể, danh dự, nhân phẩm, sức khỏe tinh thần; được hỗ trợ **tư vấn tâm lý học đường**.", "Điều 34 khoản 1 — đối tượng chuyển trường: chuyển nơi cư trú theo cha hoặc mẹ; hoàn cảnh đặc biệt khó khăn hoặc lý do thực sự chính đáng; chuyển sang trường chuyên biệt theo quy chế riêng; từ THPT tư thục sang công lập do **Giám đốc Sở** quy định."], "bay": ["⚠ Tuổi vào học: lớp 1 = **6**, lớp 6 = **11**, lớp 10 = **15** — dễ đảo số.", "⚠ Lưu ban **không quá 03 lần trong một cấp học** (không phải trong cả quá trình học, không phải 03 lần/năm).", "⚠ Vào lớp 1 cao hơn tuổi **không quá 03 tuổi**; vượt quá do **Chủ tịch UBND cấp xã** quyết định (không phải hiệu trưởng).", "⚠ Học vượt lớp do **hiệu trưởng quyết định**; hội đồng chỉ khảo sát, tư vấn.", "⚠ Điều 32 (nhiệm vụ) có **5** khoản, Điều 33 (quyền) có **7** khoản."], "cauhoi": [{"t": "s", "q": "Theo Điều 31, tuổi của học sinh vào lớp 1 là bao nhiêu?", "o": ["07 tuổi", "08 tuổi", "05 tuổi", "06 tuổi"], "a": [3], "e": "Điều 31 khoản 1: 06 tuổi (tính theo năm).", "r": "Điều 31 khoản 1 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Tuổi của học sinh vào lớp sáu là bao nhiêu?", "o": ["13 tuổi", "11 tuổi", "12 tuổi", "10 tuổi"], "a": [1], "e": "Điều 31 khoản 2: lớp sáu là 11 tuổi.", "r": "Điều 31 khoản 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Tuổi của học sinh vào lớp mười là bao nhiêu?", "o": ["17 tuổi", "16 tuổi", "15 tuổi", "14 tuổi"], "a": [2], "e": "Điều 31 khoản 2: lớp mười là 15 tuổi (đã hoàn thành chương trình THCS hoặc tương đương).", "r": "Điều 31 khoản 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Học sinh không được lưu ban quá bao nhiêu lần trong một cấp học?", "o": ["01 lần", "05 lần", "03 lần", "02 lần"], "a": [2], "e": "Điều 31 khoản 3: không quá 03 lần trong một cấp học.", "r": "Điều 31 khoản 3 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Trường hợp vào học lớp 1 vượt quá 03 tuổi so với tuổi quy định do ai quyết định?", "o": ["Chủ tịch UBND cấp xã nơi cư trú", "Hiệu trưởng nhà trường", "Giám đốc Sở GDĐT", "Chủ tịch UBND cấp tỉnh"], "a": [0], "e": "Điều 31 khoản 1: Chủ tịch UBND cấp xã nơi cư trú quyết định trên cơ sở đề nghị của cơ sở giáo dục.", "r": "Điều 31 khoản 1 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Ai là người quyết định cho học sinh học vượt lớp theo Điều 31 khoản 4?", "o": ["Cha mẹ học sinh", "Hội đồng khảo sát, tư vấn", "Chủ tịch UBND cấp xã", "Hiệu trưởng"], "a": [3], "e": "Hội đồng khảo sát, tư vấn chỉ tư vấn; hiệu trưởng quyết định sau khi cha mẹ làm đơn.", "r": "Điều 31 khoản 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Điều 33 Điều lệ quy định quyền của học sinh gồm bao nhiêu khoản?", "o": ["05 khoản", "07 khoản", "08 khoản", "06 khoản"], "a": [1], "e": "Điều 33 có 7 khoản về quyền; Điều 32 có 5 khoản về nhiệm vụ.", "r": "Điều 33 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Theo Điều 33, học sinh có quyền khiếu nại như thế nào?", "o": ["Khiếu nại về quyết định đối với giáo viên", "Chỉ khiếu nại với nhà trường, không khiếu nại lên cấp quản lý", "Khiếu nại về mọi quyết định liên quan đến tập thể lớp", "Khiếu nại với nhà trường và các cấp quản lý giáo dục về quyết định đối với bản thân"], "a": [3], "e": "Điều 33 khoản 2: khiếu nại với nhà trường và các cấp quản lý giáo dục về quyết định đối với bản thân.", "r": "Điều 33 khoản 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "s", "q": "Việc chuyển học sinh từ trường THPT tư thục sang trường công lập thực hiện theo quy định của ai (Điều 34 khoản 1)?", "o": ["Chủ tịch UBND cấp xã", "Giám đốc Sở Giáo dục và Đào tạo", "Bộ trưởng Bộ GDĐT", "Hiệu trưởng trường công lập"], "a": [1], "e": "Điều 34 khoản 1 điểm d: từ THPT tư thục sang công lập do Giám đốc Sở quy định.", "r": "Điều 34 khoản 1 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Những đối tượng nào được vào học lớp 1 cao hơn tuổi quy định nhưng không quá 03 tuổi? (chọn tất cả đáp án đúng)", "o": ["Trẻ em dân tộc thiểu số", "Trẻ em ở nước ngoài về nước", "Trẻ em khuyết tật", "Trẻ em mồ côi không nơi nương tựa", "Trẻ em có cha mẹ là giáo viên của trường"], "a": [0, 1, 2, 3], "e": "Điều 31 khoản 1 chỉ nêu các đối tượng đặc thù về khuyết tật, vùng khó khăn, dân tộc thiểu số, mồ côi, ở nước ngoài về...; không có đối tượng \"con giáo viên\".", "r": "Điều 31 khoản 1 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về nhiệm vụ của học sinh theo Điều 32? (chọn tất cả đáp án đúng)", "o": ["Tham gia hoạt động tập thể của trường, lớp, Đội, Đoàn", "Tự quyết định nội dung chương trình giáo dục", "Giữ gìn, bảo vệ tài sản nhà trường, nơi công cộng", "Kính trọng cha mẹ, cán bộ, giáo viên, nhân sự hỗ trợ và người lớn tuổi", "Rèn luyện thân thể, giữ gìn vệ sinh cá nhân"], "a": [0, 2, 3, 4], "e": "Nội dung chương trình do Bộ trưởng ban hành, không phải nhiệm vụ hay quyền của học sinh.", "r": "Điều 32 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Học sinh có những quyền nào sau đây theo Điều 33? (chọn tất cả đáp án đúng)", "o": ["Được hỗ trợ tư vấn tâm lý học đường", "Được miễn thực hiện nội quy nhà trường", "Được chuyển trường nếu đủ điều kiện", "Được học bổng, trợ cấp", "Được bảo vệ thân thể, danh dự, nhân phẩm, sức khỏe tinh thần"], "a": [0, 2, 3, 4], "e": "Nhiệm vụ học sinh gồm thực hiện điều lệ, nội quy (Điều 32), không có quyền miễn.", "r": "Điều 33 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "m", "q": "Phát biểu nào đúng về học vượt lớp theo Điều 31 khoản 4? (chọn tất cả đáp án đúng)", "o": ["Hiệu trưởng lập hội đồng khảo sát, tư vấn gồm lãnh đạo trường, giáo viên trực tiếp dạy, đại diện Ban đại diện cha mẹ học sinh", "Hiệu trưởng quyết định", "Cha mẹ học sinh làm đơn đề nghị", "Áp dụng khi học sinh có thể lực tốt, phát triển sớm về trí tuệ", "Chủ tịch UBND cấp xã quyết định"], "a": [0, 1, 2, 3], "e": "Học vượt lớp do hiệu trưởng quyết định; Chủ tịch UBND cấp xã quyết định trường hợp vượt quá 03 tuổi khi vào lớp 1.", "r": "Điều 31 khoản 4 Điều lệ (Thông tư 15/2026/TT-BGDĐT)"}, {"t": "f", "q": "Tuổi vào lớp 1 là ____ tuổi, vào lớp sáu là ____ tuổi, vào lớp mười là ____ tuổi.", "a": [["06", "6", "sáu"], ["11", "mười một"], ["15", "mười lăm"]], "e": "Điều 31: 6 – 11 – 15 tuổi.", "r": "Điều 31 khoản 1, 2 Điều lệ (Thông tư 15/2026/TT-BGDĐT)", "o": [["6", "10", "14"], ["6", "11", "15"], ["7", "11", "15"], ["6", "12", "16"]], "k": 1}, {"t": "f", "q": "Học sinh không được lưu ban quá ____ lần trong một ____.", "a": [["03", "3", "ba"], ["cấp học"]], "e": " 1 cao hơn tuổi", "Không quá 03 tuổi; vượt do Chủ tịch UBND cấp xã quyết định"], ["Lưu ban", "Không quá 03 lần trong một cấp học"]]}, {"tieu_de": "Học vượt lớp và chuyển trường", "cot": ["Nội dung", "Ai làm / quy định"], "dong": [["Học vượt lớp: bước 1", "Cha mẹ làm đơn"], ["Học vượt lớp: bước 2", "Hiệu trưởng lập hội đồng khảo sát, tư vấn"], ["Học vượt lớp: bước 3", "Hiệu trưởng quyết định"], ["THPT tư thục sang công lập (Điều 34 khoản 1)", "Do Giám đốc Sở quy định"], ["Quyền của học sinh (Điều 33)", "Khiếu nại, chuyển trường nếu đủ điều kiện, tư vấn tâm lý học đường"]]}], "vidu": [{"tinh_huong": "Em Tú là học sinh mồ côi không nơi nương tựa, đã quá 06 tuổi 2 năm. Gia đình xin cho em vào lớp 1.", "ket_luan": "→ Được: đối tượng này vào lớp 1 cao hơn tuổi nhưng không quá 03 tuổi (Điều 31 khoản 1)."}, {"tinh_huong": "Một trẻ cao hơn tuổi vào lớp 1 đến 4 tuổi, thuộc đối tượng được ưu tiên. Hiệu trưởng định tự quyết cho nhập học.", "ket_luan": "→ Sai: vượt quá 03 tuổi do Chủ tịch UBND cấp xã nơi cư trú quyết định trên cơ sở đề nghị của cơ sở giáo dục (Điều 31 khoản 1)."}, {"tinh_huong": "Em Vy học lớp 7 lưu ban lần thứ tư trong cấp THCS.", "ket_luan": "→ Không được: học sinh không được lưu ban quá 03 lần trong một cấp học (Điều 31 khoản 3)."}, {"tinh_huong": "Cha mẹ em Khoa làm đơn xin học vượt lớp vì em phát triển sớm về trí tuệ. Hội đồng khảo sát, tư vấn nhất trí. Ai quyết định cuối cùng?", "ket_luan": "→ Hiệu trưởng quyết định; hội đồng chỉ khảo sát, tư vấn (Điều 31 khoản 4)."}, {"tinh_huong": "Em Linh không đồng ý với một quyết định của nhà trường đối với bản thân và muốn phản ánh.", "ket_luan": "→ Em có quyền khiếu nại với nhà trường và các cấp quản lý giáo dục về quyết định đối với bản thân (Điều 33 khoản 2)."}], "nho": ["Tuổi vào học '6 - 11 - 15': lớp 1 là 6, lớp sáu là 11, lớp mười là 15 (cách nhau 5 rồi 4).", "'Ba - ba': cao hơn tuổi không quá 3 tuổi; lưu ban không quá 3 lần/cấp.", "Nhiệm vụ 5 khoản, quyền 7 khoản: 'Nhiệm 5 - Quyền 7' (Điều 32, 33)."]}]});</script>
<script>(function(){
'use strict';
var LAWS=(window.LAWS||[]).slice().sort(function(a,b){return a.id.localeCompare(b.id,'en',{numeric:true})});
var app=document.getElementById('app');
var EXAM_N=50, EXAM_MIN=60, MIX_COUNT=30;

/* ---------- tiện ích ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function norm(s){return String(s).normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim()}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var store={load:function(){try{return JSON.parse(localStorage.getItem('lqb1'))||{res:{},mix:{}}}catch(e){return{res:{},mix:{}}}},
  save:function(){try{localStorage.setItem('lqb1',JSON.stringify(S))}catch(e){}}};
var S=store.load(); S.res=S.res||{}; S.mix=S.mix||{};
function setRes(key,ok){S.res[key]=ok?1:0;store.save()}

/* ---------- ngân hàng ---------- */
var POOL=[],BYKEY={};
LAWS.forEach(function(L){L.baihoc.forEach(function(b){b.cauhoi.forEach(function(q,i){
  var o=Object.assign({},q,{key:L.id+'|'+b.id+'|'+i,law:L.id,lawTen:L.ten,bai:b.ten});
  if(o.t==='f'){ /* điền chỗ trống -> chọn phương án */
    var n=0;o.q=o.q.replace(/____/g,function(){n++;return '【'+(n>1||o.q.split('____').length>2?'('+n+') ':'')+'……】'});
    o.o=o.o.map(function(c){return c.length>1?c.map(function(x,j){return '('+(j+1)+') '+x}).join('   ·   '):c[0]});
    o.a=[o.k];
  }
  POOL.push(o);BYKEY[o.key]=o;b.cauhoi[i]=o})})});
function lawStats(L){var t=0,ok=0,bad=0;L.baihoc.forEach(function(b){b.cauhoi.forEach(function(q){t++;var r=S.res[q.key];if(r===1)ok++;else if(r===0)bad++})});return{t:t,ok:ok,bad:bad}}
function baiStats(b){var t=b.cauhoi.length,ok=0,bad=0;b.cauhoi.forEach(function(q){var r=S.res[q.key];if(r===1)ok++;else if(r===0)bad++});return{t:t,ok:ok,bad:bad}}

/* ---------- chấm ---------- */
function grade(q,ans){
  if(q.t!=='m')return ans.length===1&&ans[0]===q.a[0];
  if(q.t==='m'){var x=ans.slice().sort().join(),y=q.a.slice().sort().join();return x===y}
  return q.a.every(function(acc,i){var v=norm(ans[i]||'');return v&&acc.some(function(c){return norm(c)===v})});
}
function answered(q,ans){
  return ans.length>0;
}

/* ---------- vẽ 1 câu hỏi ----------
 opts: {no, order, ans, locked, show (hiện đáp án), onChange(ans), check (hiện nút kiểm tra), onCheck(ok)} */
function renderQ(q,opts){
  var ans=opts.ans||[];
  var order=opts.order||(q.o?q.o.map(function(_,i){return i}):[]);
  var card=el('<div class="q"></div>');
  var tag={s:'Chọn 1',m:'Chọn nhiều',f:'Điền vào chỗ trống'}[q.t];
  var head='<span class="no">'+opts.no+'</span><span class="tag '+q.t+'">'+tag+'</span>';
  var locked=!!opts.locked;
  var body=el('<div></div>');
  card.innerHTML=head;
  card.appendChild(body);
  var fbox=el('<div></div>');
  var state={locked:locked};

  function paint(){
    body.innerHTML='';
    if(false){
      var parts=q.q.split('____'),h='<div class="fillq">';
      parts.forEach(function(p,i){h+=fmt(p);if(i<parts.length-1)h+='<input class="fill" data-i="'+i+'" autocomplete="off" spellcheck="false">'});
      body.appendChild(el(h+'</div>'));
      Array.prototype.forEach.call(body.querySelectorAll('input.fill'),function(inp){
        var i=+inp.dataset.i;inp.value=ans[i]||'';inp.disabled=state.locked;
        inp.addEventListener('input',function(){ans[i]=inp.value;opts.onChange&&opts.onChange(ans)});
        if(state.locked&&(opts.show||state.checked)){
          var acc=q.a[i];var good=acc.some(function(c){return norm(c)===norm(ans[i]||'')});inp.classList.add(good?'ok':'bad');
          if(!good)inp.title='Đáp án: '+acc[0];
        }
      });
    }else{
      body.appendChild(el('<div class="qt">'+fmt(q.q)+'</div>'));
      order.forEach(function(oi,pos){
        var sel=ans.indexOf(oi)>=0,cls='opt';
        if(sel)cls+=' sel';
        var isRight=q.a.indexOf(oi)>=0;
        if(state.locked&&(opts.show||state.checked)){
          if(sel&&isRight)cls+=' ok';else if(sel&&!isRight)cls+=' bad';else if(!sel&&isRight)cls+=' miss'}
        var d=el('<div class="'+cls+'"><b>'+String.fromCharCode(65+pos)+'</b><span>'+fmt(q.o[oi])+'</span></div>');
        d.addEventListener('click',function(){
          if(state.locked)return;
          if(q.t!=='m'){ans.length=0;ans.push(oi)}
          else{var k=ans.indexOf(oi);if(k>=0)ans.splice(k,1);else ans.push(oi)}
          opts.onChange&&opts.onChange(ans);paint();
        });
        body.appendChild(d);
      });
    }
  }
  function feedback(){
    fbox.innerHTML='';
    var ok=grade(q,ans);
    var txt=ok?'✔ Chính xác.':'✘ Chưa đúng.';
    var da='';
    if(!ok)da='<div><b>Đáp án đúng:</b> '+q.a.slice().sort().map(function(i){return String.fromCharCode(65+order.indexOf(i))}).join(', ')+'</div>';
    fbox.appendChild(el('<div class="exp '+(ok?'ok':'bad')+'"><b>'+txt+'</b>'+da+'<div>'+fmt(q.e)+'</div><div class="r">📌 '+esc(q.r)+'</div></div>'));
    return ok;
  }
  paint();card.appendChild(fbox);
  if(opts.show&&state.locked)feedback();
  if(opts.check){
    var bar=el('<div class="row" style="margin-top:8px"></div>');
    var b1=el('<button class="btn blue">Kiểm tra</button>'),b2=el('<button class="btn gray" style="display:none">Làm lại câu</button>');
    b1.addEventListener('click',function(){
      if(!answered(q,ans)){alert('Hãy chọn / điền đáp án trước.');return}
      state.locked=true;state.checked=true;paint();var ok=feedback();setRes(q.key,ok);
      b1.style.display='none';b2.style.display='';opts.onCheck&&opts.onCheck(ok);
    });
    b2.addEventListener('click',function(){
      ans.length=0;state.locked=false;state.checked=false;
      fbox.innerHTML='';paint();b1.style.display='';b2.style.display='none';
    });
    bar.appendChild(b1);bar.appendChild(b2);card.appendChild(bar);
  }
  card._ans=ans;
  return card;
}

/* ---------- danh sách luyện tập (dưới bài, câu sai...) ---------- */
function practiceList(qs,titleEl){
  var box=el('<div></div>');
  var sum=el('<div class="sum"><div class="row"><b id="sc">Đã làm 0/'+qs.length+'</b><span id="sc2" style="color:#6b7280"></span><span style="flex:1"></span><button class="btn gray" id="rs">Làm lại bài</button></div></div>');
  var list=el('<div></div>');
  function update(){
    var n=0,ok=0;qs.forEach(function(q){var r=S.res[q.key];if(list._done&&list._done[q.key]!==undefined){n++;if(list._done[q.key])ok++}});
    sum.querySelector('#sc').textContent='Đã làm '+n+'/'+qs.length;
    sum.querySelector('#sc2').textContent=n?('Đúng '+ok+' · Sai '+(n-ok)):'';
  }
  function build(){
    list.innerHTML='';list._done={};
    qs.forEach(function(q,i){
      list.appendChild(renderQ(q,{no:i+1,check:true,onCheck:function(ok){list._done[q.key]=ok;update()}}));
    });update();
  }
  build();
  sum.querySelector('#rs').addEventListener('click',function(){build();window.scrollTo({top:box.offsetTop-60,behavior:'smooth'})});
  box.appendChild(list);box.appendChild(sum);return box;
}

/* ---------- trang chủ ---------- */
function pageHome(){
  var tot=POOL.length,ok=0;POOL.forEach(function(q){if(S.res[q.key]===1)ok++});
  var h='<div class="hero"><h1>Ôn thi viên chức giáo viên THCS – Phần Luật</h1><p>'+LAWS.length+' văn bản · '+tot+' câu hỏi · chọn 1 đáp án, chọn nhiều đáp án, điền chỗ trống</p></div><div class="wrap">';
  h+='<div class="row" style="margin-bottom:16px"><a class="btn blue" href="#/mix">📝 Làm đề mix ('+MIX_COUNT+' đề)</a><a class="btn amber" href="#/wrong">🔁 Ôn câu làm sai</a><span style="color:#6b7280">Đã đúng '+ok+'/'+tot+' câu</span></div><div class="grid">';
  LAWS.forEach(function(L){
    var s=lawStats(L),p=Math.round(100*s.ok/s.t);
    h+='<a class="card" href="#/law/'+L.id+'"><h3>'+esc(L.ten)+'</h3><div class="meta">'+esc(L.so)+(L.hieuluc?' · hiệu lực '+esc(L.hieuluc):'')+'</div><div style="font-size:14px;margin-bottom:6px">'+esc(L.mota||'')+'</div><span class="pill">'+L.baihoc.length+' bài</span><span class="pill">'+s.t+' câu</span><div class="bar"><i style="width:'+p+'%"></i></div><div class="meta" style="margin:0">Đúng '+s.ok+'/'+s.t+(s.bad?' · sai '+s.bad:'')+'</div></a>';
  });
  app.innerHTML=h+'</div></div>';
}

/* ---------- trang văn bản ---------- */
function pageLaw(id){
  var L=LAWS.filter(function(x){return x.id===id})[0];if(!L)return notFound();
  var h='<div class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> / '+esc(L.ten)+'</div><div class="sec"><h2>'+esc(L.ten)+'</h2><div>'+esc(L.so)+(L.hieuluc?' · hiệu lực '+esc(L.hieuluc):'')+'</div><div style="margin-top:6px">'+esc(L.mota||'')+'</div></div><div class="grid">';
  L.baihoc.forEach(function(b,i){var s=baiStats(b),p=Math.round(100*s.ok/s.t);
    h+='<a class="card" href="#/law/'+L.id+'/'+b.id+'"><h3>Bài '+(i+1)+'. '+esc(b.ten)+'</h3><span class="pill">'+(b.tomtat||[]).length+' ý chính</span><span class="pill">'+s.t+' câu luyện tập</span><div class="bar"><i style="width:'+p+'%"></i></div><div class="meta" style="margin:0">Đúng '+s.ok+'/'+s.t+(s.bad?' · sai '+s.bad:'')+'</div></a>'});
  app.innerHTML=h+'</div></div>';
}

/* ---------- trang bài học + luyện tập ---------- */
function pageBai(lid,bid){
  var L=LAWS.filter(function(x){return x.id===lid})[0];if(!L)return notFound();
  var bi=-1;L.baihoc.forEach(function(b,i){if(b.id===bid)bi=i});if(bi<0)return notFound();
  var b=L.baihoc[bi];
  var tabs='<div class="tabs">';L.baihoc.forEach(function(x,i){tabs+='<a class="'+(i===bi?'act':'')+'" href="#/law/'+L.id+'/'+x.id+'">Bài '+(i+1)+'</a>'});tabs+='</div>';
  var h='<div class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> / <a href="#/law/'+L.id+'">'+esc(L.ten)+'</a> / Bài '+(bi+1)+'</div>'+tabs;
  h+='<div class="sec"><h2>Bài '+(bi+1)+'. '+esc(b.ten)+'</h2>';
  if(b.ynho&&b.ynho.length)h+='<div class="ynho"><b>⭐ Cần nhớ nhất</b><ol>'+b.ynho.map(function(t){return'<li>'+fmt(t)+'</li>'}).join('')+'</ol></div>';
  h+='<h3 class="sh">📖 Nội dung chi tiết</h3><ul>'+(b.tomtat||[]).map(function(t){return'<li>'+fmt(t)+'</li>'}).join('')+'</ul></div>';
  (b.bang||[]).forEach(function(t){
    h+='<div class="sec"><h3 class="sh" style="margin-top:0">📊 '+esc(t.tieu_de||'Bảng tóm tắt')+'</h3><div class="tw"><table><thead><tr>'+t.cot.map(function(c){return'<th>'+fmt(c)+'</th>'}).join('')+'</tr></thead><tbody>'+t.dong.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+fmt(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div>'});
  if(b.vidu&&b.vidu.length)h+='<div class="sec"><h3 class="sh" style="margin-top:0">💡 Ví dụ minh hoạ</h3>'+b.vidu.map(function(v,i){return'<div class="vd"><div><b>Ví dụ '+(i+1)+'.</b> '+fmt(v.tinh_huong)+'</div><div class="kl">'+fmt(v.ket_luan)+'</div></div>'}).join('')+'</div>';
  if(b.nho&&b.nho.length)h+='<div class="sec nho"><h3 class="sh" style="margin-top:0">🧠 Mẹo ghi nhớ</h3><ul>'+b.nho.map(function(t){return'<li>'+fmt(t)+'</li>'}).join('')+'</ul></div>';
  if(b.bay&&b.bay.length)h+='<div class="sec bay"><h2>⚠ Chỗ hay bị đánh lừa</h2><ul>'+b.bay.map(function(t){return'<li>'+fmt(String(t).replace(/^\s*⚠️?\s*/,''))+'</li>'}).join('')+'</ul></div>';
  h+='<h2 style="margin:18px 0 10px">✍ Luyện tập ('+b.cauhoi.length+' câu)</h2><div id="pl"></div>';
  var nx='<div class="nvg">'+(bi>0?'<a class="btn gray" href="#/law/'+L.id+'/'+L.baihoc[bi-1].id+'">← Bài trước</a>':'<span></span>')+(bi<L.baihoc.length-1?'<a class="btn blue" href="#/law/'+L.id+'/'+L.baihoc[bi+1].id+'">Bài sau →</a>':'<a class="btn blue" href="#/law/'+L.id+'">Về danh sách bài</a>')+'</div>';
  app.innerHTML=h+nx+'</div>';
  document.getElementById('pl').appendChild(practiceList(b.cauhoi));
}

/* ---------- câu làm sai ---------- */
function pageWrong(){
  var qs=POOL.filter(function(q){return S.res[q.key]===0});
  var h='<div class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> / Câu làm sai</div><h2>🔁 Ôn câu làm sai ('+qs.length+')</h2>';
  if(!qs.length){app.innerHTML=h+'<div class="empty">Chưa có câu sai nào. Hãy luyện tập hoặc làm đề mix!</div></div>';return}
  h+='<div id="pl"></div></div>';app.innerHTML=h;
  document.getElementById('pl').appendChild(practiceList(qs));
}

/* ---------- đề mix ---------- */
var MIX=(function(){
  var r=mulberry(20260101),pool=POOL.slice(),seq=[];
  for(var p=0;p<4;p++)seq=seq.concat(shuffle(pool,r));
  var des=[],pos=0;
  for(var d=0;d<MIX_COUNT;d++){
    var picked=[],used={};
    while(picked.length<EXAM_N){var q=seq[pos%seq.length];pos++;if(!used[q.key]){used[q.key]=1;picked.push(q)}}
    des.push(picked);
  }
  return des;
})();
function pageMix(){
  var h='<div class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> / Đề mix</div><h2>📝 Đề mix – '+MIX_COUNT+' đề ('+EXAM_N+' câu / '+EXAM_MIN+' phút)</h2><p style="color:#6b7280">Mỗi đề trộn ngẫu nhiên các văn bản và dạng câu. Thứ tự đáp án được xáo trộn trong từng đề.</p><div class="grid">';
  MIX.forEach(function(d,i){var best=S.mix[i+1];
    var cnt={s:0,m:0,f:0};d.forEach(function(q){cnt[q.t]++});
    h+='<a class="card" href="#/mix/'+(i+1)+'"><h3>Đề số '+(i+1)+'</h3><div class="meta">'+EXAM_N+' câu · 1 đáp án '+cnt.s+' · nhiều đáp án '+cnt.m+' · điền từ '+cnt.f+'</div>'+(best!=null?'<span class="pill">Điểm cao nhất: '+best+'/'+EXAM_N+'</span>':'<span class="pill" style="background:#f3f4f6;color:#6b7280">Chưa làm</span>')+'</a>'});
  app.innerHTML=h+'</div></div>';
}
var timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function pageExam(n){
  n=+n;var qs=MIX[n-1];if(!qs)return notFound();
  var rnd=mulberry(1000+n);
  var orders=qs.map(function(q){return q.o?shuffle(q.o.map(function(_,i){return i}),rnd):null});
  var answers=qs.map(function(){return []});
  var flags={},cur=0,left=EXAM_MIN*60,submitted=false;
  app.innerHTML='<div class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> / <a href="#/mix">Đề mix</a> / Đề '+n+'</div><div class="card" style="text-align:center"><h2 style="margin-top:0">Đề mix số '+n+'</h2><p>'+EXAM_N+' câu · '+EXAM_MIN+' phút · không hiện đáp án cho tới khi nộp bài.<br>Câu khó có thể đánh dấu ⚑ để quay lại sau.</p><button class="btn" id="go">Bắt đầu</button></div></div>';
  document.getElementById('go').addEventListener('click',start);

  function start(){
    var w=app.querySelector('.wrap');
    w.innerHTML='<div class="crumb"><a href="#/mix">← Đề mix</a> / Đề '+n+'</div><div class="exam"><div><div id="qa"></div><div class="nvg"><button class="btn gray" id="pv">← Câu trước</button><button class="btn amber" id="fl">⚑ Đánh dấu</button><button class="btn blue" id="nx">Câu sau →</button></div></div><div class="side"><div style="text-align:center;color:#0369a1">Thời gian còn lại</div><div class="timer" id="tm"></div><div class="pal" id="pal"></div><div class="leg"><span>🟩 Đã làm</span><span>⬜ Chưa làm</span><span>🟨 Đánh dấu</span></div><div style="text-align:center;margin-top:14px"><button class="btn red" id="sub">Nộp bài</button></div></div></div>';
    document.getElementById('pv').onclick=function(){go(cur-1)};
    document.getElementById('nx').onclick=function(){go(cur+1)};
    document.getElementById('fl').onclick=function(){flags[cur]=!flags[cur];pal()};
    document.getElementById('sub').onclick=function(){
      var un=answers.filter(function(a,i){return !answered(qs[i],a)}).length;
      if(confirm(un?'Còn '+un+' câu chưa làm. Nộp bài?':'Nộp bài?'))finish();
    };
    stopTimer();tick();timerId=setInterval(tick,1000);go(0);
  }
  function tick(){
    if(submitted)return;
    var m=Math.floor(left/60),s=left%60,t=document.getElementById('tm');
    if(!t){stopTimer();return}
    t.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;t.className='timer'+(left<300?' low':'');
    if(left--<=0){alert('Hết giờ! Hệ thống tự nộp bài.');finish()}
  }
  function pal(){
    var p=document.getElementById('pal');if(!p)return;p.innerHTML='';
    qs.forEach(function(q,i){
      var c='';if(answered(q,answers[i]))c='done';if(flags[i])c='flag';if(i===cur)c+=' cur';
      var s=el('<span class="'+c+'">'+(i+1)+'</span>');s.onclick=function(){go(i)};p.appendChild(s)});
    var fl=document.getElementById('fl');if(fl)fl.textContent=flags[cur]?'⚑ Bỏ đánh dấu':'⚑ Đánh dấu';
  }
  function go(i){
    if(i<0||i>=qs.length)return;cur=i;
    var qa=document.getElementById('qa');qa.innerHTML='';
    qa.appendChild(renderQ(qs[i],{no:i+1,order:orders[i],ans:answers[i],onChange:function(){pal()}}));
    pal();window.scrollTo({top:0,behavior:'smooth'});
  }
  function finish(){
    if(submitted)return;submitted=true;stopTimer();
    var ok=0,res=qs.map(function(q,i){var g=grade(q,answers[i]);if(g)ok++;setRes(q.key,g);return g});
    if(S.mix[n]==null||ok>S.mix[n])S.mix[n]=ok;store.save();
    var w=app.querySelector('.wrap');
    var h='<div class="crumb"><a href="#/mix">← Đề mix</a> / Đề '+n+' / Kết quả</div><div class="card"><div class="score">'+ok+'/'+qs.length+' câu đúng</div><div style="text-align:center;font-size:18px">Điểm: <b>'+(Math.round(ok*100/qs.length)/10).toFixed(1)+'/10</b></div><div class="pal" style="grid-template-columns:repeat(10,1fr)">';
    res.forEach(function(g,i){h+='<span class="'+(g?'ok':'bad')+'" data-i="'+i+'">'+(i+1)+'</span>'});
    h+='</div><div class="row" style="justify-content:center"><button class="btn gray" id="fw">Chỉ xem câu sai</button><a class="btn blue" href="#/mix/'+n+'" onclick="location.reload()">Làm lại đề</a><a class="btn" href="#/mix">Đề khác</a></div></div><div id="rv" style="margin-top:14px"></div>';
    w.innerHTML=h;
    var rv=document.getElementById('rv'),only=false;
    function draw(){rv.innerHTML='';qs.forEach(function(q,i){if(only&&res[i])return;
      var c=renderQ(q,{no:i+1,order:orders[i],ans:answers[i],locked:true,show:true});
      var lw=el('<div style="font-size:12px;color:#6b7280;margin-bottom:6px">'+esc(q.lawTen)+' – '+esc(q.bai)+'</div>');c.insertBefore(lw,c.children[2]);c.id='rq'+i;rv.appendChild(c)})}
    draw();
    document.getElementById('fw').onclick=function(){only=!only;this.textContent=only?'Xem tất cả':'Chỉ xem câu sai';draw()};
    Array.prototype.forEach.call(w.querySelectorAll('.pal span'),function(s){s.onclick=function(){var t=document.getElementById('rq'+s.dataset.i);if(t)t.scrollIntoView({behavior:'smooth'})}});
    window.scrollTo({top:0});
  }
}

function notFound(){app.innerHTML='<div class="wrap"><div class="empty">Không tìm thấy trang. <a href="#/" style="color:#2aa7e0">Về trang chủ</a></div></div>'}

/* ---------- router ---------- */
function route(){
  stopTimer();
  var h=(location.hash||'#/').replace(/^#\/?/,'').split('/');
  ['home','mix','wrong'].forEach(function(k){var a=document.getElementById('n-'+k);a&&a.classList.remove('act')});
  var act=h[0]==='mix'?'mix':h[0]==='wrong'?'wrong':'home';document.getElementById('n-'+act).classList.add('act');
  if(h[0]==='law'&&h[1]&&h[2])pageBai(h[1],h[2]);
  else if(h[0]==='law'&&h[1])pageLaw(h[1]);
  else if(h[0]==='mix'&&h[1])pageExam(h[1]);
  else if(h[0]==='mix')pageMix();
  else if(h[0]==='wrong')pageWrong();
  else pageHome();
  if(!(h[0]==='mix'&&h[1]))window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
