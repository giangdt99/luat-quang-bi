ghề 100% theo Nghị quyết 248?", "o": ["Mọi giáo viên mầm non, phổ thông công lập trên cả nước", "Nhân viên công tác tại vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn", "Cán bộ quản lý cơ sở giáo dục công lập ở mọi địa bàn", "Giáo viên công tác tại khu vực biên giới, hải đảo, vùng đồng bào dân tộc thiểu số và miền núi, vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn"], "a": [3], "e": "Điều 2.2.a: mức 100% chỉ dành cho GIÁO VIÊN công tác tại các khu vực đặc thù; nhân viên vẫn tối thiểu 30%.", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Phụ cấp ưu đãi nghề theo Điều 2 khoản 2 điểm a Nghị quyết 248 áp dụng đối với loại cơ sở giáo dục nào?", "o": ["Cơ sở giáo dục mầm non, giáo dục phổ thông công lập", "Cơ sở giáo dục mầm non, giáo dục phổ thông công lập và tư thục", "Cơ sở giáo dục nghề nghiệp, giáo dục đại học công lập", "Cơ sở giáo dục thường xuyên và cơ sở giáo dục đại học"], "a": [0], "e": "Điều 2.2.a chỉ nêu cơ sở giáo dục mầm non, phổ thông CÔNG LẬP. GDNN, đại học thì được tự chủ quyết định thu nhập tăng thêm (điểm b).", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Cơ sở giáo dục nghề nghiệp, giáo dục đại học được miễn giấy phép lao động cho chuyên gia, nhà khoa học là người nước ngoài trong thời hạn nào?", "o": ["Tối thiểu 03 năm", "Không quá 01 năm", "Không quá 03 năm", "Không quá 05 năm"], "a": [2], "e": "Điều 2.1.c: xác nhận đối tượng miễn giấy phép lao động trong thời hạn không quá 03 năm. Bẫy: 'tối thiểu' khác 'không quá'.", "r": "Điều 2 khoản 1 điểm c Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Cơ sở giáo dục nào được tự chủ quyết định mức thu nhập tăng thêm cho nhà giáo, viên chức và người lao động từ nguồn thu hợp pháp ngoài ngân sách nhà nước cấp được để lại?", "o": ["Cơ sở giáo dục mầm non công lập", "Cơ sở giáo dục phổ thông công lập", "Cơ sở giáo dục nghề nghiệp, giáo dục đại học", "Cơ sở giáo dục thường xuyên công lập"], "a": [2], "e": "Điều 2.2.b chỉ nêu cơ sở GDNN và giáo dục đại học. Bẫy: nhầm với phụ cấp ưu đãi nghề của mầm non, phổ thông.", "r": "Điều 2 khoản 2 điểm b Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Nghị quyết 248/2025/QH15 áp dụng đối với đối tượng nào?", "o": ["Các cơ sở giáo dục thuộc hệ thống giáo dục quốc dân, các tổ chức và cá nhân có liên quan", "Chỉ các cơ sở giáo dục công lập thuộc hệ thống giáo dục quốc dân", "Chỉ các cơ sở giáo dục phổ thông công lập", "Chỉ nhà giáo trong các cơ sở giáo dục công lập"], "a": [0], "e": "Điều 1.2 có phạm vi rộng: cơ sở giáo dục thuộc hệ thống GDQD, tổ chức và cá nhân có liên quan. Các phương án nhiễu thu hẹp phạm vi bằng chữ 'chỉ'.", "r": "Điều 1 khoản 2 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Theo Điều 2 khoản 1 điểm a Nghị quyết 248, Giám đốc Sở Giáo dục và Đào tạo có thẩm quyền nào sau đây? (chọn tất cả đáp án đúng)", "o": ["Tuyển dụng, tiếp nhận cán bộ quản lý cơ sở giáo dục và nhân viên trong cơ sở giáo dục công lập trên địa bàn tỉnh", "Tuyển dụng, tiếp nhận nhà giáo trong cơ sở giáo dục công lập trên địa bàn tỉnh", "Điều động, thuyên chuyển, biệt phái nhà giáo ở cơ sở giáo dục công lập liên quan đến phạm vi từ 02 đơn vị hành chính cấp xã trở lên", "Tự chủ quyết định mức thu nhập tăng thêm của nhà giáo ở cơ sở giáo dục đại học", "Quyết định một bộ sách giáo khoa giáo dục phổ thông sử dụng thống nhất toàn quốc"], "a": [0, 1, 2], "e": "Giám đốc Sở: tuyển dụng, tiếp nhận nhà giáo, CBQL, nhân viên ở cơ sở công lập trên địa bàn tỉnh và các việc điều động... liên quan từ 02 xã trở lên. Quyết định SGK thuộc Bộ trưởng BGDĐT (Điều 3); thu nhập tăng thêm do cơ sở GDNN, đại học tự chủ (Điều 2.2.b).", "r": "Điều 2 khoản 1 điểm a Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Các loại cơ sở nào sau đây thuộc khái niệm 'cơ sở giáo dục công lập' tại Điều 2 khoản 1 điểm a Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Cơ sở giáo dục đại học công lập", "Cơ sở giáo dục phổ thông công lập", "Trường chuyên biệt và trường trung học nghề công lập", "Cơ sở giáo dục mầm non công lập", "Cơ sở giáo dục thường xuyên công lập"], "a": [1, 2, 3, 4], "e": "Điều 2.1.a liệt kê: mầm non, phổ thông, thường xuyên, trường chuyên biệt, trường trung học nghề công lập. Cơ sở giáo dục đại học không nằm trong danh sách này (đại học được tự chủ riêng tại điểm c).", "r": "Điều 2 khoản 1 điểm a Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Cơ sở giáo dục nghề nghiệp, giáo dục đại học có quyền tự chủ nào sau đây theo Điều 2 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Tự quyết định mức phụ cấp ưu đãi nghề không phụ thuộc lộ trình do Chính phủ quy định", "Xác nhận đối tượng miễn giấy phép lao động cho chuyên gia, nhà khoa học người nước ngoài trong thời hạn không quá 03 năm", "Tự quyết định thu nhập tăng thêm từ nguồn ngân sách nhà nước cấp", "Quyết định mức thu nhập tăng thêm từ nguồn thu hợp pháp ngoài ngân sách nhà nước cấp được để lại", "Xác định vị trí việc làm, tuyển dụng, ký hợp đồng lao động với chuyên gia, nhà khoa học trình độ tiến sĩ là người nước ngoài theo quy chế nội bộ"], "a": [1, 3, 4], "e": "Điều 2.1.c và 2.2.b. Bẫy: thu nhập tăng thêm lấy từ nguồn thu hợp pháp NGOÀI ngân sách nhà nước cấp được để lại, không phải từ ngân sách cấp; phụ cấp ưu đãi nghề theo lộ trình của Chính phủ và áp dụng cho mầm non, phổ thông công lập.", "r": "Điều 2 khoản 1 điểm c và khoản 2 điểm b Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Phát biểu nào đúng về phụ cấp ưu đãi nghề tại Điều 2 khoản 2 điểm a Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Mức tối thiểu 70% đối với giáo viên", "Mức 100% áp dụng cho cả giáo viên và nhân viên ở vùng đặc biệt khó khăn", "Thực hiện theo lộ trình do Chính phủ quy định", "Mức tối thiểu 30% đối với nhân viên", "Áp dụng cho cả cơ sở giáo dục đại học công lập"], "a": [0, 2, 3], "e": "Mức 100% chỉ dành cho giáo viên ở khu vực biên giới, hải đảo, vùng ĐBDTTS và miền núi, vùng ĐBKK; áp dụng cho cơ sở mầm non, phổ thông công lập.", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15"}, {"t": "f", "q": "____ Sở Giáo dục và Đào tạo có thẩm quyền tuyển dụng, tiếp nhận nhà giáo trong cơ sở giáo dục công lập trên địa bàn ____.", "a": [["giám đốc"], ["tỉnh"]], "e": "Chủ thể là Giám đốc Sở GDĐT (không phải Chủ tịch UBND cấp xã), phạm vi địa bàn tỉnh.", "r": "Điều 2 khoản 1 điểm a Nghị quyết 248/2025/QH15", "o": [["chủ tịch", "tỉnh"], ["giám đốc", "xã"], ["phó giám đốc", "cả nước"], ["giám đốc", "tỉnh"]], "k": 3}, {"t": "f", "q": "____ Ủy ban nhân dân cấp ____ có thẩm quyền điều động, thuyên chuyển, biệt phái, bổ nhiệm, miễn nhiệm, thay đổi vị trí việc làm đối với nhà giáo, cán bộ quản lý, nhân viên thuộc thẩm quyền quản lý.", "a": [["chủ tịch"], ["xã"]], "e": "Điều 2.1.b: Chủ tịch UBND cấp xã.", "r": "Điều 2 khoản 1 điểm b Nghị quyết 248/2025/QH15", "o": [["chủ tịch", "xã"], ["giám đốc", "xã"], ["chủ tịch", "tỉnh"], ["chủ tịch", "huyện"]], "k": 0}, {"t": "f", "q": "Phụ cấp ưu đãi nghề tối thiểu ____ đối với giáo viên, tối thiểu ____ đối với nhân viên và ____ đối với giáo viên công tác tại khu vực biên giới, hải đảo.", "a": [["70%", "70"], ["30%", "30"], ["100%", "100"]], "e": "Điều 2.2.a: 70% - 30% - 100%.", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15", "o": [["70%", "50%", "100%"], ["50%", "30%", "70%"], ["70%", "30%", "100%"], ["70%", "30%", "150%"]], "k": 2}, {"t": "f", "q": "Phụ cấp ưu đãi nghề đối với cơ sở giáo dục mầm non, phổ thông công lập được thực hiện theo lộ trình do ____ quy định.", "a": [["chính phủ"]], "e": "Bẫy: không phải Thủ tướng Chính phủ hay Bộ trưởng Bộ Giáo dục và Đào tạo.", "r": "Điều 2 khoản 2 điểm a Nghị quyết 248/2025/QH15", "o": [["thủ tướng chính phủ"], ["chính phủ"], ["bộ trưởng bộ giáo dục và đào tạo"], ["quốc hội"]], "k": 1}, {"t": "f", "q": "Cơ sở giáo dục nghề nghiệp, giáo dục đại học tự chủ xác nhận đối tượng miễn giấy phép lao động cho chuyên gia, nhà khoa học người nước ngoài trong thời hạn không quá ____ năm.", "a": [["03", "3", "ba"]], "e": "Điều 2.1.c: không quá 03 năm.", "r": "Điều 2 khoản 1 điểm c Nghị quyết 248/2025/QH15", "o": [["05"], ["02"], ["01"], ["03"]], "k": 3}, {"t": "f", "q": "Cơ sở giáo dục nghề nghiệp, giáo dục đại học được ____ quyết định mức thu nhập tăng thêm từ nguồn thu hợp pháp ngoài ngân sách nhà nước cấp được để lại.", "a": [["tự chủ"]], "e": "Điều 2.2.b: được tự chủ quyết định.", "r": "Điều 2 khoản 2 điểm b Nghị quyết 248/2025/QH15", "o": [["ủy quyền"], ["đề xuất"], ["phối hợp"], ["tự chủ"]], "k": 3}], "ynho": ["NQ **248/2025/QH15**: thông qua **10/12/2025**, hiệu lực **01/01/2026**.", "**Giám đốc Sở GDĐT** tuyển dụng, tiếp nhận nhà giáo, cán bộ quản lý, nhân viên trường công lập.", "**Chủ tịch UBND cấp xã** điều động, thuyên chuyển, biệt phái, bổ nhiệm, **miễn nhiệm** người thuộc thẩm quyền.", "Phụ cấp ưu đãi nghề tối thiểu **70%** giáo viên, **30%** nhân viên, **100%** giáo viên vùng đặc biệt khó khăn.", "Miễn giấy phép lao động: **không quá 03 năm** (GDNN, đại học)."], "bang": [{"tieu_de": "Ai có thẩm quyền gì (Điều 2 khoản 1)", "cot": ["Chủ thể", "Thẩm quyền"], "dong": [["Giám đốc Sở GDĐT", "Tuyển dụng, tiếp nhận nhà giáo, CBQL, nhân viên trường công lập trong tỉnh"], ["Giám đốc Sở GDĐT", "Điều động, bổ nhiệm... khi cơ sở liên quan từ 02 đơn vị cấp xã trở lên"], ["Chủ tịch UBND cấp xã", "Điều động, thuyên chuyển, biệt phái, bổ nhiệm, miễn nhiệm, thay đổi vị trí việc làm"], ["Cơ sở GDNN, đại học", "Tự chủ vị trí việc làm, tuyển dụng, ký HĐLĐ với tiến sĩ nước ngoài, Việt kiều"]]}, {"tieu_de": "Số liệu phụ cấp ưu đãi nghề (Điều 2 khoản 2 điểm a)", "cot": ["Đối tượng", "Mức"], "dong": [["Giáo viên mầm non, phổ thông công lập", "Tối thiểu 70%"], ["Nhân viên", "Tối thiểu 30%"], ["Giáo viên biên giới, hải đảo, vùng ĐBDTTS, miền núi, vùng đặc biệt khó khăn", "100%"], ["Lộ trình", "Do Chính phủ quy định"]]}], "vidu": [{"tinh_huong": "Cô Lan là giáo viên Tin học một trường THCS công lập, nghe tin Giám đốc Sở GDĐT tỉnh sẽ tuyển dụng giáo viên mới cho trường cô.", "ket_luan": "→ Đúng. Giám đốc Sở có thẩm quyền tuyển dụng, tiếp nhận nhà giáo, cán bộ quản lý, nhân viên trong cơ sở giáo dục công lập trên địa bàn tỉnh (Điều 2 khoản 1 điểm a)."}, {"tinh_huong": "Thầy Hùng ở một trường THCS thuộc xã X cần điều động sang trường THCS cũng thuộc xã X. Hiệu trưởng hỏi ai có thẩm quyền.", "ket_luan": "→ Chủ tịch UBND cấp xã. Người thuộc thẩm quyền quản lý trong phạm vi xã do Chủ tịch UBND cấp xã điều động (Điều 2 khoản 1 điểm b); Giám đốc Sở chỉ khi cơ sở liên quan từ 02 đơn vị cấp xã trở lên."}, {"tinh_huong": "Một trường THCS công lập ở xã miền núi đặc biệt khó khăn xây dựng phương án phụ cấp ưu đãi nghề cho toàn bộ giáo viên với mức 70%.", "ket_luan": "→ Chưa đúng. Giáo viên ở vùng đặc biệt khó khăn, miền núi, vùng đồng bào dân tộc thiểu số, biên giới, hải đảo được hưởng 100%; 70% là mức tối thiểu chung (Điều 2 khoản 2 điểm a)."}, {"tinh_huong": "Cô Mai, nhân viên thư viện trường THCS công lập, thắc mắc mức phụ cấp ưu đãi nghề tối thiểu dành cho nhân viên.", "ket_luan": "→ Tối thiểu 30%, theo lộ trình do Chính phủ quy định (Điều 2 khoản 2 điểm a)."}, {"tinh_huong": "Một trường đại học tuyển tiến sĩ người nước ngoài và tự xác nhận đối tượng miễn giấy phép lao động trong thời hạn 03 năm.", "ket_luan": "→ Đúng. Cơ sở GDNN, đại học được tự chịu trách nhiệm xác nhận miễn giấy phép lao động trong thời hạn không quá 03 năm (Điều 2 khoản 1 điểm c)."}], "nho": ["**Sở** lo đầu vào (tuyển dụng, tiếp nhận) và liên xã; **Chủ tịch xã** lo điều động, bổ nhiệm, miễn nhiệm trong phạm vi xã.", "Dãy số phụ cấp: **7 - 3 - 10** (70% giáo viên, 30% nhân viên, 100% vùng khó); luôn là mức **tối thiểu** chung.", "**Không quá** 03 năm là giới hạn trên (miễn giấy phép lao động); đừng đọc thành 'tối thiểu'."]}, {"id": "L6-2", "ten": "Chương trình giáo dục, chuyển đổi số, hợp tác quốc tế và hỗ trợ người học (Điều 3-5)", "tomtat": ["**Bộ trưởng Bộ Giáo dục và Đào tạo** quyết định **một bộ sách giáo khoa** giáo dục phổ thông sử dụng thống nhất toàn quốc, thực hiện từ năm học **2026 - 2027** (Điều 3 khoản 1).", "Đến năm **2030** hoàn thành cung cấp **miễn phí sách giáo khoa** cho học sinh; ưu tiên biên giới, hải đảo, vùng đồng bào dân tộc thiểu số và miền núi, vùng kinh tế - xã hội đặc biệt khó khăn (Điều 3 khoản 1).", "Nhà nước bảo đảm nguồn lực miễn học phí và giáo trình môn **Giáo dục quốc phòng và an ninh** ở GDNN, đại học theo lộ trình do **Chính phủ** quy định (Điều 3 khoản 1 đoạn 2).", "Cơ sở giáo dục **được hợp tác** với tổ chức khoa học và công nghệ, viện nghiên cứu, doanh nghiệp, tổ chức khác để thực hiện chương trình gắn với nhu cầu thị trường lao động (Điều 3 khoản 2).", "Nhà nước ưu tiên đầu tư **cơ sở dữ liệu quốc gia** về giáo dục và đào tạo, hạ tầng số, nền tảng dùng chung; đến **2030** các cơ sở giáo dục **đại học** hoàn thành hạ tầng số, nền tảng số đồng bộ, kết nối liên thông (Điều 4 khoản 1).", "Doanh nghiệp được **khuyến khích** đầu tư sản phẩm, dịch vụ giáo dục số theo phương thức đối tác công tư (Điều 4 khoản 1).", "Cơ sở GDNN, đại học, tổ chức KH&CN chủ động tổ chức hội nghị, hội thảo quốc tế và **thông báo cơ quan quản lý trực tiếp** trước khi tổ chức; trường hợp nhạy cảm theo quy định của **Thủ tướng Chính phủ** và pháp luật bí mật nhà nước (Điều 4 khoản 2).", "**Bộ trưởng Bộ GDĐT** quyết định thành lập phân hiệu cơ sở giáo dục đại học công lập Việt Nam ở nước ngoài (Điều 4 khoản 3).", "Người học được vay tín dụng ưu đãi từ **Ngân hàng Chính sách xã hội** để chi trả học tập và sinh hoạt (Điều 5 khoản 1).", "Chương trình trọng điểm đào tạo **tiến sĩ toàn thời gian** do Chính phủ quy định; nghiên cứu sinh được học bổng và hỗ trợ sinh hoạt phí (Điều 5 khoản 2); ngành đặc thù nghệ thuật, thể thao thành tích cao do Bộ Văn hóa, Thể thao và Du lịch đặt hàng, giao nhiệm vụ đào tạo dài hạn (Điều 5 khoản 3)."], "bay": ["⚠ Bộ trưởng Bộ GDĐT (SGK, phân hiệu ở nước ngoài) ≠ Chính phủ ≠ Thủ tướng Chính phủ.", "⚠ Năm học 2026 - 2027 (một bộ SGK) ≠ năm 2030 (hoàn thành miễn phí SGK; hạ tầng số đại học).", "⚠ Nghị quyết 248 miễn học phí và giáo trình môn GDQP&AN ở GDNN, đại học; KHÔNG quy định miễn học phí phổ thông.", "⚠ 'được hợp tác' ≠ 'phải hợp tác'; 'khuyến khích' ≠ 'bắt buộc'.", "⚠ Mốc 2030 về hạ tầng số: cơ sở giáo dục ĐẠI HỌC, không phải mầm non/phổ thông."], "cauhoi": [{"t": "s", "q": "Ai quyết định một bộ sách giáo khoa giáo dục phổ thông sử dụng thống nhất toàn quốc theo Nghị quyết 248?", "o": ["Thủ tướng Chính phủ", "Chính phủ", "Chủ tịch Ủy ban nhân dân cấp tỉnh", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [3], "e": "Điều 3.1 giao Bộ trưởng BGDĐT. Bẫy: Chính phủ / Thủ tướng Chính phủ.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Một bộ sách giáo khoa giáo dục phổ thông sử dụng thống nhất toàn quốc được thực hiện từ năm học nào?", "o": ["2025 - 2026", "2026 - 2027", "2027 - 2028", "2030 - 2031"], "a": [1], "e": "Điều 3.1: từ năm học 2026 - 2027. Bẫy: năm 2030 là mốc hoàn thành miễn phí sách giáo khoa.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Đến năm 2030, Nghị quyết 248 đặt mục tiêu hoàn thành việc gì?", "o": ["Miễn học phí cho toàn bộ học sinh phổ thông", "Cung cấp miễn phí sách giáo khoa cho học sinh", "Cung cấp miễn phí sách giáo khoa và vở viết cho học sinh", "Cung cấp miễn phí sách giáo khoa cho sinh viên đại học"], "a": [1], "e": "Điều 3.1 chỉ nói miễn phí sách giáo khoa cho học sinh. Miễn học phí phổ thông không nằm trong Nghị quyết 248.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Khi cung cấp miễn phí sách giáo khoa cho học sinh, Nghị quyết 248 ưu tiên khu vực nào?", "o": ["Các đô thị lớn có mật độ học sinh cao", "Chỉ các xã vùng đồng bằng đã đạt chuẩn nông thôn mới", "Các thành phố trực thuộc trung ương", "Khu vực biên giới, hải đảo, vùng đồng bào dân tộc thiểu số và miền núi, vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn"], "a": [3], "e": "Điều 3.1 nêu các khu vực khó khăn, đặc thù được ưu tiên.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Nhà nước bảo đảm nguồn lực để miễn học phí và giáo trình môn học nào tại cơ sở giáo dục nghề nghiệp, giáo dục đại học theo Nghị quyết 248?", "o": ["Giáo dục quốc phòng và an ninh", "Giáo dục thể chất", "Tin học đại cương", "Ngoại ngữ"], "a": [0], "e": "Điều 3.1 đoạn 2: môn Giáo dục quốc phòng và an ninh. Bẫy: không phải mọi môn học.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Việc bảo đảm nguồn lực miễn học phí và giáo trình môn Giáo dục quốc phòng và an ninh ở cơ sở giáo dục nghề nghiệp, giáo dục đại học thực hiện theo lộ trình do cơ quan nào quy định?", "o": ["Bộ trưởng Bộ Giáo dục và Đào tạo", "Quốc hội", "Chính phủ", "Hội đồng nhân dân cấp tỉnh"], "a": [2], "e": "Điều 3.1 đoạn 2: lộ trình do Chính phủ quy định, phù hợp khả năng cân đối ngân sách nhà nước.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Phát biểu nào đúng về hợp tác của cơ sở giáo dục theo Điều 3 khoản 2 Nghị quyết 248?", "o": ["Cơ sở giáo dục phải hợp tác với doanh nghiệp để thực hiện chương trình giáo dục", "Cơ sở giáo dục chỉ được hợp tác với viện nghiên cứu, không được hợp tác với doanh nghiệp", "Cơ sở giáo dục được hợp tác với tổ chức khoa học và công nghệ, viện nghiên cứu, doanh nghiệp và các tổ chức khác để thực hiện chương trình giáo dục hoặc đào tạo gắn với nhu cầu thị trường lao động", "Cơ sở giáo dục chỉ được hợp tác khi được Quốc hội cho phép"], "a": [2], "e": "Điều 3.2 dùng 'được hợp tác' (quyền, không bắt buộc) và liệt kê cả doanh nghiệp. Bẫy: 'phải' khác 'được'; 'chỉ' thu hẹp phạm vi.", "r": "Điều 3 khoản 2 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Theo Điều 4 khoản 1 Nghị quyết 248, đến năm 2030 cơ sở giáo dục nào phải hoàn thành hạ tầng số, nền tảng số đồng bộ, kết nối liên thông?", "o": ["Các cơ sở giáo dục đại học", "Các cơ sở giáo dục phổ thông", "Các cơ sở giáo dục mầm non", "Các cơ sở giáo dục thường xuyên"], "a": [0], "e": "Mốc 2030 về hạ tầng số, nền tảng số đồng bộ chỉ nêu đối với cơ sở giáo dục đại học.", "r": "Điều 4 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Ai quyết định thành lập phân hiệu của cơ sở giáo dục đại học công lập Việt Nam ở nước ngoài?", "o": ["Thủ tướng Chính phủ", "Chính phủ", "Giám đốc Sở Giáo dục và Đào tạo", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [3], "e": "Điều 4.3 giao Bộ trưởng BGDĐT quyết định, theo đề án được cơ quan quản lý trực tiếp phê duyệt và phù hợp pháp luật nước sở tại.", "r": "Điều 4 khoản 3 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Người học có thể tiếp cận nguồn tín dụng ưu đãi từ tổ chức nào để chi trả chi phí học tập và sinh hoạt theo Nghị quyết 248?", "o": ["Ngân hàng Nhà nước Việt Nam", "Ngân hàng Chính sách xã hội", "Ngân hàng Phát triển Việt Nam", "Ngân hàng Thương mại Cổ phần Ngoại thương"], "a": [1], "e": "Điều 5.1: Ngân hàng Chính sách xã hội.", "r": "Điều 5 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào sau đây đúng với Điều 4 khoản 1 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Nhà nước ưu tiên đầu tư xây dựng cơ sở dữ liệu quốc gia về giáo dục và đào tạo", "Bắt buộc doanh nghiệp đầu tư phát triển sản phẩm giáo dục số", "Đến năm 2030 mọi cơ sở giáo dục phổ thông phải hoàn thành hạ tầng số đồng bộ", "Nhà nước ưu tiên đầu tư hạ tầng số và nền tảng dùng chung", "Khuyến khích doanh nghiệp đầu tư, phát triển sản phẩm, dịch vụ giáo dục số theo phương thức đối tác công tư"], "a": [0, 3, 4], "e": "Với doanh nghiệp chỉ là 'khuyến khích', không bắt buộc; mốc 2030 nêu cho cơ sở giáo dục đại học.", "r": "Điều 4 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào đúng với Điều 5 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Nghiên cứu sinh tham gia chương trình trọng điểm đào tạo tiến sĩ toàn thời gian được cấp học bổng và hỗ trợ sinh hoạt phí", "Người học được tiếp cận tín dụng ưu đãi của Ngân hàng Chính sách xã hội cho học tập và sinh hoạt", "Bộ Giáo dục và Đào tạo thực hiện cơ chế đặt hàng đào tạo ngành đặc thù nghệ thuật, thể thao thành tích cao", "Chương trình trọng điểm đào tạo tiến sĩ do Thủ tướng Chính phủ quy định", "Bộ Văn hóa, Thể thao và Du lịch thực hiện cơ chế giao nhiệm vụ, đặt hàng đào tạo dài hạn đối với ngành đặc thù nghệ thuật, thể thao thành tích cao"], "a": [0, 1, 4], "e": "Cơ chế đặt hàng ngành nghệ thuật, thể thao thành tích cao thuộc Bộ VHTTDL; chương trình trọng điểm đào tạo tiến sĩ toàn thời gian do Chính phủ quy định (không phải Thủ tướng).", "r": "Điều 5 khoản 1, 2, 3 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào đúng với Điều 3 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Việc miễn học phí và giáo trình môn Giáo dục quốc phòng và an ninh ở giáo dục nghề nghiệp, đại học thực hiện theo lộ trình do Chính phủ quy định", "Bộ trưởng Bộ Giáo dục và Đào tạo quyết định một bộ sách giáo khoa giáo dục phổ thông dùng thống nhất toàn quốc từ năm học 2026 - 2027", "Nghị quyết miễn học phí cho toàn bộ học sinh giáo dục phổ thông", "Việc miễn học phí môn Giáo dục quốc phòng và an ninh áp dụng ở cơ sở giáo dục phổ thông", "Việc bảo đảm nguồn lực miễn học phí và giáo trình môn Giáo dục quốc phòng và an ninh phải phù hợp với khả năng cân đối ngân sách nhà nước"], "a": [0, 1, 4], "e": "Nghị quyết 248 không có quy định miễn học phí phổ thông; môn GDQP&AN nêu ở GDNN, đại học.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Phát biểu nào đúng về hội nghị, hội thảo quốc tế theo Điều 4 khoản 2 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Phải thông báo cho cơ quan quản lý trực tiếp trước khi tổ chức", "Cơ sở giáo dục nghề nghiệp, giáo dục đại học, tổ chức khoa học và công nghệ được chủ động tổ chức trong các lĩnh vực nêu tại khoản này", "Hội nghị, hội thảo có nội dung liên quan đến chủ quyền quốc gia phải tuân thủ quy định của Thủ tướng Chính phủ và pháp luật về bảo vệ bí mật nhà nước", "Mọi hội nghị, hội thảo quốc tế phải được Quốc hội phê duyệt trước", "Chỉ cơ sở giáo dục phổ thông mới được chủ động tổ chức"], "a": [0, 1, 2], "e": "Quy định theo hướng chủ động và chỉ phải thông báo; trường hợp nhạy cảm theo quy định của Thủ tướng Chính phủ và pháp luật bí mật nhà nước.", "r": "Điều 4 khoản 2 Nghị quyết 248/2025/QH15"}, {"t": "f", "q": "Bộ trưởng Bộ Giáo dục và Đào tạo quyết định một bộ ____ giáo khoa giáo dục phổ thông sử dụng thống nhất ____.", "a": [["sách"], ["toàn quốc"]], "e": "Điều 3.1: một bộ sách giáo khoa dùng thống nhất toàn quốc.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15", "o": [["sách", "từng tỉnh"], ["sách", "toàn quốc"], ["tài liệu", "toàn quốc"], ["sách", "từng địa phương"]], "k": 1}, {"t": "f", "q": "Đến năm ____, hoàn thành việc cung cấp ____ sách giáo khoa cho học sinh.", "a": [["2030"], ["miễn phí"]], "e": "Điều 3.1: mốc 2030, miễn phí sách giáo khoa.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15", "o": [["2035", "miễn phí"], ["2030", "giảm giá"], ["2028", "giảm 50%"], ["2030", "miễn phí"]], "k": 3}, {"t": "f", "q": "Nhà nước bảo đảm nguồn lực để miễn học phí và giáo trình môn học Giáo dục ____ và an ninh tại cơ sở giáo dục nghề nghiệp, giáo dục đại học theo lộ trình do ____ quy định.", "a": [["quốc phòng"], ["chính phủ"]], "e": "Điều 3.1 đoạn 2.", "r": "Điều 3 khoản 1 Nghị quyết 248/2025/QH15", "o": [["thể chất", "chính phủ"], ["quốc phòng", "thủ tướng chính phủ"], ["quốc phòng", "bộ trưởng bộ giáo dục và đào tạo"], ["quốc phòng", "chính phủ"]], "k": 3}, {"t": "f", "q": "Đến năm 2030, các cơ sở giáo dục ____ hoàn thành hạ tầng số, nền tảng số đồng bộ, kết nối ____.", "a": [["đại học"], ["liên thông"]], "e": "Điều 4.1.", "r": "Điều 4 khoản 1 Nghị quyết 248/2025/QH15", "o": [["đại học", "liên thông"], ["phổ thông", "liên thông"], ["đại học", "riêng biệt"], ["mầm non", "độc lập"]], "k": 0}, {"t": "f", "q": "Người học được tiếp cận nguồn tín dụng ưu đãi từ Ngân hàng ____ xã hội để chi trả chi phí học tập và ____.", "a": [["chính sách"], ["sinh hoạt"]], "e": "Điều 5.1.", "r": "Điều 5 khoản 1 Nghị quyết 248/2025/QH15", "o": [["thương mại", "sinh hoạt"], ["chính sách", "sinh hoạt"], ["chính sách", "đi lại"], ["phát triển", "nhà ở"]], "k": 1}, {"t": "f", "q": "Bộ trưởng Bộ Giáo dục và Đào tạo quyết định việc thành lập ____ của cơ sở giáo dục đại học công lập Việt Nam ở ____.", "a": [["phân hiệu"], ["nước ngoài"]], "e": "Điều 4.3.", "r": "Điều 4 khoản 3 Nghị quyết 248/2025/QH15", "o": [["chi nhánh", "nước ngoài"], ["phân hiệu", "nước ngoài"], ["phân hiệu", "tỉnh khác"], ["văn phòng đại diện", "trong nước"]], "k": 1}], "ynho": ["**Một bộ SGK** thống nhất toàn quốc do **Bộ trưởng Bộ GDĐT** quyết định, từ năm học **2026 - 2027**.", "Đến **2030** hoàn thành cung cấp **miễn phí SGK** cho học sinh.", "Đến **2030** các cơ sở giáo dục **đại học** hoàn thành hạ tầng số, nền tảng số đồng bộ.", "Người học vay ưu đãi từ **Ngân hàng Chính sách xã hội**.", "Miễn học phí, giáo trình môn **GDQP&AN** ở GDNN, đại học theo lộ trình do **Chính phủ** quy định."], "bang": [{"tieu_de": "Mốc năm và nội dung (Điều 3-4)", "cot": ["Mốc", "Nội dung"], "dong": [["2026 - 2027", "Thực hiện một bộ SGK giáo dục phổ thông thống nhất toàn quốc"], ["2030", "Hoàn thành cung cấp miễn phí SGK cho học sinh"], ["2030", "Cơ sở giáo dục đại học hoàn thành hạ tầng số, nền tảng số đồng bộ, liên thông"]]}, {"tieu_de": "Ai quyết định, ai quy định", "cot": ["Chủ thể", "Việc"], "dong": [["Bộ trưởng Bộ GDĐT", "Quyết định bộ SGK; quyết định thành lập phân hiệu đại học công lập ở nước ngoài"], ["Chính phủ", "Lộ trình miễn học phí GDQP&AN; chương trình trọng điểm đào tạo tiến sĩ toàn thời gian"], ["Thủ tướng Chính phủ", "Quy định trường hợp nhạy cảm khi tổ chức hội nghị, hội thảo quốc tế"], ["Bộ Văn hóa, Thể thao và Du lịch", "Đặt hàng, giao nhiệm vụ đào tạo ngành đặc thù nghệ thuật, thể thao"]]}], "vidu": [{"tinh_huong": "Hiệu trưởng trường THCS phổ biến: từ năm học 2026 - 2027 giáo viên dạy theo một bộ SGK thống nhất toàn quốc.", "ket_luan": "→ Đúng. Bộ trưởng Bộ GDĐT quyết định một bộ SGK giáo dục phổ thông dùng thống nhất, thực hiện từ năm học 2026 - 2027 (Điều 3 khoản 1)."}, {"tinh_huong": "Phụ huynh em Nam hỏi: Nghị quyết 248 đã miễn học phí cho học sinh THCS chưa?", "ket_luan": "→ Không có quy định đó. NQ 248 bảo đảm miễn học phí và giáo trình môn GDQP&AN ở GDNN, đại học, không quy định miễn học phí phổ thông (Điều 3 khoản 1)."}, {"tinh_huong": "Thầy Bình dạy Tin học, nghe nói đến năm 2030 mọi trường THCS đều phải hoàn thành hạ tầng số theo Nghị quyết 248.", "ket_luan": "→ Sai. Mốc 2030 về hạ tầng số, nền tảng số đồng bộ là của cơ sở giáo dục đại học (Điều 4 khoản 1)."}, {"tinh_huong": "Một trường đại học tổ chức hội thảo quốc tế, thông báo cho cơ quan quản lý trực tiếp trước khi tổ chức.", "ket_luan": "→ Đúng. Cơ sở GDNN, đại học chủ động tổ chức và thông báo cơ quan quản lý trực tiếp; trường hợp nhạy cảm theo quy định của Thủ tướng Chính phủ (Điều 4 khoản 2)."}, {"tinh_huong": "Sinh viên Hà gặp khó khăn tài chính, hỏi có được vay tín dụng ưu đãi không.", "ket_luan": "→ Có. Người học được vay tín dụng ưu đãi từ Ngân hàng Chính sách xã hội để chi trả học tập và sinh hoạt (Điều 5 khoản 1)."}], "nho": ["**2026 - 2027** = SGK **một bộ**; **2030** = **miễn phí** SGK và **số hóa đại học**.", "Thứ bậc: **Bộ trưởng** (SGK, phân hiệu) - **Chính phủ** (lộ trình, tiến sĩ) - **Thủ tướng** (hội thảo nhạy cảm).", "'**Được** hợp tác', '**khuyến khích**' là mở, không bắt buộc."]}, {"id": "L6-3", "ten": "Ưu đãi đầu tư, chuyển tiếp khi hội đồng trường chấm dứt, tổ chức thực hiện và hiệu lực (Điều 6-9)", "tomtat": ["Nhà nước bảo đảm bố trí **tối thiểu 20%** tổng chi ngân sách nhà nước cho giáo dục và đào tạo; ưu tiên biên giới, hải đảo, vùng đồng bào dân tộc thiểu số và miền núi, vùng đặc biệt khó khăn (Điều 6 khoản 4).", "**Hội đồng nhân dân cấp tỉnh** quyết định bổ sung dự án đầu tư trung hạn lĩnh vực giáo dục và đào tạo (Điều 6 khoản 1).", "**Ủy ban nhân dân cấp tỉnh** ưu tiên bố trí quỹ đất cho cơ sở giáo dục, đào tạo; cho phép tổ chức, cá nhân thuê trụ sở dôi dư, cơ sở vật chất nhà nước để hoạt động giáo dục (Điều 6 khoản 2).", "**Đất ở**, đất xây dựng trụ sở làm việc, công trình sự nghiệp khác và đất sản xuất kinh doanh phi nông nghiệp được dùng cho mục đích giáo dục, đào tạo **không phụ thuộc quy hoạch, kế hoạch sử dụng đất** (Điều 6 khoản 3).", "Trong **06 tháng** sau khi hội đồng trường (công lập) chấm dứt hoạt động, **cơ quan quản lý trực tiếp** quyết định công việc về tổ chức, nhân sự và quyết định người đứng đầu theo tiêu chuẩn do **Bộ trưởng Bộ GDĐT** quy định (Điều 7 khoản 1).", "Cơ quan quản lý trực tiếp cho phép số lượng cấp phó **vượt quy định tối đa trong 05 năm** và lập kế hoạch giảm dần (Điều 7 khoản 2).", "**Chính phủ** hướng dẫn thực hiện và **báo cáo hằng năm** với Quốc hội kết quả thực hiện Nghị quyết (Điều 8 khoản 1).", "**Bộ GDĐT** là đầu mối, chịu trách nhiệm trước Chính phủ (Điều 8 khoản 2); Quốc hội, Ủy ban Thường vụ Quốc hội, HĐND, Mặt trận Tổ quốc Việt Nam... giám sát trong phạm vi nhiệm vụ, quyền hạn (Điều 8 khoản 3).", "Hiệu lực từ **01/01/2026** (Điều 9 khoản 1).", "Quy định khác nhau với luật, nghị quyết khác của Quốc hội về cùng vấn đề thì **áp dụng Nghị quyết 248**, trừ khoản 3 (Điều 9 khoản 2).", "Văn bản của Quốc hội ban hành **sau** có cơ chế, chính sách **ưu đãi, thuận lợi hơn** thì áp dụng văn bản đó (Điều 9 khoản 3)."], "bay": ["⚠ HĐND cấp tỉnh (bổ sung dự án đầu tư trung hạn) ≠ UBND cấp tỉnh (quỹ đất, cho thuê trụ sở dôi dư).", "⚠ 06 tháng (xử lý công việc, nhân sự) ≠ 05 năm (cấp phó vượt quy định).", "⚠ 'tối thiểu 20%' ≠ 'tối đa 20%' tổng chi ngân sách nhà nước.", "⚠ Cơ quan quản lý trực tiếp quyết định người đứng đầu; Bộ trưởng chỉ quy định tiêu chuẩn.", "⚠ 10/12/2025 (ngày thông qua) ≠ 01/01/2026 (hiệu lực); Điều 9.2 (ưu tiên NQ 248) có ngoại lệ Điều 9.3."], "cauhoi": [{"t": "s", "q": "Theo Nghị quyết 248, Nhà nước bảo đảm bố trí tỷ lệ nào trong tổng chi ngân sách nhà nước cho giáo dục và đào tạo?", "o": ["Tối đa 20%", "Tối thiểu 20%", "Tối thiểu 15%", "Tối thiểu 30%"], "a": [1], "e": "Điều 6.4: tối thiểu 20% tổng chi NSNN. Bẫy: 'tối thiểu' khác 'tối đa'.", "r": "Điều 6 khoản 4 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Cơ quan nào quyết định bổ sung dự án đầu tư trung hạn thuộc lĩnh vực giáo dục và đào tạo theo Điều 6 khoản 1 Nghị quyết 248?", "o": ["Ủy ban nhân dân cấp tỉnh", "Hội đồng nhân dân cấp xã", "Chính phủ", "Hội đồng nhân dân cấp tỉnh"], "a": [3], "e": "Điều 6.1: HĐND cấp tỉnh. UBND cấp tỉnh ở khoản 2 là cơ quan ưu tiên bố trí quỹ đất.", "r": "Điều 6 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Cơ quan nào có trách nhiệm ưu tiên bố trí đủ diện tích đất cho cơ sở giáo dục và đào tạo trong quy hoạch cấp tỉnh theo Nghị quyết 248?", "o": ["Ủy ban nhân dân cấp tỉnh", "Hội đồng nhân dân cấp tỉnh", "Sở Giáo dục và Đào tạo", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [0], "e": "Điều 6.2 giao UBND cấp tỉnh. Bẫy: HĐND cấp tỉnh (khoản 1) và UBND cấp tỉnh (khoản 2) khác nhau.", "r": "Điều 6 khoản 2 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Loại đất nào sau đây có thể được sử dụng cho mục đích giáo dục và đào tạo mà không phụ thuộc vào quy hoạch, kế hoạch sử dụng đất theo Điều 6 khoản 3?", "o": ["Đất trồng lúa nước", "Đất rừng đặc dụng", "Đất ở", "Đất quốc phòng, an ninh"], "a": [2], "e": "Điều 6.3 nêu đất ở, đất xây dựng trụ sở làm việc, công trình sự nghiệp khác cơ sở giáo dục và đào tạo, đất sản xuất kinh doanh phi nông nghiệp.", "r": "Điều 6 khoản 3 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Trong thời hạn bao lâu sau khi hội đồng trường chấm dứt hoạt động, cơ quan quản lý trực tiếp quyết định các công việc về tổ chức, nhân sự do hội đồng trường đảm nhiệm trước đó?", "o": ["03 tháng", "12 tháng", "06 tháng", "05 năm"], "a": [2], "e": "Điều 7.1: trong 06 tháng. Bẫy: 05 năm là thời hạn cho phép số lượng cấp phó vượt quy định (Điều 7.2).", "r": "Điều 7 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Cơ quan quản lý trực tiếp được cho phép số lượng cấp phó vượt quy định tối đa trong thời hạn bao lâu sau khi hội đồng trường chấm dứt hoạt động?", "o": ["05 năm", "06 tháng", "01 năm", "03 năm"], "a": [0], "e": "Điều 7.2: 05 năm và phải lập kế hoạch giảm dần. 06 tháng là thời hạn tại khoản 1.", "r": "Điều 7 khoản 2 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Khi hội đồng trường chấm dứt hoạt động, người đứng đầu cơ sở giáo dục được quyết định thế nào theo Điều 7 khoản 1?", "o": ["Hội đồng trường quyết định người đứng đầu rồi mới chấm dứt hoạt động", "Bộ trưởng Bộ Giáo dục và Đào tạo trực tiếp quyết định người đứng đầu mọi cơ sở giáo dục", "Người đứng đầu đương nhiệm tự chỉ định người kế nhiệm", "Cơ quan quản lý trực tiếp quyết định người đứng đầu theo tiêu chuẩn, điều kiện do Bộ trưởng Bộ Giáo dục và Đào tạo quy định"], "a": [3], "e": "Cơ quan quản lý trực tiếp quyết định; Bộ trưởng chỉ quy định tiêu chuẩn, điều kiện. Bẫy: đổi chủ thể quyết định.", "r": "Điều 7 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Việc báo cáo kết quả thực hiện Nghị quyết 248/2025/QH15 được quy định như thế nào?", "o": ["Bộ trưởng Bộ Giáo dục và Đào tạo báo cáo 6 tháng một lần với Ủy ban Thường vụ Quốc hội", "Chính phủ báo cáo hằng năm với Quốc hội trong báo cáo về hoạt động giáo dục và thực hiện ngân sách giáo dục", "Thủ tướng Chính phủ báo cáo 5 năm một lần với Quốc hội", "Ủy ban nhân dân cấp tỉnh báo cáo hằng năm với Chính phủ"], "a": [1], "e": "Điều 8.1: Chính phủ hướng dẫn thực hiện và báo cáo kết quả hằng năm với Quốc hội.", "r": "Điều 8 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Cơ quan nào là đầu mối, chịu trách nhiệm trước Chính phủ trong việc thực hiện Nghị quyết 248?", "o": ["Bộ Nội vụ", "Bộ Giáo dục và Đào tạo", "Bộ Tài chính", "Văn phòng Chính phủ"], "a": [1], "e": "Điều 8.2: Bộ Giáo dục và Đào tạo là đầu mối.", "r": "Điều 8 khoản 2 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Khi văn bản của Quốc hội ban hành sau Nghị quyết 248 có cơ chế, chính sách ưu đãi, thuận lợi hơn thì áp dụng thế nào?", "o": ["Vẫn áp dụng Nghị quyết 248 vì Nghị quyết 248 luôn được ưu tiên", "Chỉ áp dụng sau khi Chính phủ có văn bản hướng dẫn", "Áp dụng khi Thủ tướng Chính phủ quyết định", "Áp dụng cơ chế, chính sách của văn bản ban hành sau"], "a": [3], "e": "Điều 9.3 là ngoại lệ của Điều 9.2: văn bản ban hành sau mà ưu đãi hơn thì áp dụng.", "r": "Điều 9 khoản 3 Nghị quyết 248/2025/QH15"}, {"t": "s", "q": "Nghị quyết 248/2025/QH15 có hiệu lực thi hành từ ngày nào?", "o": ["01/01/2026", "10/12/2025", "01/01/2025", "01/09/2026"], "a": [0], "e": "Điều 9.1: hiệu lực từ 01/01/2026. 10/12/2025 là ngày Quốc hội thông qua.", "r": "Điều 9 khoản 1 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào đúng với Điều 6 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Ủy ban nhân dân cấp tỉnh cho phép tổ chức, cá nhân thuê trụ sở dôi dư, cơ sở vật chất của Nhà nước để hoạt động giáo dục và đào tạo", "Hội đồng nhân dân cấp tỉnh quyết định bổ sung dự án đầu tư trung hạn thuộc lĩnh vực giáo dục và đào tạo", "Chỉ tổ chức công lập mới được thuê trụ sở dôi dư để hoạt động giáo dục", "Ủy ban nhân dân cấp xã quyết định bổ sung dự án đầu tư trung hạn lĩnh vực giáo dục", "Đất ở được sử dụng cho mục đích giáo dục và đào tạo mà không căn cứ vào quy hoạch, kế hoạch sử dụng đất"], "a": [0, 1, 4], "e": "Điều 6.1-6.3. Các phương án sai đổi chủ thể quyết định hoặc thu hẹp đối tượng được thuê.", "r": "Điều 6 khoản 1, 2, 3 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào đúng với Điều 7 Nghị quyết 248 về xử lý chuyển tiếp khi hội đồng trường chấm dứt hoạt động? (chọn tất cả đáp án đúng)", "o": ["Số lượng cấp phó được phép vượt quy định tối đa trong 05 năm và phải lập kế hoạch giảm dần", "Người đứng đầu được quyết định theo tiêu chuẩn, điều kiện do Bộ trưởng Bộ Giáo dục và Đào tạo quy định", "Số lượng cấp phó được phép vượt quy định tối đa trong 06 tháng", "Hội đồng trường tiếp tục hoạt động thêm 12 tháng để bàn giao", "Trong 06 tháng, cơ quan quản lý trực tiếp quyết định công việc về tổ chức, nhân sự do hội đồng trường đảm nhiệm"], "a": [0, 1, 4], "e": "Hãy phân biệt 06 tháng (xử lý công việc, nhân sự) và 05 năm (cấp phó vượt quy định).", "r": "Điều 7 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào đúng với Điều 8 Nghị quyết 248 về tổ chức thực hiện? (chọn tất cả đáp án đúng)", "o": ["Bộ Giáo dục và Đào tạo là đầu mối, chịu trách nhiệm trước Chính phủ", "Mặt trận Tổ quốc Việt Nam giám sát việc thực hiện Nghị quyết trong phạm vi nhiệm vụ, quyền hạn", "Chính phủ báo cáo kết quả thực hiện với Quốc hội 5 năm một lần", "Bộ Nội vụ là cơ quan đầu mối thực hiện Nghị quyết", "Chính phủ hướng dẫn thực hiện Nghị quyết"], "a": [0, 1, 4], "e": "Báo cáo là hằng năm; đầu mối là Bộ GDĐT.", "r": "Điều 8 Nghị quyết 248/2025/QH15"}, {"t": "m", "q": "Nội dung nào đúng với Điều 9 Nghị quyết 248? (chọn tất cả đáp án đúng)", "o": ["Quy định khác nhau giữa Nghị quyết 248 và luật, nghị quyết khác của Quốc hội về cùng vấn đề thì áp dụng Nghị quyết 248, trừ trường hợp khoản 3", "Nghị quyết có hiệu lực từ ngày 01/01/2026", "Luật ban hành trước luôn được ưu tiên áp dụng hơn Nghị quyết 248", "Nghị quyết 248 luôn được ưu tiên, kể cả khi văn bản Quốc hội ban hành sau ưu đãi hơn", "Văn bản của Quốc hội ban hành sau có cơ chế, chính sách ưu đãi hơn thì áp dụng văn bản đó"], "a": [0, 1, 4], "e": "Điều 9.2 ưu tiên áp dụng NQ 248 nhưng có ngoại lệ tại Điều 9.3.", "r": "Điều 9 Nghị quyết 248/2025/QH15"}, {"t": "f", "q": "Nhà nước bảo đảm bố trí tối thiểu ____ tổng chi ngân sách nhà nước cho giáo dục và đào tạo.", "a": [["20%", "20", "hai mươi phần trăm"]], "e": "Điều 6.4.", "r": "Điều 6 khoản 4 Nghị quyết 248/2025/QH15", "o": [["15%"], ["25%"], ["20%"], ["30%"]], "k": 2}, {"t": "f", "q": "Trong thời hạn ____ tháng sau khi hội đồng trường chấm dứt hoạt động, cơ quan quản lý trực tiếp quyết định công việc về tổ chức, nhân sự do hội đồng trường đảm nhiệm.", "a": [["06", "6", "sáu"]], "e": "Điều 7.1.", "r": "Điều 7 khoản 1 Nghị quyết 248/2025/QH15", "o": [["03"], ["09"], ["12"], ["06"]], "k": 3}, {"t": "f", "q": "Cơ quan quản lý trực tiếp cho phép số lượng cấp phó vượt quy định tối đa trong ____ năm và lập kế hoạch giảm ____.", "a": [["05", "5", "năm"], ["dần"]], "e": "Điều 7.2.", "r": "Điều 7 khoản 2 Nghị quyết 248/2025/QH15", "o": [["05", "dần"], ["03", "dần"], ["05", "ngay"], ["10", "ngay lập tức"]], "k": 0}, {"t": "f", "q": "Nghị quyết 248/2025/QH15 có hiệu lực thi hành từ ngày ____.", "a": [["01/01/2026", "1/1/2026", "01 tháng 01 năm 2026", "1 tháng 1 năm 2026"]], "e": "Điều 9.1.", "r": "Điều 9 khoản 1 Nghị quyết 248/2025/QH15", "o": [["01/01/2026"], ["01/07/2026"], ["01/01/2025"], ["10/12/2025"]], "k": 0}, {"t": "f", "q": "Nếu Nghị quyết 248 và luật khác có quy định khác nhau về cùng vấn đề thì áp dụng ____ này, trừ trường hợp quy định tại khoản ____ Điều 9.", "a": [["nghị quyết"], ["3", "ba"]], "e": "Điều 9.2, ngoại lệ ở khoản 3.", "r": "Điều 9 khoản 2 Nghị quyết 248/2025/QH15", "o": [["luật", "3"], ["nghị quyết", "2"], ["luật", "4"], ["nghị quyết", "3"]], "k": 3}, {"t": "f", "q": "Nghị quyết 248/2025/QH15 được Quốc hội khóa ____ thông qua tại kỳ họp thứ ____.", "a": [["xv", "15"], ["10", "mười"]], "e": "Quốc hội khóa XV, kỳ họp thứ 10, ngày 10/12/2025.", "r": "Phần cuối Nghị quyết Nghị quyết 248/2025/QH15", "o": [["XIV", "10"], ["XV", "9"], ["XV", "10"], ["XVI", "11"]], "k": 2}], "ynho": ["Chi NSNN cho GD&ĐT **tối thiểu 20%** tổng chi ngân sách nhà nước (Điều 6 khoản 4).", "Hội đồng trường công lập chấm dứt: trong **06 tháng** cơ quan quản lý trực tiếp quyết định tổ chức, nhân sự, người đứng đầu.", "Cấp phó **vượt quy định tối đa trong 05 năm**, kèm kế hoạch giảm dần.", "**HĐND cấp tỉnh** bổ sung dự án đầu tư trung hạn; **UBND cấp tỉnh** bố trí quỹ đất.", "Hiệu lực **01/01/2026**; Điều 9 khoản 3: văn bản sau ưu đãi hơn thì áp dụng."], "bang": [{"tieu_de": "HĐND tỉnh và UBND tỉnh (Điều 6)", "cot": ["Chủ thể", "Việc"], "dong": [["HĐND cấp tỉnh", "Quyết định bổ sung dự án đầu tư trung hạn lĩnh vực giáo dục và đào tạo"], ["UBND cấp tỉnh", "Ưu tiên quỹ đất; cho thuê trụ sở dôi dư, cơ sở vật chất nhà nước để hoạt động giáo dục"]]}, {"tieu_de": "Số liệu, mốc cần nhớ (Điều 6-9)", "cot": ["Nội dung", "Số liệu"], "dong": [["Chi NSNN cho giáo dục", "Tối thiểu 20%"], ["Xử lý sau khi hội đồng trường chấm dứt", "06 tháng"], ["Cấp phó vượt quy định tối đa", "05 năm"], ["Thông qua / hiệu lực", "10/12/2025 / 01/01/2026"], ["Báo cáo Quốc hội", "Hằng năm (Chính phủ)"]]}], "vidu": [{"tinh_huong": "Hội đồng trường một trường THCS công lập chấm dứt hoạt động. Ai quyết định công việc tổ chức, nhân sự lúc này?", "ket_luan": "→ Cơ quan quản lý trực tiếp, trong 06 tháng, và quyết định người đứng đầu theo tiêu chuẩn do Bộ trưởng Bộ GDĐT quy định (Điều 7 khoản 1)."}, {"tinh_huong": "Sau khi hội đồng trường chấm dứt, trường có 4 phó hiệu trưởng, vượt mức tối đa quy định. Hiệu trưởng lo phải giảm ngay.", "ket_luan": "→ Không bắt buộc ngay. Cơ quan quản lý trực tiếp cho phép vượt tối đa trong 05 năm và lập kế hoạch giảm dần (Điều 7 khoản 2)."}, {"tinh_huong": "Một tỉnh dự kiến bố trí 15% tổng chi ngân sách nhà nước cho giáo dục để xây phòng máy Tin học.", "ket_luan": "→ Không đạt. Nhà nước bảo đảm tối thiểu 20% tổng chi NSNN cho giáo dục và đào tạo (Điều 6 khoản 4)."}, {"tinh_huong": "Ai quyết định bổ sung dự án đầu tư trung hạn xây trường THCS mới của tỉnh?", "ket_luan": "→ HĐND cấp tỉnh (Điều 6 khoản 1); UBND cấp tỉnh lo ưu tiên quỹ đất (khoản 2)."}, {"tinh_huong": "Một quy định của luật khác về cùng vấn đề khác với NQ 248, tranh luận nên áp dụng cái nào.", "ket_luan": "→ Áp dụng NQ 248, trừ khoản 3 (Điều 9 khoản 2); riêng văn bản Quốc hội ban hành sau ưu đãi, thuận lợi hơn thì áp dụng văn bản đó (Điều 9 khoản 3)."}], "nho": ["**6 tháng** lo người (tổ chức, nhân sự); **5 năm** lo cấp phó vượt mức.", "**H**ĐND = **H**ọp quyết **dự án** trung hạn; **U**BND = **U**ớc, bố trí **đất**, cho thuê trụ sở dôi dư.", "**Tối thiểu 20%**: sàn chứ không phải trần; Bộ trưởng chỉ quy định **tiêu chuẩn**, cơ quan quản lý trực tiếp **quyết định** người đứng đầu."]}]});</script>
<script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L7", "ten": "Quy tắc ứng xử: Thông tư 03/2026/TT-BGDĐT (nhà giáo) và Thông tư 06/2019/TT-BGDĐT (cơ sở giáo dục)", "so": "TT 03/2026/TT-BGDĐT; TT 06/2019/TT-BGDĐT", "hieuluc": "30/01/2026 và 28/05/2019", "mota": "Quy tắc ứng xử của nhà giáo (TT 03/2026, thay QĐ 16/2008 và Điều 6 TT 06/2019) và Bộ quy tắc ứng xử trong cơ sở giáo dục mầm non, phổ thông, thường xuyên (TT 06/2019).", "baihoc": [{"id": "L7-1", "ten": "Thông tư 03/2026: phạm vi, mục đích, nguyên tắc và ứng xử chung (Điều 4)", "tomtat": ["TT 03/2026/TT-BGDĐT ban hành và có hiệu lực từ **30/01/2026**; gồm **03 chương, 15 điều**.", "Thay thế **Quyết định 16/2008/QĐ-BGDĐT** (đạo đức nhà giáo) và **Điều 6 Thông tư 06/2019/TT-BGDĐT** (chỉ Điều 6, không phải cả Thông tư 06).", "Áp dụng với **nhà giáo** làm nhiệm vụ giảng dạy, giáo dục trong cơ sở giáo dục thuộc hệ thống giáo dục quốc dân (kể cả nhà giáo lực lượng vũ trang, biệt phái); **không** áp dụng cho người học, cha mẹ, khách.", "Nội dung quy tắc nằm ở **Điều 4 đến Điều 9**, chia **6 nhóm**: chung (Đ4), người học (Đ5), đồng nghiệp (Đ6), cán bộ quản lý (Đ7), cha mẹ hoặc người giám hộ (Đ8), cộng đồng (Đ9).", "Mục đích: bảo đảm chuẩn mực nhận thức, thái độ, hành vi; môi trường giáo dục an toàn, thân thiện; phòng chống tiêu cực và bạo lực học đường; rèn luyện văn hóa ứng xử trong **môi trường số, đặc biệt trên mạng xã hội**.", "Nguyên tắc: tuân thủ pháp luật; bình đẳng, không phân biệt đối xử; tôn trọng đa dạng văn hóa, **đời sống riêng tư, bí mật cá nhân**; ngắn gọn, dễ hiểu; phù hợp cấp học, vùng miền; khả thi, dân chủ, công khai, khách quan.", "Điều 4 khoản 1: chấp hành chủ trương, đường lối của Đảng, chính sách, pháp luật; thực hiện đúng quyền, nghĩa vụ; chấp hành **phân công, điều động của người có thẩm quyền**.", "Điều 4 khoản 2: tận tụy; dạy đúng mục tiêu, nguyên lý giáo dục; trung thực trong học tập, NCKH, giảng dạy; tiếp thu **có chọn lọc** khoa học công nghệ; **có trách nhiệm khi sử dụng thông tin và ứng xử trên không gian mạng**.", "Điều 4 khoản 3: giữ gìn phẩm chất, uy tín, danh dự, nhân phẩm; mẫu mực, nêu gương; tiết kiệm, chống lãng phí, tham nhũng, **bệnh thành tích**; phê bình và tự phê bình thường xuyên.", "Điều 4 khoản 4: bảo vệ cảnh quan cơ sở giáo dục; phòng chống bạo lực học đường; đoàn kết, yêu thương, giúp đỡ; bảo vệ uy tín, danh dự người khác và của cơ sở giáo dục.", "Điều 4 khoản 5: ngôn ngữ trong sáng, dễ hiểu, đúng mực, trung thực, tôn trọng; trang phục gọn gàng, lịch sự, phù hợp môi trường và hoạt động giáo dục.", "Điều 4 khoản 6 (không được làm): lợi dụng chức danh, danh hiệu, hình ảnh nhà giáo để vi phạm pháp luật hay **tư lợi**; **tự ý bỏ việc**; tuyên truyền nội dung trái quan điểm, chính sách của Đảng và Nhà nước; không thờ ơ, né tránh hoặc **che giấu** vi phạm của người học, đồng nghiệp.", "Điều 4 khoản 6: không hút thuốc lá, sử dụng đồ uống có cồn **khi thực hiện nhiệm vụ**; không sử dụng chất cấm và chất kích thích khác theo quy định pháp luật; không tham gia tệ nạn xã hội."], "bay": ["⚠ TT03: hút thuốc, đồ uống có cồn bị cấm **'khi thực hiện nhiệm vụ'** ≠ TT06/2019: cấm **'trong cơ sở giáo dục'**.", "⚠ TT03 thay **Điều 6** của TT06/2019 (không phải cả TT06); và thay **QĐ 16/2008** (không phải QĐ khác).", "⚠ TT03 chỉ dành cho **nhà giáo**; TT06/2019 mới có quy tắc cho người học, cha mẹ, khách.", "⚠ Điều 4 khoản 6: 'né tránh' ≠ 'che giấu' ≠ 'thờ ơ' (đều bị cấm, nghe tương tự); nhớ đủ cụm 'không thờ ơ, né tránh hoặc che giấu'.", "⚠ Nội dung quy tắc là Điều **4–9** (6 nhóm), không phải Điều 1–6 hay 5–10."], "cauhoi": [{"t": "s", "q": "Thông tư 03/2026/TT-BGDĐT thay thế văn bản nào sau đây?", "o": ["Toàn bộ Thông tư 06/2019/TT-BGDĐT", "Quyết định 16/2008/QĐ-BGDĐT và Điều 6 Thông tư 06/2019/TT-BGDĐT", "Quyết định 16/2008/QĐ-BGDĐT và toàn bộ Thông tư 06/2019/TT-BGDĐT", "Chỉ Điều 6 Thông tư 06/2019/TT-BGDĐT, không thay thế Quyết định 16/2008/QĐ-BGDĐT"], "a": [1], "e": "TT03 thay QĐ 16/2008 (đạo đức nhà giáo) và chỉ Điều 6 của TT06/2019; các điều còn lại của TT06 không bị thay thế. Bẫy: 'toàn bộ' và 'chỉ Điều 6' đều sai.", "r": "Thông tư 03/2026/TT-BGDĐT (phần thay thế văn bản)"}, {"t": "s", "q": "Thông tư 03/2026/TT-BGDĐT gồm bao nhiêu chương, bao nhiêu điều?", "o": ["03 chương, 14 điều", "02 chương, 15 điều", "04 chương, 15 điều", "03 chương, 15 điều"], "a": [3], "e": "TT03 gồm 3 chương, 15 điều. Con số 14 điều là của TT06/2019 (cũng 3 chương, 14 điều).", "r": "Thông tư 03/2026/TT-BGDĐT"}, {"t": "s", "q": "Nội dung quy tắc ứng xử của nhà giáo theo Thông tư 03/2026/TT-BGDĐT được quy định tại các điều nào và gồm mấy nhóm?", "o": ["Điều 4 đến Điều 9; 6 nhóm", "Điều 1 đến Điều 6; 6 nhóm", "Điều 4 đến Điều 8; 5 nhóm", "Điều 5 đến Điều 10; 6 nhóm"], "a": [0], "e": "Điều 4 (chung), 5 (người học), 6 (đồng nghiệp), 7 (cán bộ quản lý), 8 (cha mẹ), 9 (cộng đồng) = 6 nhóm.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4–9"}, {"t": "s", "q": "Theo Thông tư 03/2026/TT-BGDĐT, nhà giáo không được hút thuốc lá, sử dụng đồ uống có cồn vào thời điểm nào?", "o": ["Trong cơ sở giáo dục", "Trong giờ lên lớp", "Khi thực hiện nhiệm vụ", "Ở mọi nơi, mọi lúc"], "a": [2], "e": "TT03 Điều 4 khoản 6: 'khi thực hiện nhiệm vụ'. Cụm 'trong cơ sở giáo dục' là của TT06/2019 Điều 4 khoản 6.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6"}, {"t": "s", "q": "Theo Điều 4 khoản 2 Thông tư 03/2026/TT-BGDĐT, nhà giáo phải có trách nhiệm khi sử dụng thông tin và ứng xử ở đâu?", "o": ["Trong lớp học", "Tại nơi công cộng", "Trên không gian mạng", "Trong gia đình"], "a": [2], "e": "Điều 4 khoản 2: có trách nhiệm khi sử dụng thông tin và ứng xử trên không gian mạng (nội dung về ứng xử mạng).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 2"}, {"t": "s", "q": "Phát biểu nào đúng về những điều nhà giáo không được làm theo Điều 4 khoản 6 Thông tư 03/2026/TT-BGDĐT?", "o": ["Không thờ ơ, né tránh hoặc che giấu hành vi vi phạm của người học, đồng nghiệp", "Được sử dụng đồ uống có cồn khi thực hiện nhiệm vụ nếu không say", "Chỉ cấm che giấu vi phạm của người học, còn vi phạm của đồng nghiệp thì không bắt buộc", "Được tuyên truyền nội dung trái chính sách của Nhà nước nếu là ý kiến cá nhân"], "a": [0], "e": "Điều 4 khoản 6 cấm cả thờ ơ/né tránh/che giấu vi phạm của người học lẫn đồng nghiệp; cấm đồ uống có cồn khi thực hiện nhiệm vụ (không phân biệt có say hay không); cấm tuyên truyền nội dung trái quan điểm, chính sách.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6"}, {"t": "s", "q": "Đối tượng điều chỉnh của Thông tư 03/2026/TT-BGDĐT là ai?", "o": ["Nhà giáo, người học và cha mẹ người học", "Chỉ nhà giáo trong cơ sở giáo dục công lập", "Cán bộ quản lý, giáo viên, nhân viên và khách đến cơ sở giáo dục", "Nhà giáo làm nhiệm vụ giảng dạy, giáo dục trong cơ sở giáo dục thuộc hệ thống giáo dục quốc dân"], "a": [3], "e": "TT03 chỉ quy định quy tắc ứng xử của nhà giáo. Việc quy định cả người học, cha mẹ, khách là của TT06/2019.", "r": "Thông tư 03/2026/TT-BGDĐT (phạm vi, đối tượng áp dụng)"}, {"t": "s", "q": "Theo Điều 4 khoản 5 Thông tư 03/2026/TT-BGDĐT, trang phục của nhà giáo phải như thế nào?", "o": ["Mặc đồng phục thống nhất của nhà trường", "Gọn gàng, lịch sự, phù hợp môi trường và hoạt động giáo dục", "Sạch sẽ, gọn gàng, phù hợp lứa tuổi", "Phù hợp tính chất công việc"], "a": [1], "e": "TT03 khoản 5: gọn gàng, lịch sự, phù hợp môi trường và hoạt động giáo dục. 'Sạch sẽ, gọn gàng' là yêu cầu với người học; 'phù hợp tính chất công việc' là với nhân viên (TT06 Điều 4 khoản 4).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 5"}, {"t": "s", "q": "Theo Điều 4 khoản 3 Thông tư 03/2026/TT-BGDĐT, nhà giáo tiết kiệm, chống những gì?", "o": ["Lãng phí, tham nhũng, bệnh thành tích", "Lãng phí, tham nhũng, tiêu cực trong thi cử", "Lãng phí, bệnh thành tích, bạo lực học đường", "Tham nhũng, bệnh thành tích, tin giả"], "a": [0], "e": "Khoản 3: tiết kiệm, chống lãng phí, tham nhũng, bệnh thành tích. Các cụm khác (tiêu cực thi cử, bạo lực học đường, tin giả) nằm ở các nội dung khác nên không đúng cụm này.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 3"}, {"t": "s", "q": "Thông tư 03/2026/TT-BGDĐT làm căn cứ để nhà giáo rèn luyện văn hóa ứng xử trong môi trường nào được nhấn mạnh?", "o": ["Môi trường lớp học, đặc biệt trong giờ dạy", "Môi trường gia đình, đặc biệt với cha mẹ người học", "Môi trường số, đặc biệt trên mạng xã hội", "Môi trường quốc tế, đặc biệt trong hợp tác giáo dục"], "a": [2], "e": "Mục đích của TT03 nêu rõ văn hóa ứng xử trong môi trường số, đặc biệt trên mạng xã hội.", "r": "Thông tư 03/2026/TT-BGDĐT (mục đích)"}, {"t": "s", "q": "Nguyên tắc nào sau đây đúng với việc xây dựng quy tắc ứng xử của nhà giáo theo Thông tư 03/2026/TT-BGDĐT?", "o": ["Áp dụng thống nhất tuyệt đối, không tính đến cấp học và vùng miền", "Phù hợp cấp học, trình độ đào tạo, phương thức giáo dục, đặc trưng vùng miền", "Ưu tiên bảo vệ uy tín nhà trường hơn quyền riêng tư của cá nhân", "Chỉ cần khả thi, không cần công khai"], "a": [1], "e": "Nguyên tắc: phù hợp cấp học, trình độ đào tạo, phương thức, vùng miền; tôn trọng đời sống riêng tư, bí mật cá nhân; khả thi, dân chủ, công khai, khách quan.", "r": "Thông tư 03/2026/TT-BGDĐT (nguyên tắc)"}, {"t": "s", "q": "Điều 4 khoản 1 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo chấp hành sự phân công, điều động của ai?", "o": ["Hiệu trưởng", "Tổ trưởng chuyên môn", "Cơ quan quản lý giáo dục cấp trên", "Người có thẩm quyền"], "a": [3], "e": "Khoản 1: 'người có thẩm quyền' (không giới hạn một chức danh cụ thể như hiệu trưởng).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 1"}, {"t": "m", "q": "Những hành vi nào sau đây nhà giáo không được làm theo Điều 4 khoản 6 Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Sử dụng đồ uống có cồn khi thực hiện nhiệm vụ", "Tham gia hoạt động từ thiện, nhân đạo", "Che giấu hành vi vi phạm của đồng nghiệp", "Tự phê bình và phê bình thường xuyên", "Tự ý bỏ việc"], "a": [0, 2, 4], "e": "Tự ý bỏ việc, uống rượu bia khi thực hiện nhiệm vụ, che giấu vi phạm đều bị cấm. Từ thiện (Điều 9) và phê bình, tự phê bình (Điều 4 khoản 3) là việc nên làm.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6"}, {"t": "m", "q": "Các nhóm quan hệ nào là đối tượng ứng xử của nhà giáo được quy định riêng trong Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Khách đến cơ sở giáo dục", "Nhân viên cơ sở giáo dục", "Cha mẹ hoặc người giám hộ của người học", "Người học", "Cộng đồng"], "a": [2, 3, 4], "e": "TT03 có 6 nhóm: chung, người học, đồng nghiệp, cán bộ quản lý, cha mẹ/người giám hộ, cộng đồng. 'Khách' và 'nhân viên' là nhóm trong TT06/2019.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4–9"}, {"t": "m", "q": "Mục đích của Thông tư 03/2026/TT-BGDĐT gồm những nội dung nào? (chọn tất cả đáp án đúng)", "o": ["Bảo đảm chuẩn mực nhận thức, thái độ, hành vi của nhà giáo", "Thay thế toàn bộ Luật Nhà giáo 2025", "Phòng chống tiêu cực và bạo lực học đường", "Tạo cơ sở pháp lý thống nhất để cơ sở giáo dục xây dựng quy tắc phù hợp thực tiễn", "Quy định cách ứng xử của người học và cha mẹ người học"], "a": [0, 2, 3], "e": "TT03 chỉ điều chỉnh ứng xử của nhà giáo, không quy định cho người học, cha mẹ (là TT06/2019) và không thay Luật.", "r": "Thông tư 03/2026/TT-BGDĐT (mục đích)"}, {"t": "m", "q": "Điều 4 khoản 2 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo thực hiện những nội dung nào? (chọn tất cả đáp án đúng)", "o": ["Tiếp thu toàn bộ khoa học công nghệ mới", "Dạy đúng mục tiêu, nguyên lý giáo dục", "Thực hiện chương trình ở mức tối thiểu", "Trung thực trong học tập, nghiên cứu khoa học, giảng dạy", "Tiếp thu có chọn lọc khoa học và công nghệ"], "a": [1, 3, 4], "e": "Khoản 2 nêu 'tiếp thu có chọn lọc' và 'thực hiện đầy đủ, bảo đảm chất lượng chương trình'. 'Toàn bộ' và 'tối thiểu' là bẫy.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 2"}, {"t": "m", "q": "Điều 4 khoản 4 Thông tư 03/2026/TT-BGDĐT quy định nhà giáo thực hiện những việc nào? (chọn tất cả đáp án đúng)", "o": ["Chỉ bảo vệ uy tín, danh dự của bản thân", "Bảo vệ cảnh quan cơ sở giáo dục", "Phòng chống bạo lực học đường", "Xây dựng quy tắc ứng xử cho cha mẹ người học", "Bảo vệ uy tín, danh dự của người khác và của cơ sở giáo dục"], "a": [1, 2, 4], "e": "Khoản 4 yêu cầu bảo vệ uy tín, danh dự của người khác và cơ sở giáo dục (không chỉ bản thân).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 4"}, {"t": "f", "q": "Thông tư 03/2026/TT-BGDĐT có hiệu lực thi hành từ ngày ____.", "a": [["30/01/2026", "30/1/2026"]], "e": "TT03 ban hành và có hiệu lực từ 30/01/2026.", "r": "Thông tư 03/2026/TT-BGDĐT", "o": [["01/01/2026"], ["30/01/2026"], ["30/01/2025"], ["15/03/2026"]], "k": 1}, {"t": "f", "q": "Thông tư 03/2026/TT-BGDĐT gồm ____ chương và ____ điều.", "a": [["3", "03", "ba"], ["15", "mười lăm"]], "e": "3 chương, 15 điều (TT06/2019 là 3 chương, 14 điều).", "r": "Thông tư 03/2026/TT-BGDĐT", "o": [["3", "14"], ["4", "15"], ["2", "16"], ["3", "15"]], "k": 3}, {"t": "f", "q": "Nhà giáo không hút thuốc lá, sử dụng đồ uống có cồn khi ____.", "a": [["thực hiện nhiệm vụ"]], "e": "TT03: 'khi thực hiện nhiệm vụ'; TT06: 'trong cơ sở giáo dục'.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6", "o": [["trong cơ sở giáo dục"], ["thực hiện nhiệm vụ"], ["ngoài giờ làm việc"], ["trong giờ lên lớp"]], "k": 1}, {"t": "f", "q": "Nhà giáo không thờ ơ, né tránh hoặc ____ hành vi vi phạm của người học, đồng nghiệp.", "a": [["che giấu"]], "e": "Cụm đúng: 'không thờ ơ, né tránh hoặc che giấu'.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6", "o": [["phê phán"], ["tố cáo"], ["báo cáo"], ["che giấu"]], "k": 3}, {"t": "f", "q": "Nhà giáo không lợi dụng chức danh, danh hiệu, hình ảnh nhà giáo và hoạt động nghề nghiệp để vi phạm pháp luật hay ____ cá nhân.", "a": [["tư lợi"]], "e": "Điều 4 khoản 6: vi phạm pháp luật hay tư lợi cá nhân.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6", "o": [["phục vụ"], ["bảo vệ"], ["tư lợi"], ["hỗ trợ"]], "k": 2}, {"t": "f", "q": "Nhà giáo tiết kiệm, chống lãng phí, tham nhũng, bệnh ____.", "a": [["thành tích"]], "e": "Điều 4 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 3", "o": [["hình thức"], ["quan liêu"], ["thành tích"], ["bảo thủ"]], "k": 2}, {"t": "f", "q": "Nhà giáo có trách nhiệm khi sử dụng thông tin và ứng xử trên ____.", "a": [["không gian mạng"]], "e": "Điều 4 khoản 2.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 2", "o": [["không gian mạng"], ["mạng xã hội"], ["internet"], ["truyền thông đại chúng"]], "k": 0}, {"t": "f", "q": "Nội dung quy tắc ứng xử của nhà giáo nằm từ Điều ____ đến Điều ____ của Thông tư 03/2026/TT-BGDĐT.", "a": [["4", "bốn"], ["9", "chín"]], "e": "6 nhóm ứng xử từ Điều 4 đến Điều 9.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4–9", "o": [["3", "9"], ["4", "10"], ["4", "9"], ["5", "8"]], "k": 2}, {"t": "f", "q": "Thông tư 03/2026/TT-BGDĐT thay thế Quyết định số ____/2008/QĐ-BGDĐT về đạo đức nhà giáo.", "a": [["16"]], "e": "QĐ 16/2008/QĐ-BGDĐT ngày 16/4/2008.", "r": "Thông tư 03/2026/TT-BGDĐT (phần thay thế văn bản)", "o": [["06"], ["16"], ["20"], ["15"]], "k": 1}], "ynho": ["TT **03/2026** có hiệu lực **30/01/2026**; gồm **3 chương, 15 điều**.", "Thay **QĐ 16/2008** và chỉ **Điều 6** của TT 06/2019.", "Quy tắc nằm ở **Điều 4–9**, chia **6 nhóm** quan hệ.", "Cấm hút thuốc, đồ uống có cồn **khi thực hiện nhiệm vụ**.", "Không **thờ ơ, né tránh hoặc che giấu** vi phạm của người học, đồng nghiệp."], "bang": [{"tieu_de": "6 nhóm ứng xử của TT03/2026 (Điều 4–9)", "cot": ["Điều", "Nhóm quan hệ", "Từ khoá"], "dong": [["4", "Ứng xử chung", "Không gian mạng, tư lợi, bỏ việc, thờ ơ-né tránh-che giấu"], ["5", "Người học", "Không phân biệt đối xử, phải báo cáo bạo lực"], ["6", "Đồng nghiệp", "Không chia rẽ, đùn đẩy, công khai thông tin"], ["7", "Cán bộ quản lý", "Chấp hành, cầu thị, tham mưu, chính kiến"], ["8", "Cha mẹ/người giám hộ", "Thông tin trung thực, không ép buộc"], ["9", "Cộng đồng", "Chống tin giả, không mê tín dị đoan"]]}, {"tieu_de": "TT03/2026 và TT06/2019 dễ nhầm", "cot": ["Tiêu chí", "TT03/2026", "TT06/2019"], "dong": [["Hiệu lực", "30/01/2026", "28/5/2019"], ["Quy mô", "3 chương, 15 điều", "3 chương, 14 điều"], ["Đối tượng", "Chỉ nhà giáo", "CBQL, GV, nhân viên, người học, cha mẹ, khách"], ["Cấm thuốc lá, cồn", "Khi thực hiện nhiệm vụ", "Trong cơ sở giáo dục"], ["Quan hệ", "Thay QĐ 16/2008 và Điều 6 TT06", "Điều 6 hết hiệu lực từ 30/01/2026"]]}], "vidu": [{"tinh_huong": "Thầy Nam, giáo viên Tin học, đang trực ban sân trường giờ ra chơi thì ra góc sân hút thuốc lá.", "ket_luan": "→ Vi phạm. Điều 4 khoản 6 TT03/2026 cấm hút thuốc lá khi thực hiện nhiệm vụ."}, {"tinh_huong": "Tối thứ Bảy, cô Hà chia sẻ lên Facebook một bài 'tin nóng' về chính sách giáo dục mà chưa kiểm chứng nguồn, nhiều đồng nghiệp share lại.", "ket_luan": "→ Không phù hợp. Điều 4 khoản 2 yêu cầu có trách nhiệm khi sử dụng thông tin và ứng xử trên không gian mạng."}, {"tinh_huong": "Cô Lan chứng kiến một đồng nghiệp quát tháo, đánh học sinh ở hành lang nhưng im lặng 'cho khỏi mất lòng'.", "ket_luan": "→ Vi phạm. Điều 4 khoản 6 cấm thờ ơ, né tránh hoặc che giấu vi phạm của người học, đồng nghiệp."}, {"tinh_huong": "Cô Mai tự giới thiệu 'cô giáo trường X' trong nhóm Zalo phụ huynh để bán thực phẩm chức năng cho phụ huynh.", "ket_luan": "→ Vi phạm. Điều 4 khoản 6 cấm lợi dụng chức danh, hình ảnh nhà giáo để tư lợi."}, {"tinh_huong": "Thầy Bình nhận quyết định điều động sang cơ sở khác nhưng không đồng ý, không bàn giao mà nghỉ làm luôn.", "ket_luan": "→ Vi phạm. Điều 4 khoản 1 yêu cầu chấp hành điều động của người có thẩm quyền; khoản 6 cấm tự ý bỏ việc."}], "nho": ["Điều 4–9 = 6 nhóm: Chung – Học trò – Đồng nghiệp – Sếp (CBQL) – Phụ huynh – Cộng đồng, đúng thứ tự 4-5-6-7-8-9.", "TT**03** = '**t**hực hiện nhiệm vụ' (không ở nhà thì không cấm); TT**06** = '**t**rong cơ sở giáo dục' (cứ ở trường là cấm).", "Ba chữ 'thờ ơ – né tránh – che giấu' luôn đi cùng nhau, nhớ đủ cả cụm.", "Thay thế: 'QĐ 16/2008 + Điều 6 TT06' (chỉ một điều, không phải cả TT06)."]}, {"id": "L7-2", "ten": "Thông tư 03/2026: ứng xử của nhà giáo với người học (Điều 5)", "tomtat": ["Điều 5 khoản 1: thái độ mẫu mực, bao dung, trách nhiệm, yêu thương; phản hồi, nhận xét, **khen hoặc phê bình phù hợp đối tượng và hoàn cảnh**; động viên, khích lệ.", "Điều 5 khoản 2: tạo môi trường giáo dục **an toàn, tích cực, bình đẳng**; khuyến khích người học nghiên cứu, lao động sản xuất, hoạt động phục vụ cộng đồng, phát triển bền vững.", "Điều 5 khoản 3: tôn trọng, đánh giá **đúng thực chất** năng lực; bảo vệ quyền, lợi ích hợp pháp, chính đáng của người học; tạo động lực.", "Điều 5 khoản 3: lắng nghe, **kịp thời** tư vấn, hỗ trợ về học tập, xã hội, phù hợp **tâm sinh lý lứa tuổi**.", "Điều 5 khoản 4 (không được làm) - **không phân biệt đối xử** giữa người học dưới mọi hình thức.", "Điều 5 khoản 4: không **xúc phạm, gây tổn thương, trù dập, định kiến, bạo hành, xâm hại** người học dưới mọi hình thức.", "Điều 5 khoản 4: khi phát hiện người học bị bạo lực, xâm hại thì **phải báo cáo kịp thời** với lãnh đạo, cơ quan có thẩm quyền.", "Điều 5 khoản 4: không **ép buộc** người học tham gia hoạt động mang tính chất **tự nguyện**.", "Điều 5 khoản 4: không **công khai thông tin của người học trái quy định**.", "Điều 5 khoản 4: không **gian lận, cố ý làm sai lệch kết quả** trong tuyển sinh, đánh giá người học.", "Liên hệ: Điều 4 khoản 6 cấm thờ ơ, né tránh, che giấu vi phạm; Điều 4 khoản 5 yêu cầu ngôn ngữ đúng mực."], "bay": ["⚠ Điều 5 khoản 4: 'ép buộc người học tham gia hoạt động **tự nguyện**' ≠ Điều 8 khoản 4: 'ép buộc **cha mẹ** tham gia hoạt động trái quy định của Nhà nước và hoạt động tự nguyện'.", "⚠ 'Đánh giá **đúng thực chất**' ≠ đánh giá theo hướng nâng điểm để khích lệ; 'gian lận, cố ý làm **sai lệch** kết quả'.", "⚠ Khi phát hiện bạo lực, xâm hại thì **phải** báo cáo kịp thời (không phải 'có thể'); báo cáo lãnh đạo, cơ quan có thẩm quyền.", "⚠ 'Phân biệt đối xử' và 'xúc phạm, trù dập...' đều áp dụng 'dưới mọi hình thức' (không có ngoại lệ)."], "cauhoi": [{"t": "s", "q": "Theo Điều 5 khoản 1 Thông tư 03/2026/TT-BGDĐT, khi phản hồi, nhận xét, khen hoặc phê bình người học, nhà giáo phải làm thế nào?", "o": ["Phê bình công khai trước lớp để làm gương cho người khác", "Phù hợp đối tượng và hoàn cảnh", "Chỉ khen, không phê bình để tránh tổn thương", "Áp dụng cùng một mức độ cho mọi người học"], "a": [1], "e": "Điều 5 khoản 1: khen hoặc phê bình phù hợp đối tượng và hoàn cảnh; không có chuyện một mức cho mọi người học hay chỉ khen không phê bình.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 1"}, {"t": "s", "q": "Điều 5 khoản 3 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo đánh giá năng lực người học như thế nào?", "o": ["Theo hướng nâng điểm để tạo động lực", "Theo mặt bằng chung của lớp", "Ưu tiên người học có hoàn cảnh khó khăn", "Đúng thực chất"], "a": [3], "e": "Khoản 3: tôn trọng, đánh giá đúng thực chất năng lực. Nâng điểm là làm sai lệch, vi phạm khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 3"}, {"t": "s", "q": "Khi phát hiện người học bị bạo lực, xâm hại, nhà giáo phải làm gì theo Điều 5 khoản 4 Thông tư 03/2026/TT-BGDĐT?", "o": ["Báo cáo kịp thời với lãnh đạo, cơ quan có thẩm quyền", "Tự giải quyết nội bộ, không cần báo cáo", "Chỉ báo cáo khi cha mẹ người học yêu cầu", "Báo cáo vào cuối năm học"], "a": [0], "e": "Khoản 4: phải báo cáo kịp thời với lãnh đạo, cơ quan có thẩm quyền; Điều 4 khoản 6 cấm thờ ơ, né tránh, che giấu.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4"}, {"t": "s", "q": "Cô giáo bắt buộc cả lớp phải tham gia câu lạc bộ ngoại khóa mang tính tự nguyện, em nào không tham gia sẽ bị hạ hạnh kiểm. Hành vi này vi phạm quy định nào?", "o": ["Không vi phạm vì nhằm mục đích giáo dục", "Điều 8 khoản 4: không ép buộc cha mẹ tham gia hoạt động", "Điều 5 khoản 4: không ép buộc người học tham gia hoạt động mang tính chất tự nguyện", "Điều 6 khoản 3: không đùn đẩy trách nhiệm với đồng nghiệp"], "a": [2], "e": "Đối tượng bị ép buộc là người học nên áp dụng Điều 5 khoản 4. Điều 8 khoản 4 áp dụng khi ép buộc cha mẹ người học.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4"}, {"t": "s", "q": "Một giáo viên đăng ảnh bài kiểm tra điểm kém của một học sinh lên nhóm phụ huynh của lớp. Hành vi này vi phạm quy định nào của Thông tư 03/2026/TT-BGDĐT?", "o": ["Không vi phạm vì nhóm phụ huynh là kênh chính thống", "Không tham gia tệ nạn xã hội (Điều 4 khoản 6)", "Không công khai thông tin của người học trái quy định (Điều 5 khoản 4)", "Không tự ý bỏ việc (Điều 4 khoản 6)"], "a": [2], "e": "Công khai thông tin của người học trái quy định là hành vi bị cấm ở Điều 5 khoản 4; phụ huynh khác không phải đối tượng được chia sẻ thông tin đó.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4"}, {"t": "s", "q": "Quy định về gian lận, cố ý làm sai lệch kết quả trong tuyển sinh, đánh giá người học nằm ở điều khoản nào của Thông tư 03/2026/TT-BGDĐT?", "o": ["Điều 5 khoản 4", "Điều 6 khoản 3", "Điều 7 khoản 4", "Điều 8 khoản 4"], "a": [0], "e": "Điều 5 khoản 4 (ứng xử với người học) có điểm cấm gian lận, làm sai lệch kết quả tuyển sinh, đánh giá. Điều 6 K3, 7 K4, 8 K4 là các điều cấm với đồng nghiệp, cán bộ quản lý, cha mẹ.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4"}, {"t": "s", "q": "Theo Điều 5 khoản 2 Thông tư 03/2026/TT-BGDĐT, nhà giáo tạo môi trường giáo dục như thế nào?", "o": ["An toàn, cạnh tranh, kỷ luật", "Thân thiện, tiết kiệm, kỷ luật", "Bình đẳng, nghiêm khắc, cạnh tranh", "An toàn, tích cực, bình đẳng"], "a": [3], "e": "Khoản 2: môi trường giáo dục an toàn, tích cực, bình đẳng.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 2"}, {"t": "s", "q": "Điều 5 khoản 3 Thông tư 03/2026/TT-BGDĐT yêu cầu tư vấn, hỗ trợ người học phải phù hợp với yếu tố nào?", "o": ["Kết quả học tập của người học", "Tâm sinh lý lứa tuổi", "Điều kiện kinh tế gia đình", "Nguyện vọng của cha mẹ"], "a": [1], "e": "Khoản 3: lắng nghe, kịp thời tư vấn, hỗ trợ về học tập, xã hội, phù hợp tâm sinh lý lứa tuổi.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 3"}, {"t": "s", "q": "Phát biểu nào đúng về hành vi bị cấm đối với người học theo Điều 5 khoản 4 Thông tư 03/2026/TT-BGDĐT?", "o": ["Không phân biệt đối xử giữa người học dưới mọi hình thức", "Không phân biệt đối xử giữa người học, trừ trường hợp học lực yếu", "Chỉ cấm bạo hành về thân thể, không cấm xúc phạm bằng lời nói", "Chỉ cấm xâm hại, không cấm trù dập"], "a": [0], "e": "Khoản 4: cấm phân biệt đối xử, xúc phạm, gây tổn thương, trù dập, định kiến, bạo hành, xâm hại 'dưới mọi hình thức', không có ngoại lệ.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4"}, {"t": "s", "q": "Giáo viên nói 'ngu như bò' với học sinh trước lớp. Hành vi này vi phạm quy định nào của Thông tư 03/2026/TT-BGDĐT?", "o": ["Không vi phạm vì chỉ là lời nói, không bạo hành thể chất", "Chỉ vi phạm khi học sinh hoặc cha mẹ phản ánh", "Không xúc phạm, gây tổn thương người học dưới mọi hình thức (Điều 5 khoản 4)", "Điều 6 khoản 3: không xúc phạm đồng nghiệp"], "a": [2], "e": "Xúc phạm, gây tổn thương người học 'dưới mọi hình thức' (kể cả lời nói) bị cấm; Điều 4 khoản 5 cũng yêu cầu ngôn ngữ đúng mực.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4; Điều 4 khoản 5"}, {"t": "s", "q": "Phát biểu nào đúng khi so sánh quy định ép buộc trong Điều 5 và Điều 8 của Thông tư 03/2026/TT-BGDĐT?", "o": ["Điều 5 cấm ép buộc người học tham gia hoạt động trái quy định của Nhà nước; Điều 8 cấm ép buộc cha mẹ tham gia hoạt động tự nguyện", "Điều 5 cấm ép buộc người học tham gia hoạt động mang tính chất tự nguyện; Điều 8 cấm ép buộc cha mẹ tham gia hoạt động trái quy định của Nhà nước và hoạt động mang tính chất tự nguyện", "Cả hai điều đều chỉ cấm ép buộc người học", "Điều 8 chỉ cấm ép buộc cha mẹ tham gia hoạt động trái quy định, không nhắc đến hoạt động tự nguyện"], "a": [1], "e": "Điều 5 K4: người học + hoạt động tự nguyện. Điều 8 K4: cha mẹ + hoạt động trái quy định của Nhà nước và hoạt động tự nguyện. Các phương án nhiễu đảo chủ thể hoặc bỏ bớt vế.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4; Điều 8 khoản 4"}, {"t": "s", "q": "Điều 5 khoản 2 Thông tư 03/2026/TT-BGDĐT khuyến khích người học hoạt động nào sau đây?", "o": ["Thi đua tích lũy điểm số, giành giải thưởng", "Chỉ tham gia hoạt động học thuật", "Tham gia hoạt động từ thiện bắt buộc theo kế hoạch", "Nghiên cứu, lao động sản xuất, hoạt động phục vụ cộng đồng, phát triển bền vững"], "a": [3], "e": "Khoản 2 khuyến khích (không bắt buộc) nghiên cứu, lao động sản xuất, hoạt động phục vụ cộng đồng, phát triển bền vững.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 2"}, {"t": "m", "q": "Những hành vi nào nhà giáo không được làm với người học theo Điều 5 khoản 4 Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Định kiến với người học", "Động viên, khích lệ người học", "Tư vấn, hỗ trợ người học về học tập", "Phân biệt đối xử giữa người học", "Cố ý làm sai lệch kết quả đánh giá người học"], "a": [0, 3, 4], "e": "Phân biệt đối xử, định kiến, làm sai lệch kết quả đánh giá đều bị cấm. Động viên, tư vấn là việc nhà giáo cần làm.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5"}, {"t": "m", "q": "Giáo viên phát hiện một học sinh bị bạo lực. Hành động nào phù hợp với Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Báo cáo kịp thời với lãnh đạo, cơ quan có thẩm quyền", "Không thờ ơ, né tránh hoặc che giấu", "Bảo vệ quyền, lợi ích hợp pháp, chính đáng của học sinh", "Tự xử lý riêng để giữ uy tín nhà trường", "Chờ cha mẹ đồng ý rồi mới báo cáo"], "a": [0, 1, 2], "e": "Phải báo cáo kịp thời (Điều 5 K4), không che giấu (Điều 4 K6) và bảo vệ quyền lợi của học sinh (Điều 5 K3). 'Chờ đồng ý' hoặc 'giữ uy tín' là che giấu.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 3, 4; Điều 4 khoản 6"}, {"t": "m", "q": "Điều 5 khoản 3 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo thực hiện những việc nào? (chọn tất cả đáp án đúng)", "o": ["Nâng điểm để người học có động lực", "Bảo vệ quyền, lợi ích hợp pháp, chính đáng của người học", "Đánh giá theo thứ hạng so sánh giữa người học", "Tôn trọng, đánh giá đúng thực chất năng lực người học", "Lắng nghe, kịp thời tư vấn, hỗ trợ người học"], "a": [1, 3, 4], "e": "Khoản 3 yêu cầu đánh giá đúng thực chất, không nâng điểm. (Không so sánh học sinh với nhau là nội dung của Điều lệ trường phổ thông, không thuộc khoản này.)", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 3"}, {"t": "m", "q": "Hành vi nào sau đây vi phạm Điều 5 khoản 4 Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Khen ngợi học sinh có tiến bộ", "Sửa điểm bài kiểm tra cho học sinh", "Nhắc nhở riêng một học sinh vi phạm nội quy, phù hợp hoàn cảnh", "Bắt học sinh tham gia hoạt động tự nguyện, không tham gia thì hạ hạnh kiểm", "Đăng công khai điểm kém của một học sinh lên nhóm phụ huynh trái quy định"], "a": [1, 3, 4], "e": "Ba hành vi đầu lần lượt là công khai thông tin trái quy định, làm sai lệch kết quả, ép buộc hoạt động tự nguyện; hai hành vi còn lại là ứng xử đúng (Điều 5 khoản 1).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4"}, {"t": "f", "q": "Nhà giáo không ____ đối xử giữa người học dưới mọi hình thức.", "a": [["phân biệt"]], "e": "Điều 5 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4", "o": [["phân loại"], ["so sánh"], ["phân biệt"], ["chênh lệch"]], "k": 2}, {"t": "f", "q": "Nhà giáo không ép buộc người học tham gia hoạt động mang tính chất ____.", "a": [["tự nguyện"]], "e": "Điều 5 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4", "o": [["bắt buộc"], ["hành chính"], ["tự nguyện"], ["từ thiện"]], "k": 2}, {"t": "f", "q": "Nhà giáo không công khai thông tin của người học ____ quy định.", "a": [["trái"]], "e": "Điều 5 khoản 4: 'trái quy định'.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4", "o": [["ngoài"], ["vượt"], ["đúng"], ["trái"]], "k": 3}, {"t": "f", "q": "Khi phát hiện người học bị bạo lực, xâm hại, nhà giáo phải ____ kịp thời với lãnh đạo, cơ quan có thẩm quyền.", "a": [["báo cáo"]], "e": "Điều 5 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4", "o": [["báo cáo"], ["xử lý"], ["hòa giải"], ["giữ bí mật"]], "k": 0}, {"t": "f", "q": "Nhà giáo tôn trọng, đánh giá ____ năng lực người học.", "a": [["đúng thực chất"]], "e": "Điều 5 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 3", "o": [["thấp hơn"], ["phóng đại"], ["đúng thực chất"], ["một chiều"]], "k": 2}, {"t": "f", "q": "Nhà giáo không xúc phạm, gây tổn thương, ____, định kiến, bạo hành, xâm hại người học dưới mọi hình thức.", "a": [["trù dập"]], "e": "Điều 5 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4", "o": [["ưu ái"], ["dung túng"], ["lạm dụng"], ["trù dập"]], "k": 3}, {"t": "f", "q": "Nhà giáo không gian lận, cố ý làm ____ kết quả trong tuyển sinh, đánh giá người học.", "a": [["sai lệch"]], "e": "Điều 5 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5 khoản 4", "o": [["chậm trễ"], ["sai lệch"], ["thất lạc"], ["giảm"]], "k": 1}, {"t": "f", "q": "Ứng xử của nhà giáo với người học được quy định tại Điều ____ Thông tư 03/2026/TT-BGDĐT.", "a": [["5", "năm"]], "e": "Điều 5.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 5", "o": [["4"], ["6"], ["5"], ["7"]], "k": 2}], "ynho": ["Điều 5 khoản 4 là nhóm điều **không được làm** với người học.", "**Không phân biệt đối xử** giữa người học dưới mọi hình thức.", "Phát hiện người học bị bạo lực, xâm hại thì **phải báo cáo kịp thời**.", "Không **ép buộc** người học tham gia hoạt động **tự nguyện**; không **công khai thông tin** trái quy định.", "Đánh giá **đúng thực chất**; không **gian lận, cố ý làm sai lệch** kết quả."], "bang": [{"tieu_de": "Điều 5 theo từng khoản", "cot": ["Khoản", "Nội dung", "Từ khoá"], "dong": [["1", "Thái độ, phản hồi, khen hoặc phê bình", "Phù hợp đối tượng và hoàn cảnh"], ["2", "Tạo môi trường giáo dục", "An toàn, tích cực, bình đẳng"], ["3", "Đánh giá và hỗ trợ người học", "Đúng thực chất; tư vấn kịp thời; tâm sinh lý lứa tuổi"], ["4", "Những điều không được làm", "5 nhóm hành vi cấm (xem bảng dưới)"]]}, {"tieu_de": "Điều 5 khoản 4: không được làm", "cot": ["Hành vi cấm", "Từ khoá"], "dong": [["Phân biệt đối xử", "Dưới mọi hình thức"], ["Xúc phạm, gây tổn thương, trù dập, định kiến, bạo hành, xâm hại", "Dưới mọi hình thức; phát hiện thì phải báo cáo"], ["Ép buộc tham gia hoạt động tự nguyện", "Hoạt động mang tính chất tự nguyện"], ["Công khai thông tin người học", "Trái quy định"], ["Gian lận, cố ý làm sai lệch kết quả", "Tuyển sinh, đánh giá người học"]]}], "vidu": [{"tinh_huong": "Trong giờ, cô Thu nói trước cả lớp: 'Lớp này có Long là hết thuốc chữa', khiến em Long cúi mặt khóc.", "ket_luan": "→ Vi phạm. Điều 5 khoản 4 cấm xúc phạm, gây tổn thương người học; khoản 1 yêu cầu phê bình phù hợp đối tượng và hoàn cảnh."}, {"tinh_huong": "Thầy Hưng chụp bảng điểm có tên và thứ hạng từng em đăng vào nhóm Zalo chung của phụ huynh mà không có quy định cho phép.", "ket_luan": "→ Vi phạm. Đó là công khai thông tin của người học trái quy định (Điều 5 khoản 4)."}, {"tinh_huong": "Cô Vân thấy em An bị mấy bạn đánh sau giờ ra chơi, nghĩ 'chuyện trẻ con' nên bỏ qua.", "ket_luan": "→ Vi phạm. Điều 5 khoản 4: phải báo cáo kịp thời với lãnh đạo, cơ quan có thẩm quyền; Điều 4 khoản 6 cấm thờ ơ, né tránh."}, {"tinh_huong": "Cô Lệ thông báo: em nào không đăng ký chương trình thiện nguyện cuối tuần (tự nguyện) sẽ bị trừ điểm rèn luyện.", "ket_luan": "→ Vi phạm. Điều 5 khoản 4 cấm ép buộc người học tham gia hoạt động mang tính chất tự nguyện."}, {"tinh_huong": "Thầy Khoa sửa tăng điểm kiểm tra của con người quen để em đủ điểm xét thi đua.", "ket_luan": "→ Vi phạm. Điều 5 khoản 4 cấm gian lận, cố ý làm sai lệch kết quả đánh giá; khoản 3 yêu cầu đánh giá đúng thực chất."}], "nho": ["Điều 5 khoản 4 = '5 KHÔNG': Phân biệt – Xúc phạm – Ép buộc – Công khai (thông tin) – Gian lận (nhớ: P-X-É-C-G).", "'Phát hiện bạo lực là PHẢI báo' – không có chữ 'có thể'.", "Ép buộc **người học** (Điều 5) tự nguyện; ép buộc **cha mẹ** là Điều 8 – phân biệt theo đối tượng bị ép."]}, {"id": "L7-3", "ten": "Thông tư 03/2026: ứng xử với đồng nghiệp và cán bộ quản lý (Điều 6, 7)", "tomtat": ["Điều 6 khoản 1: ứng xử với đồng nghiệp trung thực, chân thành, đoàn kết, hợp tác, chia sẻ trách nhiệm, giúp đỡ lẫn nhau; **tự phê bình và phê bình** khách quan, nghiêm túc, **thẳng thắn**, xây dựng.", "Điều 6 khoản 2: tôn trọng, lắng nghe ý kiến; phối hợp, trao đổi kinh nghiệm, học hỏi.", "Điều 6 khoản 3 (không được): **xúc phạm, chia rẽ, gây mất đoàn kết** nội bộ; **né tránh, đùn đẩy trách nhiệm**; **công khai thông tin của đồng nghiệp trái quy định**.", "Điều 7 khoản 1: **chấp hành** phân công, chỉ đạo, điều hành của cán bộ quản lý trong phạm vi chức năng, nhiệm vụ được giao.", "Điều 7 khoản 2: lắng nghe, **cầu thị** tiếp thu ý kiến đánh giá, góp ý.", "Điều 7 khoản 3: tích cực **tham mưu** và thể hiện rõ **chính kiến** theo chức năng, nhiệm vụ.", "Điều 7 khoản 4 (không được): **xúc phạm, gây mất đoàn kết** nội bộ; **thờ ơ, né tránh hoặc che giấu** hành vi sai phạm của cán bộ quản lý.", "Điều 4 khoản 6 cũng cấm thờ ơ, né tránh, che giấu vi phạm của người học, đồng nghiệp.", "Ứng xử trên mạng với đồng nghiệp, cán bộ quản lý vẫn phải tuân Điều 4 khoản 2 (có trách nhiệm khi ứng xử trên không gian mạng)."], "bay": ["⚠ Điều 6 (đồng nghiệp) ≠ Điều 7 (cán bộ quản lý): 'công khai thông tin trái quy định' và 'đùn đẩy trách nhiệm' chỉ thấy ở Điều 6 khoản 3.", "⚠ Điều 7 khoản 1: chấp hành chỉ đạo 'trong phạm vi chức năng, nhiệm vụ được giao'; khoản 3: 'thể hiện rõ chính kiến' (không im lặng, cũng không xúc phạm).", "⚠ 'Thờ ơ, né tránh hoặc che giấu' (Điều 7 K4) ≠ 'né tránh, đùn đẩy trách nhiệm' (Điều 6 K3).", "⚠ Phê bình đồng nghiệp: phải 'khách quan, nghiêm túc, thẳng thắn, xây dựng' (không phải né tránh va chạm)."], "cauhoi": [{"t": "s", "q": "Nhà giáo ứng xử với đồng nghiệp được quy định tại điều nào của Thông tư 03/2026/TT-BGDĐT?", "o": ["Điều 5", "Điều 6", "Điều 7", "Điều 8"], "a": [1], "e": "Điều 5: người học; Điều 6: đồng nghiệp; Điều 7: cán bộ quản lý; Điều 8: cha mẹ.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6"}, {"t": "s", "q": "Nhà giáo ứng xử với cán bộ quản lý cơ sở giáo dục được quy định tại điều nào của Thông tư 03/2026/TT-BGDĐT?", "o": ["Điều 6", "Điều 8", "Điều 9", "Điều 7"], "a": [3], "e": "Điều 7 quy định ứng xử với cán bộ quản lý cơ sở giáo dục.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7"}, {"t": "s", "q": "Theo Điều 6 khoản 1 Thông tư 03/2026/TT-BGDĐT, nhà giáo tự phê bình và phê bình đồng nghiệp như thế nào?", "o": ["Khách quan, nghiêm túc, thẳng thắn, xây dựng", "Tế nhị, né tránh va chạm, giữ hòa khí", "Kín đáo, chỉ trao đổi riêng, không ghi nhận", "Nghiêm khắc, quyết liệt, không cần xây dựng"], "a": [0], "e": "Khoản 1: khách quan, nghiêm túc, thẳng thắn, xây dựng.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 1"}, {"t": "s", "q": "Phát biểu nào đúng về ứng xử của nhà giáo với đồng nghiệp theo Điều 6 Thông tư 03/2026/TT-BGDĐT?", "o": ["Không được phê bình đồng nghiệp dưới mọi hình thức", "Được đùn đẩy trách nhiệm nếu công việc ngoài chuyên môn", "Không được công khai thông tin của đồng nghiệp trái quy định", "Được công khai thông tin của đồng nghiệp nếu đã phổ biến trong trường"], "a": [2], "e": "Điều 6 khoản 1 khuyến khích phê bình xây dựng; khoản 3 cấm công khai thông tin trái quy định và đùn đẩy trách nhiệm.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6"}, {"t": "s", "q": "Điều 7 khoản 1 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo chấp hành phân công, chỉ đạo, điều hành của cán bộ quản lý trong phạm vi nào?", "o": ["Mọi nội dung chỉ đạo, không điều kiện", "Chỉ khi chỉ đạo bằng văn bản", "Chức năng, nhiệm vụ được giao", "Chỉ khi được hưởng thêm phụ cấp"], "a": [2], "e": "Khoản 1: chấp hành trong phạm vi chức năng, nhiệm vụ được giao.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 1"}, {"t": "s", "q": "Theo Điều 7 khoản 3 Thông tư 03/2026/TT-BGDĐT, nhà giáo ứng xử với cán bộ quản lý như thế nào?", "o": ["Tích cực tham mưu và thể hiện rõ chính kiến theo chức năng, nhiệm vụ", "Không bày tỏ ý kiến trái chiều", "Chỉ tham mưu khi được yêu cầu bằng văn bản", "Thể hiện chính kiến bằng mọi hình thức, kể cả trên mạng xã hội"], "a": [0], "e": "Khoản 3: tích cực tham mưu và thể hiện rõ chính kiến theo chức năng, nhiệm vụ (đúng kênh, không xúc phạm).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 3"}, {"t": "s", "q": "Giáo viên biết cán bộ quản lý có sai phạm nhưng im lặng cho yên chuyện. Hành vi này vi
