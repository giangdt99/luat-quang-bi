 đền bù chi phí đào tạo (Điều 29 khoản 3)."}, {"tinh_huong": "Cô Liên được bổ nhiệm làm tổ trưởng chuyên môn (viên chức quản lý) và hỏi nhiệm kỳ bổ nhiệm.", "ket_luan": "→ 05 năm, trừ khi pháp luật nghề nghiệp có quy định khác; hết hạn phải xem xét bổ nhiệm lại hoặc không (Điều 30 khoản 2)."}, {"tinh_huong": "Hiệu trưởng một trường được đánh giá cuối năm. Ai là người đánh giá?", "ket_luan": "→ Cấp trên quản lý trực tiếp của hiệu trưởng (Điều 25 khoản 2)."}], "nho": ["**5 – 10**: viên chức có **5** ngày để kiến nghị, cơ quan có **10** ngày làm việc để trả lời. Người kiến nghị ít ngày hơn người giải quyết.", "Xếp loại 4 mức: **XS – T – HT – KHT** (xuất sắc, tốt, hoàn thành, không hoàn thành).", "Bổ nhiệm: **5 năm** một nhiệm kỳ; hết hạn phải xem xét lại.", "Đào tạo: **được tính liên tục**, nhưng bỏ việc thì **phải đền bù**."]}, {"id": "L1-6", "ten": "Khen thưởng và kỷ luật viên chức", "tomtat": ["Điều 33 – khen thưởng: theo pháp luật thi đua, khen thưởng (khoản 1); viên chức có thành tích xuất sắc, công trạng được **nâng lương trước thời hạn**, thưởng từ quỹ thưởng, **ưu tiên khi xét bổ nhiệm** chức vụ cao hơn (khoản 2).", "Điều 34 khoản 1 – loại trừ, miễn, giảm trách nhiệm: a) đúng thẩm quyền, trình tự, **không vụ lợi** nhưng vẫn gây thiệt hại vì lý do khách quan; b) thực hiện đề xuất **đổi mới sáng tạo** được cho phép, động cơ trong sáng; c) **bất khả kháng**; d) trường hợp khác.", "Điều 35 khoản 1 – **4 hình thức kỷ luật**: a) **Khiển trách**; b) **Cảnh cáo**; c) **Cách chức** (chỉ áp dụng đối với **viên chức quản lý**); d) **Buộc thôi việc**.", "Điều 35 khoản 2: viên chức bị kỷ luật còn bị hạn chế hoạt động nghề nghiệp theo pháp luật liên quan.", "Điều 35 khoản 3: bị Tòa án kết án phạt tù **không được hưởng án treo** hoặc bị kết án **tội tham nhũng** thì **đương nhiên** bị buộc thôi việc kể từ ngày **bản án có hiệu lực**; viên chức quản lý phạm tội bị kết án **đương nhiên thôi giữ chức vụ**.", "Điều 36 khoản 1 – **thời hiệu** xử lý kỷ luật: **05 năm** (khiển trách); **10 năm** (các hình thức còn lại).", "Điều 36 khoản 2 – **không áp dụng thời hiệu**: đảng viên vi phạm đến mức khai trừ; vi phạm bảo vệ chính trị nội bộ; xâm hại lợi ích quốc gia về quốc phòng, an ninh, đối ngoại; dùng văn bằng, chứng chỉ giả hoặc không hợp pháp.", "Điều 36 khoản 3 – **thời hạn** xử lý kỷ luật **không quá 90 ngày**; trường hợp phức tạp, kéo dài **không quá 150 ngày**.", "Điều 37 khoản 2: đang trong thời hạn xử lý kỷ luật, đang bị điều tra, truy tố, xét xử thì **không được** ứng cử, đề cử, bổ nhiệm, điều động, biệt phái, đào tạo, bồi dưỡng; khoản 3: bị **cách chức do tham nhũng** thì **không được bổ nhiệm** viên chức quản lý.", "Điều 38 – **tạm đình chỉ công tác**: do người đứng đầu cơ quan, đơn vị có thẩm quyền quyết định khi viên chức có dấu hiệu vi phạm.", "Điều 42 khoản 3 – viên chức đã nghỉ việc, nghỉ hưu: mọi hành vi vi phạm trong thời gian công tác đều bị xử lý; hình thức kỷ luật có thể là **khiển trách, cảnh cáo, xóa tư cách chức vụ đã đảm nhiệm**."], "bay": ["⚠ Thời hiệu: **05 năm** chỉ với **khiển trách**; cảnh cáo, cách chức, buộc thôi việc là **10 năm**. Thời hạn xử lý: **90 ngày** / phức tạp **150 ngày**.", "⚠ **Cách chức** chỉ áp dụng với **viên chức quản lý**; Luật 2025 có 4 hình thức (không có hạ bậc lương, giáng chức).", "⚠ Bị phạt tù **không được hưởng án treo** hoặc bị kết án **tội tham nhũng** → **đương nhiên** buộc thôi việc **kể từ ngày bản án có hiệu lực** (không phải ngày tuyên án).", "⚠ Đang bị xử lý kỷ luật/điều tra/truy tố/xét xử: **không được** bổ nhiệm, điều động, biệt phái, **đào tạo, bồi dưỡng**; bị cách chức do **tham nhũng**: không được bổ nhiệm viên chức quản lý.", "⚠ Viên chức đã nghỉ hưu vẫn bị xử lý: **khiển trách, cảnh cáo, xóa tư cách chức vụ đã đảm nhiệm** (không có buộc thôi việc)."], "cauhoi": [{"t": "s", "q": "Hình thức nào sau đây KHÔNG phải là hình thức kỷ luật viên chức theo Điều 35 khoản 1 Luật Viên chức 2025?", "o": ["Khiển trách", "Cảnh cáo", "Buộc thôi việc", "Hạ bậc lương"], "a": [3], "e": "Điều 35 khoản 1 có 4 hình thức: khiển trách, cảnh cáo, cách chức, buộc thôi việc.", "r": "Điều 35 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Hình thức kỷ luật cách chức áp dụng đối với đối tượng nào?", "o": ["Mọi viên chức", "Viên chức quản lý", "Viên chức giữ vị trí việc làm chuyên môn, nghiệp vụ", "Viên chức ký hợp đồng làm việc không xác định thời hạn"], "a": [1], "e": "Điều 35 khoản 1 điểm c: cách chức áp dụng đối với viên chức quản lý.", "r": "Điều 35 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Thời hiệu xử lý kỷ luật đối với hình thức khiển trách là bao lâu?", "o": ["03 năm", "05 năm", "10 năm", "24 tháng"], "a": [1], "e": "Điều 36 khoản 1: khiển trách 05 năm; các hình thức còn lại 10 năm.", "r": "Điều 36 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Thời hiệu xử lý kỷ luật đối với các hình thức cảnh cáo, cách chức, buộc thôi việc là bao lâu?", "o": ["10 năm", "05 năm", "07 năm", "15 năm"], "a": [0], "e": "Điều 36 khoản 1: 10 năm cho các hình thức còn lại (khiển trách 05 năm). Bẫy: nhầm 05 năm.", "r": "Điều 36 khoản 1 Luật Viên chức 2025"}, {"t": "s", "q": "Thời hạn xử lý kỷ luật đối với trường hợp phức tạp, cần có thời gian xác minh, kéo dài theo Điều 36 khoản 3 là?", "o": ["Không quá 60 ngày", "Không quá 120 ngày", "Không quá 150 ngày", "Không quá 180 ngày"], "a": [2], "e": "Điều 36 khoản 3: không quá 90 ngày; phức tạp kéo dài không quá 150 ngày.", "r": "Điều 36 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức bị Tòa án kết án phạt tù không được hưởng án treo thì bị xử lý như thế nào theo Điều 35 khoản 3?", "o": ["Đương nhiên bị buộc thôi việc kể từ ngày bản án có hiệu lực", "Đương nhiên bị buộc thôi việc kể từ ngày Tòa án tuyên án", "Bị buộc thôi việc sau khi hội đồng kỷ luật họp xem xét", "Bị cách chức nhưng vẫn giữ vị trí việc làm"], "a": [0], "e": "Điều 35 khoản 3: đương nhiên buộc thôi việc kể từ ngày bản án CÓ HIỆU LỰC (không phải ngày tuyên án).", "r": "Điều 35 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Trường hợp nào sau đây KHÔNG áp dụng thời hiệu xử lý kỷ luật theo Điều 36 khoản 2?", "o": ["Sử dụng văn bằng, chứng chỉ giả hoặc không hợp pháp", "Vi phạm nội quy đơn vị lần đầu", "Đã được khen thưởng nhiều lần", "Không hoàn thành nhiệm vụ được giao"], "a": [0], "e": "Điều 36 khoản 2: không áp dụng thời hiệu với 4 nhóm, trong đó có dùng văn bằng, chứng chỉ giả hoặc không hợp pháp.", "r": "Điều 36 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức đang trong thời hạn xử lý kỷ luật, đang bị điều tra, truy tố, xét xử thì bị hạn chế như thế nào theo Điều 37 khoản 2?", "o": ["Chỉ không được bổ nhiệm, vẫn được đào tạo, bồi dưỡng", "Đương nhiên bị buộc thôi việc", "Đương nhiên bị tạm đình chỉ công tác", "Không được ứng cử, đề cử, bổ nhiệm, điều động, biệt phái, đào tạo, bồi dưỡng"], "a": [3], "e": "Điều 37 khoản 2 hạn chế cả đào tạo, bồi dưỡng; không đương nhiên buộc thôi việc hay tạm đình chỉ.", "r": "Điều 37 khoản 2 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức bị cách chức do tham nhũng thì sau đó thế nào theo Điều 37 khoản 3?", "o": ["Không được bổ nhiệm viên chức quản lý", "Chỉ không được bổ nhiệm chức vụ cao hơn chức vụ đã bị cách chức", "Bị buộc thôi việc ngay", "Vẫn được bổ nhiệm nhưng giảm một bậc lương"], "a": [0], "e": "Điều 37 khoản 3: không được bổ nhiệm viên chức quản lý.", "r": "Điều 37 khoản 3 Luật Viên chức 2025"}, {"t": "s", "q": "Viên chức đã nghỉ việc, nghỉ hưu mà bị phát hiện vi phạm trong thời gian công tác có thể bị áp dụng hình thức kỷ luật nào theo Điều 42 khoản 3?", "o": ["Cách chức, buộc thôi việc", "Khiển trách, hạ bậc lương", "Khiển trách, cảnh cáo, xóa tư cách chức vụ đã đảm nhiệm", "Cảnh cáo, buộc thôi việc"], "a": [2], "e": "Điều 42 khoản 3: khiển trách, cảnh cáo, xóa tư cách chức vụ đã đảm nhiệm.", "r": "Điều 42 khoản 3 Luật Viên chức 2025"}, {"t": "m", "q": "Trường hợp nào được loại trừ, miễn, giảm trách nhiệm theo Điều 34 khoản 1? (chọn tất cả đáp án đúng)", "o": ["Thực hiện đề xuất đổi mới sáng tạo được cho phép, động cơ trong sáng", "Bất khả kháng", "Gây thiệt hại do thiếu thận trọng nhưng không vụ lợi", "Thực hiện đúng thẩm quyền, trình tự, không vụ lợi nhưng vẫn gây thiệt hại vì lý do khách quan", "Gây thiệt hại do thực hiện theo chỉ đạo miệng của cấp trên"], "a": [0, 1, 3], "e": "Điều 34 khoản 1 (a, b, c). Phải đúng thẩm quyền, trình tự và không vụ lợi; chỉ đạo miệng hay thiếu thận trọng không phải căn cứ.", "r": "Điều 34 khoản 1 Luật Viên chức 2025"}, {"t": "m", "q": "Trường hợp nào KHÔNG áp dụng thời hiệu xử lý kỷ luật theo Điều 36 khoản 2? (chọn tất cả đáp án đúng)", "o": ["Xâm hại lợi ích quốc gia trong lĩnh vực quốc phòng, an ninh, đối ngoại", "Đảng viên vi phạm đến mức phải khai trừ", "Sử dụng văn bằng, chứng chỉ giả hoặc không hợp pháp", "Vi phạm quy định về bảo vệ chính trị nội bộ", "Vi phạm nội quy đơn vị lần đầu"], "a": [0, 1, 2, 3], "e": "Khoản 2 liệt kê 4 nhóm; vi phạm nội quy thông thường vẫn áp dụng thời hiệu.", "r": "Điều 36 khoản 2 Luật Viên chức 2025"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 35 khoản 3? (chọn tất cả đáp án đúng)", "o": ["Viên chức quản lý phạm tội bị kết án đương nhiên thôi giữ chức vụ", "Bị kết án về tội tham nhũng thì đương nhiên bị buộc thôi việc", "Bị kết án phạt tù được hưởng án treo thì đương nhiên bị buộc thôi việc", "Bị Tòa án kết án phạt tù không được hưởng án treo thì đương nhiên bị buộc thôi việc kể từ ngày bản án có hiệu lực"], "a": [0, 1, 3], "e": "Chỉ phạt tù KHÔNG được hưởng án treo hoặc tội tham nhũng mới đương nhiên buộc thôi việc.", "r": "Điều 35 khoản 3 Luật Viên chức 2025"}, {"t": "m", "q": "Viên chức có thành tích xuất sắc, công trạng được hưởng chế độ nào theo Điều 33 khoản 2? (chọn tất cả đáp án đúng)", "o": ["Nâng lương trước thời hạn", "Được đặc cách thăng hạng không qua xét", "Ưu tiên khi xét bổ nhiệm chức vụ cao hơn", "Thưởng từ quỹ thưởng", "Được miễn xử lý kỷ luật đối với mọi vi phạm sau này"], "a": [0, 2, 3], "e": "Điều 33 khoản 2 chỉ có 3 chế độ trên.", "r": "Điều 33 khoản 2 Luật Viên chức 2025"}, {"t": "f", "q": "Hình thức kỷ luật ____ chỉ áp dụng đối với viên chức quản lý.", "a": [["cách chức"]], "e": "Điều 35 khoản 1 điểm c.", "r": "Điều 35 khoản 1 Luật Viên chức 2025", "o": [["cách chức"], ["buộc thôi việc"], ["cảnh cáo"], ["khiển trách"]], "k": 0}, {"t": "f", "q": "Thời hiệu xử lý kỷ luật là ____ năm đối với khiển trách và ____ năm đối với các hình thức còn lại.", "a": [["05", "5", "năm"], ["10", "mười"]], "e": "Điều 36 khoản 1.", "r": "Điều 36 khoản 1 Luật Viên chức 2025", "o": [["05", "07"], ["05", "10"], ["03", "10"], ["10", "15"]], "k": 1}, {"t": "f", "q": "Thời hạn xử lý kỷ luật không quá ____ ngày; trường hợp phức tạp, kéo dài không quá ____ ngày.", "a": [["90", "chín mươi"], ["150", "một trăm năm mươi"]], "e": "Điều 36 khoản 3.", "r": "Điều 36 khoản 3 Luật Viên chức 2025", "o": [["60", "90"], ["90", "120"], ["90", "150"], ["60", "150"]], "k": 2}, {"t": "f", "q": "Viên chức bị Tòa án kết án phạt tù không được hưởng án treo thì ____ bị buộc thôi việc kể từ ngày bản án có hiệu lực.", "a": [["đương nhiên"]], "e": "Điều 35 khoản 3.", "r": "Điều 35 khoản 3 Luật Viên chức 2025", "o": [["có thể"], ["không"], ["đương nhiên"], ["chưa"]], "k": 2}, {"t": "f", "q": "Người đứng đầu cơ quan, đơn vị có thẩm quyền quyết định ____ công tác khi viên chức có dấu hiệu vi phạm.", "a": [["tạm đình chỉ"]], "e": "Điều 38.", "r": "Điều 38 Luật Viên chức 2025", "o": [["đình chỉ"], ["tạm hoãn"], ["tạm nghỉ"], ["tạm đình chỉ"]], "k": 3}], "ynho": ["**4 hình thức** kỷ luật: khiển trách, cảnh cáo, **cách chức**, buộc thôi việc.", "Cách chức chỉ áp dụng với **viên chức quản lý**.", "Thời hiệu: **05 năm** (khiển trách); **10 năm** (các hình thức còn lại).", "Thời hạn xử lý: **không quá 90 ngày**; phức tạp **không quá 150 ngày**.", "Phạt tù không án treo hoặc tội tham nhũng: **đương nhiên buộc thôi việc** từ ngày **bản án có hiệu lực**."], "bang": [{"tieu_de": "Kỷ luật viên chức", "cot": ["Nội dung", "Quy định"], "dong": [["Hình thức (Điều 35)", "Khiển trách; Cảnh cáo; Cách chức (chỉ viên chức quản lý); Buộc thôi việc"], ["Thời hiệu khiển trách", "05 năm"], ["Thời hiệu cảnh cáo, cách chức, buộc thôi việc", "10 năm"], ["Thời hạn xử lý", "Không quá 90 ngày; phức tạp không quá 150 ngày"], ["Đương nhiên buộc thôi việc", "Phạt tù không án treo hoặc tội tham nhũng, từ ngày bản án có hiệu lực"], ["Đã nghỉ hưu, nghỉ việc", "Khiển trách, cảnh cáo, xóa tư cách chức vụ đã đảm nhiệm"]]}, {"tieu_de": "Đang bị xử lý kỷ luật thì không được", "cot": ["Tình trạng", "Hậu quả"], "dong": [["Đang xử lý kỷ luật, bị điều tra, truy tố, xét xử", "Không được ứng cử, đề cử, bổ nhiệm, điều động, biệt phái, đào tạo, bồi dưỡng (Điều 37 khoản 2)"], ["Bị cách chức do tham nhũng", "Không được bổ nhiệm viên chức quản lý (Điều 37 khoản 3)"]]}], "vidu": [{"tinh_huong": "Thầy Việt là giáo viên (không giữ chức vụ quản lý) bị đề xuất kỷ luật cách chức.", "ket_luan": "→ Sai: cách chức chỉ áp dụng với viên chức quản lý (Điều 35 khoản 1 điểm c)."}, {"tinh_huong": "Một hành vi vi phạm của cô Xuân bị phát hiện sau 6 năm, mức xử lý dự kiến là khiển trách.", "ket_luan": "→ Hết thời hiệu: khiển trách có thời hiệu 05 năm (Điều 36 khoản 1)."}, {"tinh_huong": "Thầy Cường bị kết án tù không được hưởng án treo, bản án có hiệu lực ngày 15/3.", "ket_luan": "→ Đương nhiên bị buộc thôi việc kể từ ngày bản án có hiệu lực, không phải ngày tuyên án (Điều 35 khoản 3)."}, {"tinh_huong": "Cô Bích đang trong thời gian bị xử lý kỷ luật, nhà trường định cử cô đi bồi dưỡng.", "ket_luan": "→ Không được: đang trong thời hạn xử lý kỷ luật thì không được đào tạo, bồi dưỡng (Điều 37 khoản 2)."}, {"tinh_huong": "Cô Thủy, giáo viên có thành tích xuất sắc, được nâng lương trước thời hạn và ưu tiên khi xét bổ nhiệm.", "ket_luan": "→ Đúng quy định khen thưởng (Điều 33 khoản 2)."}], "nho": ["Thời hiệu **5 – 10**: **5** năm chỉ dành cho khiển trách (nhẹ nhất), còn lại **10** năm.", "Thời hạn xử lý **90 – 150**: bình thường 90 ngày, phức tạp cộng thêm 60 ngày thành 150 ngày.", "**Cách chức = Chức**: chỉ người có chức (viên chức quản lý) mới bị cách chức.", "Đương nhiên buộc thôi việc tính từ **bản án có hiệu lực**, không phải từ ngày tuyên án."]}]});</script><script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L2", "ten": "Luật Giáo dục 2019 (sửa đổi, bổ sung bởi Luật 123/2025/QH15)", "so": "Luật số 43/2019/QH14", "hieuluc": "01/7/2020 (Luật gốc); Luật 123/2025/QH15 sửa đổi có hiệu lực từ 01/01/2026, riêng một số nội dung từ 01/7/2026", "mota": "Luật Giáo dục số 43/2019/QH14 được sửa đổi, bổ sung bởi Luật 123/2025/QH15 (ban hành 10/12/2025). Ôn các nội dung trọng tâm cho giáo viên THCS: mục tiêu, hệ thống giáo dục, giáo dục THCS, hành vi bị nghiêm cấm, nhà giáo, thành lập trường, học phí và tài chính.", "baihoc": [{"id": "L2-1", "ten": "Thông tin chung, hiệu lực và những điểm sửa đổi chính của Luật 123/2025/QH15", "tomtat": ["Luật Giáo dục số **43/2019/QH14** được Quốc hội thông qua ngày **14/6/2019**, có hiệu lực từ **01/7/2020**.", "Luật **123/2025/QH15** là luật **sửa đổi, bổ sung một số điều** của Luật Giáo dục; ban hành ngày **10/12/2025** tại Kỳ họp thứ **10**, Quốc hội khóa **XV**.", "Hiệu lực chung của Luật 123/2025/QH15 là **01/01/2026** (Điều 2 khoản 1).", "Một số nội dung có hiệu lực muộn hơn, từ **01/7/2026** (Điều 2 khoản 2 Luật 123): điểm b khoản 1, khoản 4, khoản 13, khoản 15, điểm b khoản 23 Điều 1 và quy định \"Chính phủ quy định việc miễn phí sách giáo khoa\" tại khoản 8 Điều 1.", "Trong các nội dung hiệu lực từ **01/7/2026** có: Điều 6 khoản 3 (Thủ tướng phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân), Điều 14 khoản 1 (giáo dục bắt buộc), Điều 52 (thẩm quyền thành lập trường).", "Điều 14 khoản 1 mới: giáo dục **tiểu học và THCS** là giáo dục bắt buộc; Nhà nước phổ cập giáo dục mầm non cho trẻ từ **03 đến 06 tuổi** (áp dụng từ **01/7/2026**).", "Luật 123 **bãi bỏ** các Điều 67, 68, 69, 70, 71, 72, 73, 75, 76, 77, 78 về nhà giáo từ **01/01/2026** (Điều 1 khoản 31 điểm đ); nội dung chuyển sang Luật Nhà giáo số **73/2025/QH15**.", "Luật 123 cũng bãi bỏ: Điều 18, khoản 2 Điều 28 (độ tuổi tối đa vào học lớp một), Điều 49-51...; còn Điều 66 được **viết lại**, Điều 66a, 66b được **bổ sung**.", "Bằng tốt nghiệp THCS đã cấp **trước 01/01/2026** vẫn có giá trị (Điều 2 khoản 3 điểm đ Luật 123).", "Từ **01/01/2026**, hội đồng trường của nhà trẻ, trường mẫu giáo, mầm non và cơ sở giáo dục phổ thông **công lập** kết thúc hoạt động, bàn giao hồ sơ cho **hiệu trưởng** (Điều 2 khoản 3 điểm b Luật 123).", "Điều 96 khoản 1: chi NSNN cho giáo dục **tối thiểu 20%** tổng chi NSNN, trong đó chi đầu tư **ít nhất 5%**, chi cho giáo dục đại học **ít nhất 3%**.", "Điều 19 (viết lại): khuyến khích ứng dụng trí tuệ nhân tạo **có kiểm soát** trong cơ sở giáo dục (khoản 3); Nhà nước đầu tư chuyển đổi số **toàn diện** (khoản 4)."], "bay": ["⚠ **01/01/2026** (hiệu lực chung) ≠ **01/7/2026** (Điều 14.1, Điều 52, Điều 6.3, miễn phí SGK) ≠ **01/7/2020** (hiệu lực Luật gốc).", "⚠ Luật 123 chỉ **sửa đổi, bổ sung một số điều**, không phải ban hành luật mới thay thế Luật 43/2019/QH14.", "⚠ Số hiệu: **43/2019/QH14** (Luật Giáo dục) ≠ **123/2025/QH15** (Luật sửa đổi) ≠ **73/2025/QH15** (Luật Nhà giáo).", "⚠ **Bãi bỏ** (Điều 67-73, 75-78) ≠ **viết lại** (Điều 66) ≠ **bổ sung** (Điều 66a, 66b).", "⚠ Phổ cập mầm non **3 đến 6 tuổi** (Điều 14.1 mới) ≠ 3 đến 5 tuổi (mục tiêu của Nghị quyết 71) ≠ 5 tuổi (bản gốc)."], "cauhoi": [{"t": "s", "q": "Luật Giáo dục được Quốc hội thông qua năm 2019 có số hiệu nào sau đây?", "o": ["Luật số 123/2025/QH15", "Luật số 73/2025/QH15", "Luật số 43/2019/QH14", "Luật số 43/2019/QH15"], "a": [2], "e": "Luật Giáo dục 2019 là 43/2019/QH14. 123/2025/QH15 là Luật sửa đổi, bổ sung; 73/2025/QH15 là Luật Nhà giáo; QH14 khác QH15 (khóa Quốc hội).", "r": "Luật Giáo dục số 43/2019/QH14"}, {"t": "s", "q": "Luật Giáo dục số 43/2019/QH14 (bản gốc) có hiệu lực từ ngày nào?", "o": ["01/7/2020", "01/01/2020", "14/6/2019", "01/01/2026"], "a": [0], "e": "Luật thông qua 14/6/2019, hiệu lực 01/7/2020. Không nhầm ngày thông qua với ngày hiệu lực, cũng không nhầm với mốc 01/01/2026 của Luật 123.", "r": "Luật Giáo dục số 43/2019/QH14"}, {"t": "s", "q": "Luật 123/2025/QH15 có hiệu lực chung từ ngày nào?", "o": ["01/7/2026", "10/12/2025", "01/7/2025", "01/01/2026"], "a": [3], "e": "Hiệu lực chung là 01/01/2026; chỉ một số nội dung mới có hiệu lực từ 01/7/2026. 10/12/2025 là ngày ban hành.", "r": "Điều 2 khoản 1 Luật 123/2025/QH15"}, {"t": "s", "q": "Luật 123/2025/QH15 được ban hành ngày nào?", "o": ["16/6/2025", "10/12/2025", "14/6/2019", "22/8/2025"], "a": [1], "e": "Luật 123/2025/QH15 ban hành 10/12/2025. 16/6/2025 là ngày thông qua Luật Nhà giáo; 14/6/2019 là ngày thông qua Luật Giáo dục gốc; 22/8/2025 là Nghị quyết 71-NQ/TW.", "r": "Luật 123/2025/QH15"}, {"t": "s", "q": "Nội dung nào sau đây của Luật 123/2025/QH15 có hiệu lực từ 01/7/2026 (không phải 01/01/2026)?", "o": ["Việc hội đồng trường công lập của cơ sở giáo dục phổ thông kết thúc hoạt động", "Quy định Chính phủ quy định việc miễn phí sách giáo khoa (khoản 8 Điều 1)", "Việc bãi bỏ các điều về nhà giáo trong Luật Giáo dục 2019", "Việc bằng tốt nghiệp THCS cấp trước 01/01/2026 vẫn có giá trị"], "a": [1], "e": "Chỉ phần miễn phí SGK (cùng các khoản 1b, 4, 13, 15, 23b Điều 1) có hiệu lực 01/7/2026. Hội đồng trường kết thúc, bãi bỏ điều về nhà giáo và quy định chuyển tiếp về bằng THCS đều theo mốc 01/01/2026.", "r": "Điều 2 khoản 1, 2 Luật 123/2025/QH15"}, {"t": "s", "q": "Theo Điều 14 khoản 1 Luật Giáo dục (sửa đổi, áp dụng từ 01/7/2026), giáo dục bắt buộc là:", "o": ["Chỉ giáo dục tiểu học", "Giáo dục tiểu học, trung học cơ sở và trung học phổ thông", "Giáo dục mầm non cho trẻ 5 tuổi và giáo dục tiểu học", "Giáo dục tiểu học và giáo dục trung học cơ sở"], "a": [3], "e": "Điều 14.1 mới: tiểu học và THCS là giáo dục bắt buộc. Bản gốc 2019 chỉ coi tiểu học là bắt buộc; THPT không bắt buộc.", "r": "Điều 14 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Các quy định về nhiệm vụ, quyền của nhà giáo (Điều 69, 70) trong Luật Giáo dục 2019 hiện nay như thế nào?", "o": ["Đã bị bãi bỏ từ 01/01/2026 và chuyển sang Luật Nhà giáo 73/2025/QH15", "Vẫn còn hiệu lực đến hết 30/6/2026 rồi mới bãi bỏ", "Được sửa đổi nhưng vẫn nằm trong Luật Giáo dục", "Bị bãi bỏ từ 01/7/2026"], "a": [0], "e": "Luật 123 bãi bỏ các Điều 67-73, 75-78 từ 01/01/2026 (không phải 01/7/2026) vì đã được quy định tại Luật Nhà giáo.", "r": "Điều 1 khoản 31 điểm đ Luật 123/2025/QH15"}, {"t": "s", "q": "Luật 123/2025/QH15 có tính chất nào đối với Luật Giáo dục số 43/2019/QH14?", "o": ["Ban hành mới, thay thế toàn bộ Luật Giáo dục 2019", "Chỉ sửa Điều 14 về giáo dục bắt buộc", "Sửa đổi, bổ sung một số điều của Luật Giáo dục", "Chỉ bãi bỏ các điều về nhà giáo"], "a": [2], "e": "Luật 123 sửa đổi, bổ sung nhiều điều (Điều 6, 9, 12, 14, 19, 28, 32, 52, 55, 66, 96, 99...) và bãi bỏ một số điều; không thay thế toàn bộ.", "r": "Luật 123/2025/QH15"}, {"t": "s", "q": "Khoản nào của Điều 28 Luật Giáo dục bị Luật 123/2025/QH15 bãi bỏ?", "o": ["Khoản 1", "Khoản 3", "Khoản 2", "Khoản 4"], "a": [2], "e": "Khoản 2 Điều 28 bị bãi bỏ; khoản 4 (Bộ trưởng quy định học vượt lớp, học ở độ tuổi cao hơn hoặc thấp hơn) được sửa chứ không bị bãi bỏ.", "r": "Điều 28 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Bằng tốt nghiệp THCS đã được cấp trước ngày 01/01/2026 thì:", "o": ["Vẫn có giá trị", "Hết giá trị từ 01/01/2026", "Chỉ có giá trị đến hết 30/6/2026", "Phải đổi sang xác nhận học bạ"], "a": [0], "e": "Điều 2 khoản 3 điểm đ Luật 123 giữ nguyên giá trị của bằng THCS đã cấp trước 01/01/2026; chỉ từ thời điểm này không cấp bằng THCS mới.", "r": "Điều 2 khoản 3 điểm đ Luật 123/2025/QH15"}, {"t": "m", "q": "Những nội dung nào sau đây thuộc phần Luật 123/2025/QH15 đã sửa đổi Luật Giáo dục 2019? (chọn tất cả đáp án đúng)", "o": ["Điều 3 về tính chất, nguyên lý giáo dục được viết lại", "Điều 12: văn bằng giáo dục quốc dân có thể ở dạng giấy hoặc số", "Điều 6: giáo dục nghề nghiệp bổ sung trung học nghề", "Điều 99: miễn học phí cho học sinh phổ thông trường công lập", "Điều 22: bãi bỏ các hành vi bị nghiêm cấm"], "a": [1, 2, 3], "e": "Điều 3 và Điều 22 không bị Luật 123 sửa đổi. Điều 6 (thêm trung học nghề), Điều 12 (văn bằng giấy hoặc số), Điều 99 (miễn học phí) được sửa đổi.", "r": "Luật 123/2025/QH15"}, {"t": "m", "q": "Nội dung nào sau đây có hiệu lực từ 01/7/2026? (chọn tất cả đáp án đúng)", "o": ["Việc hội đồng trường công lập kết thúc hoạt động", "Giáo dục tiểu học và THCS là giáo dục bắt buộc (Điều 14 khoản 1)", "Chủ tịch UBND cấp xã quyết định thành lập trường THCS (Điều 52)", "Thủ tướng phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân (Điều 6 khoản 3)", "Bãi bỏ các Điều 67-73, 75-78 về nhà giáo"], "a": [1, 2, 3], "e": "Điều 14.1, Điều 52, Điều 6.3 hiệu lực 01/7/2026. Hội đồng trường kết thúc và bãi bỏ các điều về nhà giáo có hiệu lực từ 01/01/2026.", "r": "Điều 2 khoản 2 Luật 123/2025/QH15"}, {"t": "m", "q": "Điều nào sau đây thuộc nhóm điều bị Luật 123/2025/QH15 BÃI BỎ? (chọn tất cả đáp án đúng)", "o": ["Điều 69", "Điều 66", "Điều 75", "Điều 22", "Điều 18"], "a": [0, 2, 4], "e": "Điều 69 (nhiệm vụ nhà giáo), Điều 75 (Ngày Nhà giáo), Điều 18 bị bãi bỏ. Điều 66 chỉ được viết lại; Điều 22 (hành vi bị nghiêm cấm) không bị sửa.", "r": "Điều 1 khoản 31 Luật 123/2025/QH15"}, {"t": "m", "q": "Về hội đồng trường theo Luật 123/2025/QH15, phát biểu nào đúng? (chọn tất cả đáp án đúng)", "o": ["Từ 01/01/2026, hội đồng trường của trường mầm non công lập kết thúc hoạt động", "Hội đồng trường của cơ sở giáo dục phổ thông công lập kết thúc hoạt động từ 01/01/2026", "Hồ sơ của hội đồng trường được bàn giao cho hiệu trưởng", "Hội đồng trường của cơ sở giáo dục phổ thông tư thục cũng kết thúc hoạt động", "Hồ sơ của hội đồng trường được bàn giao cho Chủ tịch UBND cấp xã"], "a": [0, 1, 2], "e": "Chỉ hội đồng trường CÔNG LẬP (nhà trẻ, mẫu giáo, mầm non, phổ thông) kết thúc, bàn giao cho hiệu trưởng. Cơ sở tư thục vẫn có hội đồng trường (Điều 55).", "r": "Điều 2 khoản 3 điểm b Luật 123/2025/QH15; Điều 55 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "f", "q": "Luật Giáo dục số 43/2019/QH14 có hiệu lực từ ngày ____.", "a": [["01/7/2020", "01/07/2020", "1/7/2020"]], "e": "Hiệu lực Luật gốc là 01/7/2020 (khác 01/01/2026 của Luật 123).", "r": "Luật Giáo dục số 43/2019/QH14", "o": [["01/01/2020"], ["01/7/2020"], ["01/01/2026"], ["01/7/2026"]], "k": 1}, {"t": "f", "q": "Luật 123/2025/QH15 được ban hành tại Kỳ họp thứ ____, Quốc hội khóa ____.", "a": [["10", "mười"], ["xv", "15"]], "e": "Kỳ họp thứ 10, Quốc hội khóa XV (Luật Nhà giáo thông qua tại Kỳ họp thứ 9).", "r": "Luật 123/2025/QH15", "o": [["9", "xv"], ["10", "xiv"], ["10", "xv"], ["9", "xiv"]], "k": 2}, {"t": "f", "q": "Theo Điều 14 khoản 1 mới, giáo dục tiểu học và giáo dục ____ là giáo dục bắt buộc.", "a": [["trung học cơ sở", "thcs"]], "e": "Bản gốc chỉ có tiểu học; Luật 123 thêm THCS (hiệu lực 01/7/2026).", "r": "Điều 14 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["trung học cơ sở"], ["trung học phổ thông"], ["mầm non"], ["nghề nghiệp"]], "k": 0}, {"t": "f", "q": "Nhà nước thực hiện phổ cập giáo dục mầm non cho trẻ em từ ____ tuổi đến ____ tuổi.", "a": [["03", "3", "ba"], ["06", "6", "sáu"]], "e": "Từ 3 đến 6 tuổi, không phải 3 đến 5 tuổi (đó là mục tiêu trong Nghị quyết 71).", "r": "Điều 14 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["3", "5"], ["4", "6"], ["5", "6"], ["03", "06"]], "k": 3}, {"t": "f", "q": "Luật Giáo dục số 43/2019/QH14 được Quốc hội thông qua ngày ____ tháng ____ năm 2019.", "a": [["14"], ["6", "06", "sáu"]], "e": "Thông qua ngày 14/6/2019; hiệu lực 01/7/2020.", "r": "Luật Giáo dục số 43/2019/QH14", "o": [["14", "7"], ["14", "6"], ["15", "6"], ["12", "5"]], "k": 1}, {"t": "f", "q": "Các điều của Luật Giáo dục 2019 về nhà giáo bị bãi bỏ từ ngày ____ vì đã chuyển sang Luật Nhà giáo.", "a": [["01/01/2026", "1/1/2026"]], "e": "Bãi bỏ từ 01/01/2026 (không phải 01/7/2026).", "r": "Điều 1 khoản 31 điểm đ Luật 123/2025/QH15", "o": [["01/7/2026"], ["01/7/2025"], ["01/01/2027"], ["01/01/2026"]], "k": 3}], "ynho": ["Luật Giáo dục gốc **43/2019/QH14**, hiệu lực **01/7/2020**.", "Luật sửa đổi **123/2025/QH15**, ban hành **10/12/2025**, hiệu lực chung **01/01/2026**.", "Một số nội dung hiệu lực muộn **01/7/2026**: Điều 14.1, Điều 52, Điều 6.3, miễn phí SGK.", "Bãi bỏ Điều **67-73, 75-78** về nhà giáo; chuyển sang Luật Nhà giáo **73/2025/QH15**.", "Chi NSNN cho giáo dục **tối thiểu 20%**; đầu tư **ít nhất 5%**; đại học **ít nhất 3%**."], "bang": [{"tieu_de": "Ba mốc hiệu lực", "cot": ["Mốc", "Nội dung"], "dong": [["01/7/2020", "Luật Giáo dục 43/2019/QH14 (luật gốc) có hiệu lực"], ["01/01/2026", "Hiệu lực chung của Luật 123/2025/QH15; bãi bỏ Điều 67-78 về nhà giáo; hội đồng trường công lập kết thúc"], ["01/7/2026", "Điều 14.1 (giáo dục bắt buộc), Điều 52 (thành lập trường), Điều 6.3, miễn phí SGK"]]}, {"tieu_de": "Ba số hiệu dễ nhầm", "cot": ["Số hiệu", "Văn bản"], "dong": [["43/2019/QH14", "Luật Giáo dục (luật gốc)"], ["123/2025/QH15", "Luật sửa đổi, bổ sung một số điều của Luật Giáo dục"], ["73/2025/QH15", "Luật Nhà giáo"]]}, {"tieu_de": "Ba kiểu sửa đổi", "cot": ["Kiểu", "Điều"], "dong": [["Bãi bỏ", "Điều 67, 68, 69, 70, 71, 72, 73, 75, 76, 77, 78"], ["Viết lại", "Điều 66 (và Điều 12, 19, 55, 99 khoản 3...)"], ["Bổ sung", "Điều 66a, 66b"]]}], "vidu": [{"tinh_huong": "Thầy Kiên hỏi ngày có hiệu lực của Luật 123/2025/QH15 để biết từ khi nào áp dụng quy định mới.", "ket_luan": "→ Hiệu lực chung là 01/01/2026 (Điều 2 khoản 1); một số nội dung hiệu lực muộn hơn từ 01/7/2026."}, {"tinh_huong": "Hội đồng trường của một trường THCS công lập vẫn họp sau ngày 01/01/2026 và ra nghị quyết.", "ket_luan": "→ Sai: từ 01/01/2026 hội đồng trường của cơ sở giáo dục phổ thông công lập kết thúc hoạt động và bàn giao hồ sơ cho hiệu trưởng (Điều 2 khoản 3 điểm b Luật 123)."}, {"tinh_huong": "Em Minh đã được cấp bằng tốt nghiệp THCS năm 2025. Mẹ em lo bằng này không còn giá trị.", "ket_luan": "→ Vẫn có giá trị: bằng tốt nghiệp THCS cấp trước 01/01/2026 vẫn có giá trị (Điều 2 khoản 3 điểm đ Luật 123)."}, {"tinh_huong": "Cô Hà dạy ở trường THCS tra Luật Giáo dục để tìm quyền, nhiệm vụ của nhà giáo ở Điều 69, 70 nhưng không còn thấy.", "ket_luan": "→ Các điều 67-73, 75-78 đã bị Luật 123 bãi bỏ từ 01/01/2026; nội dung chuyển sang Luật Nhà giáo 73/2025/QH15."}, {"tinh_huong": "Tổ trưởng hỏi nhà nước phải dành tối thiểu bao nhiêu phần trăm chi ngân sách cho giáo dục.", "ket_luan": "→ Tối thiểu 20% tổng chi NSNN, trong đó chi đầu tư ít nhất 5%, giáo dục đại học ít nhất 3% (Điều 96 khoản 1)."}], "nho": ["Ba mốc **20 – 26 – 7/26**: 01/7/**2020** (luật gốc), 01/01/**2026** (hiệu lực chung), 01/7/**2026** (nội dung hiệu lực muộn).", "**Bãi – Viết – Bổ**: Bãi bỏ Điều 67-78, **Viết lại** Điều 66, **Bổ** sung Điều 66a, 66b.", "Ngân sách giáo dục **20 – 5 – 3**: tối thiểu 20%, đầu tư 5%, đại học 3%.", "Luật 123 chỉ **sửa đổi, bổ sung một số điều**, không thay thế Luật 43/2019."]}, {"id": "L2-2", "ten": "Mục tiêu, tính chất, nguyên lý và hệ thống giáo dục quốc dân", "tomtat": ["Điều 2 - Mục tiêu giáo dục: phát triển toàn diện con người Việt Nam có **đạo đức, tri thức, văn hóa, sức khỏe, thẩm mỹ và nghề nghiệp**; có phẩm chất, năng lực và ý thức công dân.", "Điều 2: mục tiêu còn gồm yêu nước, trung thành với lý tưởng độc lập dân tộc và chủ nghĩa xã hội; nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài.", "Điều 3 khoản 1 - Tính chất: nền giáo dục xã hội chủ nghĩa có tính **nhân dân, dân tộc, khoa học, hiện đại**, lấy chủ nghĩa Mác - Lê nin và **tư tưởng Hồ Chí Minh** làm nền tảng.", "Điều 3 khoản 2 - Nguyên lý: **học đi đôi với hành, lý luận gắn liền với thực tiễn**, giáo dục nhà trường kết hợp với giáo dục **gia đình** và giáo dục **xã hội**.", "Điều 4 khoản 1: phát triển giáo dục là **quốc sách hàng đầu**.", "Điều 7: nội dung giáo dục cơ bản, toàn diện, thiết thực, hiện đại, có hệ thống, cập nhật thường xuyên (khoản 1); phương pháp khoa học, phát huy tính tích cực, tự giác, chủ động, tư duy sáng tạo; bồi dưỡng năng lực tự học, hợp tác, thực hành (khoản 2).", "Điều 16: phát triển giáo dục, xây dựng xã hội học tập là sự nghiệp của **Nhà nước và của toàn dân** (khoản 1); tổ chức, gia đình và cá nhân có trách nhiệm chăm lo, phối hợp với cơ sở giáo dục, xây dựng môi trường giáo dục an toàn, lành mạnh (khoản 3).", "Điều 6 khoản 1: hệ thống giáo dục quốc dân là hệ thống **mở, liên thông** gồm giáo dục **chính quy** và giáo dục **thường xuyên**.", "Điều 6 khoản 2: (a) **mầm non** gồm nhà trẻ, mẫu giáo; (b) **phổ thông** gồm tiểu học, THCS, THPT; (c) **giáo dục nghề nghiệp** gồm sơ cấp, **trung học nghề**, trung cấp, cao đẳng và các chương trình đào tạo nghề khác; (d) **giáo dục đại học** gồm đại học và sau đại học.", "Điều 6 khoản 3 (hiệu lực **01/7/2026**): **Thủ tướng Chính phủ** phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân và Khung trình độ quốc gia Việt Nam.", "Điều 9 khoản 2: phân luồng là biện pháp tổ chức hoạt động giáo dục trên cơ sở hướng nghiệp để học sinh **sau THCS, THPT, trung học nghề** học tiếp cấp cao hơn hoặc tham gia lao động phù hợp năng lực, sở trường.", "Điều 12 (viết lại): văn bằng giáo dục quốc dân ở dạng **giấy hoặc số**; gồm bằng tốt nghiệp THPT, trung học nghề, trung cấp, cao đẳng, cử nhân, thạc sĩ, tiến sĩ... **không còn bằng tốt nghiệp THCS**."], "bay": ["⚠ Điều 3.1 lấy **chủ nghĩa Mác - Lê nin và tư tưởng Hồ Chí Minh** làm nền tảng; đừng bỏ sót một vế.", "⚠ Nguyên lý: **lý luận** gắn liền với thực tiễn (Điều 3.2) và giáo dục nhà trường kết hợp với gia đình và xã hội.", "⚠ **Thủ tướng Chính phủ** (phê duyệt Khung, Điều 6.3) ≠ Chính phủ ≠ Bộ trưởng Bộ GDĐT.", "⚠ Giáo dục **phổ thông** (tiểu học, THCS, THPT) ≠ giáo dục **nghề nghiệp** (có trung học nghề) ≠ **mầm non**.", "⚠ Văn bằng giấy **hoặc** số; không còn bằng tốt nghiệp **THCS**."], "cauhoi": [{"t": "s", "q": "Theo Điều 3 khoản 1 Luật Giáo dục, phát biểu nào đúng về tính chất của nền giáo dục Việt Nam?", "o": ["Nền giáo dục xã hội chủ nghĩa có tính nhân dân, dân tộc, khoa học, hiện đại, lấy chủ nghĩa Mác - Lê nin làm nền tảng", "Nền giáo dục có tính toàn dân, dân chủ, khoa học, hiện đại, lấy tư tưởng Hồ Chí Minh làm nền tảng", "Nền giáo dục xã hội chủ nghĩa có tính nhân đạo, dân tộc, khoa học, hiện đại, lấy chủ nghĩa Mác - Lê nin và tư tưởng Hồ Chí Minh làm nền tảng", "Nền giáo dục xã hội chủ nghĩa có tính nhân dân, dân tộc, khoa học, hiện đại, lấy chủ nghĩa Mác - Lê nin và tư tưởng Hồ Chí Minh làm nền tảng"], "a": [3], "e": "Phương án đúng nêu đủ 4 tính chất (nhân dân, dân tộc, khoa học, hiện đại) và đủ hai nền tảng. Các phương án nhiễu thiếu một nền tảng hoặc đổi tính chất (toàn dân, dân chủ, nhân đạo).", "r": "Điều 3 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 3 khoản 2, nguyên lý giáo dục là:", "o": ["Học đi đôi với hành, lý luận gắn liền với thực tiễn, giáo dục nhà trường là chủ yếu", "Học đi đôi với hành, lý luận gắn liền với thực tiễn, giáo dục nhà trường kết hợp với giáo dục gia đình và giáo dục xã hội", "Học đi đôi với hành, thực tiễn gắn liền với lý luận, giáo dục gia đình là chủ yếu", "Học đi đôi với hành, giáo dục nhà trường kết hợp với giáo dục gia đình, không gồm giáo dục xã hội"], "a": [1], "e": "Nguyên lý có 3 vế: học - hành; lý luận - thực tiễn; nhà trường - gia đình - xã hội. Phương án nhiễu thay 'kết hợp' bằng 'chủ yếu' hoặc bỏ vế xã hội.", "r": "Điều 3 khoản 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 4 khoản 1, phát triển giáo dục là:", "o": ["Nhiệm vụ trọng tâm", "Quốc sách hàng đầu", "Chiến lược ưu tiên", "Động lực chính của phát triển"], "a": [1], "e": "Cụm đúng nguyên văn là 'quốc sách hàng đầu'.", "r": "Điều 4 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 6 khoản 1, hệ thống giáo dục quốc dân là hệ thống:", "o": ["Mở, liên thông gồm giáo dục công lập và giáo dục ngoài công lập", "Đóng, liên thông gồm giáo dục chính quy và giáo dục thường xuyên", "Mở, liên thông gồm giáo dục chính quy và giáo dục từ xa", "Mở, liên thông gồm giáo dục chính quy và giáo dục thường xuyên"], "a": [3], "e": "Hệ thống mở, liên thông, gồm giáo dục chính quy và giáo dục thường xuyên. Công lập/ngoài công lập là loại hình, không phải cách chia ở khoản 1.", "r": "Điều 6 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 6 khoản 2 điểm c (sửa đổi), giáo dục nghề nghiệp gồm:", "o": ["Sơ cấp, trung học nghề, trung cấp, cao đẳng và các chương trình đào tạo nghề khác", "Sơ cấp, trung cấp, cao đẳng và đại học nghề", "Chỉ gồm trung cấp và cao đẳng", "Trung học nghề, trung cấp, cao đẳng, đại học và sau đại học"], "a": [0], "e": "Luật 123 bổ sung 'trung học nghề'. Đại học và sau đại học thuộc giáo dục đại học (điểm d).", "r": "Điều 6 khoản 2 điểm c Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 6 khoản 2 điểm b, giáo dục phổ thông gồm các cấp nào?", "o": ["Mẫu giáo, tiểu học, trung học cơ sở", "Tiểu học, trung học cơ sở, trung học nghề", "Tiểu học, trung học cơ sở, trung học phổ thông", "Trung học cơ sở, trung học phổ thông, trung cấp"], "a": [2], "e": "Phổ thông = tiểu học, THCS, THPT. Mẫu giáo thuộc mầm non; trung học nghề, trung cấp thuộc giáo dục nghề nghiệp.", "r": "Điều 6 khoản 2 điểm b Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Ai phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân và Khung trình độ quốc gia Việt Nam (Điều 6 khoản 3, hiệu lực 01/7/2026)?", "o": ["Chính phủ", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Thủ tướng Chính phủ", "Quốc hội"], "a": [2], "e": "Chủ thể là Thủ tướng Chính phủ. Bẫy: Chính phủ (cơ quan) khác Thủ tướng Chính phủ (cá nhân).", "r": "Điều 6 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 12 (viết lại), văn bằng giáo dục quốc dân được cấp ở dạng nào?", "o": ["Giấy hoặc số", "Chỉ dạng giấy", "Chỉ dạng số", "Bắt buộc cả giấy và số"], "a": [0], "e": "Luật dùng 'hoặc': giấy hoặc số, không bắt buộc cả hai.", "r": "Điều 12 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Văn bằng nào sau đây KHÔNG còn thuộc văn bằng giáo dục quốc dân theo Điều 12 sửa đổi?", "o": ["Bằng tốt nghiệp trung học phổ thông", "Bằng tốt nghiệp trung học nghề", "Bằng thạc sĩ", "Bằng tốt nghiệp trung học cơ sở"], "a": [3], "e": "Không còn bằng tốt nghiệp THCS (học sinh hết THCS được hiệu trưởng xác nhận học bạ). Bằng THPT, trung học nghề, thạc sĩ vẫn là văn bằng.", "r": "Điều 12 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 9 khoản 2, phân luồng giáo dục được thực hiện đối với học sinh sau cấp học/trình độ nào?", "o": ["Sau tiểu học và THCS", "Sau THCS, THPT và trung học nghề", "Chỉ sau THCS", "Sau THPT và đại học"], "a": [1], "e": "Luật 123 sửa: phân luồng sau THCS, THPT, trung học nghề để học tiếp cấp cao hơn hoặc lao động phù hợp năng lực, sở trường.", "r": "Điều 9 khoản 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Theo Điều 2, mục tiêu giáo dục gồm: (chọn tất cả đáp án đúng)", "o": ["Nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài", "Trung thành với lý tưởng độc lập dân tộc và chủ nghĩa xã hội", "Chỉ phát triển trí tuệ và kỹ năng nghề nghiệp", "Có phẩm chất, năng lực và ý thức công dân", "Lấy kết quả thi cử làm mục tiêu cao nhất"], "a": [0, 1, 3], "e": "Mục tiêu là phát triển TOÀN DIỆN con người; không 'chỉ' trí tuệ, kỹ năng và không lấy thi cử là mục tiêu cao nhất.", "r": "Điều 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 6 khoản 2? (chọn tất cả đáp án đúng)", "o": ["Giáo dục nghề nghiệp gồm cả đại học nghề", "Mầm non gồm nhà trẻ và mẫu giáo", "Phổ thông gồm tiểu học, THCS và THPT", "Giáo dục phổ thông gồm cả trung học nghề", "Giáo dục đại học gồm đại học và sau đại học"], "a": [1, 2, 4], "e": "Trung học nghề thuộc giáo dục nghề nghiệp, không thuộc phổ thông; 'đại học nghề' không có trong điểm c.", "r": "Điều 6 khoản 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Phát biểu nào đúng về nội dung, phương pháp giáo dục theo Điều 7? (chọn tất cả đáp án đúng)", "o": ["Nội dung giáo dục cơ bản, toàn diện, thiết thực, hiện đại, có hệ thống", "Nội dung được cập nhật thường xuyên", "Phương pháp giáo dục chủ yếu là ghi nhớ, tiếp thu thụ động", "Phương pháp phát huy tính tích cực, tự giác, chủ động, tư duy sáng tạo", "Nội dung chỉ được cập nhật 5 năm một lần"], "a": [0, 1, 3], "e": "Nội dung: cập nhật 'thường xuyên' (không phải 5 năm một lần); phương pháp phát huy tính tích cực, không thụ động.", "r": "Điều 7 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 16 Luật Giáo dục? (chọn tất cả đáp án đúng)", "o": ["Phát triển giáo dục là sự nghiệp của Nhà nước và của toàn dân", "Phát triển giáo dục chỉ là sự nghiệp riêng của Nhà nước", "Tổ chức, gia đình và cá nhân có trách nhiệm chăm lo sự nghiệp giáo dục", "Trách nhiệm xây dựng môi trường giáo dục chỉ thuộc nhà trường", "Tổ chức, gia đình và cá nhân phối hợp với cơ sở giáo dục thực hiện mục tiêu giáo dục"], "a": [0, 2, 4], "e": "Giáo dục là sự nghiệp của Nhà nước VÀ toàn dân; trách nhiệm không chỉ ở nhà trường.", "r": "Điều 16 khoản 1, 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "f", "q": "Phát triển giáo dục là ____ hàng đầu.", "a": [["quốc sách"]], "e": "Cụm 'quốc sách hàng đầu' (Điều 4.1).", "r": "Điều 4 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["quốc sách"], ["chính sách"], ["nhiệm vụ"], ["mục tiêu"]], "k": 0}, {"t": "f", "q": "Hệ thống giáo dục quốc dân là hệ thống ____, liên thông gồm giáo dục ____ và giáo dục thường xuyên.", "a": [["mở"], ["chính quy"]], "e": "Hệ thống mở, liên thông; chính quy và thường xuyên.", "r": "Điều 6 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["linh hoạt", "chính quy"], ["mở", "phổ thông"], ["mở", "chính quy"], ["đóng", "chính quy"]], "k": 2}, {"t": "f", "q": "Giáo dục nhà trường kết hợp với giáo dục ____ và giáo dục ____.", "a": [["gia đình"], ["xã hội"]], "e": "Nguyên lý giáo dục: nhà trường - gia đình - xã hội.", "r": "Điều 3 khoản 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["gia đình", "xã hội"], ["gia đình", "cộng đồng"], ["cộng đồng", "xã hội"], ["đoàn thể", "gia đình"]], "k": 0}, {"t": "f", "q": "Nền giáo dục có tính nhân dân, dân tộc, ____, hiện đại, lấy chủ nghĩa Mác - Lê nin và tư tưởng ____ làm nền tảng.", "a": [["khoa học"], ["hồ chí minh"]], "e": "Tính chất theo Điều 3.1: nhân dân, dân tộc, khoa học, hiện đại.", "r": "Điều 3 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["đại chúng", "hồ chí minh"], ["khoa học", "hồ chí minh"], ["khoa học", "đạo đức"], ["phổ thông", "hồ chí minh"]], "k": 1}, {"t": "f", "q": "Theo Điều 6 khoản 3, ____ phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân và Khung trình độ quốc gia Việt Nam.", "a": [["thủ tướng chính phủ", "thủ tướng"]], "e": "Thủ tướng Chính phủ (không phải Chính phủ), hiệu lực 01/7/2026.", "r": "Điều 6 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["chính phủ"], ["bộ trưởng bộ giáo dục và đào tạo"], ["thủ tướng chính phủ"], ["quốc hội"]], "k": 2}, {"t": "f", "q": "Văn bằng giáo dục quốc dân được cấp dưới dạng giấy hoặc ____.", "a": [["số"]], "e": "Điều 12 (viết lại): giấy hoặc số.", "r": "Điều 12 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["điện tử"], ["bản sao"], ["ảnh"], ["số"]], "k": 3}], "ynho": ["Mục tiêu: con người có **đạo đức, tri thức, văn hóa, sức khỏe, thẩm mỹ, nghề nghiệp**.", "Tính chất: **nhân dân, dân tộc, khoa học, hiện đại**; nền tảng Mác - Lê nin và **tư tưởng Hồ Chí Minh**.", "Nguyên lý: **học đi đôi với hành**, lý luận gắn liền thực tiễn, nhà trường kết hợp **gia đình và xã hội**.", "Giáo dục là **quốc sách hàng đầu**; hệ thống **mở, liên thông**.", "**Thủ tướng Chính phủ** phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân; không còn bằng tốt nghiệp **THCS**."], "bang": [{"tieu_de": "Bốn bậc của hệ thống giáo dục quốc dân (Điều 6 khoản 2)", "cot": ["Bậc", "Gồm"], "dong": [["Mầm non", "Nhà trẻ, mẫu giáo"], ["Phổ thông", "Tiểu học, THCS, THPT"], ["Giáo dục nghề nghiệp", "Sơ cấp, trung học nghề, trung cấp, cao đẳng, các chương trình đào tạo nghề khác"], ["Giáo dục đại học", "Đại học, sau đại học"]]}, {"tieu_de": "Điều 2, 3, 4: ba ý nền tảng", "cot": ["Điều", "Nội dung"], "dong": [["Điều 2", "Mục tiêu giáo dục"], ["Điều 3 khoản 1", "Tính chất: nhân dân, dân tộc, khoa học, hiện đại"], ["Điều 3 khoản 2", "Nguyên lý: học đi đôi với hành..."], ["Điều 4 khoản 1", "Quốc sách hàng đầu"]]}], "vidu": [{"tinh_huong": "Cô Lệ nói với học sinh: học lý thuyết xong phải đem vào thực hành, vì giáo dục phải gắn lý luận với thực tiễn.", "ket_luan": "→ Đúng nguyên lý giáo dục: học đi đôi với hành, lý luận gắn liền với thực tiễn (Điều 3 khoản 2)."}, {"tinh_huong": "Hiệu trưởng phối hợp với hội phụ huynh để chăm lo xây dựng môi trường giáo dục an toàn, lành mạnh.", "ket_luan": "→ Đúng tinh thần Điều 16 khoản 3 và nguyên lý kết hợp nhà trường, gia đình, xã hội."}, {"tinh_huong": "Một người nói rằng bậc giáo dục phổ thông gồm cả trung cấp, cao đẳng.", "ket_luan": "→ Sai: giáo dục phổ thông gồm tiểu học, THCS, THPT; trung cấp, cao đẳng thuộc giáo dục nghề nghiệp (Điều 6 khoản 2)."}, {"tinh_huong": "Học sinh Nam tốt nghiệp THCS năm 2026 hỏi vì sao không nhận bằng tốt nghiệp THCS.", "ket_luan": "→ Điều 12 (viết lại) không còn bằng tốt nghiệp THCS trong các loại văn bằng; học sinh được xác nhận hoàn thành chương trình vào học bạ."}, {"tinh_huong": "Một cán bộ hỏi ai phê duyệt Khung cơ cấu hệ thống giáo dục quốc dân và Khung trình độ quốc gia Việt Nam.", "ket_luan": "→ Thủ tướng Chính phủ (Điều 6 khoản 3, hiệu lực 01/7/2026)."}], "nho": ["Mục tiêu **ĐẠO – TRI – VĂN – SỨC – MỸ – NGHỀ**: đạo đức, tri thức, văn hóa, sức khỏe, thẩm mỹ, nghề nghiệp.", "Tính chất **N-D-K-H**: Nhân dân, Dân tộc, Khoa học, Hiện đại.", "Hệ thống giáo dục: **Mầm non – Phổ thông – Nghề – Đại học** (4 bậc); mỗi bậc nhớ từng thành phần, đừng lẫn trung học nghề vào phổ thông.", "Văn bằng: giấy **hoặc** số; từ nay **không có** bằng THCS."]}, {"id": "L2-3", "ten": "Giáo dục trung học cơ sở, giáo dục bắt buộc và phổ cập", "tomtat": ["Điều 28 khoản 1 điểm b: giáo dục THCS thực hiện trong **04 năm học**, từ lớp **sáu** đến hết lớp **chín**; học sinh vào lớp sáu phải hoàn thành chương trình **tiểu học**; tuổi vào lớp sáu là **11 tuổi**.", "Điều 28 khoản 1: tiểu học **05 năm**, vào lớp một **06 tuổi** (điểm a); THPT **03 năm**, vào lớp mười **15 tuổi** (điểm c, sửa bởi Luật 123).", "Điều 28 khoản 3: giáo dục phổ thông có 2 giai đoạn: giáo dục **cơ bản** (tiểu học + THCS) và giáo dục **định hướng nghề nghiệp** (THPT).", "Điều 28 khoản 4 (sửa): **Bộ trưởng Bộ GDĐT** quy định các trường hợp học vượt lớp, học ở độ tuổi cao hơn hoặc thấp hơn tuổi quy định; khoản 2 đã bị bãi bỏ.", "Điều 29 khoản 3 - Mục tiêu THCS: củng cố, phát triển kết quả giáo dục tiểu học; học sinh có học vấn phổ thông **nền tảng**, hiểu biết cần thiết **tối thiểu** về kỹ thuật và hướng nghiệp để học THPT hoặc giáo dục nghề nghiệp.", "Điều 30 khoản 2 điểm b - Nội dung THCS: hiểu biết phổ thông cơ bản về tiếng Việt, toán, lịch sử dân tộc; kiến thức khác về khoa học xã hội, khoa học tự nhiên, pháp luật, tin học, ngoại ngữ; hiểu biết tối thiểu về kỹ thuật và hướng nghiệp.", "Điều 30 khoản 3 - Phương pháp giáo dục phổ thông: phát huy tính tích cực, tự giác, chủ động, sáng tạo; tăng cường ứng dụng công nghệ thông tin và truyền thông.", "Điều 14 khoản 1 mới (từ **01/7/2026**): giáo dục tiểu học và THCS là giáo dục **bắt buộc**; phổ cập giáo dục mầm non cho trẻ từ **03 đến 06 tuổi**.", "Điều 14 khoản 2-5: Nhà nước chịu trách nhiệm thực hiện giáo dục bắt buộc, quyết định kế hoạch, bảo đảm điều kiện phổ cập; mọi công dân trong độ tuổi có nghĩa vụ học tập; gia đình, người giám hộ tạo điều kiện; Chính phủ quy định chi tiết khoản 1, 2.", "Điều 5: **phổ cập giáo dục** là mọi công dân trong độ tuổi đều được học và đạt trình độ học vấn nhất định; **giáo dục bắt buộc** là công dân trong độ tuổi bắt buộc phải học để đạt trình độ tối thiểu, Nhà nước bảo đảm điều kiện.", "Điều 34 khoản 1 (sửa, từ 01/01/2026): học sinh học hết chương trình tiểu học, THCS đủ điều kiện theo quy định của Bộ trưởng Bộ GDĐT được **hiệu trưởng xác nhận vào học bạ** việc hoàn thành chương trình; không còn cấp bằng tốt nghiệp THCS.", "Điều 32: Bộ trưởng Bộ GDĐT quyết định **một bộ** sách giáo khoa sử dụng thống nhất toàn quốc; **Chính phủ** quy định miễn phí sách giáo khoa (hiệu lực phần miễn phí từ 01/7/2026).", "Điều 19 (viết lại): khuyến khích ứng dụng AI **có kiểm soát** trong cơ sở giáo dục; Nhà nước đầu tư chuyển đổi số toàn diện; ưu tiên hạ tầng, công nghệ, hỗ trợ đào tạo để nghiên cứu, ứng dụng, phát triển AI trong giáo dục và đào tạo."], "bay": ["⚠ THCS **04 năm** (lớp 6-9), vào lớp sáu **11 tuổi**; tiểu học 05 năm/06 tuổi; THPT 03 năm/15 tuổi.", "⚠ **Giáo dục bắt buộc** (tiểu học + THCS) ≠ **phổ cập mầm non** (trẻ 3 đến 6 tuổi); THPT không bắt buộc.", "⚠ **Hiệu trưởng xác nhận học bạ** (Điều 34) ≠ cấp bằng tốt nghiệp THCS (không còn từ 01/01/2026).", "⚠ **Bộ trưởng** quy định học vượt lớp/tuổi (Điều 28.4); **Chính phủ** quy định miễn phí SGK và chi tiết Điều 14; mục tiêu THCS: kiến thức **nền tảng**, kỹ thuật **tối thiểu**.", "⚠ AI: ứng dụng **có kiểm soát** (Điều 19), không phải tự do, không bắt buộc."], "cauhoi": [{"t": "s", "q": "Theo Điều 28 khoản 1 điểm b, giáo dục trung học cơ sở được thực hiện trong bao nhiêu năm học?", "o": ["03 năm học, từ lớp sáu đến hết lớp tám", "04 năm học, từ lớp sáu đến hết lớp chín", "05 năm học, từ lớp sáu đến hết lớp mười", "04 năm học, từ lớp năm đến hết lớp tám"], "a": [1], "e": "THCS: 04 năm, lớp 6 đến hết lớp 9. Tiểu học mới là 05 năm; THPT là 03 năm.", "r": "Điều 28 khoản 1 điểm b Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Tuổi của học sinh vào lớp sáu là bao nhiêu?", "o": ["10 tuổi", "12 tuổi", "06 tuổi", "11 tuổi"], "a": [3], "e": "Vào lớp sáu: 11 tuổi (tính theo năm); 06 tuổi là vào lớp một.", "r": "Điều 28 khoản 1 điểm b Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Tuổi của học sinh vào lớp mười (Điều 28 khoản 1 điểm c, sửa bởi Luật 123) là:", "o": ["15 tuổi", "14 tuổi", "16 tuổi", "11 tuổi"], "a": [0], "e": "THPT 03 năm, vào lớp mười 15 tuổi; 11 tuổi là tuổi vào lớp sáu.", "r": "Điều 28 khoản 1 điểm c Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Giai đoạn giáo dục cơ bản trong giáo dục phổ thông (Điều 28 khoản 3) gồm:", "o": ["Trung học cơ sở và trung học phổ thông", "Chỉ tiểu học", "Tiểu học và trung học cơ sở", "Mầm non và tiểu học"], "a": [2], "e": "Giáo dục cơ bản = tiểu học + THCS; THPT thuộc giai đoạn định hướng nghề nghiệp.", "r": "Điều 28 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Mục tiêu của giáo dục trung học cơ sở theo Điều 29 khoản 3 là:", "o": ["Củng cố kết quả tiểu học; có hiểu biết chuyên sâu về kỹ thuật và hướng nghiệp để học đại học", "Bảo đảm học sinh bắt buộc học tiếp THPT, không được vào giáo dục nghề nghiệp", "Củng cố, phát triển kết quả giáo dục tiểu học; có học vấn phổ thông nền tảng, hiểu biết cần thiết tối thiểu về kỹ thuật và hướng nghiệp để tiếp tục học THPT hoặc giáo dục nghề nghiệp", "Phát triển kết quả giáo dục tiểu học; có học vấn chuyên sâu để học đại học"], "a": [2], "e": "Từ khóa: học vấn phổ thông 'nền tảng', hiểu biết 'tối thiểu' về kỹ thuật, học tiếp THPT HOẶC giáo dục nghề nghiệp.", "r": "Điều 29 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 28 khoản 4, ai quy định các trường hợp học vượt lớp, học ở độ tuổi cao hơn hoặc thấp hơn tuổi quy định?", "o": ["Bộ trưởng Bộ Giáo dục và Đào tạo", "Chính phủ", "Thủ tướng Chính phủ", "Chủ tịch UBND cấp tỉnh"], "a": [0], "e": "Thẩm quyền thuộc Bộ trưởng Bộ GDĐT.", "r": "Điều 28 khoản 4 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Từ 01/01/2026, học sinh học hết chương trình THCS và đủ điều kiện sẽ được:", "o": ["Cấp bằng tốt nghiệp THCS", "Chủ tịch UBND cấp xã cấp giấy chứng nhận", "Giám đốc Sở GDĐT xác nhận vào học bạ", "Hiệu trưởng xác nhận vào học bạ việc hoàn thành chương trình"], "a": [3], "e": "Điều 34 khoản 1 mới: hiệu trưởng xác nhận học bạ. Không còn bằng tốt nghiệp THCS; chủ thể là hiệu trưởng, không phải Sở hay UBND.", "r": "Điều 34 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Nhà nước thực hiện phổ cập giáo dục mầm non cho trẻ em trong độ tuổi nào theo Điều 14 khoản 1 mới?", "o": ["Từ 03 tuổi đến 05 tuổi", "Từ 03 tuổi đến 06 tuổi", "Chỉ trẻ 05 tuổi", "Từ 04 tuổi đến 06 tuổi"], "a": [1], "e": "Luật 123: 3 đến 6 tuổi. '3 đến 5 tuổi' là mục tiêu 2030 trong Nghị quyết 71; 5 tuổi là bản gốc 2019.", "r": "Điều 14 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 5 Luật Giáo dục, 'giáo dục bắt buộc' là:", "o": ["Giáo dục mà mọi công dân trong độ tuổi đều được học và đạt trình độ học vấn nhất định", "Giáo dục mà công dân trong độ tuổi bắt buộc phải học để đạt trình độ tối thiểu, Nhà nước bảo đảm điều kiện để thực hiện", "Giáo dục mà công dân tự nguyện học, Nhà nước không bảo đảm điều kiện", "Giáo dục mà chỉ nhà trường chịu trách nhiệm tổ chức"], "a": [1], "e": "Phương án 2 là định nghĩa 'phổ cập giáo dục'. Bắt buộc = phải học để đạt trình độ tối thiểu, Nhà nước bảo đảm điều kiện.", "r": "Điều 5 khoản 8, 9 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Chính sách về sách giáo khoa theo Điều 32 (sửa đổi) là:", "o": ["Chính phủ quyết định một bộ sách giáo khoa; Bộ trưởng quy định miễn phí sách giáo khoa", "Bộ trưởng quyết định nhiều bộ sách giáo khoa; Chính phủ quy định miễn phí", "Thủ tướng Chính phủ quyết định một bộ sách giáo khoa; Quốc hội quy định miễn phí", "Bộ trưởng Bộ GDĐT quyết định một bộ sách giáo khoa sử dụng thống nhất toàn quốc; Chính phủ quy định việc miễn phí sách giáo khoa"], "a": [3], "e": "Đổi chủ thể là bẫy: Bộ trưởng quyết định một bộ SGK; Chính phủ quy định miễn phí (phần miễn phí hiệu lực 01/7/2026).", "r": "Điều 32 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Theo Điều 30 khoản 2 điểm b, nội dung giáo dục THCS gồm: (chọn tất cả đáp án đúng)", "o": ["Hiểu biết phổ thông cơ bản về tiếng Việt, toán, lịch sử dân tộc", "Kiến thức chuyên sâu về nghề để làm việc ngay sau THCS", "Kiến thức khác về khoa học xã hội, khoa học tự nhiên, pháp luật, tin học, ngoại ngữ", "Hiểu biết tối thiểu về kỹ thuật và hướng nghiệp", "Chương trình sơ cấp nghề bắt buộc"], "a": [0, 2, 3], "e": "THCS chỉ yêu cầu hiểu biết TỐI THIỂU về kỹ thuật, hướng nghiệp; không có kiến thức chuyên sâu về nghề hay sơ cấp nghề bắt buộc.", "r": "Điều 30 khoản 2 điểm b Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 14 khoản 2-5? (chọn tất cả đáp án đúng)", "o": ["Nhà nước chịu trách nhiệm thực hiện giáo dục bắt buộc, quyết định kế hoạch, bảo đảm điều kiện phổ cập", "Nhà nước chỉ quyết định kế hoạch, không phải bảo đảm điều kiện phổ cập", "Mọi công dân trong độ tuổi có nghĩa vụ học tập để thực hiện phổ cập và hoàn thành giáo dục bắt buộc", "Gia đình, người giám hộ không có trách nhiệm tạo điều kiện cho thành viên trong độ tuổi được học", "Chính phủ quy định chi tiết khoản 1, khoản 2 Điều 14"], "a": [0, 2, 4], "e": "Nhà nước phải bảo đảm điều kiện phổ cập; gia đình, người giám hộ CÓ trách nhiệm tạo điều kiện; Chính phủ (không phải Bộ trưởng) quy định chi tiết.", "r": "Điều 14 khoản 2-5 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 28 khoản 1? (chọn tất cả đáp án đúng)", "o": ["Tiểu học 05 năm, vào lớp một 06 tuổi", "THCS 03 năm, từ lớp sáu đến hết lớp tám", "Học sinh vào lớp sáu phải hoàn thành chương trình tiểu học", "THPT 03 năm, vào lớp mười 15 tuổi", "Học sinh vào lớp sáu là 12 tuổi"], "a": [0, 2, 3], "e": "THCS là 04 năm (lớp 6-9), vào lớp sáu 11 tuổi.", "r": "Điều 28 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Theo Điều 19 (viết lại) Luật Giáo dục, phát biểu nào đúng? (chọn tất cả đáp án đúng)", "o": ["Khuyến khích ứng dụng trí tuệ nhân tạo có kiểm soát trong cơ sở giáo dục", "Cấm ứng dụng trí tuệ nhân tạo trong cơ sở giáo dục", "Nhà nước đầu tư chuyển đổi số toàn diện", "Ưu tiên hạ tầng, công nghệ, hỗ trợ đào tạo để nghiên cứu, ứng dụng, phát triển AI trong giáo dục và đào tạo", "Chỉ khuyến khích ứng dụng AI ở giáo dục đại học"], "a": [0, 2, 3], "e": "AI được khuyến khích CÓ KIỂM SOÁT, không bị cấm và không giới hạn ở đại học.", "r": "Điều 19 khoản 3, 4, 5 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "f", "q": "Giáo dục trung học cơ sở thực hiện trong ____ năm học, từ lớp ____ đến hết lớp ____.", "a": [["04", "4", "bốn"], ["sáu", "6"], ["chín", "9"]], "e": "THCS 04 năm: lớp 6 đến hết lớp 9.", "r": "Điều 28 khoản 1 điểm b Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["03", "sáu", "chín"], ["04", "sáu", "chín"], ["04", "sáu", "mười"], ["05", "bảy", "chín"]], "k": 1}, {"t": "f", "q": "Tuổi vào lớp sáu là ____ tuổi; tuổi vào lớp mười là ____ tuổi.", "a": [["11", "mười một"], ["15", "mười lăm"]], "e": "Lớp sáu 11 tuổi; lớp mười 15 tuổi.", "r": "Điều 28 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["11", "15"], ["10", "15"], ["11", "16"], ["12", "16"]], "k": 0}, {"t": "f", "q": "Giáo dục phổ thông có hai giai đoạn: giáo dục ____ và giáo dục định hướng ____.", "a": [["cơ bản"], ["nghề nghiệp"]], "e": "Giáo dục cơ bản (tiểu học, THCS) và định hướng nghề nghiệp (THPT).", "r": "Điều 28 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["nền tảng", "nghề nghiệp"], ["cơ bản", "chuyên sâu"], ["cơ bản", "nghề nghiệp"], ["cơ sở", "hướng nghiệp"]], "k": 2}, {"t": "f", "q": "Mục tiêu giáo dục THCS: học sinh có học vấn phổ thông ____ và hiểu biết cần thiết ____ về kỹ thuật và hướng nghiệp.", "a": [["nền tảng"], ["tối thiểu"]], "e": "Từ khóa 'nền tảng' và 'tối thiểu'.", "r": "Điều 29 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["cơ bản", "tối thiểu"], ["nền tảng", "tối đa"], ["cơ bản", "tối đa"], ["nền tảng", "tối thiểu"]], "k": 3}, {"t": "f", "q": "Từ 01/01/2026, học sinh hết THCS đủ điều kiện được ____ xác nhận vào ____ việc hoàn thành chương trình.", "a": [["hiệu trưởng"], ["học bạ"]], "e": "Không còn cấp bằng tốt nghiệp THCS; hiệu trưởng xác nhận vào học bạ.", "r": "Điều 34 khoản 1 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["hiệu trưởng", "học bạ"], ["giáo viên chủ nhiệm", "học bạ"], ["hiệu trưởng", "giấy chứng nhận"], ["sở giáo dục và đào tạo", "bằng tốt nghiệp"]], "k": 0}, {"t": "f", "q": "Chính phủ quy định việc miễn phí ____ (hiệu lực từ 01/7/2026).", "a": [["sách giáo khoa", "sgk"]], "e": "Điều 32 sửa đổi: Chính phủ quy định miễn phí sách giáo khoa.", "r": "Điều 32 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["học phí"], ["tài liệu học tập"], ["sách giáo khoa"], ["sách tham khảo"]], "k": 2}], "ynho": ["THCS **04 năm**, lớp **6 đến 9**, vào lớp sáu **11 tuổi**.", "Tiểu học **05 năm** (6 tuổi); THPT **03 năm** (15 tuổi).", "Giáo dục bắt buộc: **tiểu học và THCS**; phổ cập mầm non: trẻ **3 đến 6 tuổi** (từ 01/7/2026).", "Từ 01/01/2026: **hiệu trưởng xác nhận vào học bạ**; không cấp bằng tốt nghiệp THCS.", "**Bộ trưởng Bộ GDĐT** quyết định **một bộ** SGK; **Chính phủ** quy định miễn phí SGK."], "bang": [{"tieu_de": "Các cấp học phổ thông", "cot": ["Cấp", "Số năm", "Tuổi vào học"], "dong": [["Tiểu học", "05 năm", "06 tuổi (lớp một)"], ["THCS", "04 năm (lớp 6 đến 9)", "11 tuổi (lớp sáu)"], ["THPT", "03 năm", "15 tuổi (lớp mười)"]]}, {"tieu_de": "Ai quy định cái gì", "cot": ["Ai", "Quy định"], "dong": [["Bộ trưởng Bộ GDĐT", "Học vượt lớp, học ở độ tuổi khác (Điều 28.4); một bộ SGK thống nhất (Điều 32); điều kiện hoàn thành chương trình (Điều 34)"], ["Chính phủ", "Miễn phí SGK (Điều 32); chi tiết Điều 14 khoản 1, 2"], ["Hiệu trưởng", "Xác nhận vào học bạ việc hoàn thành chương trình tiểu học, THCS (Điều 34)"]]}, {"tieu_de": "Phân biệt khái niệm (Điều 5, 14)", "cot": ["Khái niệm", "Hiểu thế nào"], "dong": [["Phổ cập giáo dục", "Mọi công dân trong độ tuổi đều được học và đạt trình độ nhất định"], ["Giáo dục bắt buộc", "Công dân trong độ tuổi bắt buộc phải học; Nhà nước bảo đảm điều kiện"], ["Áp dụng từ 01/7/2026", "Bắt buộc: tiểu học và THCS; phổ cập mầm non: 3 đến 6 tuổi"]]}], "vidu": [{"tinh_huong": "Em Lan vừa hoàn thành chương trình tiểu học và chuẩn bị vào lớp sáu. Mẹ hỏi em được bao nhiêu tuổi khi vào lớp sáu.", "ket_luan": "→ 11 tuổi (Điều 28 khoản 1 điểm b)."}, {"tinh_huong": "Em Khoa học hết lớp chín. Thầy hiệu trưởng không cấp bằng tốt nghiệp THCS mà xác nhận vào học bạ.", "ket_luan": "→ Đúng: từ 01/01/2026 hiệu trưởng xác nhận vào học bạ việc hoàn thành chương trình, không cấp bằng THCS (Điều 34 khoản 1)."}, {"tinh_huong": "Phụ huynh muốn cho con học vượt lớp và hỏi ai quy định các trường hợp này.", "ket_luan": "→ Bộ trưởng Bộ GDĐT quy định các trường hợp học vượt lớp, học ở độ tuổi cao hơn hoặc thấp hơn tuổi quy định (Điều 28 khoản 4)."}, {"tinh_huong": "Một phụ huynh nói THPT cũng là giáo dục bắt buộc như THCS.", "ket_luan": "→ Sai: giáo dục bắt buộc là tiểu học và THCS (Điều 14 khoản 1 mới); THPT thuộc giai đoạn định hướng nghề nghiệp."}, {"tinh_huong": "Cô Hằng dùng AI hỗ trợ soạn bài trong trường theo hướng dẫn của nhà trường, có kiểm soát.", "ket_luan": "→ Phù hợp: Nhà nước khuyến khích ứng dụng AI có kiểm soát trong cơ sở giáo dục (Điều 19 khoản 3)."}], "nho": ["THCS: **4 năm – lớp 6 đến 9 – 11 tuổi**. Tiểu học **5-6**, THPT **3-15** (số năm rồi tuổi).", "**Bắt buộc = Tiểu học + THCS**; **phổ cập mầm non = 3 đến 6 tuổi**. THPT không bắt buộc.", "Bộ trưởng lo **chuyên môn** (vượt lớp, một bộ SGK), Chính phủ lo **miễn phí SGK**.", "Không còn bằng THCS: **hiệu trưởng** xác nhận vào **học bạ**."]}, {"id": "L2-4", "ten": "Hành vi bị nghiêm cấm trong cơ sở giáo dục và quy định về nhà giáo", "tomtat": ["Điều 20: không truyền bá **tôn giáo**, tiến hành **lễ nghi tôn giáo** trong cơ sở giáo dục của hệ thống giáo dục quốc dân, cơ quan nhà nước...", "Điều 21: cấm **lợi dụng** hoạt động giáo dục: (khoản 1) xuyên tạc chủ trương, chính sách, chống Nhà nước, chia rẽ đoàn kết, kích động bạo lực, truyền bá mê tín, hủ tục...; (khoản 2) vì **mục đích vụ lợi**.", "Điều 22 - Các hành vi bị nghiêm cấm trong cơ sở giáo dục (**6 hành vi**): (1) xúc phạm nhân phẩm, danh dự, xâm phạm thân thể **nhà giáo, cán bộ, người lao động và người học**; (2) xuyên tạc nội dung giáo dục; (3) gian lận trong học tập, kiểm tra, thi, tuyển sinh.", "Điều 22 (tiếp): (4) **hút thuốc; uống rượu, bia**; gây rối an ninh, trật tự; (5) **ép buộc học sinh học thêm để thu tiền**; (6) lợi dụng việc tài trợ, ủng hộ giáo dục để ép buộc đóng góp **tiền hoặc hiện vật**.", "Phân biệt: Điều 22 Luật Giáo dục cấm ép buộc học sinh học thêm **để thu tiền**; Luật Nhà giáo Điều 11 khoản 2 điểm c cấm nhà giáo ép buộc người học học thêm **dưới mọi hình thức**.", "Luật 123 **bãi bỏ** các Điều 67-73, 75-78 (tiêu chuẩn, nhiệm vụ, quyền, thỉnh giảng, trình độ chuẩn, đào tạo bồi dưỡng, Ngày Nhà giáo, tiền lương, chính sách, phong tặng danh hiệu...) từ 01/01/2026, vì đã chuyển sang Luật Nhà giáo 73/2025/QH15 (nhiệm vụ: Điều 9; quyền: Điều 8).", "Bản gốc 2019 (chỉ để nhận biết khi gặp văn bản cũ): Điều 69 - nhiệm vụ nhà giáo (4 khoản); Điều 70 - quyền nhà giáo (5 khoản); Điều 75 - ngày **20/11** hằng năm là Ngày Nhà giáo Việt Nam.", "Điều 66 (viết lại): nhà giáo gồm (a) nhà giáo **cơ hữu** (tuyển dụng, làm việc toàn thời gian tại **duy nhất** một cơ sở); (b) nhà giáo **đồng cơ hữu** (giáo dục nghề nghiệp, đại học công lập); (c) nhà giáo **hợp đồng toàn thời gian sau khi nghỉ hưu**; (d) nhà giáo **thỉnh giảng**.", "Điều 66 khoản 2: nhà giáo cơ hữu thực hiện theo quy định của **Luật Nhà giáo**.", "Điều 66a (bổ sung): nhà giáo được điều động làm cán bộ quản lý giáo dục được **bảo lưu phụ cấp nhà giáo** theo quy định của Chính phủ; cán bộ quản lý cơ sở giáo dục công lập là **viên chức quản lý**, được hưởng phụ cấp ưu đãi nghề.", "Điều 66b (bổ sung): **nhân sự hỗ trợ giáo dục** (vị trí việc làm chuyên môn, nghiệp vụ không phải nhà giáo) trong cơ sở công lập được hưởng phụ cấp ưu đãi nghề và chế độ khác theo quy định của Chính phủ.", "Điều 104 khoản 3 (sửa): Bộ Giáo dục và Đào tạo quy định chuẩn nghề nghiệp nhà giáo, chế độ làm việc, quy tắc ứng xử của nhà giáo..."], "bay": ["⚠ Điều 22: ép học thêm **để thu tiền** (Luật Giáo dục) ≠ ép học thêm **dưới mọi hình thức** (Luật Nhà giáo Điều 11).", "⚠ Điều 22 cấm xúc phạm **nhà giáo, cán bộ, người lao động và người học**, không chỉ người học.", "⚠ Điều 20 (**tôn giáo**) ≠ Điều 21 (**lợi dụng** hoạt động giáo dục) ≠ Điều 22 (6 hành vi bị nghiêm cấm).", "⚠ Nhà giáo **cơ hữu** (duy nhất một cơ sở) ≠ **đồng cơ hữu** (giáo dục nghề nghiệp, đại học công lập) ≠ **thỉnh giảng**.", "⚠ **Bãi bỏ** Điều 67-78 (trừ 74) ≠ **viết lại** Điều 66; quyền nhà giáo ở Điều **8**, nghĩa vụ ở Điều **9** (Luật Nhà giáo)."], "cauhoi": [{"t": "s", "q": "Phát biểu nào sau đây đúng về các hành vi bị nghiêm cấm tại Điều 22 Luật Giáo dục?", "o": ["Nghiêm cấm xúc phạm nhân phẩm, danh dự, xâm phạm thân thể nhà giáo, cán bộ, người lao động và người học", "Chỉ nghiêm cấm xâm phạm thân thể người học, không áp dụng đối với nhà giáo", "Chỉ nghiêm cấm hút thuốc, không nghiêm cấm uống rượu, bia", "Chỉ nghiêm cấm gian lận trong thi, không nghiêm cấm gian lận trong học tập, kiểm tra"], "a": [0], "e": "Điều 22 bảo vệ cả nhà giáo, cán bộ, người lao động và người học; cấm cả hút thuốc và uống rượu, bia; cấm gian lận trong học tập, kiểm tra, thi, tuyển sinh.", "r": "Điều 22 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Điều 22 Luật Giáo dục liệt kê bao nhiêu hành vi bị nghiêm cấm trong cơ sở giáo dục?", "o": ["5 hành vi", "7 hành vi", "6 hành vi", "4 hành vi"], "a": [2], "e": "Điều 22 có 6 khoản/hành vi: xúc phạm; xuyên tạc nội dung; gian lận; hút thuốc, rượu bia, gây rối; ép học thêm để thu tiền; lợi dụng tài trợ ép đóng góp.", "r": "Điều 22 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Quy định cấm truyền bá tôn giáo, tiến hành lễ nghi tôn giáo trong cơ sở giáo dục thuộc Điều nào của Luật Giáo dục?", "o": ["Điều 19", "Điều 21", "Điều 20", "Điều 22"], "a": [2], "e": "Điều 20: tôn giáo; Điều 21: lợi dụng hoạt động giáo dục; Điều 22: các hành vi bị nghiêm cấm. Điều 19 là khoa học, công nghệ.", "r": "Điều 20 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 21 khoản 2, cấm lợi dụng hoạt động giáo dục vì mục đích nào?", "o": ["Vụ lợi", "Truyền bá tôn giáo", "Kích động bạo lực", "Gian lận trong thi"], "a": [0], "e": "Khoản 2 là 'vì mục đích vụ lợi'. Kích động bạo lực thuộc khoản 1; truyền bá tôn giáo thuộc Điều 20; gian lận thi thuộc Điều 22.", "r": "Điều 21 khoản 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Phát biểu nào đúng về hành vi lợi dụng tài trợ, ủng hộ giáo dục tại Điều 22?", "o": ["Cấm mọi hình thức tài trợ cho giáo dục", "Cấm ép buộc đóng góp tiền, nhưng ép buộc đóng góp hiện vật thì không bị cấm", "Chỉ cấm nhà trường nhận tài trợ từ cá nhân nước ngoài", "Cấm lợi dụng việc tài trợ, ủng hộ giáo dục để ép buộc đóng góp tiền hoặc hiện vật"], "a": [3], "e": "Điều cấm là LỢI DỤNG tài trợ để ÉP BUỘC đóng góp tiền HOẶC hiện vật; tài trợ tự nguyện không bị cấm.", "r": "Điều 22 khoản 6 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Phát biểu nào đúng khi so sánh quy định về học thêm của Luật Giáo dục (Điều 22) và Luật Nhà giáo (Điều 11)?", "o": ["Cả hai luật đều cấm ép buộc học thêm chỉ khi để thu tiền", "Luật Giáo dục cấm ép buộc học sinh học thêm để thu tiền; Luật Nhà giáo cấm nhà giáo ép buộc người học học thêm dưới mọi hình thức", "Luật Giáo dục cấm ép học thêm dưới mọi hình thức; Luật Nhà giáo chỉ cấm khi để thu tiền", "Cả hai luật đều không cấm ép buộc học thêm"], "a": [1], "e": "Phạm vi khác nhau: Điều 22 Luật Giáo dục - 'để thu tiền'; Điều 11.2.c Luật Nhà giáo - 'dưới mọi hình thức'.", "r": "Điều 22 khoản 5 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15); Điều 11 khoản 2 điểm c Luật Nhà giáo 73/2025/QH15"}, {"t": "s", "q": "Theo Điều 66 (viết lại), nhà giáo cơ hữu là nhà giáo:", "o": ["Làm việc toàn thời gian tại ít nhất hai cơ sở giáo dục", "Được tuyển dụng, làm việc toàn thời gian tại duy nhất một cơ sở giáo dục", "Chỉ giảng dạy theo hợp đồng thỉnh giảng", "Làm việc toàn thời gian theo hợp đồng sau khi đã nghỉ hưu"], "a": [1], "e": "Từ khóa 'duy nhất một cơ sở'. Phương án 2 là nhà giáo thỉnh giảng, phương án 3 là nhà giáo hợp đồng toàn thời gian sau khi nghỉ hưu.", "r": "Điều 66 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Nhà giáo 'đồng cơ hữu' theo Điều 66 áp dụng ở loại cơ sở nào?", "o": ["Mầm non và phổ thông công lập", "Tiểu học và trung học cơ sở công lập", "Mọi cơ sở giáo dục thuộc hệ thống giáo dục quốc dân", "Giáo dục nghề nghiệp và đại học công lập"], "a": [3], "e": "Đồng cơ hữu chỉ có ở giáo dục nghề nghiệp, đại học công lập; giáo viên THCS thuộc nhóm cơ hữu (hoặc nhóm khác).", "r": "Điều 66 điểm b Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 66 khoản 2 Luật Giáo dục, nhà giáo cơ hữu thực hiện theo quy định của luật nào?", "o": ["Luật Nhà giáo", "Luật Viên chức", "Bộ luật Lao động", "Luật Cán bộ, công chức"], "a": [0], "e": "Điều 66 khoản 2 dẫn chiếu tới Luật Nhà giáo.", "r": "Điều 66 khoản 2 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Quyền của nhà giáo hiện được quy định tại điều nào của Luật Nhà giáo 73/2025/QH15 (thay cho Điều 70 Luật Giáo dục 2019 đã bãi bỏ)?", "o": ["Điều 9", "Điều 10", "Điều 8", "Điều 11"], "a": [2], "e": "Quyền = Điều 8; nghĩa vụ = Điều 9; đạo đức = Điều 10; việc không được làm = Điều 11.", "r": "Điều 8 Luật Nhà giáo 73/2025/QH15; Điều 1 khoản 31 điểm đ Luật 123/2025/QH15"}, {"t": "m", "q": "Theo Điều 22 Luật Giáo dục, hành vi nào bị nghiêm cấm trong cơ sở giáo dục? (chọn tất cả đáp án đúng)", "o": ["Xuyên tạc nội dung giáo dục", "Gian lận trong học tập, kiểm tra, thi, tuyển sinh", "Đưa học sinh đi tham quan, học tập ngoài nhà trường theo kế hoạch", "Hút thuốc; uống rượu, bia; gây rối an ninh, trật tự", "Tổ chức sinh hoạt chuyên đề theo kế hoạch của nhà trường"], "a": [0, 1, 3], "e": "Tham quan, sinh hoạt chuyên đề theo kế hoạch là hoạt động giáo dục hợp pháp, không thuộc Điều 22.", "r": "Điều 22 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Theo Điều 66 (viết lại), nhà giáo trong cơ sở giáo dục thuộc hệ thống giáo dục quốc dân gồm: (chọn tất cả đáp án đúng)", "o": ["Nhà giáo cơ hữu", "Nhà giáo tập sự", "Nhà giáo hợp đồng toàn thời gian sau khi nghỉ hưu", "Nhà giáo danh dự", "Nhà giáo thỉnh giảng"], "a": [0, 2, 4], "e": "Điều 66: cơ hữu, đồng cơ hữu, hợp đồng toàn thời gian sau nghỉ hưu, thỉnh giảng. 'Tập sự', 'danh dự' không phải loại do Điều 66 liệt kê.", "r": "Điều 66 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "m", "q": "Nội dung nào sau đây từng được quy định tại các điều về nhà giáo của Luật Giáo dục 2019 và nay đã bị bãi bỏ? (chọn tất cả đáp án đúng)", "o": ["Điều 66 về cơ cấu nhà giáo", "Điều 69 về nhiệm vụ của nhà giáo", "Điều 70 về quyền của nhà giáo", "Điều 75 về Ngày Nhà giáo Việt Nam", "Điều 66a về cán bộ quản lý giáo dục"], "a": [1, 2, 3], "e": "Điều 66 chỉ được viết lại; Điều 66a được bổ sung mới. Điều 69, 70, 75 bị bãi bỏ từ 01/01/2026.", "r": "Điều 1 khoản 31 điểm đ Luật 123/2025/QH15"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 20, 21 Luật Giáo dục? (chọn tất cả đáp án đúng)", "o": ["Điều 20 cấm tiến hành lễ nghi tôn giáo trong cơ sở giáo dục của hệ thống giáo dục quốc dân", "Điều 21 khoản 1 cấm lợi dụng hoạt động giáo dục để kích động bạo lực", "Điều 21 khoản 1 cấm lợi dụng hoạt động giáo dục để truyền bá mê tín, hủ tục", "Điều 21 khoản 2 cấm lợi dụng hoạt động giáo dục để xuyên tạc chủ trương, chính sách", "Điều 20 chỉ cấm truyền bá tôn giáo, không cấm lễ nghi tôn giáo"], "a": [0, 1, 2], "e": "Xuyên tạc chủ trương, chính sách thuộc khoản 1 (khoản 2 là vụ lợi). Điều 20 cấm cả truyền bá tôn giáo và lễ nghi tôn giáo.", "r": "Điều 20, 21 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "f", "q": "Điều 22 nghiêm cấm ____ học sinh học thêm để ____ tiền.", "a": [["ép buộc"], ["thu"]], "e": "Chỉ cấm ép buộc học thêm để thu tiền (Luật Nhà giáo cấm ép học thêm dưới mọi hình thức).", "r": "Điều 22 khoản 5 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["lôi kéo", "thu"], ["ép buộc", "quyên góp"], ["dụ dỗ", "quyên góp"], ["ép buộc", "thu"]], "k": 3}, {"t": "f", "q": "Điều 22 nghiêm cấm hút thuốc; uống ____, ____; gây rối an ninh, trật tự trong cơ sở giáo dục.", "a": [["rượu"], ["bia"]], "e": "Cấm cả rượu và bia.", "r": "Điều 22 khoản 4 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["rượu", "chất kích thích"], ["rượu", "bia"], ["cà phê", "bia"], ["nước tăng lực", "chất kích thích"]], "k": 1}, {"t": "f", "q": "Điều 20 Luật Giáo dục quy định không truyền bá ____, tiến hành lễ nghi ____ trong cơ sở giáo dục của hệ thống giáo dục quốc dân.", "a": [["tôn giáo"], ["tôn giáo"]], "e": "Điều 20 về tôn giáo; không nhầm với Điều 21.", "r": "Điều 20 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["tín ngưỡng", "tôn giáo"], ["tôn giáo", "tôn giáo"], ["tôn giáo", "chính trị"], ["chính trị", "chính trị"]], "k": 1}, {"t": "f", "q": "Nhà giáo cơ hữu là nhà giáo được tuyển dụng, làm việc toàn thời gian tại ____ một cơ sở giáo dục.", "a": [["duy nhất"]], "e": "Từ khóa 'duy nhất'.", "r": "Điều 66 điểm a Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)", "o": [["chính"], ["đầu tiên"], ["duy nhất"], ["ít nhất"]], "k": 2}, {"t": "f", "q": "Các điều về nhà giáo (Điều 67-73, 75-78) của Luật Giáo dục 2019 bị bãi bỏ từ ngày ____.", "a": [["01/01/2026", "1/1/2026"]], "e": "Bãi bỏ từ 01/01/2026 vì đã chuyển sang Luật Nhà giáo.", "r": "Điều 1 khoản 31 điểm đ Luật 123/2025/QH15", "o": [["01/7/2026"], ["01/7/2025"], ["01/01/2027"], ["01/01/2026"]], "k": 3}, {"t": "f", "q": "Theo Điều 75 Luật Giáo dục 2019 (bản gốc, nay đã bãi bỏ), ngày ____ tháng ____ hằng năm là Ngày Nhà giáo Việt Nam.", "a": [["20", "hai mươi"], ["11", "mười một"]], "e": "Ngày 20/11; nội dung nay nằm ở Điều 32 Luật Nhà giáo.", "r": "Điều 75 Luật Giáo dục 2019 (đã bãi bỏ)", "o": [["20", "11"], ["20", "10"], ["15", "11"], ["25", "11"]], "k": 0}], "ynho": ["Điều 22 có **6 hành vi** bị nghiêm cấm trong cơ sở giáo dục.", "Cấm xúc phạm **nhà giáo, cán bộ, người lao động và người học**, không chỉ người học.", "Cấm **hút thuốc, uống rượu, bia** trong cơ sở giáo dục.", "Luật Giáo dục cấm ép học thêm **để thu tiền**; Luật Nhà giáo cấm **dưới mọi hình thức**.", "Điều 66 nhà giáo: **cơ hữu, đồng cơ hữu, hợp đồng toàn thời gian sau nghỉ hưu, thỉnh giảng**."], "bang": [{"tieu_de": "Điều 20, 21, 22", "cot": ["Điều", "Nội dung"], "dong": [["Điều 20", "Không truyền bá tôn giáo, tiến hành lễ nghi tôn giáo trong cơ sở giáo dục"], ["Điều 21", "Cấm lợi dụng hoạt động giáo dục (xuyên tạc, chống Nhà nước, mê tín, hủ tục; vụ lợi)"], ["Điều 22", "6 hành vi bị nghiêm cấm trong cơ sở giáo dục"]]}, {"tieu_de": "6 hành vi bị nghiêm cấm (Điều 22)", "cot": ["STT", "Hành vi"], "dong": [["1", "Xúc phạm nhân phẩm, danh dự, xâm phạm thân thể nhà giáo, cán bộ, người lao động, người học"], ["2", "Xuyên tạc nội dung giáo dục"], ["3", "Gian lận trong học tập, kiểm tra, thi, tuyển sinh"], ["4", "Hút thuốc; uống rượu, bia; gây rối an ninh, trật tự"], ["5", "Ép buộc học sinh học thêm để thu tiền"], ["6", "Lợi dụng tài trợ, ủng hộ giáo dục để ép buộc đóng góp tiền hoặc hiện vật"]]}, {"tieu_de": "Các loại nhà giáo (Điều 66, viết lại)", "cot": ["Loại", "Đặc điểm"], "dong": [["Cơ hữu", "Tuyển dụng, làm toàn thời gian tại duy nhất một cơ sở"], ["Đồng cơ hữu", "Giáo dục nghề nghiệp, đại học công lập"], ["Hợp đồng toàn thời gian sau nghỉ hưu", "Nhà giáo đã nghỉ hưu"], ["Thỉnh giảng", "Nhà giáo thỉnh giảng"]]}], "vidu": [{"tinh_huong": "Thầy Phát hút thuốc trong khuôn viên trường giờ ra chơi.", "ket_luan": "→ Vi phạm: hút thuốc, uống rượu, bia là hành vi bị nghiêm cấm trong cơ sở giáo dục (Điều 22)."}, {"tinh_huong": "Cô Trâm yêu cầu học sinh trong lớp phải đăng ký học thêm ở nhà cô và đóng tiền.", "ket_luan": "→ Vi phạm: ép buộc học sinh học thêm để thu tiền (Điều 22); Luật Nhà giáo còn cấm ép học thêm dưới mọi hình thức (Điều 11 khoản 2 điểm c)."}, {"tinh_huong": "Một học sinh lớp 9 nhờ người thi hộ trong kỳ kiểm tra.", "ket_luan": "→ Gian lận trong học tập, kiểm tra, thi là hành vi bị nghiêm cấm (Điều 22)."}, {"tinh_huong": "Một phụ huynh chửi bới, xúc phạm một cô giáo ngay trong trường.", "ket_luan": "→ Vi phạm: cấm xúc phạm nhân phẩm, danh dự nhà giáo, cán bộ, người lao động và người học (Điều 22)."}, {"tinh_huong": "Nhà trường kêu gọi tài trợ rồi ép mỗi phụ huynh phải đóng góp tiền hoặc hiện vật.", "ket_luan": "→ Vi phạm: lợi dụng việc tài trợ, ủng hộ giáo dục để ép buộc đóng góp (Điều 22)."}], "nho": ["Điều 20 = **Tôn giáo**, Điều 21 = **Lợi dụng**, Điều 22 = **6 hành vi cấm** (theo thứ tự 20-21-22).", "Ép học thêm: Luật Giáo dục **chữ \"để thu tiền\"**, Luật Nhà giáo **chữ \"mọi hình thức\"**; hẹp và rộng.", "Nhà giáo Điều 66: **Cơ – Đồng – Hưu – Thỉnh** (4 loại).", "Quyền nhà giáo ở Điều **8**, nghĩa vụ ở Điều **9** (Luật Nhà giáo); các điều cũ 67-78 đã bị bãi bỏ."]}, {"id": "L2-5", "ten": "Thành lập trường, hội đồng trường, học phí và tài chính giáo dục", "tomtat": ["Điều 52 khoản 2 điểm a (sửa, hiệu lực **01/7/2026**): **Chủ tịch UBND cấp xã** quyết định thành lập trường mầm non, tiểu học, **THCS** và trường phổ thông nhiều cấp có cấp học cao nhất là THCS.", "Điều 52 khoản 2: **Chủ tịch UBND cấp tỉnh** quyết định thành lập trường THPT...", "Điều 55 (viết lại): hội đồng trường chỉ còn ở trường mầm non **dân lập** (khoản 2), trường mầm non **tư thục** và cơ sở giáo dục phổ thông **tư thục** (khoản 3), giáo dục nghề nghiệp/đại học tư thục (khoản 1).", "Từ **01/01/2026**, hội đồng trường của nhà trẻ, trường mẫu giáo, mầm non và cơ sở giáo dục phổ thông **công lập** kết thúc hoạt động; bàn giao hồ sơ cho **hiệu trưởng** (Điều 2 khoản 3 điểm b Luật 123).", "Điều 99 khoản 3 (viết lại): trẻ em mầm non, học sinh phổ thông, người học chương trình giáo dục phổ thông trong cơ sở giáo dục **công lập** được **miễn học phí**.", "Điều 99 khoản 3: cơ sở **dân lập, tư thục**: Nhà nước **hỗ trợ** tiền đóng học phí; mức do **HĐND cấp tỉnh** quyết định.", "Điều 85 khoản 2 (sửa): trợ cấp và miễn, giảm học phí cho người học là đối tượng chính sách xã hội, người dân tộc thiểu số, thường trú vùng đặc biệt khó khăn, trẻ mồ côi, người khuyết tật, hộ nghèo, cận nghèo.", "Điều 96 khoản 1: chi NSNN cho giáo dục **tối thiểu 20%** tổng chi NSNN; chi đầu tư **ít nhất 5%**; chi cho giáo dục đại học **ít nhất 3%**.", "Điều 66a: nhà giáo điều động làm cán bộ quản lý giáo dục được **bảo lưu phụ cấp nhà giáo** theo quy định của Chính phủ; cán bộ quản lý cơ sở giáo dục công lập là **viên chức quản lý**, được hưởng phụ cấp ưu đãi nghề.", "Điều 66b: nhân sự hỗ trợ giáo dục (không phải nhà giáo) trong cơ sở công lập được hưởng phụ cấp ưu đãi nghề và chế độ khác theo quy định của Chính phủ.", "Điều 104 khoản 3 (sửa): **Bộ Giáo dục và Đào tạo** quy định chuẩn nghề nghiệp nhà giáo, chế độ làm việc, quy tắc ứng xử của nhà giáo.", "Điều 32: **Bộ trưởng Bộ GDĐT** quyết định một bộ sách giáo khoa sử dụng thống nhất toàn quốc."], "bay": ["⚠ Trường THCS do **Chủ tịch UBND cấp xã** thành lập; trường THPT do **Chủ tịch UBND cấp tỉnh** (từ 01/7/2026).", "⚠ Hội đồng trường: **công lập** kết thúc (01/01/2026) ≠ **tư thục / dân lập** vẫn còn (Điều 55).", "⚠ **Miễn** học phí (công lập) ≠ **hỗ trợ** tiền học phí (dân lập, tư thục); mức do **HĐND** cấp tỉnh, không phải UBND.", "⚠ Điều 96: **tối thiểu 20%** ≠ tối đa; đầu tư **5%** ≠ đại học **3%** (đừng đổi số).", "⚠ **Bộ trưởng** quyết định một bộ SGK; **Chính phủ** quy định miễn phí SGK và phụ cấp ưu đãi của nhân sự hỗ trợ."], "cauhoi": [{"t": "s", "q": "Từ 01/7/2026, ai có thẩm quyền quyết định thành lập trường trung học cơ sở công lập (Điều 52 khoản 2 điểm a)?", "o": ["Chủ tịch UBND cấp tỉnh", "Giám đốc Sở Giáo dục và Đào tạo", "Chủ tịch UBND cấp xã", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [2], "e": "Điều 52 sửa đổi: trường mầm non, tiểu học, THCS do Chủ tịch UBND cấp xã; trường THPT do Chủ tịch UBND cấp tỉnh.", "r": "Điều 52 khoản 2 điểm a Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Trường phổ thông nhiều cấp học có cấp học cao nhất là THCS do ai quyết định thành lập?", "o": ["Chủ tịch UBND cấp xã", "Chủ tịch UBND cấp tỉnh", "Chủ tịch HĐND cấp xã", "Giám đốc Sở Giáo dục và Đào tạo"], "a": [0], "e": "Cấp học cao nhất là THCS thì thuộc thẩm quyền Chủ tịch UBND cấp xã (nếu cấp cao nhất là THPT thì thuộc cấp tỉnh).", "r": "Điều 52 khoản 2 điểm a Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Sau khi Luật 123/2025/QH15 có hiệu lực, hội đồng trường vẫn được tổ chức tại:", "o": ["Trường THCS công lập", "Trường mầm non công lập", "Trường tiểu học công lập", "Trường mầm non tư thục"], "a": [3], "e": "Điều 55 chỉ còn hội đồng trường ở cơ sở dân lập, tư thục; hội đồng trường công lập kết thúc từ 01/01/2026.", "r": "Điều 55 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Hội đồng trường của cơ sở giáo dục phổ thông tư thục được quy định tại khoản nào của Điều 55?", "o": ["Khoản 1", "Khoản 3", "Khoản 2", "Khoản 4"], "a": [1], "e": "Khoản 2: mầm non dân lập; khoản 3: mầm non tư thục và phổ thông tư thục; khoản 1: giáo dục nghề nghiệp, đại học tư thục.", "r": "Điều 55 khoản 3 Luật Giáo dục 2019 (sửa đổi bởi Luật 123/2025/QH15)"}, {"t": "s", "q": "Theo Điều 99 khoản 3 (viết lại), học sinh phổ thông trong cơ sở giáo dục công lập:", "o": ["Chỉ được miễn học phí nếu thuộc hộ nghèo", "Được miễn học phí", "Được giảm 50% học phí", "Được hỗ trợ tiền đóng học phí"], "a": [1], "e": "Công lập: MIỄN học phí. 'Hỗ trợ tiền đóng học phí' áp dụng cho cơ sở dân lập, tư thục.", "r": "Điều 99 khoản 3 Luật Giáo dụ
