phạm quy định nào?", "o": ["Không vi phạm vì cán bộ quản lý ở cấp cao hơn", "Chỉ vi phạm nếu sai phạm liên quan tài chính", "Điều 6 khoản 3: không công khai thông tin của đồng nghiệp", "Điều 7 khoản 4: không thờ ơ, né tránh hoặc che giấu hành vi sai phạm của cán bộ quản lý"], "a": [3], "e": "Điều 7 khoản 4 cấm thờ ơ, né tránh, che giấu sai phạm của cán bộ quản lý, không giới hạn loại sai phạm.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 4"}, {"t": "s", "q": "Hiệu trưởng đột xuất giao thêm việc trong phạm vi nhiệm vụ, một giáo viên phản ứng gay gắt trên nhóm Zalo của trường. Đánh giá nào đúng?", "o": ["Phù hợp vì đó là cách thể hiện chính kiến", "Không phù hợp: phải chấp hành phân công, nếu có ý kiến thì tham mưu đúng cách, không xúc phạm, không gây mất đoàn kết", "Phù hợp vì nhóm Zalo là nơi trao đổi nội bộ", "Không phù hợp chỉ vì chưa có văn bản giao việc"], "a": [1], "e": "Điều 7: chấp hành phân công (K1), tham mưu/thể hiện chính kiến theo chức năng (K3), không xúc phạm, gây mất đoàn kết (K4). Bẫy: 'chính kiến' không đồng nghĩa phản ứng gay gắt công khai.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7; Điều 4 khoản 2"}, {"t": "s", "q": "Thầy B đẩy hết phần việc nhóm cho đồng nghiệp để tránh trách nhiệm. Hành vi này vi phạm quy định nào?", "o": ["Điều 6 khoản 3: không né tránh, đùn đẩy trách nhiệm", "Điều 7 khoản 4: không thờ ơ với sai phạm của cán bộ quản lý", "Điều 5 khoản 4: không phân biệt đối xử người học", "Điều 9 khoản 4: không tham gia mê tín dị đoan"], "a": [0], "e": "Đùn đẩy trách nhiệm cho đồng nghiệp thuộc Điều 6 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 3"}, {"t": "s", "q": "Nội dung nào chỉ có trong Điều 6 khoản 3 (đồng nghiệp) mà không có trong Điều 7 khoản 4 (cán bộ quản lý) của Thông tư 03/2026/TT-BGDĐT?", "o": ["Xúc phạm", "Gây mất đoàn kết nội bộ", "Công khai thông tin trái quy định", "Thờ ơ, né tránh hoặc che giấu hành vi sai phạm"], "a": [2], "e": "Điều 7 khoản 4 gồm xúc phạm, gây mất đoàn kết, thờ ơ/né tránh/che giấu sai phạm; 'công khai thông tin trái quy định' chỉ nằm ở Điều 6 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 3; Điều 7 khoản 4"}, {"t": "s", "q": "Thầy C thấy đồng nghiệp tự ý sửa điểm cho học sinh nhưng im lặng 'để tránh va chạm, giữ đoàn kết'. Đánh giá nào đúng?", "o": ["Đúng, vì giữ đoàn kết là yêu cầu của Điều 6", "Sai, vì không được thờ ơ, né tránh hoặc che giấu vi phạm của đồng nghiệp (Điều 4 khoản 6)", "Đúng, vì việc đánh giá điểm là việc của người sửa", "Chỉ sai nếu học sinh phản ánh"], "a": [1], "e": "Điều 4 khoản 6 cấm né tránh, che giấu vi phạm của đồng nghiệp; sửa điểm là làm sai lệch kết quả đánh giá (Điều 5 khoản 4). Đoàn kết không có nghĩa là bao che.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6; Điều 5 khoản 4"}, {"t": "s", "q": "Theo Điều 7 khoản 2 Thông tư 03/2026/TT-BGDĐT, nhà giáo tiếp thu ý kiến đánh giá, góp ý của cán bộ quản lý với thái độ nào?", "o": ["Tiếp thu có chọn lọc, từ chối nếu không đồng ý", "Tiếp thu khi được cán bộ quản lý yêu cầu", "Ghi nhận nhưng không cần thay đổi", "Lắng nghe, cầu thị"], "a": [3], "e": "Khoản 2: lắng nghe, cầu thị tiếp thu ý kiến đánh giá, góp ý. (Cụm 'có chọn lọc' là về khoa học công nghệ ở Điều 4 khoản 2.)", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 2"}, {"t": "m", "q": "Những hành vi nào nhà giáo không được làm với đồng nghiệp theo Điều 6 khoản 3 Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Chia rẽ, gây mất đoàn kết nội bộ", "Né tránh, đùn đẩy trách nhiệm", "Xúc phạm đồng nghiệp", "Trao đổi kinh nghiệm, học hỏi lẫn nhau", "Phê bình khách quan, thẳng thắn, xây dựng"], "a": [0, 1, 2], "e": "Phê bình xây dựng và trao đổi kinh nghiệm là nội dung được khuyến khích (khoản 1, 2).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6"}, {"t": "m", "q": "Theo Điều 7 Thông tư 03/2026/TT-BGDĐT, nhà giáo cần thực hiện những việc nào với cán bộ quản lý? (chọn tất cả đáp án đúng)", "o": ["Lắng nghe, cầu thị tiếp thu ý kiến góp ý", "Im lặng, không phản biện để giữ đoàn kết", "Tích cực tham mưu và thể hiện rõ chính kiến", "Che giấu sai phạm để bảo vệ uy tín tập thể", "Chấp hành phân công, chỉ đạo, điều hành trong phạm vi chức năng, nhiệm vụ"], "a": [0, 2, 4], "e": "Hai đáp án sai trái khoản 3 và khoản 4 Điều 7.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7"}, {"t": "m", "q": "Nhà giáo không thờ ơ, né tránh hoặc che giấu hành vi vi phạm của những ai theo Điều 4 khoản 6 và Điều 7 khoản 4 Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Người học", "Cha mẹ người học", "Khách đến cơ sở giáo dục", "Đồng nghiệp", "Cán bộ quản lý cơ sở giáo dục"], "a": [0, 3, 4], "e": "Điều 4 khoản 6: vi phạm của người học, đồng nghiệp; Điều 7 khoản 4: sai phạm của cán bộ quản lý. Cha mẹ, khách không nằm trong các quy định này.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6; Điều 7 khoản 4"}, {"t": "m", "q": "Hành vi nào sau đây vi phạm quy tắc ứng xử của nhà giáo theo Thông tư 03/2026/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Góp ý thẳng thắn, xây dựng về chuyên môn trong họp tổ", "Im lặng khi thấy đồng nghiệp sửa điểm cho học sinh", "Đề xuất phương án khác với kế hoạch của nhà trường trong cuộc họp hội đồng", "Đăng bài xúc phạm đồng nghiệp trong nhóm chat", "Đẩy việc của mình cho đồng nghiệp để né trách nhiệm"], "a": [1, 3, 4], "e": "Ba hành vi đầu vi phạm Điều 4 khoản 6, Điều 6 khoản 3; hai hành vi sau là phê bình xây dựng và tham mưu theo Điều 6 khoản 1, Điều 7 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4, 6, 7"}, {"t": "m", "q": "Điều 6 khoản 1 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo ứng xử với đồng nghiệp thế nào? (chọn tất cả đáp án đúng)", "o": ["Chia sẻ trách nhiệm, giúp đỡ lẫn nhau", "Chỉ giúp đỡ đồng nghiệp cùng tổ chuyên môn", "Tự phê bình và phê bình khách quan, nghiêm túc, thẳng thắn, xây dựng", "Trung thực, chân thành, đoàn kết, hợp tác", "Không phê bình để giữ hòa khí"], "a": [0, 2, 3], "e": "Khoản 1 không hạn chế đối tượng giúp đỡ và yêu cầu phê bình thẳng thắn, xây dựng.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 1"}, {"t": "f", "q": "Nhà giáo tự phê bình và phê bình khách quan, nghiêm túc, ____, xây dựng.", "a": [["thẳng thắn"]], "e": "Điều 6 khoản 1.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 1", "o": [["thẳng thắn"], ["gay gắt"], ["kín đáo"], ["nhẹ nhàng"]], "k": 0}, {"t": "f", "q": "Nhà giáo không xúc phạm, chia rẽ, gây mất ____ nội bộ.", "a": [["đoàn kết"]], "e": "Điều 6 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 3", "o": [["uy tín"], ["trật tự"], ["đoàn kết"], ["hòa khí"]], "k": 2}, {"t": "f", "q": "Nhà giáo không né tránh, ____ trách nhiệm với đồng nghiệp.", "a": [["đùn đẩy"]], "e": "Điều 6 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6 khoản 3", "o": [["chia sẻ"], ["đùn đẩy"], ["tranh giành"], ["ủy thác"]], "k": 1}, {"t": "f", "q": "Nhà giáo ứng xử với cán bộ quản lý cơ sở giáo dục được quy định tại Điều ____ Thông tư 03/2026/TT-BGDĐT.", "a": [["7", "bảy"]], "e": "Điều 7.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7", "o": [["7"], ["6"], ["8"], ["9"]], "k": 0}, {"t": "f", "q": "Nhà giáo ứng xử với đồng nghiệp được quy định tại Điều ____ Thông tư 03/2026/TT-BGDĐT.", "a": [["6", "sáu"]], "e": "Điều 6.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 6", "o": [["5"], ["7"], ["6"], ["8"]], "k": 2}, {"t": "f", "q": "Nhà giáo chấp hành phân công, chỉ đạo, điều hành của cán bộ quản lý trong phạm vi ____, nhiệm vụ được giao.", "a": [["chức năng"]], "e": "Điều 7 khoản 1.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 1", "o": [["quyền hạn"], ["chức năng"], ["năng lực"], ["sở trường"]], "k": 1}, {"t": "f", "q": "Nhà giáo lắng nghe, ____ tiếp thu ý kiến đánh giá, góp ý của cán bộ quản lý.", "a": [["cầu thị"]], "e": "Điều 7 khoản 2.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 2", "o": [["có chọn lọc"], ["hình thức"], ["cầu thị"], ["thụ động"]], "k": 2}, {"t": "f", "q": "Nhà giáo tích cực ____ và thể hiện rõ chính kiến theo chức năng, nhiệm vụ.", "a": [["tham mưu"]], "e": "Điều 7 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 7 khoản 3", "o": [["phục tùng"], ["né tránh"], ["tham mưu"], ["chờ đợi"]], "k": 2}], "ynho": ["Điều **6** = đồng nghiệp; Điều **7** = cán bộ quản lý.", "Điều 6 khoản 3 cấm: **xúc phạm, chia rẽ**; **né tránh, đùn đẩy** trách nhiệm; **công khai thông tin** đồng nghiệp trái quy định.", "Điều 7 khoản 1: **chấp hành** chỉ đạo trong phạm vi **chức năng, nhiệm vụ** được giao.", "Điều 7 khoản 3: tích cực **tham mưu**, thể hiện rõ **chính kiến**.", "Điều 7 khoản 4 cấm: xúc phạm, mất đoàn kết; **thờ ơ, né tránh hoặc che giấu** sai phạm của cán bộ quản lý."], "bang": [{"tieu_de": "Điều 6 (đồng nghiệp) và Điều 7 (cán bộ quản lý)", "cot": ["Tiêu chí", "Điều 6", "Điều 7"], "dong": [["Số khoản", "3 khoản", "4 khoản"], ["Khoản 'không được'", "Khoản 3", "Khoản 4"], ["Xúc phạm, mất đoàn kết", "Có (xúc phạm, chia rẽ, gây mất đoàn kết)", "Có (xúc phạm, gây mất đoàn kết)"], ["Đùn đẩy trách nhiệm; công khai thông tin trái quy định", "Có", "Không có"], ["Thờ ơ, né tránh hoặc che giấu sai phạm", "Không (chỉ né tránh, đùn đẩy)", "Có"], ["Tham mưu, thể hiện chính kiến", "Không", "Có (khoản 3)"]]}], "vidu": [{"tinh_huong": "Trong họp hội đồng, cô Hạnh thấy lịch kiểm tra do phó hiệu trưởng xếp bị chồng chéo, đã trình bày ý kiến có dẫn chứng và đề xuất phương án.", "ket_luan": "→ Đúng. Điều 7 khoản 3: tham mưu và thể hiện rõ chính kiến theo chức năng, nhiệm vụ; không xúc phạm ai."}, {"tinh_huong": "Thầy Đức chụp màn hình hoàn cảnh gia đình riêng của cô Trang rồi gửi vào nhóm Zalo của các thầy cô trong trường.", "ket_luan": "→ Vi phạm. Điều 6 khoản 3 cấm công khai thông tin của đồng nghiệp trái quy định."}, {"tinh_huong": "Sau buổi họp phân công, cô Yến đăng Facebook những lời chê bai, xúc phạm hiệu trưởng.", "ket_luan": "→ Vi phạm. Điều 7 khoản 4 cấm xúc phạm, gây mất đoàn kết nội bộ; Điều 4 khoản 2 yêu cầu có trách nhiệm trên không gian mạng."}, {"tinh_huong": "Phần mềm nhập điểm bị sai do cô Quỳnh nhập nhầm, nhưng cô nói với tổ trưởng là lỗi của cô Ly.", "ket_luan": "→ Vi phạm. Điều 6 khoản 3 cấm né tránh, đùn đẩy trách nhiệm."}, {"tinh_huong": "Thầy Tín biết phó hiệu trưởng có sai phạm trong một khoản thu nhưng im lặng cho yên chuyện.", "ket_luan": "→ Vi phạm. Điều 7 khoản 4 cấm thờ ơ, né tránh hoặc che giấu hành vi sai phạm của cán bộ quản lý."}], "nho": ["Điều 6 'ba không': **X**úc phạm/chia rẽ – **Đ**ùn đẩy – **C**ông khai thông tin (X-Đ-C). Điều 7 không có 'đùn đẩy', 'công khai'.", "Điều 7: Chấp hành – Cầu thị – Tham mưu (K1-K2-K3), còn K4 là các điều cấm.", "Góp ý thì 'thẳng thắn, xây dựng', không 'xúc phạm' và cũng không 'im lặng né tránh'."]}, {"id": "L7-4", "ten": "Thông tư 03/2026: ứng xử với cha mẹ người học, cộng đồng và trên không gian mạng (Điều 8, 9)", "tomtat": ["Điều 8 khoản 1: sẵn sàng hợp tác, hỗ trợ, chia sẻ về hoạt động giảng dạy, giáo dục vì sự tiến bộ của người học.", "Điều 8 khoản 2: chủ động, kịp thời cung cấp, trao đổi thông tin **trung thực** về người học; chương trình, kế hoạch giảng dạy, giáo dục **khi được sự đồng ý của cấp quản lý theo thẩm quyền**.", "Điều 8 khoản 3: khuyến khích, tạo điều kiện để cha mẹ tham gia hoạt động giáo dục.", "Điều 8 khoản 4 (không được): **xúc phạm, áp đặt, vụ lợi, ép buộc** cha mẹ tham gia hoạt động **trái quy định của Nhà nước** và các hoạt động mang tính chất **tự nguyện**.", "Điều 9 khoản 1: chấp hành nội quy, quy tắc nơi công cộng; tôn trọng không gian chung; ứng xử văn minh, lịch thiệp; bảo vệ cảnh quan, môi trường.", "Điều 9 khoản 2: tự nguyện, tích cực hoạt động xã hội; bảo vệ môi trường; từ thiện, nhân đạo; xây dựng xã hội học tập, văn hóa đọc, khuyến học, khuyến tài.", "Điều 9 khoản 3: lan tỏa giá trị nhân văn, việc tốt; chủ động truyền thông về giáo dục, **chống tin giả** liên quan lĩnh vực giáo dục và nhà giáo trên **kênh mạng xã hội chính thống**; công khai, minh bạch thông tin khi tham gia hoạt động xã hội.", "Điều 9 khoản 4 (không được): tham gia, ủng hộ hoạt động **mê tín dị đoan** và hoạt động gây **chia rẽ khối đại đoàn kết toàn dân tộc**.", "Ứng xử trên không gian mạng thể hiện ở **Điều 4 khoản 2** (có trách nhiệm khi sử dụng thông tin và ứng xử trên không gian mạng) và **Điều 9 khoản 3** (chống tin giả, kênh mạng xã hội chính thống); không có điều riêng tên 'Ứng xử trên không gian mạng' trong nhóm Điều 4–9.", "Thông tin của người học: Điều 5 khoản 4 cấm công khai trái quy định; trao đổi với cha mẹ phải trung thực (Điều 8 khoản 2)."], "bay": ["⚠ Điều 8 khoản 4: cấm ép buộc cha mẹ tham gia hoạt động **trái quy định của Nhà nước** VÀ hoạt động **tự nguyện**; còn Điều 5 khoản 4 là ép buộc **người học** tham gia hoạt động tự nguyện.", "⚠ Điều 9 khoản 3: chống tin giả trên kênh mạng xã hội **chính thống** (không phải mọi kênh).", "⚠ Điều 8 khoản 2: thông tin về chương trình, kế hoạch giảng dạy cần **sự đồng ý của cấp quản lý theo thẩm quyền**; thông tin về người học phải **trung thực**.", "⚠ 'Mê tín dị đoan' ≠ lễ hội, tín ngưỡng thông thường; khoản 4 Điều 9 cấm 'tham gia, ủng hộ' hoạt động mê tín dị đoan."], "cauhoi": [{"t": "s", "q": "Theo Điều 8 khoản 2 Thông tư 03/2026/TT-BGDĐT, nhà giáo cung cấp thông tin về chương trình, kế hoạch giảng dạy, giáo dục khi nào?", "o": ["Khi cha mẹ người học có văn bản yêu cầu", "Khi được sự đồng ý của cấp quản lý theo thẩm quyền", "Khi được tổ trưởng chuyên môn đồng ý", "Bất cứ lúc nào, không cần điều kiện"], "a": [1], "e": "Khoản 2: chương trình, kế hoạch giảng dạy, giáo dục chỉ cung cấp khi được sự đồng ý của cấp quản lý theo thẩm quyền.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 2"}, {"t": "s", "q": "Phát biểu nào đúng về các hành vi nhà giáo không được làm với cha mẹ người học theo Điều 8 khoản 4 Thông tư 03/2026/TT-BGDĐT?", "o": ["Không xúc phạm, hách dịch, vụ lợi, ép buộc cha mẹ", "Không xúc phạm, áp đặt, gây phiền hà, ép buộc cha mẹ", "Không phân biệt đối xử, áp đặt, vụ lợi, ép buộc cha mẹ", "Không xúc phạm, áp đặt, vụ lợi, ép buộc cha mẹ"], "a": [3], "e": "Điều 8 khoản 4: xúc phạm, áp đặt, vụ lợi, ép buộc. 'Hách dịch', 'gây phiền hà' là cách nói của TT06/2019 (cán bộ quản lý).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 4"}, {"t": "s", "q": "Điều 8 khoản 3 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo đối với việc tham gia hoạt động giáo dục của cha mẹ người học như thế nào?", "o": ["Khuyến khích, tạo điều kiện", "Bắt buộc cha mẹ tham gia mọi hoạt động", "Chỉ mời khi cần đóng góp", "Chỉ thông báo, không cần tạo điều kiện"], "a": [0], "e": "Khoản 3: khuyến khích, tạo điều kiện để cha mẹ tham gia hoạt động giáo dục.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 3"}, {"t": "s", "q": "Điều 9 khoản 3 Thông tư 03/2026/TT-BGDĐT yêu cầu nhà giáo chống tin giả trên kênh nào?", "o": ["Mọi nền tảng mạng xã hội", "Kênh mạng xã hội cá nhân của nhà giáo", "Kênh mạng xã hội chính thống", "Kênh thông tin của cơ quan báo chí"], "a": [2], "e": "Khoản 3: chủ động truyền thông, chống tin giả liên quan lĩnh vực giáo dục và nhà giáo trên kênh mạng xã hội chính thống.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 9 khoản 3"}, {"t": "s", "q": "Điều 9 khoản 4 Thông tư 03/2026/TT-BGDĐT cấm nhà giáo tham gia, ủng hộ hoạt động nào?", "o": ["Lễ hội truyền thống và hoạt động tôn giáo", "Từ thiện, nhân đạo và hoạt động khuyến học", "Mê tín dị đoan và hoạt động gây chia rẽ khối đại đoàn kết toàn dân tộc", "Hoạt động xã hội do tổ chức không chính thống tổ chức"], "a": [2], "e": "Khoản 4: mê tín dị đoan và hoạt động gây chia rẽ khối đại đoàn kết toàn dân tộc. Lễ hội truyền thống không bị cấm.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 9 khoản 4"}, {"t": "s", "q": "Trong các Điều 4–9 Thông tư 03/2026/TT-BGDĐT, nội dung về ứng xử trên không gian mạng nằm ở đâu?", "o": ["Điều 4 khoản 2 và Điều 9 khoản 3", "Điều 5 khoản 3 và Điều 9 khoản 1", "Điều 6 khoản 1 và Điều 8 khoản 2", "Điều 7 khoản 3 và Điều 9 khoản 4"], "a": [0], "e": "Điều 4 khoản 2 (trách nhiệm khi sử dụng thông tin, ứng xử trên không gian mạng) và Điều 9 khoản 3 (chống tin giả, kênh mạng xã hội chính thống).", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 2; Điều 9 khoản 3"}, {"t": "s", "q": "Phụ huynh nhắn tin xin điểm số và nhận xét chi tiết về cả các bạn khác trong lớp. Cách ứng xử nào của giáo viên phù hợp với Thông tư 03/2026/TT-BGDĐT?", "o": ["Gửi bảng điểm cả lớp để phụ huynh tham khảo", "Từ chối mọi trao đổi với phụ huynh", "Nhận xét tùy ý, nhẹ nhàng cho phụ huynh yên tâm", "Trao đổi thông tin trung thực về chính học sinh của phụ huynh, không công khai thông tin học sinh khác trái quy định"], "a": [3], "e": "Điều 8 khoản 2: thông tin về người học phải trung thực; Điều 5 khoản 4: không công khai thông tin người học trái quy định.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 2; Điều 5 khoản 4"}, {"t": "s", "q": "Giáo viên mời phụ huynh cho con học thêm tại nhà mình và ngầm ám chỉ học sinh không học sẽ bị đánh giá thấp. Hành vi nào sau đây KHÔNG thuộc các quy định bị vi phạm theo Thông tư 03/2026/TT-BGDĐT?", "o": ["Lợi dụng chức danh nhà giáo để tư lợi (Điều 4 khoản 6)", "Tham gia hoạt động mê tín dị đoan (Điều 9 khoản 4)", "Ép buộc, vụ lợi đối với cha mẹ (Điều 8 khoản 4)", "Đánh giá không đúng thực chất, trù dập người học (Điều 5)"], "a": [1], "e": "Hành vi trên liên quan tư lợi, ép buộc/vụ lợi với cha mẹ, trù dập/đánh giá sai thực chất; không liên quan mê tín dị đoan.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 4 khoản 6; Điều 5; Điều 8 khoản 4"}, {"t": "s", "q": "Giáo viên nhận xét học lực của học sinh sai sự thật để cha mẹ yên tâm. Hành vi này vi phạm yêu cầu nào?", "o": ["Thông tin trao đổi với cha mẹ phải trung thực (Điều 8 khoản 2)", "Thông tin phải được cấp quản lý đồng ý trước khi trao đổi", "Không được trao đổi bằng tin nhắn", "Chỉ được trao đổi tại nhà trường"], "a": [0], "e": "Điều 8 khoản 2 yêu cầu thông tin về người học phải trung thực.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 2"}, {"t": "s", "q": "Khi vận động từ thiện hoặc tham gia hoạt động xã hội, nhà giáo phải thực hiện yêu cầu nào theo Điều 9 khoản 3 Thông tư 03/2026/TT-BGDĐT?", "o": ["Giữ kín thông tin để tránh phô trương", "Chỉ công khai khi có yêu cầu của cơ quan", "Công khai, minh bạch thông tin", "Công khai trong nhóm bạn bè"], "a": [2], "e": "Khoản 3: công khai, minh bạch thông tin khi tham gia hoạt động xã k": 0}, {"t": "f", "q": "Nhà giáo ứng xử với cộng đồng được quy định tại Điều ____ Thông tư 03/2026/TT-BGDĐT.", "a": [["9", "chín"]], "e": "Điều 9.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 9", "o": [["8"], ["9"], ["10"], ["7"]], "k": 1}, {"t": "f", "q": "Nhà giáo không xúc phạm, áp đặt, ____, ép buộc cha mẹ tham gia hoạt động trái quy định của Nhà nước và hoạt động mang tính chất tự nguyện.", "a": [["vụ lợi"]], "e": "Điều 8 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 4", "o": [["khuyến khích"], ["gợi ý"], ["thuyết phục"], ["vụ lợi"]], "k": 3}, {"t": "f", "q": "Nhà giáo cung cấp, trao đổi thông tin ____ về người học.", "a": [["trung thực"]], "e": "Điều 8 khoản 2.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 2", "o": [["chủ quan"], ["trung thực"], ["một chiều"], ["bí mật"]], "k": 1}, {"t": "f", "q": "Nhà giáo cung cấp chương trình, kế hoạch giảng dạy khi được sự đồng ý của cấp ____ theo thẩm quyền.", "a": [["quản lý"]], "e": "Điều 8 khoản 2.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 8 khoản 2", "o": [["quản lý"], ["trên"], ["địa phương"], ["cao nhất"]], "k": 0}, {"t": "f", "q": "Nhà giáo chủ động truyền thông về giáo dục, chống ____ liên quan lĩnh vực giáo dục và nhà giáo trên kênh mạng xã hội chính thống.", "a": [["tin giả"]], "e": "Điều 9 khoản 3.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 9 khoản 3", "o": [["tin giả"], ["tin vui"], ["quảng cáo"], ["tin đồn"]], "k": 0}, {"t": "f", "q": "Nhà giáo không tham gia, ủng hộ hoạt động ____ dị đoan.", "a": [["mê tín"]], "e": "Điều 9 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 9 khoản 4", "o": [["mê tín"], ["mê muội"], ["tín ngưỡng"], ["mê hoặc"]], "k": 0}, {"t": "f", "q": "Nhà giáo không tham gia, ủng hộ hoạt động gây chia rẽ khối đại ____ toàn dân tộc.", "a": [["đoàn kết"]], "e": "Điều 9 khoản 4.", "r": "Thông tư 03/2026/TT-BGDĐT Điều 9 khoản 4", "o": [["hòa hợp"], ["thống nhất"], ["hòa giải"], ["đoàn kết"]], "k": 3}], "ynho": ["Điều **8** = cha mẹ/người giám hộ; Điều **9** = cộng đồng.", "Thông tin về người học phải **trung thực**; chương trình, kế hoạch giảng dạy cần **sự đồng ý của cấp quản lý**.", "Điều 8 khoản 4 cấm **xúc phạm, áp đặt, vụ lợi, ép buộc** cha mẹ.", "Điều 9 khoản 3: **chống tin giả** trên kênh mạng xã hội **chính thống**.", "Điều 9 khoản 4 cấm tham gia, ủng hộ **mê tín dị đoan** và hoạt động **chia rẽ** khối đại đoàn kết toàn dân tộc."], "bang": [{"tieu_de": "Điều 8 và Điều 9", "cot": ["Điều/khoản", "Nội dung", "Từ khoá"], "dong": [["8 K1", "Hợp tác, hỗ trợ, chia sẻ với cha mẹ", "Vì sự tiến bộ của người học"], ["8 K2", "Cung cấp, trao đổi thông tin", "Trung thực; kế hoạch giảng dạy cần cấp quản lý đồng ý"], ["8 K3", "Tạo điều kiện cha mẹ tham gia", "Hoạt động giáo dục"], ["8 K4", "Không được làm", "Xúc phạm, áp đặt, vụ lợi, ép buộc"], ["9 K1-2", "Nơi công cộng; hoạt động xã hội", "Văn minh, từ thiện, khuyến học"], ["9 K3", "Truyền thông, mạng xã hội", "Chống tin giả; kênh chính thống"], ["9 K4", "Không được làm", "Mê tín dị đoan; chia rẽ"]]}, {"tieu_de": "Ứng xử trên không gian mạng nằm rải rác ở đâu", "cot": ["Điều", "Nội dung"], "dong": [["Điều 4 khoản 2", "Có trách nhiệm khi sử dụng thông tin và ứng xử trên không gian mạng"], ["Điều 9 khoản 3", "Chống tin giả, kênh mạng xã hội chính thống"], ["Điều 5 khoản 4", "Không công khai thông tin người học trái quy định"], ["Điều 6 khoản 3", "Không công khai thông tin đồng nghiệp trái quy định"], ["Điều 8 khoản 2", "Thông tin cho cha mẹ phải trung thực"]]}], "vidu": [{"tinh_huong": "Cô Mai nhắn riêng cho phụ huynh em Bình, nêu đúng thực tế học lực của em và đề xuất cách phối hợp hỗ trợ.", "ket_luan": "→ Đúng. Điều 8 khoản 2: chủ động, kịp thời trao đổi thông tin trung thực về người học."}, {"tinh_huong": "Thầy Quân nhắn vào nhóm Zalo lớp: phụ huynh nào không tham gia buổi quyên góp tự nguyện thì cháu sẽ bị nhắc tên.", "ket_luan": "→ Vi phạm. Điều 8 khoản 4 cấm ép buộc cha mẹ tham gia hoạt động mang tính chất tự nguyện."}, {"tinh_huong": "Cô Hoa giới thiệu phụ huynh mua sản phẩm của người quen để nhận hoa hồng.", "ket_luan": "→ Vi phạm. Điều 8 khoản 4 cấm vụ lợi đối với cha mẹ; Điều 4 khoản 6 cấm tư lợi."}, {"tinh_huong": "Thầy Đạt thấy tin giả về lịch thi lan trên mạng nên đăng bài đính chính, dẫn thông báo của cơ quan giáo dục trên kênh chính thống.", "ket_luan": "→ Đúng. Điều 9 khoản 3: chủ động truyền thông, chống tin giả trên kênh mạng xã hội chính thống."}, {"tinh_huong": "Phụ huynh xin bản kế hoạch dạy học cả năm của trường; thầy Long xin ý kiến lãnh đạo nhà trường trước khi gửi.", "ket_luan": "→ Đúng. Điều 8 khoản 2: cung cấp chương trình, kế hoạch giảng dạy khi được sự đồng ý của cấp quản lý theo thẩm quyền."}], "nho": ["Điều 8 khoản 4 = 'X-A-V-É': **X**úc phạm – **Á**p đặt – **V**ụ lợi – **É**p buộc (cha mẹ).", "Chống tin giả = 'kênh chính thống' (không phải mọi kênh).", "Thông tin: về **người học** thì 'trung thực'; về **kế hoạch, chương trình** thì 'cấp quản lý đồng ý'.", "Không có 'Điều ứng xử không gian mạng' riêng: nhớ ba chỗ chính Điều 4 K2, Điều 9 K3, Điều 5-6 (công khai thông tin)."]}, {"id": "L7-5", "ten": "Thông tư 06/2019: phạm vi, mục đích, nguyên tắc và ứng xử chung (Điều 1–4, 14)", "tomtat": ["TT 06/2019/TT-BGDĐT ký **12/4/2019**, hiệu lực **28/5/2019** (Điều 14 khoản 1); gồm **3 chương, 14 điều**.", "Phạm vi: quy tắc ứng xử trong cơ sở giáo dục **mầm non, phổ thông, thường xuyên**; áp dụng với cán bộ quản lý, giáo viên, nhân viên, **người học, cha mẹ người học**.", "Điều 6 (ứng xử của giáo viên) **hết hiệu lực từ 30/01/2026** do TT 03/2026 thay thế; các điều còn lại vẫn là văn bản gốc.", "Điều 2 (mục đích): ứng xử theo chuẩn mực đạo đức, thuần phong mỹ tục; ngăn ngừa, xử lý kịp thời hành vi tiêu cực, thiếu tính giáo dục; xây dựng văn hóa học đường, môi trường an toàn, lành mạnh, thân thiện, phòng chống bạo lực học đường.", "Điều 3 khoản 2: thể hiện **5 giá trị cốt lõi**: **nhân ái, tôn trọng, trách nhiệm, hợp tác, trung thực**.", "Điều 3 khoản 5: xây dựng, sửa đổi Bộ Quy tắc phải thảo luận dân chủ, khách quan, công khai và được **đồng thuận của đa số thành viên**.", "Điều 4 (ứng xử chung) có **9 khoản**: K1 thực hiện quy định pháp luật về quyền, nghĩa vụ; K2 lối sống lành mạnh, tích cực; K3 bảo vệ cảnh quan, môi trường xanh, sạch, đẹp.", "Điều 4 khoản 4 (trang phục): cán bộ quản lý, giáo viên **lịch sự, phù hợp**; nhân viên **phù hợp tính chất công việc**; người học **sạch sẽ, gọn gàng**; cha mẹ và khách phù hợp môi trường giáo dục. Khoản 5: không trang phục gây phản cảm.", "Điều 4 khoản 6: không hút thuốc, sử dụng đồ uống có cồn, chất cấm **trong cơ sở giáo dục**; không tham gia tệ nạn xã hội.", "Điều 4 khoản 7: không dùng **mạng xã hội** để phát tán, tuyên truyền, bình luận thông tin, hình ảnh trái thuần phong mỹ tục, trái đường lối, chính sách, pháp luật hoặc ảnh hưởng xấu môi trường giáo dục.", "Điều 4 khoản 8: không gian lận, dối trá, vu khống, gây hiềm khích, quấy rối, ép buộc, đe dọa, bạo lực với người khác; khoản 9: không làm tổn hại sức khỏe, danh dự, nhân phẩm của bản thân, người khác và uy tín tập thể."], "bay": ["⚠ TT06: cấm hút thuốc, rượu bia, chất cấm **'trong cơ sở giáo dục'** ≠ TT03: **'khi thực hiện nhiệm vụ'**.", "⚠ 5 giá trị cốt lõi: nhân ái, tôn trọng, trách nhiệm, hợp tác, **trung thực** (không có 'kỷ luật', 'sáng tạo', 'đoàn kết').", "⚠ Xây dựng Bộ Quy tắc: 'đồng thuận của **đa số** thành viên' (không phải toàn thể, không phải hiệu trưởng tự quyết).", "⚠ Hiệu lực 28/5/2019 (≠ ngày ký 12/4/2019, ≠ ngày đăng Công báo 03/5/2019); chỉ **Điều 6** hết hiệu lực từ 30/01/2026."], "cauhoi": [{"t": "s", "q": "Thông tư 06/2019/TT-BGDĐT có hiệu lực thi hành từ ngày nào?", "o": ["12/4/2019", "28/5/2019", "03/5/2019", "30/01/2026"], "a": [1], "e": "Điều 14 khoản 1: hiệu lực 28/5/2019. 12/4/2019 là ngày ký; 03/5/2019 là ngày đăng Công báo; 30/01/2026 là ngày Điều 6 hết hiệu lực.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 14 khoản 1"}, {"t": "s", "q": "Thông tư 06/2019/TT-BGDĐT gồm bao nhiêu chương, bao nhiêu điều?", "o": ["3 chương, 15 điều", "2 chương, 14 điều", "4 chương, 14 điều", "3 chương, 14 điều"], "a": [3], "e": "TT06/2019 gồm 3 chương, 14 điều (TT03/2026 là 3 chương, 15 điều).", "r": "Thông tư 06/2019/TT-BGDĐT"}, {"t": "s", "q": "Thông tư 06/2019/TT-BGDĐT quy định quy tắc ứng xử trong loại cơ sở giáo dục nào?", "o": ["Mầm non, phổ thông, thường xuyên", "Mầm non, phổ thông, đại học", "Chỉ phổ thông", "Phổ thông, thường xuyên, nghề nghiệp"], "a": [0], "e": "Điều 1: cơ sở giáo dục mầm non, phổ thông, thường xuyên.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 1"}, {"t": "s", "q": "Đối tượng áp dụng của Thông tư 06/2019/TT-BGDĐT là ai?", "o": ["Chỉ cán bộ quản lý và giáo viên", "Giáo viên, người học và cơ quan quản lý giáo dục các cấp", "Cán bộ quản lý, giáo viên, nhân viên, người học và cha mẹ người học", "Cán bộ quản lý, giáo viên, nhân viên và học viên đại học"], "a": [2], "e": "Điều 1: gồm cả người học, cha mẹ người học (khác TT03/2026 chỉ dành cho nhà giáo).", "r": "Thông tư 06/2019/TT-BGDĐT Điều 1"}, {"t": "s", "q": "Năm giá trị cốt lõi cần thể hiện trong Bộ Quy tắc ứng xử theo Thông tư 06/2019/TT-BGDĐT là gì?", "o": ["Nhân ái, tôn trọng, kỷ luật, hợp tác, trung thực", "Nhân ái, đoàn kết, trách nhiệm, hợp tác, trung thực", "Nhân ái, tôn trọng, trách nhiệm, hợp tác, trung thực", "Nhân ái, tôn trọng, trách nhiệm, sáng tạo, trung thực"], "a": [2], "e": "Điều 3 khoản 2: nhân ái, tôn trọng, trách nhiệm, hợp tác, trung thực. Các đáp án nhiễu đổi 1 giá trị.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 3 khoản 2"}, {"t": "s", "q": "Việc xây dựng, sửa đổi Bộ Quy tắc ứng xử của cơ sở giáo dục phải được thực hiện thế nào theo Thông tư 06/2019/TT-BGDĐT?", "o": ["Thảo luận dân chủ, khách quan, công khai và được đồng thuận của đa số thành viên", "Do thủ trưởng quyết định sau khi lấy ý kiến", "Được toàn thể thành viên đồng thuận 100%", "Do sở giáo dục và đào tạo phê duyệt"], "a": [0], "e": "Điều 3 khoản 5: đồng thuận của đa số thành viên.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 3 khoản 5"}, {"t": "s", "q": "Theo Thông tư 06/2019/TT-BGDĐT (Điều 4 khoản 6), cấm hút thuốc, sử dụng đồ uống có cồn, chất cấm ở đâu?", "o": ["Khi thực hiện nhiệm vụ", "Trong giờ lên lớp", "Ở mọi nơi, mọi lúc", "Trong cơ sở giáo dục"], "a": [3], "e": "TT06: 'trong cơ sở giáo dục'. Cụm 'khi thực hiện nhiệm vụ' là của TT03/2026.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4 khoản 6"}, {"t": "s", "q": "Quy tắc ứng xử chung trong Thông tư 06/2019/TT-BGDĐT (Điều 4) gồm bao nhiêu khoản?", "o": ["6 khoản", "9 khoản", "8 khoản", "10 khoản"], "a": [1], "e": "Điều 4 gồm 9 khoản.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4"}, {"t": "s", "q": "Phát biểu nào đúng về quy định mạng xã hội tại Điều 4 khoản 7 Thông tư 06/2019/TT-BGDĐT?", "o": ["Không dùng mạng xã hội để phát tán, tuyên truyền, bình luận thông tin, hình ảnh trái thuần phong mỹ tục, trái đường lối, chính sách, pháp luật hoặc ảnh hưởng xấu môi trường giáo dục", "Không được sử dụng mạng xã hội trong cơ sở giáo dục dưới mọi hình thức", "Chỉ cấm đăng thông tin trái pháp luật, không cấm hình ảnh", "Chỉ áp dụng với giáo viên, không áp dụng với người học"], "a": [0], "e": "Điều 4 khoản 7 cấm dùng mạng xã hội để phát tán... thông tin, hình ảnh trái thuần phong mỹ tục, đường lối, chính sách, pháp luật, hoặc ảnh hưởng xấu; không cấm sử dụng mạng xã hội nói chung và áp dụng với mọi đối tượng.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4 khoản 7"}, {"t": "s", "q": "Theo Điều 4 khoản 4 Thông tư 06/2019/TT-BGDĐT, yêu cầu trang phục nào đúng?", "o": ["Giáo viên: phù hợp tính chất công việc; người học: lịch sự", "Nhân viên: lịch sự, phù hợp; người học: phù hợp tính chất công việc", "Cán bộ quản lý, giáo viên: lịch sự, phù hợp; người học: sạch sẽ, gọn gàng", "Cha mẹ và khách: sạch sẽ, gọn gàng; người học: lịch sự"], "a": [2], "e": "Khoản 4: CBQL, giáo viên lịch sự, phù hợp; nhân viên phù hợp tính chất công việc; người học sạch sẽ, gọn gàng; cha mẹ, khách phù hợp môi trường giáo dục.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4 khoản 4"}, {"t": "s", "q": "Điều nào của Thông tư 06/2019/TT-BGDĐT đã hết hiệu lực từ 30/01/2026 do Thông tư 03/2026/TT-BGDĐT thay thế?", "o": ["Điều 5", "Điều 6", "Điều 8", "Toàn bộ Thông tư"], "a": [1], "e": "Chỉ Điều 6 (ứng xử của giáo viên) hết hiệu lực; Điều 5 (cán bộ quản lý), Điều 8 (người học)... vẫn còn.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 6; Thông tư 03/2026/TT-BGDĐT"}, {"t": "s", "q": "Mục đích của Thông tư 06/2019/TT-BGDĐT bao gồm nội dung nào sau đây?", "o": ["Quy định mức xử phạt vi phạm hành chính trong cơ sở giáo dục", "Chỉ điều chỉnh ứng xử của giáo viên", "Thay thế Điều lệ trường phổ thông", "Ngăn ngừa, xử lý kịp thời hành vi tiêu cực, thiếu tính giáo dục"], "a": [3], "e": "Điều 2: điều chỉnh cách ứng xử theo chuẩn mực; ngăn ngừa, xử lý kịp thời hành vi tiêu cực, thiếu tính giáo dục; xây dựng văn hóa học đường.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 2"}, {"t": "m", "q": "Những giá trị nào thuộc 5 giá trị cốt lõi theo Điều 3 khoản 2 Thông tư 06/2019/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Nhân ái", "Sáng tạo", "Hợp tác", "Đoàn kết", "Trung thực"], "a": [0, 2, 4], "e": "5 giá trị: nhân ái, tôn trọng, trách nhiệm, hợp tác, trung thực. 'Sáng tạo', 'đoàn kết' không có.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 3 khoản 2"}, {"t": "m", "q": "Điều 4 khoản 8 Thông tư 06/2019/TT-BGDĐT cấm những hành vi nào đối với người khác? (chọn tất cả đáp án đúng)", "o": ["Phê bình xây dựng", "Gian lận, dối trá", "Vu khống, gây hiềm khích", "Quan tâm, chia sẻ, giúp đỡ", "Quấy rối, đe dọa, bạo lực"], "a": [1, 2, 4], "e": "Khoản 8: không gian lận, dối trá, vu khống, gây hiềm khích, quấy rối, ép buộc, đe dọa, bạo lực. Quan tâm, chia sẻ là khoản 2.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4 khoản 8"}, {"t": "m", "q": "Phát biểu nào đúng về Điều 4 Thông tư 06/2019/TT-BGDĐT? (chọn tất cả đáp án đúng)", "o": ["Khoản 6 chỉ cấm hút thuốc khi thực hiện nhiệm vụ", "Khoản 9 cấm làm tổn hại sức khỏe, danh dự, nhân phẩm của bản thân, người khác và uy tín tập thể", "Khoản 5 cấm sử dụng trang phục gây phản cảm", "Khoản 6 cấm hút thuốc, đồ uống có cồn, chất cấm trong cơ sở giáo dục", "Khoản 4 yêu cầu mọi đối tượng ": 3}, {"t": "f", "q": "Thông tư 06/2019/TT-BGDĐT cấm hút thuốc, sử dụng đồ uống có cồn, chất cấm ____ cơ sở giáo dục.", "a": [["trong"]], "e": "Điều 4 khoản 6: 'trong cơ sở giáo dục'.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4 khoản 6", "o": [["ngoài"], ["gần"], ["trong"], ["xung quanh"]], "k": 2}, {"t": "f", "q": "Xây dựng, sửa đổi Bộ Quy tắc phải được đồng thuận của đa số ____.", "a": [["thành viên"]], "e": "Điều 3 khoản 5.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 3 khoản 5", "o": [["thành viên"], ["học sinh"], ["giáo viên"], ["cán bộ quản lý"]], "k": 0}, {"t": "f", "q": "Điều 4 khoản 7 cấm dùng ____ để phát tán, tuyên truyền, bình luận thông tin, hình ảnh trái thuần phong mỹ tục.", "a": [["mạng xã hội"]], "e": "Điều 4 khoản 7.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4 khoản 7", "o": [["báo chí"], ["tin nhắn"], ["mạng xã hội"], ["điện thoại"]], "k": 2}, {"t": "f", "q": "Quy tắc ứng xử chung của Thông tư 06/2019/TT-BGDĐT được quy định tại Điều ____.", "a": [["4", "bốn"]], "e": "Điều 4.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 4", "o": [["3"], ["5"], ["6"], ["4"]], "k": 3}, {"t": "f", "q": "Điều ____ của Thông tư 06/2019/TT-BGDĐT (ứng xử của giáo viên) hết hiệu lực từ 30/01/2026.", "a": [["6", "sáu"]], "e": "Điều 6 bị thay thế bởi TT03/2026.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 6", "o": [["6"], ["5"], ["7"], ["8"]], "k": 0}, {"t": "f", "q": "Thông tư 06/2019/TT-BGDĐT nhằm ngăn ngừa, xử lý kịp thời hành vi tiêu cực, thiếu tính ____.", "a": [["giáo dục"]], "e": "Điều 2.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 2", "o": [["khoa học"], ["pháp lý"], ["kỷ luật"], ["giáo dục"]], "k": 3}], "ynho": ["TT **06/2019**: ký **12/4/2019**, hiệu lực **28/5/2019**; **3 chương, 14 điều**.", "**Điều 6** hết hiệu lực từ **30/01/2026** (do TT03/2026 thay thế).", "**5 giá trị cốt lõi**: nhân ái, tôn trọng, trách nhiệm, hợp tác, trung thực.", "Điều 4 có **9 khoản**; cấm hút thuốc, cồn, chất cấm **trong cơ sở giáo dục**.", "Xây dựng, sửa đổi Bộ Quy tắc cần **đồng thuận của đa số** thành viên."], "bang": [{"tieu_de": "Điều 4 TT06/2019 (9 khoản)", "cot": ["Khoản", "Nội dung"], "dong": [["1", "Thực hiện quy định pháp luật về quyền, nghĩa vụ"], ["2", "Lối sống lành mạnh, tích cực"], ["3", "Bảo vệ cảnh quan, môi trường xanh, sạch, đẹp"], ["4-5", "Trang phục phù hợp (K4); không trang phục phản cảm (K5)"], ["6", "Không hút thuốc, đồ uống có cồn, chất cấm trong cơ sở giáo dục; không tệ nạn xã hội"], ["7", "Không dùng mạng xã hội phát tán thông tin, hình ảnh trái thuần phong mỹ tục, pháp luật"], ["8", "Không gian lận, dối trá, vu khống, quấy rối, ép buộc, đe dọa, bạo lực"], ["9", "Không làm tổn hại sức khỏe, danh dự, nhân phẩm; uy tín tập thể"]]}, {"tieu_de": "Mốc và con số của TT06/2019", "cot": ["Nội dung", "Con số"], "dong": [["Ngày ký", "12/4/2019"], ["Hiệu lực (Điều 14 khoản 1)", "28/5/2019"], ["Công báo (không phải hiệu lực)", "03/5/2019"], ["Quy mô", "3 chương, 14 điều"], ["Điều hết hiệu lực", "Điều 6, từ 30/01/2026"], ["Giá trị cốt lõi", "5 (nhân ái, tôn trọng, trách nhiệm, hợp tác, trung thực)"]]}], "vidu": [{"tinh_huong": "Thầy Dũng mặc áo ba lỗ, quần đùi đứng lớp dạy Tin học.", "ket_luan": "→ Không đúng. Điều 4 TT06 khoản 4 yêu cầu giáo viên trang phục lịch sự, phù hợp; khoản 5 cấm trang phục gây phản cảm."}, {"tinh_huong": "Thầy Kiên đăng Facebook kèm hình ảnh trái thuần phong mỹ tục và bình luận về một học sinh của trường.", "ket_luan": "→ Vi phạm. Điều 4 khoản 7 cấm dùng mạng xã hội phát tán, bình luận thông tin, hình ảnh trái thuần phong mỹ tục."}, {"tinh_huong": "Thầy Phong hút thuốc trong phòng bộ môn sau khi học sinh đã ra về.", "ket_luan": "→ Vi phạm theo TT06. Điều 4 khoản 6 cấm hút thuốc trong cơ sở giáo dục (phạm vi rộng hơn 'khi thực hiện nhiệm vụ' của TT03)."}, {"tinh_huong": "Hiệu trưởng tự ký ban hành Bộ Quy tắc của trường mà không tổ chức thảo luận, lấy ý kiến thành viên.", "ket_luan": "→ Chưa đúng. Điều 3 khoản 5: phải thảo luận dân chủ, khách quan, công khai và được đồng thuận của đa số thành viên."}, {"tinh_huong": "Cô Nga hỏi: Điều 6 TT06/2019 về ứng xử của giáo viên còn hiệu lực không?", "ket_luan": "→ Không. Điều 6 hết hiệu lực từ 30/01/2026, đã được TT03/2026 thay thế; các điều khác vẫn còn là văn bản gốc."}], "nho": ["5 giá trị cốt lõi: **N-T-T-H-T** = Nhân ái – Tôn trọng – Trách nhiệm – Hợp tác – Trung thực.", "Mốc ngày: ký **12/4** → Công báo 03/5 → hiệu lực **28/5/2019** (mốc cần nhớ là 28/5).", "TT06 'trong cơ sở' ≠ TT03 'khi thực hiện nhiệm vụ'.", "Bộ Quy tắc: 'đa số', không phải 'toàn thể', không phải hiệu trưởng tự quyết."]}, {"id": "L7-6", "ten": "Thông tư 06/2019: ứng xử của cán bộ quản lý, nhân viên, người học, cha mẹ, khách; tổ chức thực hiện; so sánh với TT03/2026", "tomtat": ["Điều 5 (cán bộ quản lý): K1 với **người học**; K2 với **giáo viên, nhân viên**; K3 với **cha mẹ người học**; K4 với **khách** đến cơ sở giáo dục.", "Điều 5 khoản 1: không xúc phạm, ép buộc, trù dập, bạo hành người học. Khoản 2: không **hách dịch**, gây khó khăn, xúc phạm, định kiến, **thiên vị**, vụ lợi, né tránh trách nhiệm hoặc che giấu vi phạm, đổ lỗi.", "Điều 5 khoản 3: với cha mẹ không xúc phạm, gây khó khăn, phiền hà, vụ lợi; khoản 4: với khách không xúc phạm, gây khó khăn, phiền hà.", "Điều 7 (nhân viên): ứng xử với người học, cán bộ quản lý và giáo viên, đồng nghiệp, cha mẹ và khách; không gây khó khăn, phiền hà, xúc phạm, bạo lực; không né tránh trách nhiệm, gây mất đoàn kết, vụ lợi.", "Điều 8 (**người học** phổ thông, GDTX): K1 với CBQL, giáo viên, nhân viên: kính trọng, lễ phép, trung thực; không bịa đặt thông tin, không xúc phạm. K2 với bạn: không nói tục, chửi bậy, miệt thị, xúc phạm; không bịa đặt, lôi kéo; không phát tán thông tin nói xấu bạn.", "Điều 9 (**cha mẹ người học**): K1 với người học; K2 với CBQL, giáo viên, nhân viên: tôn trọng, trách nhiệm, hợp tác, chia sẻ; **không bịa đặt thông tin; không xúc phạm** tinh thần, danh dự, nhân phẩm.", "Điều 10 (**khách**): với người học đúng mực, tôn trọng, thân thiện; với CBQL, giáo viên, nhân viên đúng mực, tôn trọng, không bịa đặt thông tin, không xúc phạm.", "Điều 11: **Vụ Giáo dục Chính trị và Công tác HSSV** hướng dẫn, kiểm tra. Điều 12: **sở GDĐT, phòng GDĐT** chỉ đạo, kiểm tra, giám sát việc xây dựng và thực hiện Bộ Quy tắc.", "Điều 13: thủ trưởng cơ sở giáo dục quy định cụ thể Bộ Quy tắc; công khai trên **website hoặc niêm yết bảng tin**, tuyên truyền; tổ chức thực hiện, đánh giá, tổng kết, báo cáo cấp quản lý trực tiếp **định kỳ mỗi năm học**; khen thưởng, kỷ luật.", "Điều 14: hiệu lực 28/5/2019; bãi bỏ quy định trước đây của Bộ trái với Thông tư.", "So sánh: chỉ **TT06** có quy tắc cho người học (Đ8), cha mẹ (Đ9), khách (Đ10); **TT03/2026** chỉ dành cho nhà giáo (có thêm chống tin giả, ứng xử không gian mạng, cấm gian lận đánh giá người học)."], "bay": ["⚠ Điều 8 = **người học**; Điều 9 = **cha mẹ**; Điều 10 = **khách** (trong TT06). Còn TT03/2026: Điều 8 = cha mẹ nhà giáo ứng xử; Điều 9 = cộng đồng.", "⚠ Báo cáo cấp quản lý trực tiếp **định kỳ mỗi năm học** (không phải mỗi học kỳ, mỗi quý).", "⚠ Công khai Bộ Quy tắc: trên website **hoặc** niêm yết bảng tin ('hoặc', không phải 'và').", "⚠ 'Hách dịch', 'phiền hà' là từ của TT06 (cán bộ quản lý); 'áp đặt', 'vụ lợi, ép buộc cha mẹ' là của TT03 Điều 8."], "cauhoi": [{"t": "s", "q": "Ứng xử của người học theo Thông tư 06/2019/TT-BGDĐT được quy định tại điều nào?", "o": ["Điều 7", "Điều 8", "Điều 9", "Điều 10"], "a": [1], "e": "Điều 7: nhân viên; Điều 8: người học; Điều 9: cha mẹ người học; Điều 10: khách.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 8"}, {"t": "s", "q": "Ứng xử của cha mẹ người học theo Thông tư 06/2019/TT-BGDĐT được quy định tại điều nào?", "o": ["Điều 8", "Điều 10", "Điều 5", "Điều 9"], "a": [3], "e": "Điều 9 quy định ứng xử của cha mẹ người học; Điều 10 là khách.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 9"}, {"t": "s", "q": "Hành vi nào cán bộ quản lý không được làm với giáo viên, nhân viên theo Điều 5 khoản 2 Thông tư 06/2019/TT-BGDĐT?", "o": ["Thiên vị", "Đồng hành cùng giáo viên, nhân viên", "Bảo vệ uy tín, danh dự, nhân phẩm của giáo viên", "Khích lệ giáo viên, nhân viên"], "a": [0], "e": "Khoản 2 cấm hách dịch, gây khó khăn, xúc phạm, định kiến, thiên vị, vụ lợi, né tránh trách nhiệm, che giấu vi phạm, đổ lỗi; các phương án còn lại là việc được yêu cầu.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 5 khoản 2"}, {"t": "s", "q": "Điều 5 Thông tư 06/2019/TT-BGDĐT quy định cán bộ quản lý ứng xử với những đối tượng nào?", "o": ["Người học; giáo viên; cha mẹ người học; cơ quan quản lý cấp trên", "Người học; giáo viên, nhân viên; cộng đồng; khách", "Người học; giáo viên, nhân viên; cha mẹ người học; khách đến cơ sở giáo dục", "Giáo viên, nhân viên; cha mẹ người học; khách; cán bộ quản lý khác"], "a": [2], "e": "Điều 5 có 4 khoản: người học, giáo viên và nhân viên, cha mẹ người học, khách.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 5"}, {"t": "s", "q": "Học sinh lớp 8 đăng ảnh chế giễu một bạn lên Facebook của lớp. Hành vi này vi phạm quy định nào của Thông tư 06/2019/TT-BGDĐT?", "o": ["Không vi phạm vì TT06 chỉ điều chỉnh ứng xử trong giờ học", "Điều 9 khoản 2: không bịa đặt thông tin với giáo viên", "Điều 8 khoản 2: không phát tán thông tin nói xấu, xúc phạm bạn", "Điều 8 khoản 3: kính trọng, lễ phép với cha mẹ"], "a": [2], "e": "Điều 8 khoản 2 (ứng xử với bạn): không nói tục, miệt thị, xúc phạm, bịa đặt, phát tán thông tin nói xấu; cùng với Điều 4 khoản 7, 8.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 8 khoản 2; Điều 4 khoản 7, 8"}, {"t": "s", "q": "Phụ huynh vào lớp, lớn tiếng xúc phạm cô giáo vì con bị phê bình. Hành vi này vi phạm quy định nào của Thông tư 06/2019/TT-BGDĐT?", "o": ["Điều 9 khoản 2: không bịa đặt thông tin, không xúc phạm tinh thần, danh dự, nhân phẩm của giáo viên", "Điều 9 khoản 1: không xúc phạm người học", "Điều 8 khoản 2: không nói tục, miệt thị bạn", "Điều 5 khoản 3: không gây phiền hà cha mẹ"], "a": [0], "e": "Điều 9 khoản 2 áp dụng cho cha mẹ với CBQL, giáo viên, nhân viên.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 9 khoản 2"}, {"t": "s", "q": "Theo Điều 13 Thông tư 06/2019/TT-BGDĐT, thủ trưởng cơ sở giáo dục báo cáo cấp quản lý trực tiếp việc thực hiện Bộ Quy tắc vào thời điểm nào?", "o": ["Định kỳ mỗi học kỳ", "Định kỳ mỗi quý", "Hằng tháng", "Định kỳ mỗi năm học"], "a": [3], "e": "Điều 13 khoản 3: tổ chức thực hiện, đánh giá, tổng kết, báo cáo cấp quản lý trực tiếp định kỳ mỗi năm học.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 13 khoản 3"}, {"t": "s", "q": "Theo Điều 13 Thông tư 06/2019/TT-BGDĐT, Bộ Quy tắc ứng xử của cơ sở giáo dục được công khai bằng hình thức nào?", "o": ["Trên website và niêm yết tại bảng tin, cả hai đều bắt buộc", "Trên website hoặc niêm yết tại bảng tin", "Chỉ gửi văn bản đến cha mẹ người học", "Chỉ phổ biến trong hội nghị cán bộ, viên chức"], "a": [1], "e": "Điều 13 khoản 2: công khai trên website 'hoặc' niêm yết bảng tin, kèm tuyên truyền. Bẫy: 'và', 'chỉ'.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 13 khoản 2"}, {"t": "s", "q": "Cơ quan nào hướng dẫn, kiểm tra việc thực hiện Thông tư 06/2019/TT-BGDĐT theo Điều 11?", "o": ["Vụ Giáo dục Chính trị và Công tác học sinh, sinh viên", "Vụ Giáo dục Trung học", "Cục Nhà giáo và Cán bộ quản lý cơ sở giáo dục", "Thanh tra Bộ Giáo dục và Đào tạo"], "a": [0], "e": "Điều 11: Vụ Giáo dục Chính trị và Công tác HSSV hướng dẫn, kiểm tra.", "r": "Thông tư 06/2019/TT-BGDĐT Điều 11"}, {"t": "s", "q": "Theo Điều 12 Thông tư 06/2019/TT-BGDĐT, ai chỉ đạo, kiểm tra, giám sát việc xây dựng và thực hiện Bộ Quy tắc ứng xử?", "o": ["Ủy ban nhân dân cấp xã", "Hiệu trưởng các trường", "Sở giáo dục và đào tạo, phòng giáo dục và đào tạo", "Bộ trưởng Bộ Giáo dục và Đào tạo"], "a": [2], "e": "Điều 12: sở GDĐT, phòng GDĐT. (UBND xã, phường được giao trách nhiệm trong Thông tư 03/2026, không phải ở đây.)", "r": "Thông tư 06/2019/TT-BGDĐT Điều 12"}, {"t": "s", "q": "Phát biểu nào đúng khi so sánh Thông tư 03/2026/TT-BGDĐT và Thông tư 06/2019/TT-BGDĐT?", "o": ["TT06 cấm 'khi thực hiện nhiệm vụ'; TT03 cấm 'trong cơ sở giáo dục'", "TT06 cấm hút thuốc, đồ uống có cồn 'trong cơ sở giáo dục'; TT03 cấm 'khi thực hiện nhiệm vụ trên website hoặc niêm yết bảng tin; báo cáo định kỳ mỗi năm học."}], "nho": ["Dãy 5-7-8-9-10 = Quản lý – Nhân viên – **H**ọc sinh – **P**hụ huynh – **K**hách; Điều 6 (giáo viên) đã mất hiệu lực.", "Điều 11-12-13 = Vụ → Sở/Phòng → Trường (từ trên xuống dưới).", "'**Hoặc**' website 'hoặc' bảng tin; báo cáo '**mỗi năm học**' (không phải học kỳ).", "Đảo số: TT06 Điều 8 = người học, TT03 Điều 8 = cha mẹ – cẩn thận khi làm đề."]}]});</script><script>window.LAWS=window.LAWS||[];window.LAWS.push({"id": "L8", "ten": "Nghị quyết 71-NQ/TW của Bộ Chính trị về đột phá phát triển giáo dục và đào tạo", "so": "Nghị quyết số 71-NQ/TW", "ngay": "22/08/2025", "hieuluc": "22/08/2025", "mota": "Nghị quyết của Bộ Chính trị ngày 22/8/2025 xác định 6 quan điểm, mục tiêu đến 2030, 2035, tầm nhìn 2045 và 8 nhóm nhiệm vụ, giải pháp đột phá phát triển giáo dục và đào tạo.", "baihoc": [{"id": "L8-1", "ten": "Quan điểm chỉ đạo", "tomtat": ["NQ 71-NQ/TW do **Bộ Chính trị** ban hành ngày **22/8/2025** (Tổng Bí thư Tô Lâm ký), về đột phá phát triển giáo dục và đào tạo.", "Nghị quyết có **6 quan điểm** chỉ đạo và **8 nhóm** nhiệm vụ, giải pháp.", "Giáo dục và đào tạo là **quốc sách hàng đầu**, quyết định tương lai dân tộc; Nhà nước định hướng chiến lược, kiến tạo phát triển, bảo đảm nguồn lực và công bằng; **đủ trường, đủ lớp, đủ giáo viên**.", "Phát huy truyền thống hiếu học, xây dựng xã hội học tập, học tập suốt đời.", "Phối hợp **gia đình - nhà trường - xã hội**; **người học là trung tâm, chủ thể**; **nhà trường là nền tảng**; **nhà giáo là động lực, quyết định chất lượng**.", "Phương châm **\"thầy ra thầy, trò ra trò\"**; hài hòa toàn dân và tinh hoa, toàn diện và chuyên sâu, dân tộc và toàn cầu.", "**Học đi đôi với hành**, lý thuyết gắn liền với thực tiễn, nhà trường gắn liền với xã hội.", "**Mầm non, phổ thông** là nền tảng hình thành nhân cách; **GDNN** then chốt cho lao động kỹ năng cao; **đại học** là nòng cốt nhân lực trình độ cao, nhân tài.", "Đột phá bắt đầu từ **đổi mới tư duy, nhận thức và thể chế**; Nhà nước giữ vai trò chủ đạo, **lấy đầu tư công dẫn dắt**.", "Giáo dục **công lập là trụ cột**, **ngoài công lập là thành phần quan trọng**; nền giáo dục mở, liên thông."], "bay": ["⚠ \"nhà trường là nền tảng\" ≠ \"nhà giáo là nền tảng\"; nhà giáo là động lực, người học là trung tâm, chủ thể", "⚠ giáo dục công lập là trụ cột ≠ ngoài công lập là trụ cột (ngoài công lập là thành phần quan trọng)", "⚠ 6 quan điểm ≠ 8 nhóm nhiệm vụ, giải pháp", "⚠ \"đầu tư công dẫn dắt\" ≠ \"đầu tư tư nhân dẫn dắt\""], "cauhoi": [{"t": "s", "q": "Nghị quyết số 71-NQ/TW về đột phá phát triển giáo dục và đào tạo do cơ quan nào ban hành?", "o": ["Chính phủ", "Bộ Chính trị", "Ban Bí thư", "Quốc hội"], "a": [1], "e": "NQ 71-NQ/TW là nghị quyết của Bộ Chính trị. Bẫy: nhầm với NQ 248/2025/QH15 của Quốc hội, là nghị quyết thể chế hóa NQ 71.", "r": "NQ 71-NQ/TW"}, {"t": "s", "q": "Nghị quyết 71-NQ/TW được ban hành vào ngày nào?", "o": ["02/9/2025", "10/12/2025", "22/8/2025", "16/6/2025"], "a": [2], "e": "NQ 71 ban hành ngày 22/8/2025. Ngày 10/12/2025 là ngày ban hành Luật 123/2025/QH15 và NQ 248/2025/QH15.", "r": "NQ 71-NQ/TW"}, {"t": "s", "q": "Nghị quyết 71-NQ/TW nêu bao nhiêu quan điểm chỉ đạo?", "o": ["8 quan điểm", "7 quan điểm", "5 quan điểm", "6 quan điểm"], "a": [3], "e": "Có 6 quan điểm chỉ đạo. Số 8 là số nhóm nhiệm vụ, giải pháp, dễ gây nhầm.", "r": "NQ 71-NQ/TW"}, {"t": "s", "q": "Phương châm về quan hệ thầy trò trong Nghị quyết 71-NQ/TW là gì?", "o": ["\"Thầy ra thầy, trò ra trò\"", "\"Tiên học lễ, hậu học văn\"", "\"Dạy tốt, học tốt\"", "\"Tôn sư trọng đạo\""], "a": [0], "e": "Nghị quyết dùng phương châm \"thầy ra thầy, trò ra trò\"; các câu còn lại là khẩu hiệu/thành ngữ khác, không phải phương châm nêu trong NQ.", "r": "NQ 71-NQ/TW"}, {"t": "s", "q": "Theo Nghị quyết 71-NQ/TW, nhà giáo giữ vai trò nào?", "o": ["Là trung tâm, chủ thể của quá trình giáo dục", "Là động lực, quyết định chất lượng giáo dục và đào tạo", "Là nền tảng của giáo dục", "Là then chốt đào tạo ò.", "r": "NQ 71-NQ/TW"}, {"t": "m", "q": "Quan điểm 3 của Nghị quyết 71-NQ/TW nêu sự hài hòa giữa những cặp nào (chọn tất cả đáp án đúng)", "o": ["toàn diện và chuyên sâu", "thành thị và nông thôn", "công lập và ngoài công lập", "dân tộc và toàn cầu", "toàn dân và tinh hoa"], "a": [0, 3, 4], "e": "NQ nêu hài hòa giữa toàn dân và tinh hoa, toàn diện và chuyên sâu, dân tộc và toàn cầu. \"Công lập - ngoài công lập\" thuộc quan điểm khác; \"thành thị - nông thôn\" không được nêu.", "r": "NQ 71-NQ/TW"}, {"t": "m", "q": "Theo Nghị quyết 71-NQ/TW, những nội dung nào thuộc nguyên lý, quan điểm nêu trong quan điểm 4 (chọn tất cả đáp án đúng)", "o": ["Nhà trường gắn liền với xã hội", "Lấy điểm số làm thước đo duy nhất", "Học đi đôi với hành", "Lý thuyết gắn liền với thực tiễn", "Nhà trường thay thế vai trò của gia đình"], "a": [0, 2, 3], "e": "Quan điểm 4 nêu: học đi đôi với hành, lý thuyết gắn liền với thực tiễn, nhà trường gắn liền với xã hội. Hai phương án còn lại không có trong NQ.", "r": "NQ 71-NQ/TW"}, {"t": "m", "q": "Theo quan điểm 1, Nhà nước giữ vai trò nào đối với giáo dục và đào tạo (chọn tất cả đáp án đúng)", "o": ["Kiến tạo phát triển", "Bảo đảm nguồn lực và công bằng", "Định hướng chiến lược", "Giao toàn bộ giáo dục cho khu vực tư nhân", "Trực tiếp điều hành mọi cơ sở giáo dục"], "a": [0, 1, 2], "e": "Nhà nước định hướng chiến lược, kiến tạo phát triển, bảo đảm nguồn lực và công bằng. Hai phương án nhiễu trái tinh thần NQ (công lập là trụ cột).", "r": "NQ 71-NQ/TW"}, {"t": "m", "q": "Theo quan điểm 5 của Nghị quyết 71-NQ/TW, những ý nào đúng (chọn tất cả đáp án đúng)", "o": ["Lấy đầu tư tư nhân dẫn dắt", "Lấy đầu tư công dẫn dắt", "Đột phá bắt đầu từ đổi mới tư duy, nhận thức và thể chế", "Lấy học phí làm nguồn thu chính", "Nhà nước giữ vai trò chủ đạo"], "a": [1, 2, 4], "e": "NQ nêu Nhà nước giữ vai trò chủ đạo, lấy đầu tư công dẫn dắt. Bẫy: đổi \"đầu tư công\" thành \"đầu tư tư nhân\".", "r": "NQ 71-NQ/TW"}, {"t": "f", "q": "Nghị quyết 71-NQ/TW của Bộ Chính
